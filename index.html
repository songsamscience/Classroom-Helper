    <style>
        /* ===== 전역 디자인 토큰 (다크모드 + UI 스케일) ===== */
        :root{
            --ui-scale:1;
            --bg-main:#F8F6F1;
            --bg-card:#ffffff;
            --bg-glass:rgba(255,255,255,.88);
            --bg-soft:#F9F7F4;
            --bg-input:#F7F7F7;
            --text-main:#4A4A4A;
            --text-sub:#A0A0A0;
            --text-mute:#CCCCCC;
            --border-soft:#EDE6DA;
            --border-line:#F0F0F0;
            --shadow-glass:0 1px 8px rgba(0,0,0,.04);
            --bg-dots:#E8DDD0;
            --nav-inactive:#A0A0A0;
        }
        body.dark-theme{
            --bg-main:#15171F;
            --bg-card:#1F2230;
            --bg-glass:rgba(31,34,48,.92);
            --bg-soft:#272B3C;
            --bg-input:#2A2E40;
            --text-main:#F1F2F5;
            --text-sub:#B4B7C2;
            --text-mute:#8B8FA0;
            --border-soft:#363B52;
            --border-line:#2E334A;
            --shadow-glass:0 2px 12px rgba(0,0,0,.45);
            --bg-dots:#242838;
            --nav-inactive:#8B8FA0;
        }
        /* UI 스케일 적용 */
        html{font-size:calc(16px * var(--ui-scale));}

        .wb-dark{background:#1F2937;color:#F1F2F5;}

@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback}=React;

// 아이콘 렌더링 픽스
const Icon=({name,size=24,className=""})=>{
    const ref=useRef(null);
    useEffect(()=>{
        if(window.lucide&&ref.current){
            ref.current.innerHTML='';
            const i=document.createElement('i');
            i.setAttribute('data-lucide',name);
            ref.current.appendChild(i);
            window.lucide.createIcons({root:ref.current,nameAttr:'data-lucide',attrs:{width:size,height:size}});
        }
    },[name,size]);
    return <span ref={ref} className={`inline-flex items-center justify-center ${className}`}/>;
};

const Copyright=({fixed})=>(<footer className={`w-full text-center py-4 text-[10px] text-gray-400 font-bold tracking-widest uppercase ${fixed?'fixed bottom-0 left-0 bg-white/50 backdrop-blur-sm safe-b':'mt-6'}`}>ⓒ 송쌤과학 Class Helper</footer>);

function SystemModal({modal,closeModal}){
    return(<div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4"><div className="modal-up bg-white p-5 sm:p-7 rounded-2xl shadow-2xl max-w-xs sm:max-w-sm w-full text-center border-4 border-[#FFB7B2]"><p className="text-base sm:text-lg font-bold text-gray-700 mb-5 whitespace-pre-wrap leading-relaxed">{modal.msg}</p><div className="flex gap-2 justify-center">{modal.type==='confirm'&&<button onClick={closeModal} className="flex-1 py-2.5 bg-gray-100 rounded-xl font-bold text-gray-500 touch-target">취소</button>}<button onClick={()=>{if(modal.action)modal.action();closeModal();}} className="flex-1 py-2.5 bg-[#FFB7B2] rounded-xl font-bold text-white touch-target">확인</button></div></div></div>);
}

function SettingsModal({isDarkMode,setIsDarkMode,uiScale,setUiScale,onClose,playSound}){
    const scalePresets=[
        {label:'작게',value:0.85,icon:'a-large-small'},
        {label:'보통',value:1.0,icon:'type'},
        {label:'크게',value:1.15,icon:'type'},
        {label:'아주크게',value:1.3,icon:'type'},
    ];
    return(<div className="fixed inset-0 z-[110] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4" onClick={onClose}>
        <div className="modal-up bg-white p-5 sm:p-7 rounded-2xl shadow-2xl max-w-sm w-full border-4 border-[#C7CEEA]" onClick={e=>e.stopPropagation()}>
            <div className="flex items-center justify-between mb-5">
                <div className="flex items-center gap-2">
                    <div className="bg-[#C7CEEA] p-2 rounded-xl text-white"><Icon name="settings" size={18}/></div>
                    <h3 className="text-lg font-black text-[#4A4A4A]">화면 설정</h3>
                </div>
                <button onClick={()=>{playSound('click');onClose();}} className="p-2 rounded-lg text-gray-400 touch-target"><Icon name="x" size={18}/></button>
            </div>

            {/* 다크모드 */}
            <div className="mb-5">
                <div className="flex items-center justify-between mb-2 px-1">
                    <span className="text-sm font-black text-gray-600 flex items-center gap-1.5"><Icon name={isDarkMode?"moon":"sun"} size={15} className={isDarkMode?'text-[#FFDAC1]':'text-[#FFD700]'}/> 화면 모드</span>
                </div>
                <div className="flex gap-2 bg-[#F7F9FC] p-1.5 rounded-xl border border-gray-100">
                    <button onClick={()=>{playSound('click');setIsDarkMode(false);}} className={`flex-1 py-3 rounded-lg font-bold text-sm flex items-center justify-center gap-1.5 transition-all ${!isDarkMode?'bg-white shadow-md text-[#FF9E99]':'text-gray-400'}`}>
                        <Icon name="sun" size={16}/> 라이트
                    </button>
                    <button onClick={()=>{playSound('click');setIsDarkMode(true);}} className={`flex-1 py-3 rounded-lg font-bold text-sm flex items-center justify-center gap-1.5 transition-all ${isDarkMode?'bg-[#1F2230] shadow-md text-[#FFDAC1]':'text-gray-400'}`}>
                        <Icon name="moon" size={16}/> 다크
                    </button>
                </div>
            </div>

            {/* UI 크기 */}
            <div className="mb-3">
                <div className="flex items-center justify-between mb-2 px-1">
                    <span className="text-sm font-black text-gray-600 flex items-center gap-1.5"><Icon name="type" size={15} className="text-[#C7CEEA]"/> 글자/아이콘 크기</span>
                    <span className="text-xs font-bold text-[#C7CEEA]">{Math.round(uiScale*100)}%</span>
                </div>
                <div className="grid grid-cols-4 gap-1.5 mb-3">
                    {scalePresets.map(p=>(
                        <button key={p.value} onClick={()=>{playSound('click');setUiScale(p.value);}}
                            className={`py-2.5 rounded-lg text-xs font-bold border-2 transition-all ${Math.abs(uiScale-p.value)<0.01?'bg-[#C7CEEA] border-[#C7CEEA] text-white shadow-md':'bg-white border-gray-100 text-gray-500'}`}>
                            {p.label}
                        </button>
                    ))}
                </div>
                <div className="flex items-center gap-2 bg-[#F7F9FC] rounded-lg p-2.5 border border-gray-100">
                    <span className="text-[10px] font-bold text-gray-400 shrink-0">A</span>
                    <input type="range" min="0.75" max="1.5" step="0.05" value={uiScale}
                        onChange={e=>setUiScale(parseFloat(e.target.value))}
                        className="flex-1" style={{accentColor:'#C7CEEA'}}/>
                    <span className="text-base font-black text-gray-500 shrink-0">A</span>
                </div>
                <p className="text-[10px] text-gray-400 font-bold mt-2 px-1 text-center">미리보기: <span style={{fontSize:`${14*uiScale}px`}}>가나다 ABC 123</span></p>
            </div>

            <button onClick={()=>{playSound('click');onClose();}} className="w-full py-3 bg-[#C7CEEA] hover:bg-[#B5BFE3] text-white rounded-xl font-black shadow-md active:scale-95 touch-target transition-all">완료</button>
        </div>
    </div>);
}

function ExcludeBar({excludedInput,setExcludedInput,excludedNums,totalCount,accentColor,playSound}){
    const activeCount=totalCount-excludedNums.length;
    return(<div className="bg-white/80 backdrop-blur rounded-xl p-2.5 border border-gray-100 soft-shadow"><div className="flex items-center gap-2"><div className="shrink-0 p-1.5 rounded-lg" style={{background:accentColor+'22'}}><Icon name="user-minus" size={15}/></div><input type="text" value={excludedInput} onChange={e=>setExcludedInput(e.target.value)} className="flex-1 p-2 bg-[#F7F7F7] rounded-lg border-2 border-transparent focus:border-gray-200 outline-none font-bold text-xs min-w-0" placeholder="제외 번호 (예: 3, 7, 15)"/>{excludedNums.length>0&&<button onClick={()=>{playSound('click');setExcludedInput('');}} className="shrink-0 p-1.5 text-gray-300 hover:text-red-400 touch-target"><Icon name="x" size={14}/></button>}</div>{excludedNums.length>0&&<div className="mt-2 flex flex-wrap items-center gap-1.5"><span className="text-[10px] text-gray-400 font-bold shrink-0">제외:</span>{excludedNums.map(n=><span key={n} className="excluded-badge">{n}번</span>)}<span className="ml-auto text-[10px] font-bold" style={{color:accentColor}}>참여 {activeCount}명</span></div>}</div>);
}

function SoundToggle({isSoundOn,setIsSoundOn,playSound}){
    return(<button onClick={()=>{if(!isSoundOn)playSound('click');setIsSoundOn(!isSoundOn);}} className={`sound-toggle ${isSoundOn?'on':'off'}`}><Icon name={isSoundOn?"volume-2":"volume-x"} size={13}/>소리 {isSoundOn?"ON":"OFF"}</button>);
}

function LiveClock({size='lg'}){
    const [now,setNow]=useState(new Date());
    useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(t);},[]);
    const h=now.getHours(),m=now.getMinutes(),s=now.getSeconds();
    const period=h>=12?'오후':'오전';const h12=h%12||12;
    const dateStr=`${now.getFullYear()}. ${now.getMonth()+1}. ${now.getDate()}. ${['일','월','화','수','목','금','토'][now.getDay()]}요일`;
    if(size==='md') return(<div className="text-center"><div className="text-sm font-bold text-gray-400 mb-1">{period}</div><div className="text-3xl sm:text-5xl font-black text-[#4A4A4A] clock-face">{String(h12).padStart(2,'0')}:{String(m).padStart(2,'0')}<span className="text-xl sm:text-3xl text-gray-300 ml-0.5">:{String(s).padStart(2,'0')}</span></div><div className="text-xs font-bold text-gray-400 mt-1.5">{dateStr}</div></div>);
    return(<div className="text-center"><div className="text-base font-bold text-gray-400 mb-1">{period}</div><div className="text-5xl sm:text-7xl font-black text-[#4A4A4A] clock-face">{String(h12).padStart(2,'0')}:{String(m).padStart(2,'0')}<span className="text-3xl sm:text-5xl text-gray-300 ml-1">:{String(s).padStart(2,'0')}</span></div><div className="text-sm font-bold text-gray-400 mt-2">{now.getFullYear()}년 {now.getMonth()+1}월 {now.getDate()}일 {['일','월','화','수','목','금','토'][now.getDay()]}요일</div></div>);
}

function CalendarWidget(){
    const today=new Date();const [year,setYear]=useState(today.getFullYear());const [month,setMonth]=useState(today.getMonth());
    const firstDay=new Date(year,month,1).getDay();const daysInMonth=new Date(year,month+1,0).getDate();
    const prev=()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);};
    const next=()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);};
    const goToday=()=>{setYear(today.getFullYear());setMonth(today.getMonth());};
    const isToday=d=>d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
    const days=[];for(let i=0;i<firstDay;i++)days.push(null);for(let d=1;d<=daysInMonth;d++)days.push(d);
    return(<div className="bg-white rounded-2xl p-4 sm:p-5 soft-shadow border border-gray-100 max-w-sm mx-auto w-full"><div className="flex items-center justify-between mb-4"><button onClick={prev} className="p-2 rounded-lg hover:bg-gray-100 touch-target"><Icon name="chevron-left" size={18}/></button><div className="text-center cursor-pointer" onClick={goToday}><span className="text-lg sm:text-xl font-black text-[#4A4A4A]">{year}년 {month+1}월</span></div><button onClick={next} className="p-2 rounded-lg hover:bg-gray-100 touch-target"><Icon name="chevron-right" size={18}/></button></div><div className="grid grid-cols-7 gap-1 mb-2">{['일','월','화','수','목','금','토'].map((d,i)=><div key={d} className={`text-center text-[11px] font-bold py-1 ${i===0?'text-red-400':i===6?'text-blue-400':'text-gray-400'}`}>{d}</div>)}</div><div className="grid grid-cols-7 gap-1">{days.map((d,i)=>d?<div key={i} className={`cal-day ${isToday(d)?'cal-today':i%7===0?'cal-sun':i%7===6?'cal-sat':'text-gray-600'} ${!isToday(d)?'hover:bg-gray-100':''}`}>{d}</div>:<div key={i}/>)}</div><div className="mt-3 text-center"><button onClick={goToday} className="text-[10px] font-bold text-[#FFB7B2] hover:underline">오늘로 이동</button></div></div>);
}

function DDayWidget({dDays, setDDays, playSound, showAlert}) {
    const [title, setTitle] = useState('');
    const [date, setDate] = useState('');

    const calculateDDay = (targetDateStr) => {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const target = new Date(targetDateStr);
        target.setHours(0, 0, 0, 0);
        
        const diffTime = target.getTime() - today.getTime();
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        
        if (diffDays === 0) return 'D-Day';
        if (diffDays > 0) return `D-${diffDays}`;
        return `D+${Math.abs(diffDays)}`;
    };

    const handleAdd = () => {
        if (!title.trim() || !date) {
            showAlert('제목과 날짜를 모두 입력해주세요.');
            return;
        }
        playSound('click');
        setDDays(prev => [...prev, { id: Date.now(), title: title.trim(), targetDate: date }].sort((a, b) => new Date(a.targetDate) - new Date(b.targetDate)));
        setTitle('');
        setDate('');
    };

    const handleDelete = (id) => {
        playSound('click');
        setDDays(prev => prev.filter(d => d.id !== id));
    };

    return (
        <div className="bg-white rounded-2xl p-4 sm:p-5 soft-shadow border border-gray-100 max-w-sm mx-auto w-full">
            <h3 className="text-base sm:text-lg font-black text-[#4A4A4A] mb-3 flex items-center justify-center gap-2">
                <Icon name="calendar-heart" size={18} className="text-[#FFB7B2]"/> D-Day 계산기
            </h3>
            
            <div className="space-y-2 mb-4">
                <input 
                    type="text" 
                    value={title} 
                    onChange={e => setTitle(e.target.value)} 
                    className="w-full p-2 bg-[#F9F7F4] rounded-xl border-2 border-transparent outline-none focus:border-[#FFB7B2] text-sm font-bold" 
                    placeholder="D-Day 제목 (예: 소풍, 중간고사)"
                />
                <div className="flex gap-2">
                    <input 
                        type="date" 
                        value={date} 
                        onChange={e => setDate(e.target.value)} 
                        className="flex-1 p-2 bg-[#F9F7F4] rounded-xl border-2 border-transparent outline-none focus:border-[#FFB7B2] text-sm font-bold text-gray-600"
                    />
                    <button 
                        onClick={handleAdd} 
                        className="px-4 py-2 bg-[#FFB7B2] text-white rounded-xl font-black text-sm touch-target active:scale-95 transition-all whitespace-nowrap"
                    >
                        추가
                    </button>
                </div>
            </div>

            {dDays.length > 0 ? (
                <div className="space-y-2 max-h-[220px] overflow-y-auto no-scrollbar">
                    {dDays.map(d => {
                        const dDayStr = calculateDDay(d.targetDate);
                        const isPast = dDayStr.startsWith('D+');
                        const isToday = dDayStr === 'D-Day';
                        
                        return (
                            <div key={d.id} className="flex items-center justify-between p-2.5 bg-[#FFFDF0] rounded-xl border border-[#FFE082]/30">
                                <div className="min-w-0 flex-1 pr-2">
                                    <p className="text-xs text-gray-600 font-black truncate mb-0.5">{d.title}</p>
                                    <p className="text-[10px] text-gray-400 font-bold">{d.targetDate}</p>
                                </div>
                                <div className="flex items-center gap-2 shrink-0">
                                    <span className={`text-base font-black ${isToday ? 'text-red-500 animate-pulse' : isPast ? 'text-gray-400' : 'text-[#FF6B6B]'}`}>
                                        {dDayStr}
                                    </span>
                                    <button onClick={() => handleDelete(d.id)} className="p-1 text-red-200 hover:text-red-400 touch-target transition-colors">
                                        <Icon name="x" size={14}/>
                                    </button>
                                </div>
                            </div>
                        );
                    })}
                </div>
            ) : (
                <div className="text-center py-5 border-2 border-dashed border-gray-100 rounded-xl bg-gray-50/50">
                    <p className="text-[11px] text-gray-400 font-bold">등록된 D-Day가 없습니다.<br/>중요한 일정을 등록해보세요!</p>
                </div>
            )}
        </div>
    );
}

function RecorderWidget({playSound:ps}){
    const [isRecording,setIsRecording]=useState(false);
    const [isPaused,setIsPaused]=useState(false);
    const [elapsed,setElapsed]=useState(0);
    const [recordings,setRecordings]=useState([]);
    const [isConverting,setIsConverting]=useState(false);
    const mediaRecRef=useRef(null);
    const chunksRef=useRef([]);
    const timerRef=useRef(null);
    const streamRef=useRef(null);
    const elapsedRef=useRef(0);

    useEffect(()=>{return()=>{if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());clearInterval(timerRef.current);};},[]);

    const toWav=(blob)=>new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=async()=>{
            try{
                const ctx=new(window.AudioContext||window.webkitAudioContext)();
                const buf=await ctx.decodeAudioData(reader.result);
                ctx.close();
                const nCh=1,sr=buf.sampleRate,samples=buf.getChannelData(0);
                const len=samples.length;
                const wavBuf=new ArrayBuffer(44+len*2);
                const v=new DataView(wavBuf);
                const writeStr=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
                writeStr(0,'RIFF');v.setUint32(4,36+len*2,true);writeStr(8,'WAVE');
                writeStr(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,nCh,true);
                v.setUint32(24,sr,true);v.setUint32(28,sr*nCh*2,true);v.setUint16(32,nCh*2,true);v.setUint16(34,16,true);
                writeStr(36,'data');v.setUint32(40,len*2,true);
                let off=44;
                for(let i=0;i<len;i++,off+=2){const s=Math.max(-1,Math.min(1,samples[i]));v.setInt16(off,s<0?s*0x8000:s*0x7FFF,true);}
                resolve(new Blob([wavBuf],{type:'audio/wav'}));
            }catch(e){reject(e);}
        };
        reader.onerror=reject;
        reader.readAsArrayBuffer(blob);
    });

    const startRecording=async()=>{
        try{
            const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,sampleRate:44100}});
            streamRef.current=stream;
            const mimeType=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'';
            const opts=mimeType?{mimeType}:{};
            const mr=new MediaRecorder(stream,opts);
            mediaRecRef.current=mr;chunksRef.current=[];
            mr.ondataavailable=e=>{if(e.data.size>0)chunksRef.current.push(e.data);};
            mr.onstop=async()=>{
                const webmBlob=new Blob(chunksRef.current,{type:mr.mimeType||'audio/webm'});
                const now=new Date();
                const name=`녹음_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}`;
                setIsConverting(true);
                try{
                    const wavBlob=await toWav(webmBlob);
                    const url=URL.createObjectURL(wavBlob);
                    const dur=elapsedRef.current;
                    setRecordings(prev=>[{id:Date.now(),url,name,duration:dur,blob:wavBlob,ext:'wav'},...prev]);
                    const a=document.createElement('a');a.href=url;a.download=name+'.wav';document.body.appendChild(a);a.click();document.body.removeChild(a);
                }catch(err){
                    console.warn('WAV 변환 실패, 원본 저장:',err);
                    const url=URL.createObjectURL(webmBlob);
                    setRecordings(prev=>[{id:Date.now(),url,name,duration:elapsedRef.current,blob:webmBlob,ext:'webm'},...prev]);
                    const a=document.createElement('a');a.href=url;a.download=name+'.webm';document.body.appendChild(a);a.click();document.body.removeChild(a);
                }
                setIsConverting(false);
                stream.getTracks().forEach(t=>t.stop());streamRef.current=null;
            };
            mr.start(250);
            setIsRecording(true);setIsPaused(false);setElapsed(0);elapsedRef.current=0;
            timerRef.current=setInterval(()=>{elapsedRef.current++;setElapsed(e=>e+1);},1000);
            ps('click');
        }catch(e){alert("마이크 권한을 허용해주세요.\n\n브라우저 설정 > 사이트 설정 > 마이크 에서 '허용'으로 변경 후 다시 시도하세요.");}
    };
    const pauseRec=()=>{if(mediaRecRef.current?.state==='recording'){mediaRecRef.current.pause();setIsPaused(true);clearInterval(timerRef.current);ps('click');}};
    const resumeRec=()=>{if(mediaRecRef.current?.state==='paused'){mediaRecRef.current.resume();setIsPaused(false);timerRef.current=setInterval(()=>{elapsedRef.current++;setElapsed(e=>e+1);},1000);ps('click');}};
    const stopRec=()=>{if(mediaRecRef.current?.state!=='inactive'){mediaRecRef.current.stop();setIsRecording(false);setIsPaused(false);clearInterval(timerRef.current);ps('win');}};
    const resetRec=()=>{setElapsed(0);elapsedRef.current=0;ps('click');};
    const newRecording=()=>{setElapsed(0);elapsedRef.current=0;startRecording();};
    const dlRec=r=>{const a=document.createElement('a');a.href=r.url;a.download=r.name+'.'+r.ext;document.body.appendChild(a);a.click();document.body.removeChild(a);};
    const delRec=id=>{setRecordings(prev=>{const t=prev.find(r=>r.id===id);if(t?.url)URL.revokeObjectURL(t.url);return prev.filter(r=>r.id!==id);});ps('click');};
    const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

    return(<div className="w-full max-w-lg mx-auto space-y-4">
        <div className="bg-white rounded-2xl p-5 sm:p-7 soft-shadow border-2 border-[#FFCDD2] text-center">
            <h2 className="text-lg sm:text-xl font-black text-[#4A4A4A] mb-1 flex items-center justify-center gap-2"><Icon name="mic" size={20}/> 음성 녹음</h2>
            <p className="text-[10px] text-gray-400 font-bold mb-5">녹음 완료 시 WAV 파일로 자동 다운로드</p>
            <div className={`text-4xl sm:text-6xl font-black clock-face mb-2 ${isRecording&&!isPaused?'text-red-500':'text-[#4A4A4A]'}`}>{fmt(elapsed)}</div>
            {isRecording&&<p className="text-[11px] font-bold text-gray-400 mb-4">예상 용량 <span className="text-gray-600">{((44100*2*elapsed)/1024/1024).toFixed(1)} MB</span></p>}
            {!isRecording&&!isConverting&&elapsed>0&&<p className="text-[11px] font-bold text-gray-400 mb-4">직전 녹음 시간입니다. 새로 녹음하면 00:00부터 시작됩니다.</p>}
            {isRecording&&!isPaused&&<div className="flex items-center justify-center gap-[3px] mb-5 h-8">{Array.from({length:24}).map((_,i)=><div key={i} className="w-[3px] bg-red-400 rounded-full origin-bottom" style={{height:'24px',animation:`barBounce ${.4+Math.random()*.4}s ease-in-out infinite`,animationDelay:`${i*.04}s`}}/>)}</div>}
            {isRecording&&isPaused&&<div className="flex items-center justify-center gap-2 mb-5 h-8 text-gray-400 font-bold text-sm"><span className="animate-pulse">⏸</span> 일시정지</div>}
            {!isRecording&&!isConverting&&<div className="h-8 mb-5"/>}
            {isConverting&&<div className="flex items-center justify-center gap-2 mb-5 h-8 text-blue-500 font-bold text-sm"><Icon name="loader-2" size={16} className="animate-spin"/> WAV 변환 중...</div>}
            <div className="flex gap-3 justify-center flex-wrap">
                {!isRecording?(elapsed>0?<>
                    <button onClick={newRecording} disabled={isConverting} className="flex items-center gap-2 px-6 py-3.5 bg-red-500 hover:bg-red-600 text-white rounded-full text-base font-black shadow-lg shadow-red-500/25 active:scale-95 touch-target transition-all disabled:opacity-50"><Icon name="rotate-ccw" size={20}/> 새로 녹음하기</button>
                    <button onClick={resetRec} disabled={isConverting} className="flex items-center gap-2 px-5 py-3.5 bg-gray-200 hover:bg-gray-300 text-gray-600 rounded-full text-sm font-black shadow active:scale-95 touch-target transition-all disabled:opacity-50"><Icon name="timer-reset" size={18}/> 시간 초기화</button>
                </>:<button onClick={startRecording} disabled={isConverting} className="flex items-center gap-2 px-6 py-3.5 bg-red-500 hover:bg-red-600 text-white rounded-full text-base font-black shadow-lg shadow-red-500/25 active:scale-95 touch-target transition-all disabled:opacity-50"><Icon name="mic" size={20}/> 녹음 시작</button>):<>
                    {!isPaused?<button onClick={pauseRec} className="px-5 py-3.5 bg-yellow-500 text-white rounded-full font-black shadow-lg active:scale-95 touch-target transition-all flex items-center gap-1.5"><Icon name="pause" size={18}/> 일시정지</button>:<button onClick={resumeRec} className="px-5 py-3.5 bg-green-500 text-white rounded-full font-black shadow-lg active:scale-95 touch-target transition-all flex items-center gap-1.5"><Icon name="play" size={18}/> 계속</button>}
                    <button onClick={stopRec} className={`px-5 py-3.5 bg-[#FFB7B2] text-white rounded-full font-black shadow-lg active:scale-95 touch-target transition-all flex items-center gap-1.5 ${isRecording&&!isPaused?'rec-pulse':''}`}><Icon name="square" size={18}/> 녹음 완료</button>
                </>}
            </div>
        </div>
        <div className="bg-[#FFF8E1] rounded-xl p-3 border border-[#FFE082] flex items-start gap-2">
            <div className="shrink-0 mt-0.5"><Icon name="clock" size={16} className="text-[#FFA000]"/></div>
            <div className="text-[11px] text-gray-600 font-bold leading-relaxed">
                <p>안정적인 녹음을 위해 <span className="text-[#E65100]">최대 10분 이내</span>로 녹음하는 것을 권장합니다.</p>
                <p className="mt-0.5 text-gray-400">긴 녹음은 WAV 변환 시 메모리 부족으로 실패할 수 있습니다. (10분 ≈ 약 53MB)</p>
            </div>
        </div>
        <div className="bg-[#F0F8FF] rounded-xl p-3 border border-[#D6EBFF] flex items-start gap-2">
            <div className="shrink-0 mt-0.5"><Icon name="shield-check" size={16} className="text-blue-400"/></div>
            <div className="text-[11px] text-gray-500 font-bold leading-relaxed">
                <p>녹음 파일은 서버에 저장되지 않으며, 사용자의 기기에서만 처리됩니다.</p>
                <p className="mt-0.5 text-gray-400">브라우저 탭을 닫거나 페이지를 새로고침하면 녹음 파일이 자동으로 삭제됩니다.</p>
            </div>
        </div>
        {recordings.length>0&&<div className="space-y-2">
            <h3 className="text-sm font-black text-gray-500 px-1">녹음 목록 ({recordings.length})</h3>
            {recordings.map(rec=><div key={rec.id} className="bg-white rounded-xl p-3 soft-shadow border border-gray-100 flex items-center gap-3">
                <div className="shrink-0 p-2 bg-red-50 rounded-lg text-red-400"><Icon name="file-audio" size={18}/></div>
                <div className="flex-1 min-w-0">
                    <p className="text-xs font-bold text-gray-600 truncate">{rec.name}.{rec.ext}</p>
                    <p className="text-[10px] text-gray-400 font-bold">{fmt(rec.duration)}</p>
                    <audio controls controlsList="nodownload" preload="metadata" className="w-full mt-1.5 h-8"><source src={rec.url} type={`audio/${rec.ext}`}/></audio>
                </div>
                <div className="flex flex-col gap-1 shrink-0">
                    <button onClick={()=>dlRec(rec)} className="p-1.5 text-blue-400 hover:bg-blue-50 rounded-lg touch-target"><Icon name="download" size={16}/></button>
                    <button onClick={()=>delRec(rec.id)} className="p-1.5 text-red-300 hover:bg-red-50 rounded-lg touch-target"><Icon name="trash-2" size={16}/></button>
                </div>
            </div>)}
        </div>}
    </div>);
}

function YouTubePlayer({playSound:ps}){
    const [embedInput,setEmbedInput]=useState('');
    const [videoId,setVideoId]=useState(null);
    const [history,setHistory]=useState([]);
    const [errorMsg,setErrorMsg]=useState('');

    const extractId=input=>{
        const c=input.trim();
        let m=c.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|shorts\/|live\/|watch\?v=|watch\?.+&v=))([a-zA-Z0-9_-]{11})/);
        if(m)return m[1];
        m=c.match(/src=["'](?:https?:)?\/\/(?:www\.)?(?:youtube\.com|youtube-nocookie\.com)\/embed\/([a-zA-Z0-9_-]{11})/i);
        if(m)return m[1];
        if(/^[a-zA-Z0-9_-]{11}$/.test(c))return c;
        return null;
    };

    const loadVideo=()=>{
        if(!embedInput.trim())return;
        ps('click');setErrorMsg('');
        const id=extractId(embedInput.trim());
        if(id){
            setVideoId(id);
            setHistory(prev=>{const f=prev.filter(h=>h.id!==id);return[{id,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})},...f].slice(0,10);});
        }else{
            setVideoId(null);
            setErrorMsg("올바른 YouTube URL 또는 임베드 코드를 입력해주세요.\n\n예시:\nhttps://www.youtube.com/watch?v=VIDEO_ID\nhttps://youtu.be/VIDEO_ID\n<iframe> 임베드 코드");
        }
    };

    return(<div className="w-full max-w-3xl mx-auto space-y-3">
        <div className="bg-white rounded-2xl p-4 sm:p-5 soft-shadow border-2 border-[#FF6B6B]/20">
            <h2 className="text-lg sm:text-xl font-black text-[#4A4A4A] mb-3 flex items-center justify-center gap-2"><Icon name="youtube" size={20} className="text-red-500"/> 유튜브 플레이어</h2>
            <div className="flex gap-2 mb-2">
                <input type="text" value={embedInput} onChange={e=>setEmbedInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&loadVideo()} className="flex-1 p-2.5 bg-[#FFF5F5] rounded-xl border-2 border-transparent focus:border-red-200 outline-none font-bold text-xs sm:text-sm min-w-0" placeholder="YouTube URL 또는 임베드 코드 붙여넣기"/>
                <button onClick={loadVideo} className="px-4 bg-red-500 text-white rounded-xl font-black shadow-md touch-target active:scale-95 transition-all text-sm shrink-0">재생</button>
            </div>
            <p className="text-[10px] text-gray-400 font-bold mb-3 px-1">YouTube 링크, 공유 URL, 또는 &lt;iframe&gt; 임베드 코드를 입력하세요</p>
            {errorMsg&&<div className="mb-3 bg-red-50 border border-red-200 rounded-xl p-3 text-xs text-red-500 font-bold whitespace-pre-wrap">{errorMsg}</div>}
            {videoId?(<div className="relative w-full rounded-xl overflow-hidden shadow-lg bg-black" style={{paddingBottom:'56.25%'}}>
                <iframe
                    key={videoId}
                    src={`https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1&playsinline=1&enablejsapi=0`}
                    className="absolute inset-0 w-full h-full"
                    frameBorder="0"
                    referrerPolicy="strict-origin-when-cross-origin"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowFullScreen
                    title="YouTube video player"
                />
            </div>):(<div className="w-full rounded-xl bg-gray-50 border-2 border-dashed border-gray-200 flex flex-col items-center justify-center py-16 sm:py-24 text-gray-300"><Icon name="play-circle" size={48} className="opacity-30 mb-2"/><span className="font-bold text-sm">영상을 불러와주세요</span></div>)}
        </div>
        {history.length>0&&<div className="bg-white/80 rounded-xl p-3 soft-shadow border border-gray-100">
            <div className="flex items-center justify-between mb-2"><span className="text-[10px] font-bold text-gray-400">최근 재생</span><button onClick={()=>{ps('click');setHistory([]);}} className="text-[10px] text-red-300 font-bold">전체삭제</button></div>
            <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">{history.map(h=><button key={h.id} onClick={()=>{ps('click');setVideoId(h.id);setErrorMsg('');}} className="shrink-0 flex items-center gap-1.5 px-2.5 py-1.5 bg-[#FFF5F5] rounded-lg border border-red-100 text-xs font-bold text-gray-600 active:scale-95 touch-target"><Icon name="play" size={11} className="text-red-400"/><span className="max-w-[80px] truncate">{h.time}</span></button>)}</div>
        </div>}
    </div>);
}

const WHEEL_COLORS=['#FF6B6B','#FECA57','#48DBFB','#FF9FF3','#54A0FF','#5F27CD','#01A3A4','#F368E0','#FF6348','#2ED573','#FFA502','#3742FA','#EE5A24','#7BED9F','#E056CF','#6C5CE7'];

function SpinWheel({playSound:ps,isSoundOn}){
    const [itemsInput,setItemsInput]=useState('');
    const [items,setItems]=useState([]);
    const [isSpinning,setIsSpinning]=useState(false);
    const [rotation,setRotation]=useState(0);
    const [result,setResult]=useState(null);
    const [history,setHistory]=useState([]);
    // ★ 중복방지 기능 - ON일 때 이미 뽑힌 항목은 휠에서 제거
    const [isNoRepeat,setIsNoRepeat]=useState(false);
    const [usedItems,setUsedItems]=useState([]);
    const canvasRef=useRef(null);
    const audioCtxRef=useRef(null);
    const spinTimerRef=useRef(null);
    const tickCountRef=useRef(0);

    // ★ 실제 휠에 표시할 항목 (중복방지 ON이면 사용된 항목 제외)
    const displayItems=useMemo(()=>{
        if(!isNoRepeat)return items;
        return items.filter(it=>!usedItems.includes(it));
    },[items,isNoRepeat,usedItems]);

    const getAudioCtx=()=>{
        if(!audioCtxRef.current)audioCtxRef.current=new(window.AudioContext||window.webkitAudioContext)();
        if(audioCtxRef.current.state==='suspended')audioCtxRef.current.resume();
        return audioCtxRef.current;
    };

    const playTickSound=useCallback(()=>{
        if(!isSoundOn)return;
        const ctx=getAudioCtx();const t=ctx.currentTime;
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type='sine';
        const pitch=600+Math.random()*200;
        o.frequency.setValueAtTime(pitch,t);
        g.gain.setValueAtTime(.06,t);
        g.gain.exponentialRampToValueAtTime(.001,t+.05);
        o.start(t);o.stop(t+.06);
    },[isSoundOn]);

    const playFanfare=useCallback(()=>{
        if(!isSoundOn)return;
        const ctx=getAudioCtx();const t=ctx.currentTime;
        const notes=[523.25,659.25,783.99,1046.5,1318.5,1046.5];
        notes.forEach((f,i)=>{
            const o=ctx.createOscillator(),g=ctx.createGain();
            o.connect(g);g.connect(ctx.destination);
            o.type=i<4?'sine':'triangle';
            o.frequency.setValueAtTime(f,t+i*.12);
            g.gain.setValueAtTime(0,t+i*.12);
            g.gain.linearRampToValueAtTime(.1,t+i*.12+.04);
            g.gain.exponentialRampToValueAtTime(.001,t+i*.12+.6);
            o.start(t+i*.12);o.stop(t+i*.12+.6);
        });
    },[isSoundOn]);

    const parseItems=()=>{
        const list=itemsInput.split(/[\n,\t]+/).map(s=>s.trim()).filter(s=>s).slice(0,60);
        if(list.length<2)return null;
        return list;
    };

    const applyItems=()=>{
        const list=parseItems();
        if(!list)return;
        ps('click');
        setItems(list);
        setResult(null);
        setRotation(0);
        setUsedItems([]); // ★ 새 항목 적용 시 사용 기록 초기화
    };

    // ★ 캔버스 그리기 - displayItems 기준
    useEffect(()=>{
        const canvas=canvasRef.current;
        if(!canvas||displayItems.length<1)return;
        const ctx=canvas.getContext('2d');
        const size=canvas.width;
        const cx=size/2,cy=size/2,r=size/2-4;
        const n=displayItems.length;
        const arc=2*Math.PI/n;

        ctx.clearRect(0,0,size,size);

        ctx.save();
        ctx.shadowColor='rgba(0,0,0,.1)';
        ctx.shadowBlur=20;
        ctx.beginPath();
        ctx.arc(cx,cy,r,0,2*Math.PI);
        ctx.fill();
        ctx.restore();

        for(let i=0;i<n;i++){
            const startAngle=i*arc-Math.PI/2;
            const endAngle=(i+1)*arc-Math.PI/2;
            ctx.beginPath();
            ctx.moveTo(cx,cy);
            ctx.arc(cx,cy,r,startAngle,endAngle);
            ctx.closePath();
            // ★ 원래 items 인덱스 기준으로 색상 유지
            const originalIdx=items.indexOf(displayItems[i]);
            ctx.fillStyle=WHEEL_COLORS[(originalIdx>=0?originalIdx:i)%WHEEL_COLORS.length];
            ctx.fill();
            ctx.strokeStyle='rgba(255,255,255,.5)';
            ctx.lineWidth=1.5;
            ctx.stroke();

            ctx.save();
            ctx.translate(cx,cy);
            ctx.rotate(startAngle+arc/2);
            ctx.fillStyle='#fff';
            ctx.font=`bold ${n>20?10:n>12?12:14}px 'Jua',sans-serif`;
            ctx.textAlign='center';
            ctx.textBaseline='middle';
            const textR=r*(n>20?.62:.58);
            const label=displayItems[i].length>(n>20?5:8)?displayItems[i].slice(0,(n>20?4:7))+'…':displayItems[i];
            ctx.fillText(label,textR,0);
            ctx.restore();
        }

        ctx.beginPath();
        ctx.arc(cx,cy,r,0,2*Math.PI);
        ctx.strokeStyle='rgba(255,255,255,.8)';
        ctx.lineWidth=3;
        ctx.stroke();
    },[displayItems,items]);

    const spinWheel=()=>{
        if(isSpinning||displayItems.length<1)return;
        // ★ 항목이 1개면 회전 의미 없음(전부 사용됨 상태) 또는 최소 2개 권장
        if(displayItems.length<2&&isNoRepeat){
            // 단일 남은 경우 바로 결정
        }
        ps('click');
        setIsSpinning(true);
        setResult(null);

        const n=displayItems.length;
        const arc=360/n;
        const extraSpins=5+Math.floor(Math.random()*5);
        const randomAngle=Math.random()*360;
        const totalRotation=extraSpins*360+randomAngle;
        const startRotation=rotation;
        const endRotation=startRotation+totalRotation;

        const duration=4000+Math.random()*2000;
        const startTime=performance.now();
        tickCountRef.current=0;

        const animate=(now)=>{
            const elapsed=now-startTime;
            const progress=Math.min(elapsed/duration,1);
            const eased=1-Math.pow(1-progress,3);
            const currentRot=startRotation+totalRotation*eased;
            setRotation(currentRot);

            const segmentsPassed=Math.floor(currentRot/arc);
            if(segmentsPassed>tickCountRef.current){
                tickCountRef.current=segmentsPassed;
                playTickSound();
            }

            if(progress<1){
                spinTimerRef.current=requestAnimationFrame(animate);
            }else{
                setRotation(endRotation);
                setIsSpinning(false);

                const finalAngle=((endRotation%360)+360)%360;
                const pointerOrigAngle=((360-finalAngle)%360+360)%360;
                const winnerIdx=Math.floor(pointerOrigAngle/arc)%n;
                const winner=displayItems[winnerIdx];

                setResult(winner);
                setHistory(prev=>[{text:winner,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})},...prev].slice(0,20));
                // ★ 중복방지 ON일 때 사용된 항목 기록
                if(isNoRepeat)setUsedItems(prev=>[...prev,winner]);
                playFanfare();
                confetti({particleCount:150,spread:80,origin:{y:.5},colors:['#FFB7B2','#B5EAD7','#C7CEEA','#FECA57','#FF6B6B'],disableForReducedMotion:true});
            }
        };
        spinTimerRef.current=requestAnimationFrame(animate);
    };

    useEffect(()=>{return()=>{if(spinTimerRef.current)cancelAnimationFrame(spinTimerRef.current);};},[]);

    const wheelSize=typeof window!=='undefined'?(window.innerWidth<640?280:360):360;

    return(<div className="w-full max-w-2xl mx-auto space-y-3">
        <div className="bg-white rounded-2xl p-4 sm:p-5 soft-shadow border-2 border-[#FECA57]/40">
            <h2 className="text-lg sm:text-xl font-black text-[#4A4A4A] mb-3 flex items-center justify-center gap-2"><Icon name="circle-dot" size={20} className="text-[#FECA57]"/> 돌림판</h2>
            <div className="mb-3">
                <textarea value={itemsInput} onChange={e=>setItemsInput(e.target.value)} className="w-full p-2.5 bg-[#FFFDF0] rounded-xl border-2 border-transparent focus:border-[#FECA57] resize-none h-20 outline-none text-sm font-bold" placeholder="항목 입력 (쉼표, 줄바꿈, 탭으로 구분 · 최대 60개)&#10;예: 사과, 바나나, 딸기 또는 엑셀에서 복사+붙여넣기"/>
                <div className="flex items-center justify-between mt-1.5 px-1">
                    <p className="text-[10px] text-gray-400 font-bold">{parseItems()?`${parseItems().length}개 항목`:'최소 2개 이상 입력해주세요'}</p>
                    <button onClick={applyItems} disabled={!parseItems()} className="px-4 py-1.5 bg-[#FECA57] text-white rounded-lg font-black text-xs shadow-md active:scale-95 touch-target disabled:opacity-40 disabled:cursor-not-allowed transition-all">적용</button>
                </div>
            </div>

            {/* ★ 중복방지 컨트롤 영역 */}
            {items.length>=2&&<div className="flex flex-wrap items-center gap-2 pt-2 border-t border-gray-100">
                <button onClick={()=>{ps('click');setIsNoRepeat(!isNoRepeat);}} className={`px-3 py-1.5 rounded-lg text-[11px] font-bold border-2 transition-all ${isNoRepeat?'bg-[#FECA57] border-[#FECA57] text-white shadow-sm':'bg-white border-gray-200 text-gray-400'}`}>
                    중복방지 {isNoRepeat?'ON':'OFF'}
                </button>
                {isNoRepeat&&usedItems.length>0&&<button onClick={()=>{ps('click');setUsedItems([]);}} className="px-3 py-1.5 bg-white border-2 border-gray-200 rounded-lg text-[11px] font-bold text-gray-500 active:scale-95">
                    초기화 ({usedItems.length}개 사용됨)
                </button>}
                {isNoRepeat&&<span className="text-[10px] text-gray-400 font-bold ml-auto">남은 항목: {displayItems.length}/{items.length}</span>}
            </div>}
        </div>

        {items.length>=2&&<div className="bg-white rounded-2xl p-4 sm:p-6 soft-shadow border border-gray-100 flex flex-col items-center">
            {result&&<div className="wheel-result-pop mb-4 px-6 py-3 rounded-2xl text-center" style={{background:'linear-gradient(135deg,#FECA57 0%,#FF6348 100%)'}}>
                <p className="text-white text-[10px] font-bold mb-0.5">당첨!</p>
                <p className="text-white text-xl sm:text-2xl font-black">{result}</p>
            </div>}

            {/* ★ 모든 항목이 다 뽑혔을 때 안내 */}
            {isNoRepeat&&displayItems.length===0&&<div className="mb-4 px-6 py-3 rounded-2xl text-center bg-gray-100 border border-gray-200">
                <p className="text-gray-500 text-sm font-black">모든 항목을 뽑았습니다!</p>
                <p className="text-gray-400 text-[11px] font-bold mt-1">초기화 버튼을 눌러 다시 시작하세요</p>
            </div>}

            {displayItems.length>0&&<div className="wheel-container mb-4">
                <svg className="wheel-pointer" width="30" height="30" viewBox="0 0 30 30">
                    <polygon points="15,28 5,4 25,4" fill="#FF6348" stroke="white" strokeWidth="2"/>
                </svg>
                <div style={{transform:`rotate(${rotation}deg)`,transition:isSpinning?'none':'transform 0.1s'}}>
                    <canvas ref={canvasRef} width={wheelSize} height={wheelSize} style={{width:wheelSize,height:wheelSize}}/>
                </div>
                <div className="wheel-center">
                    <Icon name="circle-dot" size={20} className="text-gray-300"/>
                </div>
            </div>}

            <button onClick={spinWheel} disabled={isSpinning||displayItems.length<1} className="w-full sm:w-auto px-8 py-3.5 bg-gradient-to-r from-[#FECA57] to-[#FF6348] hover:from-[#FFD700] hover:to-[#FF4500] text-white rounded-full text-lg font-black shadow-lg active:scale-95 flex items-center justify-center gap-2 touch-target transition-all disabled:opacity-60 disabled:cursor-not-allowed">
                {isSpinning?<><Icon name="loader-2" size={18} className="animate-spin"/>돌리는 중...</>:displayItems.length===0?'모두 추첨 완료!':<><Icon name="zap" size={18}/>돌리기!</>}
            </button>

            <div className="mt-4 w-full">
                <div className="flex flex-wrap gap-1.5 justify-center">{items.map((item,i)=>{
                    const isUsed=isNoRepeat&&usedItems.includes(item);
                    return <span key={i} className="px-2.5 py-1 rounded-full text-[10px] font-bold text-white relative" style={{backgroundColor:WHEEL_COLORS[i%WHEEL_COLORS.length],opacity:isUsed?0.35:1,textDecoration:isUsed?'line-through':'none'}}>{item}</span>;
                })}</div>
            </div>
        </div>}

        {history.length>0&&<div className="bg-white/80 rounded-xl p-3 soft-shadow border border-gray-100">
            <div className="flex items-center justify-between mb-2">
                <span className="text-[10px] font-bold text-gray-400">추첨 기록 ({history.length})</span>
                <button onClick={()=>{ps('click');setHistory([]);}} className="text-[10px] text-red-300 font-bold">전체삭제</button>
            </div>
            <div className="flex flex-wrap gap-1.5">{history.map((h,i)=><div key={i} className="flex items-center gap-1 px-2.5 py-1.5 bg-[#FFFDF0] rounded-lg border border-[#FECA57]/30 text-xs font-bold text-gray-600"><span className="text-[#FECA57] font-black">{i+1}.</span> {h.text} <span className="text-[9px] text-gray-400">({h.time})</span></div>)}</div>
        </div>}
    </div>);
}

const LOTTO_BALL_COLORS=['#E74C3C','#E67E22','#27AE60','#2980B9','#8E44AD','#D35400','#16A085','#2C3E50','#C0392B','#7D3C98'];

function LottoPicker({students,excludedNums,playSound:ps,isSoundOn}){
    const activeStudents=useMemo(()=>students.filter(s=>!excludedNums.includes(s)),[students,excludedNums]);
    const [pickCount,setPickCount]=useState(1);
    const [isRolling,setIsRolling]=useState(false);
    const [results,setResults]=useState([]);
    const [rollingNums,setRollingNums]=useState([]);
    const [revealedCount,setRevealedCount]=useState(0);
    const [history,setHistory]=useState([]);
    const [isNoRepeat,setIsNoRepeat]=useState(false);
    const [usedNums,setUsedNums]=useState([]);
    const rollTimersRef=useRef([]);
    const audioCtxRef=useRef(null);

    const getAudioCtx=()=>{
        if(!audioCtxRef.current)audioCtxRef.current=new(window.AudioContext||window.webkitAudioContext)();
        if(audioCtxRef.current.state==='suspended')audioCtxRef.current.resume();
        return audioCtxRef.current;
    };

    const playBallDrop=useCallback((idx)=>{
        if(!isSoundOn)return;
        const ctx=getAudioCtx();const t=ctx.currentTime;
        const baseFreq=[261.63,329.63,392.00,523.25,659.25,783.99,1046.50];
        const freq=baseFreq[idx%baseFreq.length];
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type='sine';
        o.frequency.setValueAtTime(freq,t);
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(.12,t+.03);
        g.gain.exponentialRampToValueAtTime(.001,t+.4);
        o.start(t);o.stop(t+.4);
        const o2=ctx.createOscillator(),g2=ctx.createGain();
        o2.connect(g2);g2.connect(ctx.destination);
        o2.type='triangle';
        o2.frequency.setValueAtTime(freq*2,t);
        g2.gain.setValueAtTime(.06,t);
        g2.gain.exponentialRampToValueAtTime(.001,t+.08);
        o2.start(t);o2.stop(t+.1);
    },[isSoundOn]);

    const playFinalFanfare=useCallback(()=>{
        if(!isSoundOn)return;
        const ctx=getAudioCtx();const t=ctx.currentTime;
        [523.25,659.25,783.99,1046.5,1318.5,1567.98].forEach((f,i)=>{
            const o=ctx.createOscillator(),g=ctx.createGain();
            o.connect(g);g.connect(ctx.destination);
            o.type=i<3?'sine':'triangle';
            o.frequency.setValueAtTime(f,t+i*.08);
            g.gain.setValueAtTime(0,t+i*.08);
            g.gain.linearRampToValueAtTime(.1,t+i*.08+.03);
            g.gain.exponentialRampToValueAtTime(.001,t+i*.08+.5);
            o.start(t+i*.08);o.stop(t+i*.08+.5);
        });
    },[isSoundOn]);

    const getBallColor=(num)=>{
        if(num<=10)return '#FBC400';
        if(num<=20)return '#69C8F2';
        if(num<=30)return '#FF7272';
        if(num<=40)return '#555555';
        if(num<=50)return '#B0D840';
        if(num<=60)return '#A855F7';
        if(num<=70)return '#F97316';
        if(num<=80)return '#14B8A6';
        if(num<=90)return '#EC4899';
        return '#6366F1';
    };

    const startDraw=()=>{
        let pool=isNoRepeat?activeStudents.filter(s=>!usedNums.includes(s)):activeStudents;
        if(pool.length===0){
            ps('click');
            return;
        }
        const count=Math.min(pickCount,pool.length);
        ps('click');
        setIsRolling(true);
        setResults([]);
        setRevealedCount(0);

        const shuffled=[...pool].sort(()=>Math.random()-.5);
        const winners=shuffled.slice(0,count);

        const initRolling=Array(count).fill(0);
        setRollingNums(initRolling);

        const revealBall=(idx)=>{
            let rollCount=0;
            const maxRolls=12+idx*3;
            const rollInterval=setInterval(()=>{
                setRollingNums(prev=>{
                    const next=[...prev];
                    next[idx]=activeStudents[Math.floor(Math.random()*activeStudents.length)];
                    return next;
                });
                rollCount++;
                if(rollCount>=maxRolls){
                    clearInterval(rollInterval);
                    setRollingNums(prev=>{
                        const next=[...prev];
                        next[idx]=winners[idx];
                        return next;
                    });
                    setResults(prev=>[...prev,winners[idx]]);
                    setRevealedCount(prev=>prev+1);
                    playBallDrop(idx);

                    if(idx===count-1){
                        setTimeout(()=>{
                            setIsRolling(false);
                            if(isNoRepeat)setUsedNums(prev=>[...prev,...winners]);
                            setHistory(prev=>[{
                                nums:winners,
                                time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})
                            },...prev].slice(0,20));
                            playFinalFanfare();
                            confetti({particleCount:200,spread:90,origin:{y:.45},colors:['#FF6B6B','#FECA57','#48DBFB','#2ED573','#FF9FF3','#54A0FF'],disableForReducedMotion:true});
                        },300);
                    }
                }
            },80);
            rollTimersRef.current.push(rollInterval);
        };

        for(let i=0;i<count;i++){
            const timer=setTimeout(()=>revealBall(i),i*1200+500);
            rollTimersRef.current.push(timer);
        }
    };

    useEffect(()=>{return()=>{rollTimersRef.current.forEach(t=>{clearTimeout(t);clearInterval(t);});};},[]);

    const availableCount=isNoRepeat?activeStudents.filter(s=>!usedNums.includes(s)).length:activeStudents.length;

    return(<div className="w-full max-w-2xl mx-auto space-y-3">
        <div className="lotto-machine">
            <div className="text-center mb-4">
                <h2 className="text-xl sm:text-2xl font-black text-white flex items-center justify-center gap-2">
                    <span className="text-2xl">🎱</span> 로또 추첨기
                </h2>
                <p className="text-[11px] text-gray-400 font-bold mt-1">행운의 발표자를 뽑아보세요!</p>
            </div>

            <div className="lotto-glass mb-4">
                <div className="flex items-center justify-center gap-3 sm:gap-4 min-h-[80px] flex-wrap py-2">
                    {Array.from({length:Math.min(pickCount,availableCount)}).map((_,i)=>{
                        const revealed=i<results.length;
                        const rolling=isRolling&&i>=results.length&&i<=results.length;
                        const num=revealed?results[i]:(rolling?rollingNums[i]:null);
                        if(revealed){
                            return <div key={i} className="lotto-ball lotto-pop" style={{backgroundColor:getBallColor(num)}}>
                                <span style={{textShadow:'0 1px 3px rgba(0,0,0,.3)'}}>{num}</span>
                            </div>;
                        }
                        if(rolling&&num){
                            return <div key={i} className="lotto-ball lotto-rolling" style={{backgroundColor:'#666'}}>
                                <span style={{textShadow:'0 1px 3px rgba(0,0,0,.3)'}}>{num}</span>
                            </div>;
                        }
                        return <div key={i} className="lotto-slot">
                            <span className="text-gray-400 font-bold text-lg">?</span>
                        </div>;
                    })}
                </div>
            </div>

            <div className="flex flex-col gap-3">
                <div className="flex items-center justify-center gap-3">
                    <span className="text-sm font-bold text-gray-400">뽑기 수</span>
                    <div className="flex items-center bg-white/10 rounded-xl px-1.5 py-1 gap-1 border border-white/10">
                        <button onClick={()=>{ps('click');setPickCount(Math.max(1,pickCount-1));}} className="w-9 h-9 rounded-lg bg-white/10 text-white touch-target flex items-center justify-center hover:bg-white/20 transition-all"><Icon name="minus" size={16}/></button>
                        <span className="text-xl font-black text-white min-w-[2.5rem] text-center">{pickCount}</span>
                        <button onClick={()=>{ps('click');setPickCount(Math.min(Math.min(10,availableCount),pickCount+1));}} className="w-9 h-9 rounded-lg bg-white/10 text-white touch-target flex items-center justify-center hover:bg-white/20 transition-all"><Icon name="plus" size={16}/></button>
                    </div>
                    <span className="text-[10px] text-gray-500 font-bold">명</span>
                </div>

                <div className="flex items-center justify-center gap-2">
                    <button onClick={()=>{ps('click');setIsNoRepeat(!isNoRepeat);}} className={`px-3 py-1.5 rounded-lg text-[11px] font-bold border transition-all ${isNoRepeat?'bg-yellow-500/20 border-yellow-500/40 text-yellow-300':'bg-white/5 border-white/10 text-gray-500'}`}>
                        중복방지 {isNoRepeat?'ON':'OFF'}
                    </button>
                    {isNoRepeat&&usedNums.length>0&&<button onClick={()=>{ps('click');setUsedNums([]);}} className="px-3 py-1.5 bg-white/5 border border-white/10 rounded-lg text-[11px] font-bold text-gray-500">
                        초기화 ({usedNums.length}명)
                    </button>}
                    <span className="text-[10px] text-gray-500 font-bold">남은 인원: {availableCount}명</span>
                </div>

                <button onClick={startDraw} disabled={isRolling||availableCount===0} className="w-full py-4 bg-gradient-to-r from-[#FF6B6B] via-[#FECA57] to-[#48DBFB] text-white rounded-2xl text-lg font-black shadow-lg shadow-[#FF6B6B]/20 active:scale-[.97] flex items-center justify-center gap-2 touch-target transition-all disabled:opacity-40 disabled:cursor-not-allowed">
                    {isRolling?<><Icon name="loader-2" size={20} className="animate-spin"/> 추첨 중...</>:availableCount===0?'모두 추첨 완료!':<><span className="text-xl">🎱</span> 추첨 시작!</>}
                </button>
            </div>
        </div>

        {history.length>0&&<div className="bg-white/80 rounded-xl p-3 soft-shadow border border-gray-100">
            <div className="flex items-center justify-between mb-2">
                <span className="text-[10px] font-bold text-gray-400">추첨 기록 ({history.length})</span>
                <button onClick={()=>{ps('click');setHistory([]);}} className="text-[10px] text-red-300 font-bold">전체삭제</button>
            </div>
            <div className="space-y-1.5">{history.map((h,i)=><div key={i} className="flex items-center gap-2 px-2.5 py-2 bg-[#F9F9F9] rounded-lg border border-gray-100">
                <span className="text-[10px] font-black text-gray-400 shrink-0">#{i+1}</span>
                <div className="flex gap-1.5 flex-wrap flex-1">{h.nums.map((n,j)=><span key={j} className="inline-flex items-center justify-center w-8 h-8 rounded-full text-white text-xs font-black" style={{backgroundColor:getBallColor(n),boxShadow:'inset 0 -2px 4px rgba(0,0,0,.15)'}}>{n}</span>)}</div>
                <span className="text-[9px] text-gray-400 shrink-0">{h.time}</span>
            </div>)}</div>
        </div>}
    </div>);
}

function SeatRowConfig({seatGrid,setSeatGrid,seatRows,setSeatRows,seatRowMode,setSeatRowMode,seatColumns,setSeatColumns,seatGridTotal,totalStudents,savedSeatLayout,seatLayoutDirty,onSaveLayout,onClearLayout,playSound}){
    const makeFullGrid=(r,c)=>Array.from({length:r},()=>Array(c).fill(true));
    const makeFitGrid=(r,c,total)=>{
        const grid=Array.from({length:r},()=>Array(c).fill(false));
        let remain=total;
        for(let ri=0;ri<r&&remain>0;ri++){
            for(let ci=0;ci<c&&remain>0;ci++){
                grid[ri][ci]=true;
                remain--;
            }
        }
        return grid;
    };

    const switchToCustom=()=>{
        playSound('click');
        setSeatRowMode('custom');
        if(seatGrid.length===0){
            const r=Math.ceil(totalStudents/seatColumns);
            setSeatRows(r);
            setSeatGrid(makeFitGrid(r,seatColumns,totalStudents));
        }
    };

    const changeRows=(delta)=>{
        playSound('click');
        const next=Math.max(1,Math.min(15,seatRows+delta));
        setSeatRows(next);
        setSeatGrid(prev=>{
            const grid=[...prev.map(r=>[...r])];
            while(grid.length<next)grid.push(Array(seatColumns).fill(true));
            return grid.slice(0,next);
        });
    };
    const changeCols=(delta)=>{
        playSound('click');
        const next=Math.max(2,Math.min(10,seatColumns+delta));
        setSeatColumns(next);
        setSeatGrid(prev=>prev.map(row=>{
            const r=[...row];
            while(r.length<next)r.push(true);
            return r.slice(0,next);
        }));
    };

    const toggleCell=(ri,ci)=>{
        playSound('click');
        setSeatGrid(prev=>{
            const grid=prev.map(r=>[...r]);
            grid[ri][ci]=!grid[ri][ci];
            return grid;
        });
    };
    const toggleRow=(ri)=>{
        playSound('click');
        setSeatGrid(prev=>{
            const grid=prev.map(r=>[...r]);
            const allOn=grid[ri].every(Boolean);
            grid[ri]=grid[ri].map(()=>!allOn);
            return grid;
        });
    };
    const toggleCol=(ci)=>{
        playSound('click');
        setSeatGrid(prev=>{
            const grid=prev.map(r=>[...r]);
            const allOn=grid.every(r=>r[ci]);
            grid.forEach(r=>{r[ci]=!allOn;});
            return grid;
        });
    };

    const presetAll=()=>{playSound('click');setSeatGrid(makeFullGrid(seatRows,seatColumns));};
    const presetFit=()=>{playSound('click');setSeatGrid(makeFitGrid(seatRows,seatColumns,totalStudents));};
    const presetClear=()=>{playSound('click');setSeatGrid(Array.from({length:seatRows},()=>Array(seatColumns).fill(false)));};

    return(<div className="bg-white/80 backdrop-blur rounded-xl p-2.5 border border-gray-100 soft-shadow space-y-2">
        <div className="flex items-center gap-2">
            <div className="shrink-0 p-1.5 rounded-lg bg-[#FFD3B6]/20"><Icon name="layout-grid" size={15}/></div>
            <div className="flex bg-[#FFF8F0] p-0.5 rounded-lg flex-1 border border-gray-100">
                <button onClick={()=>{playSound('click');setSeatRowMode('auto');}} className={`flex-1 py-1.5 rounded-md text-[10px] font-bold transition-all ${seatRowMode==='auto'?'bg-white shadow-sm text-[#D68C60]':'text-gray-400'}`}>자동 배치</button>
                <button onClick={switchToCustom} className={`flex-1 py-1.5 rounded-md text-[10px] font-bold transition-all ${seatRowMode==='custom'?'bg-white shadow-sm text-[#D68C60]':'text-gray-400'}`}>자리 배치</button>
            </div>
        </div>

        <div className="flex items-center gap-3 flex-wrap">
            <div className="flex items-center gap-1.5">
                <span className="text-[10px] text-gray-400 font-bold shrink-0">열</span>
                <div className="flex items-center bg-[#FFF8F0] rounded-lg border border-gray-100 px-1 gap-0.5">
                    <button onClick={()=>changeCols(-1)} className="w-7 h-7 rounded-md bg-white shadow-sm text-gray-500 touch-target flex items-center justify-center"><Icon name="minus" size={12}/></button>
                    <span className="text-sm font-black text-[#D68C60] min-w-[1.5rem] text-center">{seatColumns}</span>
                    <button onClick={()=>changeCols(1)} className="w-7 h-7 rounded-md bg-white shadow-sm text-gray-500 touch-target flex items-center justify-center"><Icon name="plus" size={12}/></button>
                </div>
            </div>
            {seatRowMode==='custom'&&<div className="flex items-center gap-1.5">
                <span className="text-[10px] text-gray-400 font-bold shrink-0">행</span>
                <div className="flex items-center bg-[#FFF8F0] rounded-lg border border-gray-100 px-1 gap-0.5">
                    <button onClick={()=>changeRows(-1)} className="w-7 h-7 rounded-md bg-white shadow-sm text-gray-500 touch-target flex items-center justify-center"><Icon name="minus" size={12}/></button>
                    <span className="text-sm font-black text-[#D68C60] min-w-[1.5rem] text-center">{seatRows}</span>
                    <button onClick={()=>changeRows(1)} className="w-7 h-7 rounded-md bg-white shadow-sm text-gray-500 touch-target flex items-center justify-center"><Icon name="plus" size={12}/></button>
                </div>
            </div>}
            <span className="text-[10px] text-gray-400 font-bold ml-auto">학생 {totalStudents}명</span>
        </div>

// ===== 판서(화이트보드) 컴포넌트 - 통합용 =====
const WB_TOOLS={MARKER:'marker',HIGHLIGHTER:'highlighter',BRUSH:'brush',TEXT:'text',SHAPE:'shape',STICKY:'sticky',ERASER:'eraser',SELECT:'select',LASER:'laser',PAN:'pan'};
const WB_ERASER_MODES={PIXEL:'pixel',STROKE:'stroke',OBJECT:'object'};
const WB_BG_MODES={LIGHT:'light',DARK:'dark',GRID:'grid',GRAPH:'graph',LINED:'lined'};
const WB_BASE_COLORS=['#E53935','#FB8C00','#FDD835','#43A047','#1E88E5','#3949AB','#8E24AA','#000000','#FFFFFF'];
const WB_STICKY_COLORS=['#FFF59D','#F8BBD0','#B3E5FC','#C5E1A5','#FFCC80','#D1C4E9'];
const WB_FONTS=[{label:'고운돋움',value:"'Gowun Dodum',sans-serif"},{label:'감자꽃',value:"'Gamja Flower',cursive"},{label:'주아',value:"'Jua',sans-serif"},{label:'도현',value:"'Do Hyeon',sans-serif"},{label:'노토산스',value:"'Noto Sans KR',sans-serif"}];
const WB_SHAPES=[{value:'line',label:'직선',icon:'minus'},{value:'arrow',label:'화살표',icon:'move-right'},{value:'rect',label:'사각형',icon:'square'},{value:'ellipse',label:'원',icon:'circle'},{value:'triangle',label:'삼각형',icon:'triangle'}];
const wbUid=()=>Math.random().toString(36).slice(2,11);
const wbDistSeg=(px,py,x1,y1,x2,y2)=>{const dx=x2-x1,dy=y2-y1;const l=dx*dx+dy*dy;if(l===0)return Math.hypot(px-x1,py-y1);let t=((px-x1)*dx+(py-y1)*dy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));};
const wbStrokeHit=(s,ex,ey,er)=>{const th=er+(s.width||3)/2;const p=s.points;for(let i=0;i<p.length-1;i++)if(wbDistSeg(ex,ey,p[i][0],p[i][1],p[i+1][0],p[i+1][1])<=th)return true;if(p.length===1)return Math.hypot(ex-p[0][0],ey-p[0][1])<=th;return false;};
const wbBoxHit=(b,ex,ey,er)=>{const cx=Math.max(b.x,Math.min(ex,b.x+b.w));const cy=Math.max(b.y,Math.min(ey,b.y+b.h));return Math.hypot(ex-cx,ey-cy)<=er;};
const wbShapeHit=(s,ex,ey,er)=>{if(s.shape==='line'||s.shape==='arrow')return wbDistSeg(ex,ey,s.x1,s.y1,s.x2,s.y2)<=er+s.strokeWidth/2;const b={x:Math.min(s.x1,s.x2),y:Math.min(s.y1,s.y2),w:Math.abs(s.x2-s.x1),h:Math.abs(s.y2-s.y1)};return wbBoxHit(b,ex,ey,er);};
const wbSplitStroke=(s,ex,ey,er)=>{const th=er+(s.width||3)/2;const p=s.points,w=s.widths;const segs=[],sw=[];let c=[],cw=[];for(let i=0;i<p.length;i++){if(Math.hypot(p[i][0]-ex,p[i][1]-ey)>th){c.push(p[i]);if(w)cw.push(w[i]);}else{if(c.length>=2){segs.push(c);if(w)sw.push(cw);}c=[];cw=[];}}if(c.length>=2){segs.push(c);if(w)sw.push(cw);}return segs.map((pts,i)=>({...s,id:wbUid(),points:pts,...(w?{widths:sw[i]}:{})}));};

const wbInitState={pages:[{id:wbUid(),name:'페이지 1',objects:[],background:WB_BG_MODES.LIGHT}],activePageIdx:0,history:[],future:[]};
function wbReducer(state,action){
    const snap=()=>JSON.parse(JSON.stringify({pages:state.pages,activePageIdx:state.activePageIdx}));
    const push=(np,ni)=>({...state,pages:np,activePageIdx:ni??state.activePageIdx,history:[...state.history,snap()].slice(-50),future:[]});
    const skip=(np,ni)=>({...state,pages:np,activePageIdx:ni??state.activePageIdx});
    switch(action.type){
        case 'ADD_OBJECT':{const np=state.pages.map((p,i)=>i===state.activePageIdx?{...p,objects:[...p.objects,action.object]}:p);return push(np);}
        case 'UPDATE_OBJECT':{const np=state.pages.map((p,i)=>i===state.activePageIdx?{...p,objects:p.objects.map(o=>o.id===action.id?{...o,...action.patch}:o)}:p);return action.skipHistory?skip(np):push(np);}
        case 'REMOVE_OBJECTS':{const ids=new Set(action.ids);const np=state.pages.map((p,i)=>i===state.activePageIdx?{...p,objects:p.objects.filter(o=>!ids.has(o.id))}:p);return push(np);}
        case 'REPLACE_OBJECTS':{const rm=new Set(action.removeIds);const np=state.pages.map((p,i)=>{if(i!==state.activePageIdx)return p;return {...p,objects:[...p.objects.filter(o=>!rm.has(o.id)),...action.newObjects]};});return action.skipHistory?skip(np):push(np);}
        case 'CLEAR_PAGE':{const np=state.pages.map((p,i)=>i===state.activePageIdx?{...p,objects:[]}:p);return push(np);}
        case 'SET_BACKGROUND':{const np=state.pages.map((p,i)=>i===state.activePageIdx?{...p,background:action.bg}:p);return push(np);}
        case 'ADD_PAGE':{const newP={id:wbUid(),name:`페이지 ${state.pages.length+1}`,objects:[],background:state.pages[state.activePageIdx].background};return push([...state.pages,newP],state.pages.length);}
        case 'REMOVE_PAGE':{if(state.pages.length<=1)return state;const np=state.pages.filter((_,i)=>i!==action.index);return push(np,Math.min(state.activePageIdx,np.length-1));}
        case 'SET_ACTIVE_PAGE':return {...state,activePageIdx:action.index};
        case 'UNDO':{if(!state.history.length)return state;const prev=state.history[state.history.length-1];return {...state,pages:prev.pages,activePageIdx:prev.activePageIdx,history:state.history.slice(0,-1),future:[snap(),...state.future].slice(0,50)};}
        case 'REDO':{if(!state.future.length)return state;const nxt=state.future[0];return {...state,pages:nxt.pages,activePageIdx:nxt.activePageIdx,history:[...state.history,snap()].slice(-50),future:state.future.slice(1)};}
        case 'LOAD':return {...action.state,history:[],future:[]};
        default:return state;
    }
}

    const cursorRef=useRef({x:0,y:0,inside:false});

    const imageCache=useRef(new Map());
    const measureCtx=useMemo(()=>{const c=document.createElement('canvas');return c.getContext('2d');},[]);
    const textDragRef=useRef(null);
    const [textBoxDraft,setTextBoxDraft]=useState(null);
    // 텍스트 객체의 화면상 박스(줄바꿈/래핑 반영) 계산
    const wbTextBox=useCallback((o)=>{
        const ctx=measureCtx;ctx.font=`${o.italic?'italic ':''}${o.bold?'bold ':''}${o.fontSize}px ${o.fontFamily}`;
        const lh=o.fontSize*1.2;const paras=(o.content||'').split('\n');let maxW=0,lines=0;
        if(o.width){maxW=o.width;paras.forEach(para=>{if(para===''){lines++;return;}let line='';for(const ch of para){const test=line+ch;if(ctx.measureText(test).width>o.width&&line!==''){lines++;line=ch;}else line=test;}if(line!=='')lines++;});}
        else{paras.forEach(l=>{maxW=Math.max(maxW,ctx.measureText(l||' ').width);lines++;});}
        return {x:o.x,y:o.y,w:Math.max(20,maxW),h:Math.max(lh,lines*lh)};
    },[measureCtx]);

    // 판서 내 배경 모드 변경 시 펜 색상 자동 적응 (검정 ↔ 흰색)
    useEffect(()=>{
