                <div className="flex flex-wrap justify-center gap-1.5 mb-3 sm:mb-5">{[{l:'+10초',v:10},{l:'+1분',v:60},{l:'+5분',v:300}].map(b=><button key={b.l} onClick={()=>adjustTime(b.v)} className="px-3.5 py-2 bg-white rounded-lg font-bold text-xs text-gray-500 shadow-sm border border-gray-100 active:scale-95 touch-target">{b.l}</button>)}<button onClick={()=>adjustTime(-10)} className="px-3.5 py-2 bg-white rounded-lg font-bold text-xs text-red-400 shadow-sm border border-red-50 active:scale-95 touch-target">-10초</button></div>
                <div className="flex flex-wrap justify-center gap-1.5 mb-5 sm:mb-7">{[{l:'1분',s:60},{l:'3분',s:180},{l:'5분',s:300},{l:'10분',s:600}].map(p=><button key={p.l} onClick={()=>{playSound('click');setTimeLeft(p.s);setInitialTime(p.s);setIsTimerRunning(false);}} className={`px-3.5 py-2 rounded-lg text-xs font-bold border-2 active:scale-95 touch-target ${timeLeft===p.s&&!isTimerRunning?'bg-[#FFDAC1] border-[#FFDAC1] text-white':'bg-white border-gray-100 text-gray-400'}`}>{p.l}</button>)}</div>
                <div className="flex gap-2.5 w-full max-w-xs"><button onClick={()=>{playSound('click');if(!isTimerRunning){setTimerEverStarted(true);if(timeLeft>0)setInitialTime(timeLeft);}setIsTimerRunning(!isTimerRunning);}} className={`flex-1 py-3.5 rounded-2xl text-lg font-black text-white shadow-lg active:scale-95 flex items-center justify-center gap-2 touch-target ${isTimerRunning?'bg-[#FF9E99]':'bg-[#B5EAD7]'}`}><Icon name={isTimerRunning?"pause":"play"} size={20}/>{isTimerRunning?'일시정지':'시작'}</button><button onClick={()=>{playSound('click');setIsTimerRunning(false);setTimeLeft(initialTime);}} className="py-3.5 px-5 rounded-2xl bg-gray-200 text-gray-500 font-bold active:scale-95 touch-target flex items-center justify-center"><Icon name="rotate-ccw" size={20}/></button><button onClick={()=>{playSound('click');setShowClockInTimer(!showClockInTimer);}} className={`py-3.5 px-5 rounded-2xl font-bold active:scale-95 touch-target flex items-center justify-center ${showClockInTimer?'bg-[#C7CEEA] text-white shadow-lg':'bg-gray-200 text-gray-500'}`}><Icon name="clock" size={20}/></button></div>
            </div>}

            {/* 5 유튜브 */}
            {mode==='youtube'&&<div className="card-enter w-full"><YouTubePlayer playSound={playSound}/></div>}
            {/* 6 달력 */}
            {mode==='calendar'&&<div className="card-enter w-full space-y-4"><div className="bg-white rounded-2xl p-5 sm:p-7 soft-shadow border border-gray-100 text-center"><LiveClock size="lg"/></div><CalendarWidget/></div>}
            {/* 7 녹음 */}
            {mode==='record'&&<div className="card-enter w-full"><RecorderWidget playSound={playSound}/></div>}
            {/* 8 QR */}
            {mode==='qr'&&<div className="card-enter flex flex-col items-center w-full"><div className="bg-white p-4 sm:p-6 rounded-2xl shadow-lg border-2 border-[#B5EAD7] w-full max-w-lg text-center"><h2 className="text-lg sm:text-xl font-black text-[#4A4A4A] mb-3 flex items-center justify-center gap-2"><Icon name="scan-line" size={18}/> QR코드</h2><div className="flex gap-2 mb-4"><input type="url" value={qrInput} onChange={e=>setQrInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&qrInput&&setQrUrl(`https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(qrInput)}`)} className="flex-1 p-2.5 bg-[#F0FDF4] rounded-xl border-2 border-transparent focus:border-[#B5EAD7] outline-none font-bold text-sm" placeholder="URL 입력"/><button onClick={()=>{if(qrInput){playSound('click');setQrUrl(`https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(qrInput)}`);}}} className="px-4 bg-[#B5EAD7] text-white rounded-xl font-black shadow-md touch-target">생성</button></div>{qrUrl?<div className="inline-block p-3 bg-white rounded-2xl shadow-md border border-gray-100 cursor-pointer" onClick={()=>setFullScreenContent({type:'qr',data:qrUrl})}><img src={qrUrl} alt="QR" className="w-40 h-40 sm:w-52 sm:h-52 mix-blend-multiply"/><p className="text-gray-400 text-[10px] font-bold mt-2">터치하여 확대</p></div>:<div className="w-40 h-40 sm:w-52 sm:h-52 mx-auto bg-gray-50 rounded-2xl flex flex-col items-center justify-center text-gray-300 border-2 border-dashed border-gray-200"><Icon name="link" size={28} className="opacity-40 mb-1"/><span className="font-bold text-xs">주소를 입력하세요</span></div>}</div></div>}

            {/* 9 메모 */}
            {mode==='memo'&&<div className="card-enter w-full max-w-3xl mx-auto">
                <div className="bg-white rounded-2xl p-3 sm:p-4 soft-shadow border border-gray-100 mb-3 space-y-2.5">
                    <div className="flex gap-2">
                        <div className="flex-1 relative"><input type="text" value={memoInput} onChange={e=>setMemoInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&memoInput.trim())addMemo();}} className="w-full p-2.5 pl-8 bg-[#F9F9F9] rounded-xl border-2 border-[#C7CEEA] font-bold text-sm focus:outline-none" placeholder="기억할 내용"/><span className="absolute left-2.5 top-1/2 -translate-y-1/2 text-[#C7CEEA]"><Icon name="pencil" size={14}/></span></div>
                        <button onClick={addMemo} className="px-3 bg-[#C7CEEA] text-white rounded-xl font-black shadow-md touch-target"><Icon name="plus" size={18}/></button>
                        {memos.length>0&&<button onClick={()=>{playSound('click');setMemos([]);}} className="px-3 bg-red-100 text-red-400 rounded-xl font-bold touch-target"><Icon name="trash-2" size={16}/></button>}
                    </div>
                    <div className="flex items-center gap-2">
                        <span className="text-[10px] text-gray-400 font-bold shrink-0">배경색</span>
                        <div className="flex gap-1.5 overflow-x-auto no-scrollbar py-1">
                            {MEMO_COLORS.map(c=><div key={c} onClick={()=>{playSound('click');setMemoColor(c);}} className={`color-dot ${memoColor===c?'active':''}`} style={{backgroundColor:c}}/>)}
                        </div>
                    </div>
                    <div className="flex items-center gap-2">
                        <span className="text-[10px] text-gray-400 font-bold shrink-0">글자 크기</span>
                        <div className="flex items-center gap-1.5 bg-[#F7F7F7] rounded-lg px-1.5 py-0.5 border border-gray-100">
                            <button onClick={()=>{playSound('click');setMemoFontSize(s=>Math.max(10,s-2));}} className="w-7 h-7 rounded-md bg-white shadow-sm text-gray-500 touch-target flex items-center justify-center text-xs font-bold">A-</button>
                            <span className="text-xs font-black text-gray-500 min-w-[2rem] text-center">{memoFontSize}px</span>
                            <button onClick={()=>{playSound('click');setMemoFontSize(s=>Math.min(32,s+2));}} className="w-7 h-7 rounded-md bg-white shadow-sm text-gray-500 touch-target flex items-center justify-center text-xs font-bold">A+</button>
                        </div>
                        <div className="ml-2 px-3 py-1 rounded-lg border border-gray-100" style={{backgroundColor:memoColor}}>
                            <span className="font-bold text-gray-600" style={{fontSize:`${memoFontSize}px`,fontFamily:'Gamja Flower'}}>미리보기</span>
                        </div>
                    </div>
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 sm:gap-3">{memos.map(m=><div key={m.id} onClick={()=>{setFullScreenContent({type:'text',data:m.text,color:m.color,fontSize:m.fontSize});setFsFontSize(window.innerWidth<500?40:70);}} className="relative p-3 sm:p-4 rounded-xl min-h-[80px] sm:min-h-[130px] flex items-center justify-center text-center cursor-pointer shadow-sm hover:shadow-md transition-shadow" style={{backgroundColor:m.color}}><p className="font-black text-gray-700 whitespace-pre-wrap line-clamp-4" style={{fontFamily:'Gamja Flower',fontSize:`${m.fontSize||14}px`}}>{m.text}</p><button onClick={e=>{e.stopPropagation();playSound('click');setMemos(memos.filter(x=>x.id!==m.id));}} className="absolute top-1.5 right-1.5 p-1 bg-white/50 rounded-full text-red-400"><Icon name="trash-2" size={11}/></button></div>)}{!memos.length&&<div className="col-span-full py-10 text-center text-gray-300 font-bold border-2 border-dashed border-gray-200 rounded-2xl bg-white/50"><Icon name="sticky-note" size={28} className="mx-auto opacity-30 mb-1"/><p className="text-xs">메모를 추가해보세요!</p></div>}</div>
            </div>}

            {/* 10 사진 */}
            {mode==='img'&&<div className="card-enter flex flex-col items-center w-full"><div className="bg-white p-3 sm:p-5 rounded-2xl shadow-lg border-2 border-[#FFC3A0] w-full max-w-3xl min-h-[220px] sm:min-h-[400px] flex items-center justify-center relative">{uploadedImg?<div className="relative w-full flex items-center justify-center"><img src={uploadedImg} className="max-w-full max-h-[50vh] rounded-xl shadow-sm cursor-pointer" onClick={()=>setFullScreenContent({type:'img',data:uploadedImg})}/><button onClick={()=>{setUploadedImg(null);fileInputRef.current.value='';}} className="absolute top-2 right-2 p-2 bg-white text-[#FFC3A0] rounded-full shadow-md touch-target"><Icon name="x" size={18}/></button></div>:<div onClick={()=>fileInputRef.current.click()} className="flex flex-col items-center justify-center gap-3 cursor-pointer p-8 sm:p-14 hover:bg-[#FFF5EB] rounded-2xl w-full h-full border-2 border-dashed border-[#FFC3A0]/30"><div className="p-5 bg-[#FFEDD5] rounded-full text-[#FFC3A0]"><Icon name="image-plus" size={32}/></div><p className="text-base font-bold text-[#FFC3A0]">터치하여 사진 업로드</p></div>}<input type="file" ref={fileInputRef} onChange={e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=res=>{setUploadedImg(res.target.result);playSound('win');};r.readAsDataURL(f);}}} accept="image/*" className="hidden"/></div></div>}
            <Copyright/>
        </main>

        {/* 짝꿍 모달 */}
        {showPairSettings&&<div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center bg-black/40 backdrop-blur-sm" onClick={()=>setShowPairSettings(false)}><div className="modal-up bg-white w-full sm:max-w-md sm:rounded-2xl rounded-t-2xl shadow-2xl border-t-4 sm:border-4 border-[#FFD3B6] max-h-[80vh] flex flex-col safe-b" onClick={e=>e.stopPropagation()}>
            <div className="flex items-center justify-between p-3.5 border-b border-gray-100 shrink-0"><div className="flex items-center gap-2"><div className="bg-[#FFD3B6] p-1.5 rounded-lg text-white"><Icon name="settings-2" size={16}/></div><div><h3 className="text-sm font-black text-[#4A4A4A]">짝꿍 조건 설정</h3><p className="text-[9px] text-gray-400 font-bold">비밀 설정</p></div></div><button onClick={()=>setShowPairSettings(false)} className="p-2 text-gray-400 rounded-lg touch-target"><Icon name="x" size={18}/></button></div>
            <div className="flex mx-3.5 mt-2.5 bg-[#FFF8F0] p-0.5 rounded-lg shrink-0"><button onClick={()=>setPairSettingTab('must')} className={`flex-1 py-2 rounded-md text-xs font-bold flex items-center justify-center gap-1 ${pairSettingTab==='must'?'bg-white shadow-sm text-[#4CAF50]':'text-gray-400'}`}><Icon name="heart" size={12}/> 같이 앉기 {seatPairSettings.mustPair.length>0&&<span className="bg-[#4CAF50] text-white text-[9px] px-1 rounded-full">{seatPairSettings.mustPair.length}</span>}</button><button onClick={()=>setPairSettingTab('mustNot')} className={`flex-1 py-2 rounded-md text-xs font-bold flex items-center justify-center gap-1 ${pairSettingTab==='mustNot'?'bg-white shadow-sm text-[#FF6B6B]':'text-gray-400'}`}><Icon name="shield-alert" size={12}/> 떨어뜨리기 {seatPairSettings.mustNotPair.length>0&&<span className="bg-[#FF6B6B] text-white text-[9px] px-1 rounded-full">{seatPairSettings.mustNotPair.length}</span>}</button></div>
            <div className="px-3.5 pt-2.5 shrink-0"><div className={`flex gap-1.5 items-center p-2 rounded-lg border-2 ${pairSettingTab==='must'?'bg-[#F0FFF0] border-[#C8E6C9]':'bg-[#FFF0F0] border-[#FFCDD2]'}`}><input type="text" value={pairInputA} onChange={e=>setPairInputA(e.target.value)} className="flex-1 bg-white p-2 rounded-md text-center font-bold text-xs border border-gray-100 focus:outline-none min-w-0" placeholder={placementType==='number'?'번호':'이름'} onKeyDown={e=>e.key==='Enter'&&addPairSetting()}/><span className="text-sm shrink-0">{pairSettingTab==='must'?'💕':'🚫'}</span><input type="text" value={pairInputB} onChange={e=>setPairInputB(e.target.value)} className="flex-1 bg-white p-2 rounded-md text-center font-bold text-xs border border-gray-100 focus:outline-none min-w-0" placeholder={placementType==='number'?'번호':'이름'} onKeyDown={e=>e.key==='Enter'&&addPairSetting()}/><button onClick={addPairSetting} className={`p-2 rounded-md text-white shrink-0 active:scale-95 touch-target ${pairSettingTab==='must'?'bg-[#4CAF50]':'bg-[#FF6B6B]'}`}><Icon name="plus" size={16}/></button></div></div>
            <div className="flex-1 overflow-y-auto px-3.5 py-2 min-h-0">{pairSettingTab==='must'?(seatPairSettings.mustPair.length?seatPairSettings.mustPair.map((p,i)=><div key={i} className="flex items-center justify-between bg-[#F0FFF0] p-2 rounded-lg border border-[#C8E6C9] mb-1.5"><div className="flex items-center gap-1.5"><span className="bg-white px-2 py-1 rounded-md font-bold text-xs text-[#4CAF50] border border-[#C8E6C9]">{p[0]}</span><span className="text-xs">💕</span><span className="bg-white px-2 py-1 rounded-md font-bold text-xs text-[#4CAF50] border border-[#C8E6C9]">{p[1]}</span></div><button onClick={()=>removePairSetting('mustPair',i)} className="p-1 text-red-300 touch-target"><Icon name="x" size={14}/></button></div>):<div className="text-center py-6 text-gray-300"><p className="text-xs font-bold">등록된 조합 없음</p></div>):(seatPairSettings.mustNotPair.length?seatPairSettings.mustNotPair.map((p,i)=><div key={i} className="flex items-center justify-between bg-[#FFF0F0] p-2 rounded-lg border border-[#FFCDD2] mb-1.5"><div className="flex items-center gap-1.5"><span className="bg-white px-2 py-1 rounded-md font-bold text-xs text-[#FF6B6B] border border-[#FFCDD2]">{p[0]}</span><span className="text-xs">🚫</span><span className="bg-white px-2 py-1 rounded-md font-bold text-xs text-[#FF6B6B] border border-[#FFCDD2]">{p[1]}</span></div><button onClick={()=>removePairSetting('mustNotPair',i)} className="p-1 text-red-300 touch-target"><Icon name="x" size={14}/></button></div>):<div className="text-center py-6 text-gray-300"><p className="text-xs font-bold">등록된 조합 없음</p></div>)}</div>
            <div className="p-3.5 border-t border-gray-100 flex gap-2 shrink-0">{(seatPairSettings.mustPair.length+seatPairSettings.mustNotPair.length)>0&&<button onClick={()=>{playSound('click');setSeatPairSettings({mustPair:[],mustNotPair:[]});}} className="px-3 py-2.5 bg-gray-100 text-gray-500 rounded-lg font-bold text-xs touch-target">전체삭제</button>}<button onClick={()=>{playSound('click');setShowPairSettings(false);}} className="flex-1 py-2.5 bg-[#FFD3B6] text-white rounded-lg font-bold shadow-md active:scale-95 touch-target">설정 완료</button></div>
        </div></div>}

        {systemModal&&<SystemModal modal={systemModal} closeModal={closeModal}/>}

        {fullScreenContent&&<div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-2 cursor-pointer" onClick={()=>setFullScreenContent(null)}>
            {fullScreenContent.type==='qr'&&<div className="bg-white p-5 rounded-2xl" onClick={e=>e.stopPropagation()}><img src={fullScreenContent.data} className="w-[75vw] h-[75vw] max-w-[400px] max-h-[400px]"/></div>}
            {fullScreenContent.type==='img'&&<img src={fullScreenContent.data} className="max-w-[98vw] max-h-[95vh] object-contain rounded-lg"/>}
            {fullScreenContent.type==='text'&&<div className="p-5 sm:p-8 rounded-2xl max-w-4xl w-full text-center max-h-[88vh] flex flex-col items-center relative" style={{backgroundColor:fullScreenContent.color}} onClick={e=>e.stopPropagation()}><div className="flex-1 overflow-y-auto w-full flex items-center justify-center min-h-[100px] no-scrollbar"><p className="font-black text-gray-700 leading-tight whitespace-pre-wrap select-text" style={{fontSize:`${fsFontSize}px`,fontFamily:'Gamja Flower'}}>{fullScreenContent.data}</p></div><div className="mt-3 flex items-center gap-3 bg-white/60 px-4 py-2 rounded-full" onClick={e=>e.stopPropagation()}><button onClick={()=>setFsFontSize(s=>Math.max(16,s-8))} className="w-9 h-9 rounded-full bg-white font-bold text-gray-500 touch-target flex items-center justify-center"><Icon name="minus" size={16}/></button><span className="font-bold text-gray-600 text-sm min-w-[2.5rem] text-center">{fsFontSize}</span><button onClick={()=>setFsFontSize(s=>Math.min(200,s+8))} className="w-9 h-9 rounded-full bg-white font-bold text-gray-500 touch-target flex items-center justify-center"><Icon name="plus" size={16}/></button></div><button onClick={()=>setFullScreenContent(null)} className="absolute top-3 right-3 p-2 bg-white/50 rounded-full text-gray-500 touch-target"><Icon name="x" size={18}/></button></div>}
        </div>}
        <div id="confetti-holder" className="fixed inset-0 pointer-events-none z-50"/>
    </div>);
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
