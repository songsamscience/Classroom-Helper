    },[]);
    useEffect(()=>{const t=setTimeout(()=>{try{localStorage.setItem('songsam_wb_v1',JSON.stringify({pages:state.pages,activePageIdx:state.activePageIdx}));}catch(e){}},500);return()=>clearTimeout(t);},[state.pages,state.activePageIdx]);

    useEffect(()=>{
        if(!containerRef.current)return;
        const ro=new ResizeObserver(es=>{for(const e of es){const{width,height}=e.contentRect;setCanvasSize({w:Math.max(100,Math.floor(width)),h:Math.max(100,Math.floor(height))});}});
        ro.observe(containerRef.current);
        return()=>ro.disconnect();
    },[]);

    const isDark=background===WB_BG_MODES.DARK;
    const toggleFullscreen=()=>setIsFullscreenMode(f=>!f);

    const ensureImage=useCallback((src)=>{
        if(imageCache.current.has(src)){const im=imageCache.current.get(src);return im.complete?im:null;}
        const im=new Image();im.crossOrigin='anonymous';im.onload=()=>setCanvasSize(cs=>({...cs}));im.src=src;imageCache.current.set(src,im);return null;
    },[]);

    const drawObject=useCallback((ctx,obj)=>{
        if(obj.type==='stroke'){
            const pts=obj.points;if(pts.length<1)return;
            ctx.save();ctx.strokeStyle=obj.color;ctx.lineWidth=obj.width;ctx.lineCap=obj.tool===WB_TOOLS.HIGHLIGHTER?'butt':'round';ctx.lineJoin='round';ctx.globalAlpha=obj.opacity??1;
            if(obj.tool===WB_TOOLS.HIGHLIGHTER)ctx.globalCompositeOperation='multiply';
            if(pts.length===1){ctx.beginPath();ctx.arc(pts[0][0],pts[0][1],obj.width/2,0,Math.PI*2);ctx.fillStyle=obj.color;ctx.fill();ctx.restore();return;}
            if(obj.tool===WB_TOOLS.BRUSH&&obj.widths&&obj.widths.length===pts.length){
                for(let i=0;i<pts.length-1;i++){
                    const p0=pts[i],p1=pts[i+1],w0=obj.widths[i],w1=obj.widths[i+1];
                    for(let s=0;s<4;s++){const t1=s/4,t2=(s+1)/4;ctx.lineWidth=w0+(w1-w0)*((t1+t2)/2);ctx.beginPath();ctx.moveTo(p0[0]+(p1[0]-p0[0])*t1,p0[1]+(p1[1]-p0[1])*t1);ctx.lineTo(p0[0]+(p1[0]-p0[0])*t2,p0[1]+(p1[1]-p0[1])*t2);ctx.stroke();}
                }
            }else{
                ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
                if(pts.length===2)ctx.lineTo(pts[1][0],pts[1][1]);
                else{for(let i=1;i<pts.length-1;i++){const mx=(pts[i][0]+pts[i+1][0])/2,my=(pts[i][1]+pts[i+1][1])/2;ctx.quadraticCurveTo(pts[i][0],pts[i][1],mx,my);}ctx.lineTo(pts[pts.length-1][0],pts[pts.length-1][1]);}
                ctx.stroke();
            }
            ctx.restore();
        }else if(obj.type==='text'){
            ctx.save();ctx.font=`${obj.italic?'italic ':''}${obj.bold?'bold ':''}${obj.fontSize}px ${obj.fontFamily}`;ctx.fillStyle=obj.color;ctx.textBaseline='top';
            const lh=obj.fontSize*1.2;let ly=obj.y;
            const paras=(obj.content||'').split('\n');
            if(obj.width){
                paras.forEach(para=>{
                    if(para===''){ly+=lh;return;}
                    let line='';
                    for(const ch of para){const test=line+ch;if(ctx.measureText(test).width>obj.width&&line!==''){ctx.fillText(line,obj.x,ly);ly+=lh;line=ch;}else line=test;}
                    if(line!==''){ctx.fillText(line,obj.x,ly);ly+=lh;}
                });
            }else{
                paras.forEach(l=>{ctx.fillText(l,obj.x,ly);ly+=lh;});
            }
            ctx.restore();
        }else if(obj.type==='shape'){
            ctx.save();ctx.strokeStyle=obj.strokeColor;ctx.lineWidth=obj.strokeWidth;ctx.lineCap='round';ctx.lineJoin='round';
            if(obj.dashed)ctx.setLineDash([obj.strokeWidth*3,obj.strokeWidth*2]);
            const{x1,y1,x2,y2,shape,fillColor}=obj;
            const x=Math.min(x1,x2),y=Math.min(y1,y2),w=Math.abs(x2-x1),h=Math.abs(y2-y1);
            ctx.beginPath();
            if(shape==='rect'){ctx.rect(x,y,w,h);if(fillColor!=='transparent'){ctx.fillStyle=fillColor;ctx.fill();}ctx.stroke();}
            else if(shape==='ellipse'){ctx.ellipse(x+w/2,y+h/2,w/2,h/2,0,0,Math.PI*2);if(fillColor!=='transparent'){ctx.fillStyle=fillColor;ctx.fill();}ctx.stroke();}
            else if(shape==='triangle'){ctx.moveTo(x+w/2,y);ctx.lineTo(x,y+h);ctx.lineTo(x+w,y+h);ctx.closePath();if(fillColor!=='transparent'){ctx.fillStyle=fillColor;ctx.fill();}ctx.stroke();}
            else if(shape==='line'){ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
            else if(shape==='arrow'){ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();const a=Math.atan2(y2-y1,x2-x1);const hl=Math.max(10,obj.strokeWidth*3);ctx.setLineDash([]);ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-hl*Math.cos(a-Math.PI/6),y2-hl*Math.sin(a-Math.PI/6));ctx.moveTo(x2,y2);ctx.lineTo(x2-hl*Math.cos(a+Math.PI/6),y2-hl*Math.sin(a+Math.PI/6));ctx.stroke();}
            ctx.restore();
        }else if(obj.type==='image'){
            const img=ensureImage(obj.src);
            if(img&&img.complete){ctx.save();ctx.translate(obj.x+obj.w/2,obj.y+obj.h/2);if(obj.rotation)ctx.rotate(obj.rotation*Math.PI/180);ctx.drawImage(img,-obj.w/2,-obj.h/2,obj.w,obj.h);ctx.restore();}
            else{ctx.save();ctx.fillStyle='rgba(0,0,0,.05)';ctx.fillRect(obj.x,obj.y,obj.w,obj.h);ctx.fillStyle='#999';ctx.font="12px sans-serif";ctx.fillText('이미지 로딩...',obj.x+10,obj.y+20);ctx.restore();}
        }
    },[ensureImage]);

    useEffect(()=>{
        const c=mainCanvasRef.current;if(!c)return;
        const dpr=window.devicePixelRatio||1;
        c.width=canvasSize.w*dpr;c.height=canvasSize.h*dpr;c.style.width=canvasSize.w+'px';c.style.height=canvasSize.h+'px';
        const ctx=c.getContext('2d');ctx.scale(dpr,dpr);
        if(background===WB_BG_MODES.DARK){ctx.fillStyle='#1F2937';ctx.fillRect(0,0,canvasSize.w,canvasSize.h);}
        else if(background===WB_BG_MODES.LIGHT){ctx.fillStyle='#FAFAFA';ctx.fillRect(0,0,canvasSize.w,canvasSize.h);}
        else if(background===WB_BG_MODES.GRID){
            ctx.fillStyle='#FAFAFA';ctx.fillRect(0,0,canvasSize.w,canvasSize.h);ctx.strokeStyle='#E5E7EB';ctx.lineWidth=1;
            for(let x=0;x<=canvasSize.w;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvasSize.h);ctx.stroke();}
            for(let y=0;y<=canvasSize.h;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvasSize.w,y);ctx.stroke();}
        }else if(background===WB_BG_MODES.GRAPH){
            ctx.fillStyle='#FAFAFA';ctx.fillRect(0,0,canvasSize.w,canvasSize.h);ctx.strokeStyle='#EEF2FF';ctx.lineWidth=1;
            for(let x=0;x<=canvasSize.w;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvasSize.h);ctx.stroke();}
            for(let y=0;y<=canvasSize.h;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvasSize.w,y);ctx.stroke();}
            ctx.strokeStyle='#C7D2FE';
            for(let x=0;x<=canvasSize.w;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvasSize.h);ctx.stroke();}
            for(let y=0;y<=canvasSize.h;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvasSize.w,y);ctx.stroke();}
        }else if(background===WB_BG_MODES.LINED){
            ctx.fillStyle='#FFFEF7';ctx.fillRect(0,0,canvasSize.w,canvasSize.h);ctx.strokeStyle='#D6E4FF';ctx.lineWidth=1;
            for(let y=40;y<=canvasSize.h;y+=36){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvasSize.w,y);ctx.stroke();}
        }
        ctx.save();ctx.translate(pan.x,pan.y);
        objects.filter(o=>o.type==='image').forEach(o=>drawObject(ctx,o));
        objects.filter(o=>o.type!=='sticky'&&o.type!=='image').forEach(o=>drawObject(ctx,o));
        ctx.restore();
    },[objects,background,canvasSize,drawObject,pan]);

    const renderOverlay=useCallback(()=>{
        const c=overlayCanvasRef.current;if(!c)return;
        const dpr=window.devicePixelRatio||1;
        if(c.width!==canvasSize.w*dpr){c.width=canvasSize.w*dpr;c.height=canvasSize.h*dpr;c.style.width=canvasSize.w+'px';c.style.height=canvasSize.h+'px';}
        const ctx=c.getContext('2d');
        const dr=drawingRef.current;

        // ── 빠른 잉크 경로: 펜/붓 필기 중에는 '새로 추가된 점'만 덧그려 지연(끊김)을 없앤다 ──
        if(dr.active&&dr.currentStroke&&dr.liveInk){
            const p=panRef.current;
            if(dr.needsClear){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);dr.needsClear=false;dr.drawnCount=0;}
            ctx.setTransform(dpr,0,0,dpr,p.x*dpr,p.y*dpr);
            const s=dr.currentStroke,pts=s.points;
            if(pts.length>0){
                ctx.save();ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';ctx.globalAlpha=s.opacity??1;
                if(pts.length===1){
                    ctx.beginPath();ctx.fillStyle=s.color;ctx.arc(pts[0][0],pts[0][1],s.width/2,0,Math.PI*2);ctx.fill();dr.drawnCount=1;
                }else{
                    const start=Math.max(1,dr.drawnCount);
                    if(s.tool===WB_TOOLS.BRUSH&&s.widths){
                        for(let i=start;i<pts.length;i++){ctx.lineWidth=s.widths[i]||s.width;ctx.beginPath();ctx.moveTo(pts[i-1][0],pts[i-1][1]);ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();}
                    }else{
                        ctx.lineWidth=s.width;ctx.beginPath();ctx.moveTo(pts[start-1][0],pts[start-1][1]);
                        for(let i=start;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);
                        ctx.stroke();
                    }
                    dr.drawnCount=pts.length;
                }
                ctx.restore();
            }
            dr.overlayHadContent=true;
            return;
        }

        // ── 기본 경로: 형광펜 미리보기·도형 미리보기·지우개 커서·유휴 상태 ──
        const needRing=cursorRef.current.inside&&(tool===WB_TOOLS.ERASER||dr.rightClickEraser);
        const hasContent=(dr.active&&(dr.currentStroke||dr.currentShape))||needRing;
        if(!hasContent){
            // 그릴 게 없으면 한 번만 지우고 이후 프레임은 건너뛴다(불필요한 연산·발열 감소).
            if(dr.overlayHadContent){ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);dr.overlayHadContent=false;}
            return;
        }
        ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);{const p=panRef.current;ctx.setTransform(dpr,0,0,dpr,p.x*dpr,p.y*dpr);}
        if(dr.active&&dr.currentStroke)drawObject(ctx,dr.currentStroke);
        if(dr.active&&dr.currentShape)drawObject(ctx,dr.currentShape);
        if(needRing){
            ctx.save();ctx.beginPath();ctx.arc(cursorRef.current.x,cursorRef.current.y,eraserSize/2,0,Math.PI*2);
            ctx.strokeStyle=isDark?'#FFFFFF':'#333333';ctx.lineWidth=1.5;ctx.setLineDash([4,3]);ctx.stroke();ctx.setLineDash([]);
            ctx.fillStyle=isDark?'rgba(255,255,255,.08)':'rgba(0,0,0,.05)';ctx.fill();ctx.restore();
        }
        dr.overlayHadContent=true;
    },[canvasSize,eraserSize,tool,isDark,drawObject]);
    const clearOverlay=useCallback(()=>{const c=overlayCanvasRef.current;if(!c)return;const ctx=c.getContext('2d');ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,c.width,c.height);drawingRef.current.overlayHadContent=false;drawingRef.current.drawnCount=0;},[]);
    useEffect(()=>{let r;const loop=()=>{renderOverlay();r=requestAnimationFrame(loop);};r=requestAnimationFrame(loop);return()=>cancelAnimationFrame(r);},[renderOverlay]);

    const getPos=(e)=>{const dr=drawingRef.current;const r=(dr.active&&dr.rect)?dr.rect:mainCanvasRef.current.getBoundingClientRect();const p=panRef.current;return {x:e.clientX-r.left-p.x,y:e.clientY-r.top-p.y};};

    const handleEraserAt=(x,y)=>{
        const dr=drawingRef.current;const er=eraserSize/2;
        if(eraserMode===WB_ERASER_MODES.PIXEL){
            const rm=[],ns=[];
            objects.forEach(o=>{if(o.type==='stroke'&&wbStrokeHit(o,x,y,er)){const sp=wbSplitStroke(o,x,y,er);rm.push(o.id);ns.push(...sp);}});
            if(rm.length)dispatch({type:'REPLACE_OBJECTS',removeIds:rm,newObjects:ns});
        }else if(eraserMode===WB_ERASER_MODES.STROKE){
            const rm=[];
            objects.forEach(o=>{if(o.type==='stroke'&&!dr.eraserRemovedIds.has(o.id)&&wbStrokeHit(o,x,y,er)){rm.push(o.id);dr.eraserRemovedIds.add(o.id);}});
            if(rm.length)dispatch({type:'REMOVE_OBJECTS',ids:rm});
        }else{
            const rm=[];
            objects.forEach(o=>{
                if(dr.eraserRemovedIds.has(o.id))return;let hit=false;
                if(o.type==='stroke')hit=wbStrokeHit(o,x,y,er);
                else if(o.type==='shape')hit=wbShapeHit(o,x,y,er);
                else if(o.type==='text'){const w=(o.content||' ').length*o.fontSize*0.55,h=(o.content||'').split('\n').length*o.fontSize*1.3;hit=wbBoxHit({x:o.x,y:o.y,w,h},x,y,er);}
                else if(o.type==='sticky'||o.type==='image')hit=wbBoxHit({x:o.x,y:o.y,w:o.w,h:o.h},x,y,er);
                if(hit){rm.push(o.id);dr.eraserRemovedIds.add(o.id);}
            });
            if(rm.length)dispatch({type:'REMOVE_OBJECTS',ids:rm});
        }
    };

    const pushRecent=(c)=>{
        if(WB_BASE_COLORS.includes(c))return;
        setRecentColors(prev=>{const n=[c,...prev.filter(x=>x!==c)].slice(0,6);try{localStorage.setItem('songsam_wb_recent',JSON.stringify(n));}catch(e){}return n;});
    };

    const onPointerDown=(e)=>{
        const dr=drawingRef.current;
        if(dr.active&&dr.activePointerId!==null&&e.pointerId!==dr.activePointerId)return;
        e.preventDefault();
        dr.rect=mainCanvasRef.current.getBoundingClientRect();
        const pos=getPos(e);cursorRef.current={x:pos.x,y:pos.y,inside:true};
        if(e.button===2&&e.pointerType==='mouse'){
            dr.rightClickEraser=true;dr.active=true;dr.activePointerId=e.pointerId;dr.eraserRemovedIds=new Set();
            const rm=[];objects.forEach(o=>{if(o.type==='stroke'&&wbStrokeHit(o,pos.x,pos.y,eraserSize/2))rm.push(o.id);});
            if(rm.length)dispatch({type:'REMOVE_OBJECTS',ids:rm});
            try{e.target.setPointerCapture(e.pointerId);}catch(_){} return;
        }
        if(e.pointerType==='mouse'&&e.button!==0)return;
        try{e.target.setPointerCapture(e.pointerId);}catch(_){}
        dr.activePointerId=e.pointerId;
        if(tool===WB_TOOLS.PAN){dr.active=true;panDragRef.current={sx:e.clientX,sy:e.clientY,ox:panRef.current.x,oy:panRef.current.y};return;}
        if(tool===WB_TOOLS.LASER){dr.active=true;setLaserActive(true);setLaserPos({x:pos.x,y:pos.y});setLaserTrail([{x:pos.x,y:pos.y,t:Date.now()}]);return;}
        if(tool===WB_TOOLS.TEXT){dr.active=true;dr.textStart={x:pos.x,y:pos.y};setTextBoxDraft(null);return;}
        if(tool===WB_TOOLS.STICKY){
            const s={id:wbUid(),type:'sticky',x:pos.x-100,y:pos.y-100,w:200,h:200,color:stickyColor,text:'',rotation:Math.random()*6-3};
            dispatch({type:'ADD_OBJECT',object:s});setTool(WB_TOOLS.SELECT);return;
        }
        if(tool===WB_TOOLS.SELECT){
            const imgs=objects.filter(o=>o.type==='image');let hit=null;
            for(let i=imgs.length-1;i>=0;i--){const o=imgs[i];if(pos.x>=o.x&&pos.x<=o.x+o.w&&pos.y>=o.y&&pos.y<=o.y+o.h){hit=o;break;}}
            if(hit){setSelectedImageId(hit.id);setSelectedTextId(null);return;}
            const texts=objects.filter(o=>o.type==='text');let th=null;const pad=8;
            for(let i=texts.length-1;i>=0;i--){const o=texts[i];const b=wbTextBox(o);if(pos.x>=b.x-pad&&pos.x<=b.x+b.w+pad&&pos.y>=b.y-pad&&pos.y<=b.y+b.h+pad){th=o;break;}}
            setSelectedImageId(null);setSelectedTextId(th?th.id:null);return;
        }
        if(tool===WB_TOOLS.ERASER){dr.active=true;dr.eraserRemovedIds=new Set();handleEraserAt(pos.x,pos.y);return;}
        if(tool===WB_TOOLS.SHAPE){dr.active=true;dr.currentShape={id:wbUid(),type:'shape',shape:shapeOpts.shape,x1:pos.x,y1:pos.y,x2:pos.x,y2:pos.y,...shapeOpts};return;}
        if(tool===WB_TOOLS.MARKER||tool===WB_TOOLS.HIGHLIGHTER||tool===WB_TOOLS.BRUSH){
            dr.active=true;
            const bw=tool===WB_TOOLS.HIGHLIGHTER?Math.max(penWidth*3,12):penWidth;
            const iw=tool===WB_TOOLS.BRUSH?bw*0.7:bw;
            dr.currentStroke={id:wbUid(),type:'stroke',tool,color:penColor,width:bw,opacity:tool===WB_TOOLS.HIGHLIGHTER?0.35:1,points:[[pos.x,pos.y]],widths:tool===WB_TOOLS.BRUSH?[iw]:undefined};
            dr.lastPointer={x:pos.x,y:pos.y,t:Date.now()};dr.smoothedWidth=iw;pushRecent(penColor);
            // 불투명 펜(마커)·붓은 증분 렌더링(빠른 잉크) 사용. 형광펜은 반투명이라 기존 전체 렌더 유지.
            dr.liveInk=(tool===WB_TOOLS.MARKER||tool===WB_TOOLS.BRUSH);
            dr.needsClear=true;dr.drawnCount=0;
        }
    };

    const processSample=(x,y,pressure,ts)=>{
        const dr=drawingRef.current;if(!dr.active||!dr.currentStroke)return;
        const s=dr.currentStroke;const pts=s.points;const last=pts[pts.length-1];
        const dist=Math.hypot(x-last[0],y-last[1]);if(dist<0.5)return;
        pts.push([x,y]);
        if(tool===WB_TOOLS.BRUSH&&dr.lastPointer){
            const dt=Math.max(1,ts-dr.lastPointer.t);const speed=Math.min(1.5,Math.max(0,dist/dt));
            const base=s.width;let tw=base*(1.5-speed*0.6);
            if(pressure&&pressure>0&&pressure!==0.5)tw=base*pressure*1.7;
            dr.smoothedWidth=dr.smoothedWidth*0.7+tw*0.3;
            s.widths.push(Math.max(base*0.3,Math.min(base*1.8,dr.smoothedWidth)));
            dr.lastPointer={x,y,t:ts};
        }
    };

    const onPointerMove=(e)=>{
        const dr=drawingRef.current;
        if(dr.active&&e.pointerId!==dr.activePointerId)return;
        const pos=getPos(e);cursorRef.current={x:pos.x,y:pos.y,inside:true};
        if(!dr.active)return;
        if(tool===WB_TOOLS.PAN&&panDragRef.current){const pd=panDragRef.current;setPanBoth({x:pd.ox+(e.clientX-pd.sx),y:pd.oy+(e.clientY-pd.sy)});return;}
        if(tool===WB_TOOLS.TEXT&&dr.textStart){const s=dr.textStart;setTextBoxDraft({x:Math.min(pos.x,s.x),y:Math.min(pos.y,s.y),w:Math.abs(pos.x-s.x),h:Math.abs(pos.y-s.y)});return;}
        if(tool===WB_TOOLS.LASER){
            setLaserPos({x:pos.x,y:pos.y});
            const now=Date.now();
            setLaserTrail(prev=>{const r=[...prev,{x:pos.x,y:pos.y,t:now}].filter(p=>now-p.t<350);return r.slice(-12);});
            return;
        }
        if(dr.rightClickEraser){const rm=[];objects.forEach(o=>{if(o.type==='stroke'&&wbStrokeHit(o,pos.x,pos.y,eraserSize/2))rm.push(o.id);});if(rm.length)dispatch({type:'REMOVE_OBJECTS',ids:rm});return;}
        if(tool===WB_TOOLS.ERASER){handleEraserAt(pos.x,pos.y);return;}
        if(tool===WB_TOOLS.SHAPE&&dr.currentShape){
            let x2=pos.x,y2=pos.y;
            if(e.shiftKey){
                const dx=x2-dr.currentShape.x1,dy=y2-dr.currentShape.y1;
                if(dr.currentShape.shape==='line'||dr.currentShape.shape==='arrow'){const a=Math.atan2(dy,dx),s=Math.round(a/(Math.PI/4))*(Math.PI/4),l=Math.hypot(dx,dy);x2=dr.currentShape.x1+Math.cos(s)*l;y2=dr.currentShape.y1+Math.sin(s)*l;}
                else{const sz=Math.min(Math.abs(dx),Math.abs(dy));x2=dr.currentShape.x1+Math.sign(dx)*sz;y2=dr.currentShape.y1+Math.sign(dy)*sz;}
            }
            dr.currentShape={...dr.currentShape,x2,y2};return;
        }
        if(dr.currentStroke){
            const ce=e.nativeEvent.getCoalescedEvents?e.nativeEvent.getCoalescedEvents():[e.nativeEvent];
            const r=dr.rect||mainCanvasRef.current.getBoundingClientRect();
            for(const c of ce)processSample(c.clientX-r.left,c.clientY-r.top,c.pressure,c.timeStamp||Date.now());
        }
    };

    const onPointerUp=(e)=>{
        const dr=drawingRef.current;
        if(!dr.active)return;
        if(dr.activePointerId!==null&&e.pointerId!==dr.activePointerId)return;
        try{e.target.releasePointerCapture(e.pointerId);}catch(_){}
        dr.active=false;dr.activePointerId=null;
        if(tool===WB_TOOLS.PAN){panDragRef.current=null;return;}
        if(tool===WB_TOOLS.TEXT&&dr.textStart){
            const start=dr.textStart;dr.textStart=null;setTextBoxDraft(null);
            const pos=getPos(e);const w=Math.abs(pos.x-start.x),h=Math.abs(pos.y-start.y);
            if(w>24||h>24){const bx=Math.min(pos.x,start.x),by=Math.min(pos.y,start.y);setTextEdit({x:bx,y:by,content:'',...textOpts,width:Math.max(60,Math.round(w))});}
            else{setTextEdit({x:start.x,y:start.y,content:'',...textOpts,width:Math.round(Math.min(Math.max(220,canvasSize.w*0.35),520))});}
            return;
        }
        if(dr.rightClickEraser){dr.rightClickEraser=false;return;}
        if(tool===WB_TOOLS.ERASER)return;
        if(tool===WB_TOOLS.LASER){setLaserActive(false);setLaserPos(null);return;}
        if(tool===WB_TOOLS.SHAPE&&dr.currentShape){const{x1,y1,x2,y2}=dr.currentShape;if(Math.hypot(x2-x1,y2-y1)>5)dispatch({type:'ADD_OBJECT',object:dr.currentShape});dr.currentShape=null;return;}
        if(dr.currentStroke){if(dr.currentStroke.points.length>=1)dispatch({type:'ADD_OBJECT',object:dr.currentStroke});dr.currentStroke=null;dr.liveInk=false;dr.drawnCount=0;clearOverlay();}
    };

    const onPointerCancel=(e)=>{
        const dr=drawingRef.current;
        if(dr.active&&dr.currentStroke&&dr.currentStroke.points.length>=2)dispatch({type:'ADD_OBJECT',object:dr.currentStroke});
        dr.active=false;dr.activePointerId=null;dr.currentStroke=null;dr.currentShape=null;dr.rightClickEraser=false;dr.liveInk=false;dr.drawnCount=0;panDragRef.current=null;clearOverlay();
        if(tool===WB_TOOLS.LASER){setLaserActive(false);setLaserPos(null);}
    };
    const onPointerLeave=()=>{cursorRef.current.inside=false;};

    useEffect(()=>{
        if(laserActive||laserTrail.length===0)return;
        const it=setInterval(()=>{const now=Date.now();setLaserTrail(prev=>{const r=prev.filter(p=>now-p.t<350);if(r.length===0)clearInterval(it);return r;});},50);
        return()=>clearInterval(it);
    },[laserActive,laserTrail.length]);

    const commitText=(content)=>{
        if(!textEdit)return;
        const w=textEdit.width||undefined;
        if(textEdit.editId){
            if(content.trim())dispatch({type:'UPDATE_OBJECT',id:textEdit.editId,patch:{content,fontSize:textEdit.fontSize,fontFamily:textEdit.fontFamily,bold:textEdit.bold,italic:textEdit.italic,color:textEdit.color,width:w}});
            else dispatch({type:'REMOVE_OBJECTS',ids:[textEdit.editId]});
        }else if(content.trim()){
            dispatch({type:'ADD_OBJECT',object:{id:wbUid(),type:'text',x:textEdit.x,y:textEdit.y,content,fontSize:textEdit.fontSize,fontFamily:textEdit.fontFamily,bold:textEdit.bold,italic:textEdit.italic,color:textEdit.color,width:w}});
        }
        setTextEdit(null);
    };
    const startEditText=(o)=>{playSound&&playSound('click');setSelectedTextId(null);setSelectedImageId(null);setTextEdit({x:o.x,y:o.y,content:o.content,fontSize:o.fontSize,fontFamily:o.fontFamily,bold:o.bold,italic:o.italic,color:o.color,width:o.width||null,editId:o.id});};
    const onTextPointerDown=(e,o,mode)=>{e.stopPropagation();try{e.target.setPointerCapture(e.pointerId);}catch(_){}textDragRef.current={id:o.id,mode,sx:e.clientX,sy:e.clientY,ox:o.x,oy:o.y,ow:o.width||wbTextBox(o).w};setSelectedTextId(o.id);setSelectedImageId(null);};
    const onTextPointerMove=(e)=>{const sd=textDragRef.current;if(!sd)return;const dx=e.clientX-sd.sx,dy=e.clientY-sd.sy;if(sd.mode==='move')dispatch({type:'UPDATE_OBJECT',id:sd.id,patch:{x:sd.ox+dx,y:sd.oy+dy},skipHistory:true});else if(sd.mode==='width')dispatch({type:'UPDATE_OBJECT',id:sd.id,patch:{width:Math.max(50,Math.round(sd.ow+dx))},skipHistory:true});};
    const onTextPointerUp=()=>{if(textDragRef.current){const o=objects.find(o=>o.id===textDragRef.current.id);if(o)dispatch({type:'UPDATE_OBJECT',id:o.id,patch:{x:o.x,y:o.y,width:o.width}});textDragRef.current=null;}};
    const selectedText=selectedTextId?objects.find(o=>o.id===selectedTextId&&o.type==='text'):null;

    const addImage=(src,cx,cy)=>{
        const im=new Image();
        im.onload=()=>{
            const mw=canvasSize.w*0.6,mh=canvasSize.h*0.6;let w=im.naturalWidth,h=im.naturalHeight;
            const ratio=Math.min(mw/w,mh/h,1);w*=ratio;h*=ratio;
            const x=cx!=null?cx-w/2:(canvasSize.w-w)/2;const y=cy!=null?cy-h/2:(canvasSize.h-h)/2;
            const obj={id:wbUid(),type:'image',x:Math.max(0,x),y:Math.max(0,y),w,h,src,rotation:0};
            dispatch({type:'ADD_OBJECT',object:obj});setSelectedImageId(obj.id);setTool(WB_TOOLS.SELECT);
        };
        im.src=src;
    };
    const handleFile=(file,x,y)=>{if(!file||!file.type.startsWith('image/'))return;const r=new FileReader();r.onload=ev=>addImage(ev.target.result,x,y);r.readAsDataURL(file);};

    // QR을 흰색 배경 데이터 URL로 변환 후 캔버스에 삽입
    const insertQRImage=async(text)=>{
        if(!text||!text.trim())return;
        const url=`https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(text.trim())}&bgcolor=ffffff&color=000000&margin=20&format=png`;
        try{
            const res=await fetch(url);
            const blob=await res.blob();
            const dataUrl=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(blob);});
            // 다크 배경에서도 안전하게 보이도록 흰색 패딩을 추가한 캔버스로 합성
            const padded=await new Promise((resolve)=>{
                const im=new Image();
                im.onload=()=>{const pad=24;const tc=document.createElement('canvas');tc.width=im.naturalWidth+pad*2;tc.height=im.naturalHeight+pad*2;const tcx=tc.getContext('2d');tcx.fillStyle='#ffffff';tcx.fillRect(0,0,tc.width,tc.height);tcx.drawImage(im,pad,pad);resolve(tc.toDataURL('image/png'));};
                im.onerror=()=>resolve(dataUrl);
                im.src=dataUrl;
            });
            addImage(padded);
        }catch(err){
            // 실패 시 원본 URL을 그대로 시도(외부 이미지)
            addImage(url);
        }
    };

    // YouTube URL → 영상 ID 추출
    const extractYouTubeId=(input)=>{
        const c=(input||'').trim();
        let m=c.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|shorts\/|live\/|watch\?v=|watch\?.+&v=))([a-zA-Z0-9_-]{11})/);
        if(m)return m[1];
        m=c.match(/src=["'](?:https?:)?\/\/(?:www\.)?(?:youtube\.com|youtu\.be)\/(?:embed\/|v\/|shorts\/)?([a-zA-Z0-9_-]{11})/);
        if(m)return m[1];
        if(/^[a-zA-Z0-9_-]{11}$/.test(c))return c;
        return null;
    };

    // YouTube 썸네일 + 재생 오버레이로 판서 캔버스에 삽입
    const insertYouTubeVideo=async(input)=>{
        const id=extractYouTubeId(input);
        if(!id){setYTModalError('올바른 YouTube URL을 입력하세요.');return false;}
        setYTModalError('');
        // 썸네일 후보 (maxres가 없는 영상도 있어 hqdefault로 폴백)
        const tryLoad=(u)=>new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>res({ok:im.naturalWidth>120,im,u});im.onerror=()=>res({ok:false,u});im.src=u;});
        const candidates=[`https://img.youtube.com/vi/${id}/maxresdefault.jpg`,`https://img.youtube.com/vi/${id}/hqdefault.jpg`,`https://img.youtube.com/vi/${id}/0.jpg`];
        let chosen=null;
        for(const u of candidates){const r=await tryLoad(u);if(r.ok){chosen=r;break;}}
        if(!chosen){setYTModalError('썸네일을 불러올 수 없습니다.');return false;}
        // 썸네일 + 재생 버튼 + YouTube 라벨을 합성한 데이터 URL 생성 (CORS 실패 시 원본 URL 폴백)
        let dataUrl=chosen.u;
        try{
            const im=chosen.im;
            const tc=document.createElement('canvas');tc.width=im.naturalWidth;tc.height=im.naturalHeight;
            const tcx=tc.getContext('2d');
            tcx.drawImage(im,0,0);
            // 어두운 그라데이션 오버레이(가운데를 살짝 어둡게)로 재생버튼 가독성 확보
            tcx.fillStyle='rgba(0,0,0,0.22)';tcx.fillRect(0,0,tc.width,tc.height);
            // 재생 삼각형
            const cx=tc.width/2,cy=tc.height/2;const rr=Math.min(tc.width,tc.height)*0.16;
            tcx.fillStyle='rgba(0,0,0,0.78)';
            tcx.beginPath();const rad=rr*1.55;
            // 둥근 사각 배경
            const rx=cx-rad,ry=cy-rad*0.7,rw=rad*2,rh=rad*1.4,rrad=18;
            tcx.moveTo(rx+rrad,ry);tcx.lineTo(rx+rw-rrad,ry);tcx.quadraticCurveTo(rx+rw,ry,rx+rw,ry+rrad);tcx.lineTo(rx+rw,ry+rh-rrad);tcx.quadraticCurveTo(rx+rw,ry+rh,rx+rw-rrad,ry+rh);tcx.lineTo(rx+rrad,ry+rh);tcx.quadraticCurveTo(rx,ry+rh,rx,ry+rh-rrad);tcx.lineTo(rx,ry+rrad);tcx.quadraticCurveTo(rx,ry,rx+rrad,ry);tcx.closePath();tcx.fill();
            tcx.fillStyle='#ffffff';
            tcx.beginPath();tcx.moveTo(cx-rr*0.45,cy-rr*0.6);tcx.lineTo(cx-rr*0.45,cy+rr*0.6);tcx.lineTo(cx+rr*0.65,cy);tcx.closePath();tcx.fill();
            // 좌상단 YOUTUBE 라벨
            const labelW=Math.min(tc.width*0.28,180),labelH=labelW*0.32,lx=16,ly=16;
            tcx.fillStyle='rgba(204,0,0,0.92)';
            tcx.beginPath();const lr=8;
            tcx.moveTo(lx+lr,ly);tcx.lineTo(lx+labelW-lr,ly);tcx.quadraticCurveTo(lx+labelW,ly,lx+labelW,ly+lr);tcx.lineTo(lx+labelW,ly+labelH-lr);tcx.quadraticCurveTo(lx+labelW,ly+labelH,lx+labelW-lr,ly+labelH);tcx.lineTo(lx+lr,ly+labelH);tcx.quadraticCurveTo(lx,ly+labelH,lx,ly+labelH-lr);tcx.lineTo(lx,ly+lr);tcx.quadraticCurveTo(lx,ly,lx+lr,ly);tcx.closePath();tcx.fill();
            tcx.fillStyle='#ffffff';tcx.font=`bold ${Math.round(labelH*0.55)}px sans-serif`;tcx.textAlign='center';tcx.textBaseline='middle';
            tcx.fillText('YouTube',lx+labelW/2,ly+labelH/2+1);
            dataUrl=tc.toDataURL('image/png');
        }catch(_){/* tainted canvas → 원본 URL 사용 */}
        // 이미지 객체 생성 (videoId 메타데이터 부착)
        const finalSrc=dataUrl;
        const im2=new Image();
        im2.onload=()=>{
            const mw=canvasSize.w*0.7,mh=canvasSize.h*0.7;let w=im2.naturalWidth,h=im2.naturalHeight;
            const ratio=Math.min(mw/w,mh/h,1);w*=ratio;h*=ratio;
            const x=(canvasSize.w-w)/2,y=(canvasSize.h-h)/2;
            const obj={id:wbUid(),type:'image',x:Math.max(0,x),y:Math.max(0,y),w,h,src:finalSrc,rotation:0,videoId:id};
            dispatch({type:'ADD_OBJECT',object:obj});setSelectedImageId(obj.id);setTool(WB_TOOLS.SELECT);
        };
        im2.onerror=()=>{
            // 폴백: 원본 썸네일이라도 삽입
            addImage(chosen.u);
        };
        im2.src=finalSrc;
        return true;
    };
    const onFileChange=(e)=>{const f=e.target.files[0];if(f)handleFile(f);e.target.value='';};

    useEffect(()=>{
        const el=containerRef.current;if(!el)return;
        const dOver=(e)=>{e.preventDefault();setIsDragOver(true);};
        const dLeave=(e)=>{if(e.target===el)setIsDragOver(false);};
        const dDrop=(e)=>{e.preventDefault();setIsDragOver(false);const r=el.getBoundingClientRect();const f=e.dataTransfer.files[0];if(f)handleFile(f,e.clientX-r.left,e.clientY-r.top);};
        el.addEventListener('dragover',dOver);el.addEventListener('dragleave',dLeave);el.addEventListener('drop',dDrop);
        return()=>{el.removeEventListener('dragover',dOver);el.removeEventListener('dragleave',dLeave);el.removeEventListener('drop',dDrop);};
    },[canvasSize]);
    useEffect(()=>{
        const onPaste=(e)=>{if(textEdit)return;const its=e.clipboardData?.items;if(!its)return;for(const it of its){if(it.type.startsWith('image/')){const b=it.getAsFile();if(b)handleFile(b);e.preventDefault();break;}}};
        window.addEventListener('paste',onPaste);return()=>window.removeEventListener('paste',onPaste);
    },[textEdit,canvasSize]);

    const imgDragRef=useRef(null);
    const onImgPointerDown=(e,obj,mode)=>{e.stopPropagation();try{e.target.setPointerCapture(e.pointerId);}catch(_){}imgDragRef.current={id:obj.id,mode,sX:e.clientX,sY:e.clientY,oX:obj.x,oY:obj.y,sW:obj.w,sH:obj.h,r:obj.w/obj.h};setSelectedImageId(obj.id);};
    const onImgPointerMove=(e)=>{
        if(!imgDragRef.current)return;
        const sd=imgDragRef.current;const dx=e.clientX-sd.sX,dy=e.clientY-sd.sY;
        if(sd.mode==='move')dispatch({type:'UPDATE_OBJECT',id:sd.id,patch:{x:sd.oX+dx,y:sd.oY+dy},skipHistory:true});
        else{
            let nw=sd.sW,nh=sd.sH,nx=sd.oX,ny=sd.oY;
            if(sd.mode==='br'){nw=Math.max(40,sd.sW+dx);nh=nw/sd.r;}
            else if(sd.mode==='tr'){nw=Math.max(40,sd.sW+dx);nh=nw/sd.r;ny=sd.oY+(sd.sH-nh);}
            else if(sd.mode==='bl'){nw=Math.max(40,sd.sW-dx);nh=nw/sd.r;nx=sd.oX+(sd.sW-nw);}
            else if(sd.mode==='tl'){nw=Math.max(40,sd.sW-dx);nh=nw/sd.r;nx=sd.oX+(sd.sW-nw);ny=sd.oY+(sd.sH-nh);}
            dispatch({type:'UPDATE_OBJECT',id:sd.id,patch:{x:nx,y:ny,w:nw,h:nh},skipHistory:true});
        }
    };
    const onImgPointerUp=()=>{if(imgDragRef.current){const o=objects.find(o=>o.id===imgDragRef.current.id);if(o)dispatch({type:'UPDATE_OBJECT',id:o.id,patch:{x:o.x,y:o.y,w:o.w,h:o.h}});imgDragRef.current=null;}};

    useEffect(()=>{
        const onKey=(e)=>{
            if(textEdit)return;const t=e.target;if(t.tagName==='TEXTAREA'||t.tagName==='INPUT')return;
            if(e.key===' '||e.code==='Space'){if(tool!==WB_TOOLS.PAN){prevToolRef.current=tool;setTool(WB_TOOLS.PAN);}e.preventDefault();return;}
            if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.shiftKey){e.preventDefault();dispatch({type:'UNDO'});}
            else if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==='y'||(e.shiftKey&&e.key.toLowerCase()==='z'))){e.preventDefault();dispatch({type:'REDO'});}
            else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();exportPNG();}
            else if((e.key==='Delete'||e.key==='Backspace')&&(selectedImageId||selectedTextId)){const id=selectedImageId||selectedTextId;dispatch({type:'REMOVE_OBJECTS',ids:[id]});setSelectedImageId(null);setSelectedTextId(null);}
            else if(e.key==='p'||e.key==='P')setTool(WB_TOOLS.MARKER);
            else if(e.key==='h'||e.key==='H')setTool(WB_TOOLS.HIGHLIGHTER);
            else if(e.key==='b'||e.key==='B')setTool(WB_TOOLS.BRUSH);
            else if(e.key==='t'||e.key==='T')setTool(WB_TOOLS.TEXT);
            else if(e.key==='s'||e.key==='S')setTool(WB_TOOLS.SHAPE);
            else if(e.key==='n'||e.key==='N')setTool(WB_TOOLS.STICKY);
            else if(e.key==='i'||e.key==='I')fileInputRef.current?.click();
            else if(e.key==='v'||e.key==='V')setTool(WB_TOOLS.SELECT);
            else if(e.key==='l'||e.key==='L')setTool(WB_TOOLS.LASER);
            else if(e.key==='e'||e.key==='E'){if(tool===WB_TOOLS.ERASER)setEraserMode(m=>m===WB_ERASER_MODES.PIXEL?WB_ERASER_MODES.STROKE:m===WB_ERASER_MODES.STROKE?WB_ERASER_MODES.OBJECT:WB_ERASER_MODES.PIXEL);else setTool(WB_TOOLS.ERASER);}
        };
        const onKeyUp=(e)=>{if((e.key===' '||e.code==='Space')&&prevToolRef.current!=null){setTool(prevToolRef.current);prevToolRef.current=null;}};
        window.addEventListener('keydown',onKey);window.addEventListener('keyup',onKeyUp);return()=>{window.removeEventListener('keydown',onKey);window.removeEventListener('keyup',onKeyUp);};
    },[tool,textEdit,selectedImageId,selectedTextId]);

    useEffect(()=>{
        if(tool===WB_TOOLS.ERASER&&!eraserTipSeen){
            setShowEraserTip(true);
            const t=setTimeout(()=>{setShowEraserTip(false);setEraserTipSeen(true);try{localStorage.setItem('songsam_wb_eraser_seen','1');}catch(e){}},5000);
            return()=>clearTimeout(t);
        }
    },[tool,eraserTipSeen]);
    useEffect(()=>{if(tool!==WB_TOOLS.SELECT){setSelectedImageId(null);setSelectedTextId(null);}},[tool]);

    const exportPNG=async()=>{
        await Promise.all(objects.filter(o=>o.type==='image').map(o=>new Promise(res=>{const im=imageCache.current.get(o.src);if(im&&im.complete)res();else if(im){im.onload=()=>res();im.onerror=()=>res();}else res();})));
        const tmp=document.createElement('canvas');const dpr=2;tmp.width=canvasSize.w*dpr;tmp.height=canvasSize.h*dpr;
        const ctx=tmp.getContext('2d');ctx.scale(dpr,dpr);
        if(background===WB_BG_MODES.DARK)ctx.fillStyle='#1F2937';else if(background===WB_BG_MODES.LINED)ctx.fillStyle='#FFFEF7';else ctx.fillStyle='#FAFAFA';
        ctx.fillRect(0,0,canvasSize.w,canvasSize.h);
        if(background===WB_BG_MODES.GRID){ctx.strokeStyle='#E5E7EB';ctx.lineWidth=1;for(let x=0;x<=canvasSize.w;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvasSize.h);ctx.stroke();}for(let y=0;y<=canvasSize.h;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvasSize.w,y);ctx.stroke();}}
        else if(background===WB_BG_MODES.GRAPH){ctx.strokeStyle='#EEF2FF';ctx.lineWidth=1;for(let x=0;x<=canvasSize.w;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvasSize.h);ctx.stroke();}for(let y=0;y<=canvasSize.h;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvasSize.w,y);ctx.stroke();}ctx.strokeStyle='#C7D2FE';for(let x=0;x<=canvasSize.w;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvasSize.h);ctx.stroke();}for(let y=0;y<=canvasSize.h;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvasSize.w,y);ctx.stroke();}}
        else if(background===WB_BG_MODES.LINED){ctx.strokeStyle='#D6E4FF';ctx.lineWidth=1;for(let y=40;y<=canvasSize.h;y+=36){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvasSize.w,y);ctx.stroke();}}
        ctx.save();ctx.translate(pan.x,pan.y);
        objects.filter(o=>o.type==='image').forEach(o=>drawObject(ctx,o));
        objects.filter(o=>o.type!=='image'&&o.type!=='sticky').forEach(o=>drawObject(ctx,o));
        objects.filter(o=>o.type==='sticky').forEach(o=>{
            ctx.save();ctx.translate(o.x+o.w/2,o.y+o.h/2);ctx.rotate((o.rotation||0)*Math.PI/180);
            ctx.fillStyle=o.color;ctx.shadowColor='rgba(0,0,0,.2)';ctx.shadowBlur=8;ctx.shadowOffsetX=2;ctx.shadowOffsetY=4;
            ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);ctx.shadowColor='transparent';
            ctx.fillStyle='#333';ctx.font="bold 18px 'Gamja Flower',sans-serif";ctx.textBaseline='top';
            (o.text||'').split('\n').forEach((l,i)=>ctx.fillText(l,-o.w/2+14,-o.h/2+14+i*22));
            ctx.restore();
        });
        ctx.restore();
        ctx.fillStyle='rgba(0,0,0,.25)';ctx.font="bold 12px 'Jua',sans-serif";ctx.textBaseline='alphabetic';ctx.textAlign='right';
        ctx.fillText('© 송쌤과학',canvasSize.w-14,canvasSize.h-12);
        const link=document.createElement('a');link.download=`송쌤과학_판서_${Date.now()}.png`;link.href=tmp.toDataURL('image/png');link.click();
    };

    const stickyDragRef=useRef(null);
    const onStickyPointerDown=(e,o,m)=>{
        if(e.target.tagName==='TEXTAREA')return;e.stopPropagation();try{e.target.setPointerCapture(e.pointerId);}catch(_){}
        if(m==='resize')stickyDragRef.current={id:o.id,mode:'resize',sX:e.clientX,sY:e.clientY,sW:o.w,sH:o.h};
        else stickyDragRef.current={id:o.id,mode:'move',sX:e.clientX,sY:e.clientY,oX:o.x,oY:o.y};
    };
    const onStickyPointerMove=(e)=>{
        if(!stickyDragRef.current)return;
        const sd=stickyDragRef.current;const dx=e.clientX-sd.sX,dy=e.clientY-sd.sY;
        const o=objects.find(o=>o.id===sd.id);if(!o)return;
        if(sd.mode==='move')dispatch({type:'UPDATE_OBJECT',id:sd.id,patch:{x:sd.oX+dx,y:sd.oY+dy},skipHistory:true});
        else dispatch({type:'UPDATE_OBJECT',id:sd.id,patch:{w:Math.max(80,sd.sW+dx),h:Math.max(80,sd.sH+dy)},skipHistory:true});
    };
    const onStickyPointerUp=()=>{if(stickyDragRef.current){const o=objects.find(o=>o.id===stickyDragRef.current.id);if(o)dispatch({type:'UPDATE_OBJECT',id:o.id,patch:{x:o.x,y:o.y,w:o.w,h:o.h}});stickyDragRef.current=null;}};

    const getCursor=()=>{if(tool===WB_TOOLS.PAN)return panDragRef.current?'grabbing':'grab';if(tool===WB_TOOLS.ERASER)return 'none';if(tool===WB_TOOLS.TEXT)return 'text';if(tool===WB_TOOLS.LASER)return 'crosshair';if(tool===WB_TOOLS.SELECT)return 'default';return 'crosshair';};
    const selectedImage=selectedImageId?objects.find(o=>o.id===selectedImageId):null;

    return(<div ref={tabRootRef} className={`flex flex-col ${isDark?'wb-dark':''} ${isFullscreenMode?'wb-fs-mode':''}`} style={{height:isFullscreenMode?'100dvh':'calc(100dvh - 76px)',minHeight:'500px',width:'100%'}}>
        {/* 상단 툴바 */}
        <div className="wb-panel border-b flex items-center px-2 py-1.5 gap-1 overflow-x-auto no-scrollbar" style={{flexShrink:0}}>
            <div className="flex items-center gap-1.5 px-1 mr-1 flex-shrink-0">
                <div className="bg-[#FFB7B2] p-1.5 rounded-lg text-white shadow-sm"><Icon name="palette" size={14}/></div>
                <span className="font-black text-sm hidden md:inline" style={{color:isDark?'#fff':'#4A4A4A'}}>판서</span>
            </div>
            <div className="wb-divider"/>
            <button onClick={()=>dispatch({type:'SET_BACKGROUND',bg:WB_BG_MODES.LIGHT})} className={`wb-tool-btn ${background===WB_BG_MODES.LIGHT?'active':''}`} data-tip="라이트 배경"><Icon name="sun" size={15}/></button>
            <button onClick={()=>dispatch({type:'SET_BACKGROUND',bg:WB_BG_MODES.DARK})} className={`wb-tool-btn ${background===WB_BG_MODES.DARK?'active':''}`} data-tip="다크 배경"><Icon name="moon" size={15}/></button>
            <button onClick={()=>dispatch({type:'SET_BACKGROUND',bg:WB_BG_MODES.GRID})} className={`wb-tool-btn ${background===WB_BG_MODES.GRID?'active':''}`} data-tip="격자 배경"><Icon name="grid-3x3" size={15}/></button>
            <button onClick={()=>dispatch({type:'SET_BACKGROUND',bg:WB_BG_MODES.GRAPH})} className={`wb-tool-btn ${background===WB_BG_MODES.GRAPH?'active':''}`} data-tip="모눈종이"><Icon name="grid-2x2" size={15}/></button>
            <button onClick={()=>dispatch({type:'SET_BACKGROUND',bg:WB_BG_MODES.LINED})} className={`wb-tool-btn ${background===WB_BG_MODES.LINED?'active':''}`} data-tip="줄노트"><Icon name="menu" size={15}/></button>
            <div className="wb-divider"/>

                    </div>
                    <button onClick={()=>setTextOpts(o=>({...o,bold:!o.bold}))} className={`wb-chip ${textOpts.bold?'active':''}`}><Icon name="bold" size={12}/></button>
                    <button onClick={()=>setTextOpts(o=>({...o,italic:!o.italic}))} className={`wb-chip ${textOpts.italic?'active':''}`}><Icon name="italic" size={12}/></button>

                    <div className="flex items-center gap-1 flex-shrink-0">{WB_BASE_COLORS.map(c=>(<div key={c} className={`wb-swatch ${textOpts.color===c?'active':''}`} style={{backgroundColor:c}} onClick={()=>setTextOpts(o=>({...o,color:c}))}/>))}</div>
                </>)}

                    <div className="flex items-center gap-1.5 flex-shrink-0"><span className="text-[10px] font-bold opacity-60">선색</span><input type="color" value={shapeOpts.strokeColor} onChange={e=>setShapeOpts(o=>({...o,strokeColor:e.target.value}))} className="w-6 h-6 rounded-full border-2 border-white shadow cursor-pointer" style={{padding:0}}/></div>

                        {shapeOpts.fillColor!=='transparent'&&<input type="color" value={shapeOpts.fillColor} onChange={e=>setShapeOpts(o=>({...o,fillColor:e.target.value}))} className="w-6 h-6 rounded-full border-2 border-white shadow cursor-pointer" style={{padding:0}}/>}
                    </div>
                    <div className="flex items-center gap-2 flex-shrink-0" style={{minWidth:110}}><span className="text-[10px] font-bold opacity-60">굵기</span><input type="range" min="1" max="20" value={shapeOpts.strokeWidth} onChange={e=>setShapeOpts(o=>({...o,strokeWidth:parseInt(e.target.value)}))} className="wb-range" style={{flex:1,minWidth:60}}/><span className="text-[10px] font-bold w-5">{shapeOpts.strokeWidth}</span></div>
                    <button onClick={()=>setShapeOpts(o=>({...o,dashed:!o.dashed}))} className={`wb-chip ${shapeOpts.dashed?'active':''}`}>점선</button>

                </>)}
                {tool===WB_TOOLS.ERASER&&(<>

                    {selectedImage.videoId&&<div style={{position:'absolute',top:-14,left:'50%',transform:'translateX(-50%)',pointerEvents:'auto',background:'#CC0000',color:'#fff',padding:'4px 10px',borderRadius:6,fontSize:11,fontWeight:900,cursor:'pointer',boxShadow:'0 1px 4px rgba(0,0,0,0.25)',display:'flex',alignItems:'center',gap:4,whiteSpace:'nowrap'}} onPointerDown={e=>e.stopPropagation()} onClick={e=>{e.stopPropagation();setWbVideoPlayer(selectedImage.videoId);}}><Icon name="play" size={11}/> 재생</div>}

            {tool===WB_TOOLS.SELECT&&selectedText&&(()=>{const b=wbTextBox(selectedText);return(

                    <div style={{background:'#fff',borderRadius:14,padding:18,width:'min(420px,92%)',boxShadow:'0 8px 24px rgba(0,0,0,0.2)'}} onClick={e=>e.stopPropagation()}>
                        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:10}}>
                            <Icon name="qr-code" size={18} className="text-gray-700"/>

                        <input autoFocus type="text" value={qrModalInput} onChange={e=>setQRModalInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&qrModalInput.trim()&&!qrModalLoading){setQRModalLoading(true);insertQRImage(qrModalInput).finally(()=>{setQRModalLoading(false);setShowQRModal(false);});}}} placeholder="https://..." style={{width:'100%',padding:'10px 12px',border:'2px solid #E5E7EB',borderRadius:10,fontSize:14,outline:'none',marginBottom:12}}/>
                        <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
                            <button disabled={qrModalLoading} onClick={()=>setShowQRModal(false)} style={{padding:'8px 14px',borderRadius:8,background:'#F3F4F6',color:'#4B5563',fontWeight:800,fontSize:13,opacity:qrModalLoading?0.5:1}}>취소</button>
                            <button disabled={qrModalLoading||!qrModalInput.trim()} onClick={()=>{setQRModalLoading(true);insertQRImage(qrModalInput).finally(()=>{setQRModalLoading(false);setShowQRModal(false);});}} style={{padding:'8px 14px',borderRadius:8,background:'#10B981',color:'#fff',fontWeight:800,fontSize:13,opacity:(qrModalLoading||!qrModalInput.trim())?0.5:1,display:'flex',alignItems:'center',gap:6}}>{qrModalLoading?<><span style={{width:12,height:12,border:'2px solid #fff',borderTopColor:'transparent',borderRadius:'50%',display:'inline-block',animation:'spin 0.8s linear infinite'}}/> 생성중</>:'삽입'}</button>
                        </div>
                    </div>
                </div>

            {showYTModal&&(

                    <div style={{background:'#fff',borderRadius:14,padding:18,width:'min(460px,92%)',boxShadow:'0 8px 24px rgba(0,0,0,0.2)'}} onClick={e=>e.stopPropagation()}>

                        </div>
                        <p style={{fontSize:12,color:'#6B7280',marginBottom:10,lineHeight:1.5}}>YouTube URL을 입력하면 썸네일과 재생 버튼이 판서에 삽입됩니다.<br/>선택 도구로 클릭한 뒤 <b>재생</b> 버튼을 누르거나 더블클릭하면 영상이 재생됩니다.</p>
                        <input autoFocus type="text" value={ytModalInput} onChange={e=>{setYTModalInput(e.target.value);if(ytModalError)setYTModalError('');}} onKeyDown={e=>{if(e.key==='Enter'&&ytModalInput.trim()&&!ytModalLoading){setYTModalLoading(true);insertYouTubeVideo(ytModalInput).then(ok=>{if(ok)setShowYTModal(false);}).finally(()=>setYTModalLoading(false));}}} placeholder="https://www.youtube.com/watch?v=..." style={{width:'100%',padding:'10px 12px',border:`2px solid ${ytModalError?'#EF4444':'#E5E7EB'}`,borderRadius:10,fontSize:14,outline:'none',marginBottom:ytModalError?6:12}}/>

                            <button disabled={ytModalLoading||!ytModalInput.trim()} onClick={()=>{setYTModalLoading(true);insertYouTubeVideo(ytModalInput).then(ok=>{if(ok)setShowYTModal(false);}).finally(()=>setYTModalLoading(false));}} style={{padding:'8px 14px',borderRadius:8,background:'#CC0000',color:'#fff',fontWeight:800,fontSize:13,opacity:(ytModalLoading||!ytModalInput.trim())?0.5:1,display:'flex',alignItems:'center',gap:6}}>{ytModalLoading?<><span style={{width:12,height:12,border:'2px solid #fff',borderTopColor:'transparent',borderRadius:'50%',display:'inline-block',animation:'spin 0.8s linear infinite'}}/> 불러오는 중</>:'삽입'}</button>

                    </div>
                </div>

                    defaultValue={textEdit.content}
                    onChange={e=>{e.target.style.height='auto';e.target.style.height=e.target.scrollHeight+'px';}}
                    onBlur={e=>commitText(e.target.value)}
                    onKeyDown={e=>{if(e.key==='Escape'){e.target.value=textEdit.editId?textEdit.content:'';setTextEdit(null);}if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();commitText(e.target.value);}}}/>
            )}

            {laserTrail.map((p,i)=>{
                const age=laserActive?(laserTrail.length-1-i)/Math.max(1,laserTrail.length-1):1-((Date.now()-p.t)/350);
                const opacity=Math.max(0,1-age*0.9);const size=Math.max(8,18-age*10);
                return <div key={`${p.t}-${i}`} className="wb-laser-trail" style={{left:p.x+pan.x,top:p.y+pan.y,width:size+'px',height:size+'px',opacity:opacity*0.55}}/>;

            {showIntroTip&&(<div className="wb-tip"><div className="flex items-start gap-2"><Icon name="sparkles" size={18} className="text-[#D84315] mt-0.5"/><div>
                <p className="font-black text-sm mb-1" style={{color:'#3E2723'}}>송쌤과학 판서에 오신 걸 환영해요!</p>
                <p className="text-[11px] font-bold leading-relaxed" style={{color:'#4E342E'}}>아이콘에 마우스를 올리면 단축키를 볼 수 있어요.<br/>이미지는 <b>드래그&드롭</b>, <b>Ctrl+V</b>, 아이콘으로 첨부 → 그 위에 필기 가능합니다.</p>
                <button onClick={()=>{setShowIntroTip(false);try{localStorage.setItem('songsam_wb_intro_seen','1');}catch(e){}}} className="mt-2 px-3 py-1 bg-white/80 rounded-full text-[10px] font-black" style={{color:'#3E2723'}}>알겠어요</button>
            </div></div></div>)}

            {showEraserTip&&(<div className="wb-eraser-tip"><div className="flex items-start gap-2"><Icon name="eraser" size={18} className="text-blue-700 mt-0.5"/><div>
                <p className="font-black text-sm mb-1" style={{color:'#0D2B4E'}}>지우개 3가지 모드</p>
                <p className="text-[11px] font-bold leading-relaxed" style={{color:'#15406B'}}><b>픽셀</b>: 지나간 자리만 정밀 삭제<br/><b>획</b>: 닿은 펜 획 통째로 삭제 (기본)<br/><b>객체</b>: 도형·텍스트·포스트잇·이미지까지 삭제</p>
                <p className="text-[10px] font-bold mt-1" style={{color:'#1E5189'}}>E키 반복 = 모드 순환</p>
            </div></div></div>)}
        </div>

        {/* 페이지 탭 */}
        <div className="wb-panel border-t px-2 py-1 flex items-center gap-1 overflow-x-auto no-scrollbar" style={{flexShrink:0}}>
            {state.pages.map((p,i)=>(
                <div key={p.id} className={`wb-page-tab ${i===state.activePageIdx?'active':''}`} onClick={()=>dispatch({type:'SET_ACTIVE_PAGE',index:i})}>

            <div className="ml-auto text-[10px] font-bold opacity-50 px-2 hidden sm:block">© 송쌤과학 판서</div>
        </div>

        <input ref={fileInputRef} type="file" accept="image/*" capture="environment" onChange={onFileChange} style={{display:'none'}}/>

        {confirmClear&&(<div className="wb-confirm" onClick={()=>setConfirmClear(false)}>
            <div className="wb-confirm-card" onClick={e=>e.stopPropagation()}>
                <div className="w-14 h-14 rounded-full bg-red-50 mx-auto mb-3 flex items-center justify-center"><Icon name="trash-2" size={24} className="text-red-400"/></div>
                <p className="font-black text-base text-gray-700 mb-1">현재 페이지를 모두 지울까요?</p>
                <p className="text-[11px] font-bold text-gray-400 mb-4">Ctrl+Z로 복구할 수 있습니다</p>
                <div className="flex gap-2">
                    <button onClick={()=>setConfirmClear(false)} className="flex-1 py-2.5 bg-gray-100 rounded-xl font-black text-gray-500">취소</button>
                    <button onClick={()=>{dispatch({type:'CLEAR_PAGE'});setConfirmClear(false);}} className="flex-1 py-2.5 bg-red-400 text-white rounded-xl font-black">전체 지우기</button>
                </div>
            </div>
        </div>)}
    </div>);
}


function App(){
    const [step,setStep]=useState('input');
    const [studentCount,setStudentCount]=useState('');
    const [students,setStudents]=useState([]);
    const [mode,setMode]=useState('pick');
    const [isSoundOn,setIsSoundOn]=useState(true);
    // ★ 전역 다크모드 + UI 스케일
    const [isDarkMode,setIsDarkMode]=useState(()=>{try{return localStorage.getItem('songsam_dark')==='1';}catch(e){return false;}});
    const [uiScale,setUiScale]=useState(()=>{try{const v=parseFloat(localStorage.getItem('songsam_ui_scale'));return isNaN(v)?1:v;}catch(e){return 1;}});
    const [showSettings,setShowSettings]=useState(false);
    useEffect(()=>{
        if(isDarkMode)document.body.classList.add('dark-theme');
        else document.body.classList.remove('dark-theme');
        try{localStorage.setItem('songsam_dark',isDarkMode?'1':'0');}catch(e){}
    },[isDarkMode]);
    useEffect(()=>{
        document.documentElement.style.setProperty('--ui-scale',uiScale);
        try{localStorage.setItem('songsam_ui_scale',String(uiScale));}catch(e){}
    },[uiScale]);
    const [systemModal,setSystemModal]=useState(null);
    const [pickHistory,setPickHistory]=useState([]);
    const [currentPick,setCurrentPick]=useState(null);
    const [pickWinner,setPickWinner]=useState(null);
    const [isPicking,setIsPicking]=useState(false);
    const [isNoRepeat,setIsNoRepeat]=useState(false);
    const [placementType,setPlacementType]=useState('number');
    const [inputNames,setInputNames]=useState('');
    const [maleInput,setMaleInput]=useState('');
    const [femaleInput,setFemaleInput]=useState('');
    const [genderOption,setGenderOption]=useState('mixed');
    const [teams,setTeams]=useState([]);
    const [teamCount,setTeamCount]=useState(6);
    const [teamColumns,setTeamColumns]=useState(3);
    const [seats,setSeats]=useState([]);
    const [seatType,setSeatType]=useState('single');
    const [excludedInput,setExcludedInput]=useState('');
    const [seatPairSettings,setSeatPairSettings]=useState({mustPair:[],mustNotPair:[]});
    const [showPairSettings,setShowPairSettings]=useState(false);
    const [pairSettingTab,setPairSettingTab]=useState('must');
    const [pairInputA,setPairInputA]=useState('');
    const [pairInputB,setPairInputB]=useState('');
    const [selectedItem,setSelectedItem]=useState(null);
    const [timeLeft,setTimeLeft]=useState(300);
    const [initialTime,setInitialTime]=useState(300);
    const [isTimerRunning,setIsTimerRunning]=useState(false);
    const [timerEverStarted,setTimerEverStarted]=useState(false);
    const [minEdit,setMinEdit]=useState('');const [secEdit,setSecEdit]=useState('');
    const [editingMin,setEditingMin]=useState(false);const [editingSec,setEditingSec]=useState(false);
    const [showClockInTimer,setShowClockInTimer]=useState(false);
    const [qrInput,setQrInput]=useState('');const [qrUrl,setQrUrl]=useState(null);
    const [memos,setMemos]=useState([]);const [memoInput,setMemoInput]=useState('');
    const [editingMemoId,setEditingMemoId]=useState(null);
    const [memoColor,setMemoColor]=useState('#FFE0E0');
    const [memoFontSize,setMemoFontSize]=useState(14);
    const [uploadedImg,setUploadedImg]=useState(null);
    const [fullScreenContent,setFullScreenContent]=useState(null);const [fsFontSize,setFsFontSize]=useState(60);

    const [seatRowMode,setSeatRowMode]=useState('auto');
    const [seatColumns,setSeatColumns]=useState(5);
    const [seatRows,setSeatRows]=useState(6);
    const [seatGrid,setSeatGrid]=useState([]);
    const [savedSeatLayout,setSavedSeatLayout]=useState(null); // 저장(잠금)된 자리 배치 스냅샷 {grid, cols}
    const [seatLayoutDirty,setSeatLayoutDirty]=useState(false); // 저장 이후 격자가 변경되었는지
    const [dDays, setDDays] = useState([]); 

    const audioCtx=useRef(null);const timerRef=useRef(null);const captureRef=useRef(null);const fileInputRef=useRef(null);

    const MEMO_COLORS=['#FFE0E0','#E0F4FF','#E0FFE4','#FFF4E0','#F3E0FF','#FFDAC1','#C7CEEA','#B5EAD7','#FFB7B2','#FFFFCC','#F0F0F0','#D4F0FF'];

    const excludedNums=useMemo(()=>excludedInput.split(/[\s,]+/).map(n=>parseInt(n)).filter(n=>!isNaN(n)&&n>=1&&n<=students.length),[excludedInput,students.length]);
    const activeStudents=useMemo(()=>students.filter(s=>!excludedNums.includes(s)),[students,excludedNums]);
    const seatGridTotal=useMemo(()=>seatGrid.reduce((sum,row)=>sum+row.filter(Boolean).length,0),[seatGrid]);

    // 저장된 배치와 현재 격자가 달라지면 '변경됨' 표시
    useEffect(()=>{
        if(!savedSeatLayout){setSeatLayoutDirty(false);return;}
        const same=savedSeatLayout.cols===seatColumns&&JSON.stringify(savedSeatLayout.grid)===JSON.stringify(seatGrid);
        setSeatLayoutDirty(!same);
    },[seatGrid,seatColumns,savedSeatLayout]);

    // 현재 자리 배치를 저장(잠금)
    const saveSeatLayout=()=>{
        const total=seatGrid.reduce((s,r)=>s+r.filter(Boolean).length,0);
        if(total<1)return showAlert("켜진 좌석이 없습니다.\n좌석을 1개 이상 켜주세요.");
        playSound('win');
        setSavedSeatLayout({grid:seatGrid.map(r=>[...r]),cols:seatColumns});
        setSeatLayoutDirty(false);
    };

    // 저장된 자리 배치 해제 → 자동 배치(직사각형 채우기)로 복귀
    const clearSeatLayout=()=>{
        playSound('click');
        setSavedSeatLayout(null);
        setSeatLayoutDirty(false);
    };

    const initAudio=()=>{if(!audioCtx.current)audioCtx.current=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.current.state==='suspended')audioCtx.current.resume();};
    const playSound=type=>{
        if(!isSoundOn)return;initAudio();const ctx=audioCtx.current;const t=ctx.currentTime;
        if(type==='click'){const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(800,t);g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);o.start(t);o.stop(t+.08);}
        else if(type==='tick'){const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='triangle';o.frequency.setValueAtTime(600,t);g.gain.setValueAtTime(.025,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);o.start(t);o.stop(t+.04);}
        else if(type==='win'){[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(f,t+i*.1);g.gain.setValueAtTime(0,t+i*.1);g.gain.linearRampToValueAtTime(.08,t+i*.1+.04);g.gain.exponentialRampToValueAtTime(.001,t+i*.1+.5);o.start(t+i*.1);o.stop(t+i*.1+.5);});}
        else if(type==='alarm'){for(let i=0;i<3;i++){const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='square';o.frequency.setValueAtTime(880,t+i*.2);o.frequency.setValueAtTime(698,t+i*.2+.1);g.gain.setValueAtTime(.04,t+i*.2);g.gain.linearRampToValueAtTime(0,t+i*.2+.15);o.start(t+i*.2);o.stop(t+i*.2+.2);}}
    };
    const fireConfetti=()=>{confetti({particleCount:120,spread:65,origin:{y:.6},colors:['#FFB7B2','#B5EAD7','#C7CEEA','#E2F0CB','#FFDAC1'],disableForReducedMotion:true});};
    const showAlert=msg=>setSystemModal({type:'alert',msg});
    const showConfirm=(msg,action)=>setSystemModal({type:'confirm',msg,action});
    const closeModal=()=>{playSound('click');setSystemModal(null);};

    const handleCapture=async()=>{if(!captureRef.current)return;playSound('click');try{await document.fonts.ready;const canvas=await html2canvas(captureRef.current,{scale:2,backgroundColor:'#FDFBF7',useCORS:true,logging:false,allowTaint:true,onclone:doc=>{doc.querySelectorAll('.center-content').forEach(el=>{el.style.display='flex';el.style.alignItems='center';el.style.justifyContent='center';el.style.paddingBottom='12px';el.style.lineHeight='1';el.style.height='100%';});}});const link=document.createElement('a');link.download=`송쌤과학_${mode}_${Date.now()}.png`;link.href=canvas.toDataURL();link.click();showAlert("이미지가 저장되었습니다 📸");}catch(e){console.error(e);showAlert("저장 실패. 다시 시도해주세요.");}};

    const startClass=e=>{e.preventDefault();const c=parseInt(studentCount);if(!c||c<1||c>100)return showAlert("1~100 사이의 번호를 입력해주세요.");playSound('click');setStudents(Array.from({length:c},(_,i)=>i+1));setStep('main');setTimeout(initAudio,300);};
    const goHome=()=>{playSound('click');showConfirm("초기 화면으로 돌아갈까요?\n모든 데이터가 초기화됩니다.",()=>{setStep('input');setStudentCount('');setStudents([]);setPickHistory([]);setTeams([]);setSeats([]);setMemos([]);setUploadedImg(null);setIsTimerRunning(false);setTimerEverStarted(false);setSelectedItem(null);setExcludedInput('');setSeatPairSettings({mustPair:[],mustNotPair:[]});setSavedSeatLayout(null);setSeatLayoutDirty(false);setSeatGrid([]);setSeatRowMode('auto');setDDays([]);});};

    // ★ 타이머 ref - 모든 타이머 동작은 이 ref들 기반
    const timerStartRef=useRef(null);
    const timerStartLeftRef=useRef(0);

    // ★ 시간 조정 함수 - 작동 중에도 즉시 반영되도록 ref 갱신
    const adjustTime=sec=>{
        playSound('click');
        const v=Math.max(0,Math.min(599999,timeLeft+sec));
        setTimeLeft(v);
        if(isTimerRunning){
            // 작동 중이면 ref를 새로 세팅하여 다음 tick부터 새 값에서 카운트
            timerStartRef.current=Date.now();
            timerStartLeftRef.current=v;
            // 새 timeLeft가 기존 initialTime보다 크면 진행도 바가 100% 초과되지 않게 보정
            if(v>initialTime)setInitialTime(v);
        }else{
            setInitialTime(v);
        }
    };

    const onMinFocus=()=>{setEditingMin(true);setMinEdit(String(Math.floor(timeLeft/60)));};
    const onMinBlur=()=>{setEditingMin(false);const m=Math.max(0,Math.min(9999,parseInt(minEdit)||0)),s=timeLeft%60,v=m*60+s;setTimeLeft(v);setInitialTime(v);};
    const onSecFocus=()=>{setEditingSec(true);setSecEdit(String(timeLeft%60));};
    const onSecBlur=()=>{setEditingSec(false);const m=Math.floor(timeLeft/60),s=Math.max(0,Math.min(59,parseInt(secEdit)||0)),v=m*60+s;setTimeLeft(v);setInitialTime(v);};

    // ★ 타이머 tick - timestamp 기반
    const tickTimer=()=>{
        if(timerStartRef.current===null)return;
        const elapsed=Math.floor((Date.now()-timerStartRef.current)/1000);
        const newLeft=Math.max(0,timerStartLeftRef.current-elapsed);
        setTimeLeft(newLeft);
        if(newLeft<=0){
            clearInterval(timerRef.current);
            timerRef.current=null;
            timerStartRef.current=null;
            setIsTimerRunning(false);
            playSound('alarm');
            fireConfetti();
        }
    };
    useEffect(()=>{
        if(isTimerRunning&&timeLeft>0){
            timerStartRef.current=Date.now();
            timerStartLeftRef.current=timeLeft;
            clearInterval(timerRef.current);
            timerRef.current=setInterval(tickTimer,250);
        }else{
            clearInterval(timerRef.current);
            timerRef.current=null;
            timerStartRef.current=null;
        }
        return()=>clearInterval(timerRef.current);
    },[isTimerRunning]);
    useEffect(()=>{
        const onVis=()=>{if(!document.hidden&&isTimerRunning&&timerStartRef.current!==null)tickTimer();};
        const onFocus=()=>{if(isTimerRunning&&timerStartRef.current!==null)tickTimer();};
        document.addEventListener('visibilitychange',onVis);
        window.addEventListener('focus',onFocus);
        return()=>{document.removeEventListener('visibilitychange',onVis);window.removeEventListener('focus',onFocus);};
    },[isTimerRunning]);

    const parseData=()=>{if(placementType==='number')return activeStudents;if(placementType==='name'){const l=inputNames.split(/[\n,]+/).map(s=>s.trim()).filter(s=>s);return l.length?l:null;}if(placementType==='gender'){const m=maleInput.split(/[\n,]+/).map(s=>s.trim()).filter(s=>s),f=femaleInput.split(/[\n,]+/).map(s=>s.trim()).filter(s=>s);return m.length+f.length?{m,f}:null;}return[];};
    const buildPool=data=>{let pool=[];if(placementType==='gender'){let{m,f}=data;m=[...m].sort(()=>Math.random()-.5);f=[...f].sort(()=>Math.random()-.5);if(genderOption==='mixed'){const mx=Math.max(m.length,f.length);for(let i=0;i<mx;i++){if(i<m.length)pool.push(m[i]);if(i<f.length)pool.push(f[i]);}}else pool=[...m,...f];}else pool=[...data].sort(()=>Math.random()-.5);return pool;};

    const createTeams=()=>{if(isPicking)return;const data=parseData();if(!data||!data.length)return showAlert("참여할 학생이 없습니다.");playSound('click');setIsPicking(true);setTeams([]);setTimeout(()=>{const pool=buildPool(data);const t=Array.from({length:teamCount},()=>[]);pool.forEach((s,i)=>t[i%teamCount].push(s));setTeams(t);setIsPicking(false);playSound('win');},350);};
    const createSeats=()=>{if(isPicking)return;const data=parseData();if(!data||!data.length)return showAlert("참여할 학생이 없습니다.");
        // 혼자 + 자리 배치 모드: 저장된 배치가 없거나 변경되었으면 현재 격자를 자동 저장(잠금)
        if(seatType==='single'&&seatRowMode==='custom'){
            if(seatGridTotal<1)return showAlert("켜진 좌석이 없습니다.\n좌석을 1개 이상 켜주세요.");
            if(!savedSeatLayout||seatLayoutDirty){
                setSavedSeatLayout({grid:seatGrid.map(r=>[...r]),cols:seatColumns});
                setSeatLayoutDirty(false);
            }
        }
        playSound('click');setIsPicking(true);setSeats([]);setTimeout(()=>{let pool=buildPool(data);if(seatType==='pair'&&(seatPairSettings.mustPair.length>0||seatPairSettings.mustNotPair.length>0))pool=applyPC(pool,seatPairSettings);setSeats(pool);setIsPicking(false);playSound('win');},350);};

            <div className="flex items-center justify-between p-3.5 border-b border-gray-100 shrink-0"><div className="flex items-center gap-2"><div className="bg-[#FFD3B6] p-1.5 rounded-lg text-white"><Icon name="settings-2" size={16}/></div><div><h3 className="text-sm font-black text-[#4A4A4A]">짝꿍 조건 설정</h3><p className="text-[9px] text-gray-400 font-bold">비밀 설정</p></div></div><button onClick={()=>setShowPairSettings(false)} className="p-2 text-gray-400 rounded-lg touch-target"><Icon name="x" size={18}/></button></div>
            <div className="flex mx-3.5 mt-2.5 bg-[#FFF8F0] p-0.5 rounded-lg shrink-0"><button onClick={()=>setPairSettingTab('must')} className={`flex-1 py-2 rounded-md text-xs font-bold flex items-center justify-center gap-1 ${pairSettingTab==='must'?'bg-white shadow-sm text-[#4CAF50]':'text-gray-400'}`}><Icon name="heart" size={12}/> 같이 앉기 {seatPairSettings.mustPair.length>0&&<span className="bg-[#4CAF50] text-white text-[9px] px-1 rounded-full">{seatPairSettings.mustPair.length}</span>}</button><button onClick={()=>setPairSettingTab('mustNot')} className={`flex-1 py-2 rounded-md text-xs font-bold flex items-center justify-center gap-1 ${pairSettingTab==='mustNot'?'bg-white shadow-sm text-[#FF6B6B]':'text-gray-400'}`}><Icon name="shield-alert" size={12}/> 떨어뜨리기 {seatPairSettings.mustNotPair.length>0&&<span className="bg-[#FF6B6B] text-white text-[9px] px-1 rounded-full">{seatPairSettings.mustNotPair.length}</span>}</button></div>
            <div className="px-3.5 pt-2.5 shrink-0"><div className={`flex gap-1.5 items-center p-2 rounded-lg border-2 ${pairSettingTab==='must'?'bg-[#F0FFF0] border-[#C8E6C9]':'bg-[#FFF0F0] border-[#FFCDD2]'}`}><input type="text" value={pairInputA} onChange={e=>setPairInputA(e.target.value)} className="flex-1 bg-white p-2 rounded-md text-center font-bold text-xs border border-gray-100 focus:outline-none min-w-0" placeholder={placementType==='number'?'번호':'이름'} onKeyDown={e=>e.key==='Enter'&&addPairSetting()}/><span className="text-sm shrink-0">{pairSettingTab==='must'?'💕':'🚫'}</span><input type="text" value={pairInputB} onChange={e=>setPairInputB(e.target.value)} className="flex-1 bg-white p-2 rounded-md text-center font-bold text-xs border border-gray-100 focus:outline-none min-w-0" placeholder={placementType==='number'?'번호':'이름'} onKeyDown={e=>e.key==='Enter'&&addPairSetting()}/><button onClick={addPairSetting} className={`p-2 rounded-md text-white shrink-0 active:scale-95 touch-target ${pairSettingTab==='must'?'bg-[#4CAF50]':'bg-[#FF6B6B]'}`}><Icon name="plus" size={16}/></button></div></div>
            <div className="flex-1 overflow-y-auto px-3.5 py-2 min-h-0">{pairSettingTab==='must'?(seatPairSettings.mustPair.length?seatPairSettings.mustPair.map((p,i)=><div key={i} className="flex items-center justify-between bg-[#F0FFF0] p-2 rounded-lg border border-[#C8E6C9] mb-1.5"><div className="flex items-center gap-1.5"><span className="bg-white px-2 py-1 rounded-md font-bold text-xs text-[#4CAF50] border border-[#C8E6C9]">{p[0]}</span><span className="text-xs">💕</span><span className="bg-white px-2 py-1 rounded-md font-bold text-xs text-[#4CAF50] border border-[#C8E6C9]">{p[1]}</span></div><button onClick={()=>removePairSetting('mustPair',i)} className="p-1 text-red-300 touch-target"><Icon name="x" size={14}/></button></div>):<div className="text-center py-6 text-gray-300"><p className="text-xs font-bold">등록된 조합 없음</p></div>):(seatPairSettings.mustNotPair.length?seatPairSettings.mustNotPair.map((p,i)=><div key={i} className="flex items-center justify-between bg-[#FFF0F0] p-2 rounded-lg border border-[#FFCDD2] mb-1.5"><div className="flex items-center gap-1.5"><span className="bg-white px-2 py-1 rounded-md font-bold text-xs text-[#FF6B6B] border border-[#FFCDD2]">{p[0]}</span><span className="text-xs">🚫</span><span className="bg-white px-2 py-1 rounded-md font-bold text-xs text-[#FF6B6B] border border-[#FFCDD2]">{p[1]}</span></div><button onClick={()=>removePairSetting('mustNotPair',i)} className="p-1 text-red-300 touch-target"><Icon name="x" size={14}/></button></div>):<div className="text-center py-6 text-gray-300"><p className="text-xs font-bold">등록된 조합 없음</p></div>)}</div>
            <div className="p-3.5 border-t border-gray-100 flex gap-2 shrink-0">{(seatPairSettings.mustPair.length+seatPairSettings.mustNotPair.length)>0&&<button onClick={()=>{playSound('click');setSeatPairSettings({mustPair:[],mustNotPair:[]});}} className="px-3 py-2.5 bg-gray-100 text-gray-500 rounded-lg font-bold text-xs touch-target">전체삭제</button>}<button onClick={()=>{playSound('click');setShowPairSettings(false);}} className="flex-1 py-2.5 bg-[#FFD3B6] text-white rounded-lg font-bold shadow-md active:scale-95 touch-target">설정 완료</button></div>
        </div></div>}

        {systemModal&&<SystemModal modal={systemModal} closeModal={closeModal}/>}
        {showSettings&&<SettingsModal isDarkMode={isDarkMode} setIsDarkMode={setIsDarkMode} uiScale={uiScale} setUiScale={setUiScale} onClose={()=>setShowSettings(false)} playSound={playSound}/>}

        {fullScreenContent&&<div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-2 cursor-pointer" onClick={()=>setFullScreenContent(null)}>
            {fullScreenContent.type==='qr'&&<div className="bg-white p-5 rounded-2xl" onClick={e=>e.stopPropagation()}><img src={fullScreenContent.data} className="w-[75vw] h-[75vw] max-w-[400px] max-h-[400px]"/></div>}
            {fullScreenContent.type==='img'&&<img src={fullScreenContent.data} className="max-w-[98vw] max-h-[95vh] object-contain rounded-lg"/>}
            {fullScreenContent.type==='text'&&<div className="p-5 sm:p-8 rounded-2xl max-w-4xl w-full text-center max-h-[88vh] flex flex-col items-center relative" style={{backgroundColor:fullScreenContent.color}} onClick={e=>e.stopPropagation()}><div className="flex-1 overflow-y-auto w-full flex items-center justify-center min-h-[100px] no-scrollbar"><p className="font-black text-gray-700 leading-tight whitespace-pre-wrap select-text" style={{fontSize:`${fsFontSize}px`,fontFamily:'Gamja Flower'}}>{fullScreenContent.data}</p></div><div className="mt-3 flex items-center gap-3 bg-white/60 px-4 py-2 rounded-full" onClick={e=>e.stopPropagation()}><button onClick={()=>setFsFontSize(s=>Math.max(16,s-8))} className="w-9 h-9 rounded-full bg-white font-bold text-gray-500 touch-target flex items-center justify-center"><Icon name="minus" size={16}/></button><span className="font-bold text-gray-600 text-sm min-w-[2.5rem] text-center">{fsFontSize}</span><button onClick={()=>setFsFontSize(s=>Math.min(200,s+8))} className="w-9 h-9 rounded-full bg-white font-bold text-gray-500 touch-target flex items-center justify-center"><Icon name="plus" size={16}/></button></div><button onClick={()=>setFullScreenContent(null)} className="absolute top-3 right-3 p-2 bg-white/50 rounded-full text-gray-500 touch-target"><Icon name="x" size={18}/></button></div>}
        </div>}
        <div id="confetti-holder" className="fixed inset-0 pointer-events-none z-50"/>
    </div>);
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
