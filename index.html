<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>송쌤과학 교실 도우미 (모바일 최적화)</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <!-- html2canvas -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Do+Hyeon&family=Gamja+Flower&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Jua', sans-serif;
            background-color: #FDFBF7;
            background-image: radial-gradient(#E2D5C5 1px, transparent 1px);
            background-size: 24px 24px;
            color: #4A4A4A;
            touch-action: manipulation;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            overscroll-behavior-y: none;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #E2D5C5; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #D1C0AD; }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .card-enter { animation: cardPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes cardPop {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .winner-pulse { animation: winnerPulse 1.5s infinite; }
        @keyframes winnerPulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 183, 178, 0.7); transform: scale(1.05); }
            70% { box-shadow: 0 0 0 20px rgba(255, 183, 178, 0); transform: scale(1.05); }
            100% { box-shadow: 0 0 0 0 rgba(255, 183, 178, 0); transform: scale(1.05); }
        }

        .drag-target-active {
            background-color: #E2F0CB !important;
            border-color: #88D8B0 !important;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(136, 216, 176, 0.5);
            z-index: 10;
        }

        .highlight-anim {
            transition: all 0.1s;
            transform: scale(1.15);
            background-color: #B5EAD7 !important;
            border-color: #88D8B0 !important;
            color: #2D6A4F !important;
            z-index: 10;
            box-shadow: 0 10px 30px -5px rgba(181, 234, 215, 0.8);
        }

        .selected-item {
            border-color: #FFB7B2 !important;
            background-color: #FFF0F0 !important;
            color: #FF8A80 !important;
            transform: scale(0.95);
            border-style: dashed !important;
            animation: borderDance 1s infinite linear;
        }

        @keyframes borderDance {
            0% { border-color: #FFB7B2; }
            50% { border-color: #FFDAC1; }
            100% { border-color: #FFB7B2; }
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.03);
        }

        .soft-shadow { 
            box-shadow: 8px 8px 20px rgba(166, 171, 189, 0.1), 
                       -8px -8px 20px rgba(255, 255, 255, 0.8); 
        }
        
        .center-content {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            height: 100%;
            line-height: 1;
            word-break: keep-all;
            padding: 0;
            margin: 0;
        }
        
        .timer-circle { transition: stroke-dashoffset 1s linear; }
        footer { font-family: 'Do Hyeon', sans-serif; }
        
        .input-focus-effect:focus-within {
            transform: scale(1.02);
            box-shadow: 0 10px 40px -10px rgba(255, 183, 178, 0.4);
            border-color: #FFB7B2;
        }

        /* 미니 타이머 */
        .mini-timer-float {
            animation: miniTimerIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes miniTimerIn {
            from { opacity: 0; transform: scale(0.5) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .mini-timer-pulse {
            animation: miniPulse 2s infinite;
        }
        @keyframes miniPulse {
            0%, 100% { box-shadow: 0 2px 12px rgba(255, 183, 178, 0.3); }
            50% { box-shadow: 0 2px 20px rgba(255, 183, 178, 0.6); }
        }

        /* 타이머 입력 필드 */
        .timer-input-field {
            background: transparent;
            border: none;
            outline: none;
            text-align: center;
            font-family: 'Jua', sans-serif;
            caret-color: #FFDAC1;
        }
        .timer-input-field:focus {
            background: rgba(255, 218, 193, 0.15);
            border-radius: 12px;
        }
        .timer-input-field::selection {
            background: rgba(255, 218, 193, 0.4);
        }
        /* 숫자 스피너 제거 */
        .timer-input-field::-webkit-inner-spin-button,
        .timer-input-field::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .timer-input-field { -moz-appearance: textfield; }

        /* 설정 모달 슬라이드 업 */
        .modal-slide-up {
            animation: slideUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // 아이콘 컴포넌트
        const Icon = ({ name, size = 24, className = "" }) => {
            const ref = useRef(null);
            useEffect(() => {
                if (window.lucide && ref.current) {
                    ref.current.innerHTML = '';
                    const i = document.createElement('i');
                    i.setAttribute('data-lucide', name);
                    i.setAttribute('class', className);
                    ref.current.appendChild(i);
                    window.lucide.createIcons({ root: ref.current, nameAttr: 'data-lucide', attrs: { width: size, height: size } });
                }
            }, [name, size, className]);
            return <span ref={ref} className="inline-flex items-center justify-center" />;
        };

        // 푸터
        const Copyright = ({ fixed = false }) => (
            <footer className={`w-full text-center py-6 text-xs text-gray-400 font-bold tracking-widest uppercase ${fixed ? 'fixed bottom-0 left-0 bg-white/50 backdrop-blur-sm' : 'mt-8'}`}>
                ⓒ 송쌤과학 Class Helper. All Rights Reserved.
            </footer>
        );

        function App() {
            // === State ===
            const [step, setStep] = useState('input');
            const [studentCount, setStudentCount] = useState('');
            const [students, setStudents] = useState([]);
            const [mode, setMode] = useState('pick');
            const [isSoundOn, setIsSoundOn] = useState(true);
            const [systemModal, setSystemModal] = useState(null);

            // 발표자
            const [pickHistory, setPickHistory] = useState([]);
            const [currentPick, setCurrentPick] = useState(null);
            const [pickWinner, setPickWinner] = useState(null);
            const [isPicking, setIsPicking] = useState(false);
            const [isNoRepeat, setIsNoRepeat] = useState(false);

            // 모둠/자리
            const [placementType, setPlacementType] = useState('number'); 
            const [inputNames, setInputNames] = useState('');
            const [maleInput, setMaleInput] = useState('');
            const [femaleInput, setFemaleInput] = useState('');
            const [genderOption, setGenderOption] = useState('mixed');

            const [teams, setTeams] = useState([]);
            const [teamCount, setTeamCount] = useState(6);
            const [teamColumns, setTeamColumns] = useState(3);
            
            const [seats, setSeats] = useState([]);
            const [seatType, setSeatType] = useState('single');
            const [excludedInput, setExcludedInput] = useState('');

            // 좌석 짝꿍 설정
            const [seatPairSettings, setSeatPairSettings] = useState({ mustPair: [], mustNotPair: [] });
            const [showPairSettings, setShowPairSettings] = useState(false);
            const [pairSettingTab, setPairSettingTab] = useState('must'); // 'must' | 'mustNot'
            const [pairInputA, setPairInputA] = useState('');
            const [pairInputB, setPairInputB] = useState('');

            // 인터랙션
            const [draggedItem, setDraggedItem] = useState(null);
            const [dragOverItem, setDragOverItem] = useState(null); 
            const [selectedItem, setSelectedItem] = useState(null);

            // 타이머
            const [timeLeft, setTimeLeft] = useState(300);
            const [initialTime, setInitialTime] = useState(300);
            const [isTimerRunning, setIsTimerRunning] = useState(false);
            const [timerEverStarted, setTimerEverStarted] = useState(false);
            const [editingMin, setEditingMin] = useState(false);
            const [editingSec, setEditingSec] = useState(false);

            // 도구
            const [qrInput, setQrInput] = useState('');
            const [qrUrl, setQrUrl] = useState(null);
            const [memos, setMemos] = useState([]);
            const [memoInput, setMemoInput] = useState('');
            const [uploadedImg, setUploadedImg] = useState(null);
            
            // 전체화면
            const [fullScreenContent, setFullScreenContent] = useState(null);
            const [fsFontSize, setFsFontSize] = useState(80);

            // Refs
            const audioCtx = useRef(null);
            const timerRef = useRef(null);
            const captureRef = useRef(null);
            const fileInputRef = useRef(null);
            const minInputRef = useRef(null);
            const secInputRef = useRef(null);

            // === 오디오 ===
            const initAudio = () => {
                if (!audioCtx.current) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx.current = new AudioContext();
                }
                if (audioCtx.current.state === 'suspended') audioCtx.current.resume();
            };

            const playSound = (type) => {
                if (!isSoundOn) return;
                initAudio();
                const ctx = audioCtx.current;
                const t = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'click') {
                    osc.frequency.setValueAtTime(800, t);
                    gain.gain.setValueAtTime(0.05, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
                    osc.start(t); osc.stop(t + 0.1);
                } else if (type === 'tick') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, t);
                    gain.gain.setValueAtTime(0.03, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
                    osc.start(t); osc.stop(t + 0.05);
                } else if (type === 'win') {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.connect(g); g.connect(ctx.destination);
                        o.type = 'sine';
                        o.frequency.setValueAtTime(freq, t + i * 0.1);
                        g.gain.setValueAtTime(0, t + i * 0.1);
                        g.gain.linearRampToValueAtTime(0.1, t + i * 0.1 + 0.05);
                        g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.1 + 0.6);
                        o.start(t + i * 0.1); o.stop(t + i * 0.1 + 0.6);
                    });
                } else if (type === 'alarm') {
                    const now = t;
                    for(let i=0; i<3; i++) {
                        const o = ctx.createOscillator(); const g = ctx.createGain();
                        o.connect(g); g.connect(ctx.destination);
                        o.type = 'square';
                        o.frequency.setValueAtTime(880, now + i*0.2);
                        o.frequency.setValueAtTime(698, now + i*0.2 + 0.1);
                        g.gain.setValueAtTime(0.05, now + i*0.2);
                        g.gain.linearRampToValueAtTime(0, now + i*0.2 + 0.15);
                        o.start(now + i*0.2); o.stop(now + i*0.2 + 0.2);
                    }
                }
            };

            // === 유틸리티 ===
            const fireConfetti = () => {
                const colors = ['#FFB7B2', '#B5EAD7', '#C7CEEA', '#E2F0CB', '#FFDAC1'];
                confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 }, colors, disableForReducedMotion: true });
            };

            const showAlert = (msg) => setSystemModal({ type: 'alert', msg });
            const showConfirm = (msg, action) => setSystemModal({ type: 'confirm', msg, action });
            const closeModal = () => { playSound('click'); setSystemModal(null); };
            
            // 이미지 캡처
            const handleCapture = async () => {
                if (!captureRef.current) return;
                playSound('click');
                try {
                    await document.fonts.ready;
                    const canvas = await html2canvas(captureRef.current, { 
                        scale: 2, backgroundColor: '#FDFBF7', useCORS: true, logging: false, allowTaint: true,
                        onclone: (clonedDoc) => {
                            const elements = clonedDoc.querySelectorAll('.center-content');
                            elements.forEach(el => {
                                el.style.display = 'flex'; el.style.alignItems = 'center'; el.style.justifyContent = 'center';
                                el.style.paddingBottom = '14px'; el.style.paddingTop = '0px'; el.style.transform = 'translateY(-3px)';
                                el.style.lineHeight = '1'; el.style.height = '100%'; el.style.boxSizing = 'border-box';
                            });
                            const headers = clonedDoc.querySelectorAll('.team-header');
                            headers.forEach(el => { el.style.display = 'flex'; el.style.alignItems = 'center'; el.style.gap = '14px'; });
                        }
                    });
                    const link = document.createElement('a');
                    link.download = `송쌤과학_${mode}_${new Date().toLocaleTimeString().replace(/:/g,'-')}.png`;
                    link.href = canvas.toDataURL();
                    link.click();
                    showAlert("이미지가 저장되었습니다. 📸\n(갤러리 또는 다운로드 폴더를 확인하세요)");
                } catch (e) { console.error(e); showAlert("저장에 실패했습니다.\n잠시 후 다시 시도해주세요."); }
            };

            // === 기본 기능 ===
            const startClass = (e) => {
                e.preventDefault();
                const cnt = parseInt(studentCount);
                if (!cnt || cnt < 1 || cnt > 100) return showAlert("1~100명 사이로 입력해주세요.");
                playSound('click');
                setStudents(Array.from({ length: cnt }, (_, i) => i + 1));
                setStep('main');
                setTimeout(initAudio, 500);
            };

            const goHome = () => {
                playSound('click');
                showConfirm("초기 화면으로 돌아갈까요?\n모든 데이터가 초기화됩니다.", () => {
                    setStep('input'); setStudentCount(''); setStudents([]); setPickHistory([]); setTeams([]); setSeats([]);
                    setMemos([]); setUploadedImg(null); setIsTimerRunning(false); setTimerEverStarted(false); setSelectedItem(null);
                    setSeatPairSettings({ mustPair: [], mustNotPair: [] });
                });
            };

            // === 타이머 시간 조정 (수정됨) ===
            const adjustTime = (seconds) => {
                playSound('click');
                setTimeLeft(prev => {
                    const newVal = Math.max(0, Math.min(5999, prev + seconds));
                    if (!isTimerRunning) setInitialTime(newVal);
                    return newVal;
                });
            };

            // 타이머 수동 입력
            const handleMinInput = (val) => {
                const m = Math.max(0, Math.min(99, parseInt(val) || 0));
                const s = timeLeft % 60;
                const newTime = m * 60 + s;
                setTimeLeft(newTime);
                setInitialTime(newTime);
            };
            const handleSecInput = (val) => {
                const m = Math.floor(timeLeft / 60);
                const s = Math.max(0, Math.min(59, parseInt(val) || 0));
                const newTime = m * 60 + s;
                setTimeLeft(newTime);
                setInitialTime(newTime);
            };

            // === 데이터 파싱 ===
            const parseData = () => {
                if (placementType === 'number') {
                    const excluded = excludedInput.split(/[\s,]+/).map(n => parseInt(n)).filter(n => !isNaN(n));
                    return students.filter(s => !excluded.includes(s));
                } else if (placementType === 'name') {
                    const list = inputNames.split(/[\n,]+/).map(s => s.trim()).filter(s => s);
                    if (list.length === 0) return null;
                    return list;
                } else if (placementType === 'gender') {
                    const m = maleInput.split(/[\n,]+/).map(s => s.trim()).filter(s => s);
                    const f = femaleInput.split(/[\n,]+/).map(s => s.trim()).filter(s => s);
                    if (m.length + f.length === 0) return null;
                    return { m, f };
                }
                return [];
            };

            // === 모둠 만들기 ===
            const createTeams = () => {
                if (isPicking) return; 
                const data = parseData();
                if (!data) return showAlert("명단을 입력해주세요.");
                playSound('click'); setIsPicking(true); setTeams([]); 
                setTimeout(() => {
                    let pool = [];
                    if (placementType === 'gender') {
                        let { m, f } = data;
                        m = m.sort(() => Math.random() - 0.5);
                        f = f.sort(() => Math.random() - 0.5);
                        if (genderOption === 'mixed') {
                           const max = Math.max(m.length, f.length);
                           for(let i=0; i<max; i++) { if(i < m.length) pool.push(m[i]); if(i < f.length) pool.push(f[i]); }
                        } else { pool = [...m, ...f]; }
                    } else { pool = data.sort(() => Math.random() - 0.5); }
                    const newTeams = Array.from({ length: teamCount }, () => []);
                    pool.forEach((student, idx) => { newTeams[idx % teamCount].push(student); });
                    setTeams(newTeams); setIsPicking(false); playSound('win');
                }, 400);
            };

            // === 자리 배치 (짝꿍 제약조건 포함) ===
            const createSeats = () => {
                if (isPicking) return;
                const data = parseData();
                if (!data) return showAlert("명단을 입력해주세요.");
                playSound('click'); setIsPicking(true); setSeats([]);

                setTimeout(() => {
                    let pool = [];
                    if (placementType === 'gender') {
                         let { m, f } = data;
                         m = m.sort(() => Math.random() - 0.5);
                         f = f.sort(() => Math.random() - 0.5);
                         if (genderOption === 'mixed') {
                             const max = Math.max(m.length, f.length);
                             for(let i=0; i<max; i++) { if(i < m.length) pool.push(m[i]); if(i < f.length) pool.push(f[i]); }
                         } else { pool = [...m, ...f]; }
                    } else { pool = data.sort(() => Math.random() - 0.5); }

                    // 짝꿍 앉기 모드일 때 제약조건 적용
                    if (seatType === 'pair' && (seatPairSettings.mustPair.length > 0 || seatPairSettings.mustNotPair.length > 0)) {
                        const result = applyPairConstraints(pool, seatPairSettings);
                        setSeats(result);
                    } else {
                        setSeats(pool);
                    }
                    setIsPicking(false); playSound('win');
                }, 400);
            };

            // 짝꿍 제약조건 적용 알고리즘
            const applyPairConstraints = (pool, settings) => {
                const { mustPair, mustNotPair } = settings;
                const stringify = (v) => String(v);
                
                // 최대 100회 시도
                for (let attempt = 0; attempt < 100; attempt++) {
                    let arranged = [...pool].sort(() => Math.random() - 0.5);
                    
                    // mustPair: 반드시 같이 앉아야 하는 쌍 → 인접 짝으로 배치
                    for (const pair of mustPair) {
                        const idxA = arranged.findIndex(s => stringify(s) === stringify(pair[0]));
                        const idxB = arranged.findIndex(s => stringify(s) === stringify(pair[1]));
                        if (idxA === -1 || idxB === -1) continue;
                        
                        // A를 짝수 인덱스로, B를 바로 다음으로
                        const a = arranged.splice(Math.max(idxA, idxB), 1)[0];
                        const b = arranged.splice(Math.min(idxA, idxB), 1)[0];
                        // 빈 짝수 위치 찾기
                        let placed = false;
                        for (let i = 0; i <= arranged.length; i += 2) {
                            arranged.splice(i, 0, b, a);
                            placed = true;
                            break;
                        }
                        if (!placed) { arranged.push(b, a); }
                    }
                    
                    // mustNotPair 검증: 같이 앉으면 안 되는 쌍이 인접 짝이면 실패
                    let valid = true;
                    for (const pair of mustNotPair) {
                        for (let i = 0; i < arranged.length - 1; i += 2) {
                            const s1 = stringify(arranged[i]);
                            const s2 = stringify(arranged[i + 1]);
                            if ((s1 === stringify(pair[0]) && s2 === stringify(pair[1])) ||
                                (s1 === stringify(pair[1]) && s2 === stringify(pair[0]))) {
                                valid = false;
                                break;
                            }
                        }
                        if (!valid) break;
                    }
                    
                    // mustPair 검증
                    for (const pair of mustPair) {
                        let found = false;
                        for (let i = 0; i < arranged.length - 1; i += 2) {
                            const s1 = stringify(arranged[i]);
                            const s2 = stringify(arranged[i + 1]);
                            if ((s1 === stringify(pair[0]) && s2 === stringify(pair[1])) ||
                                (s1 === stringify(pair[1]) && s2 === stringify(pair[0]))) {
                                found = true;
                                break;
                            }
                        }
                        if (!found) { valid = false; break; }
                    }

                    if (valid) return arranged;
                }
                
                // 실패 시 그냥 랜덤 반환
                return pool.sort(() => Math.random() - 0.5);
            };

            // === 짝꿍 설정 관리 ===
            const addPairSetting = () => {
                const a = pairInputA.trim();
                const b = pairInputB.trim();
                if (!a || !b) return showAlert("두 학생 모두 입력해주세요.");
                if (a === b) return showAlert("같은 학생을 입력할 수 없습니다.");
                
                const key = pairSettingTab === 'must' ? 'mustPair' : 'mustNotPair';
                const existing = seatPairSettings[key];
                const isDuplicate = existing.some(p => 
                    (String(p[0]) === a && String(p[1]) === b) || (String(p[0]) === b && String(p[1]) === a)
                );
                if (isDuplicate) return showAlert("이미 등록된 조합입니다.");
                
                setSeatPairSettings(prev => ({ ...prev, [key]: [...prev[key], [a, b]] }));
                setPairInputA(''); setPairInputB('');
                playSound('click');
            };

            const removePairSetting = (key, index) => {
                playSound('click');
                setSeatPairSettings(prev => ({ ...prev, [key]: prev[key].filter((_, i) => i !== index) }));
            };

            // === 상호작용 ===
            const performSwap = (source, target) => {
                if (source.type === 'team') {
                    const newTeams = [...teams.map(t => [...t])];
                    const temp = newTeams[source.index][source.subIndex];
                    newTeams[source.index][source.subIndex] = newTeams[target.index][target.subIndex];
                    newTeams[target.index][target.subIndex] = temp;
                    setTeams(newTeams);
                } else if (source.type === 'seat') {
                    const newSeats = [...seats];
                    const temp = newSeats[source.index];
                    newSeats[source.index] = newSeats[target.index];
                    newSeats[target.index] = temp;
                    setSeats(newSeats);
                }
            };

            const handleItemInteraction = (type, index, subIndex = null) => {
                if (isPicking) return;
                playSound('click');
                if (selectedItem) {
                    if (selectedItem.type === type && selectedItem.index === index && selectedItem.subIndex === subIndex) { setSelectedItem(null); return; }
                    if (selectedItem.type !== type) { setSelectedItem({ type, index, subIndex }); return; }
                    performSwap(selectedItem, { type, index, subIndex }); setSelectedItem(null); playSound('win');
                } else { setSelectedItem({ type, index, subIndex }); }
            };

            const onDragStart = (e, type, index, subIndex) => { setDraggedItem({ type, index, subIndex }); setSelectedItem(null); };
            const onDragOver = (e) => e.preventDefault();
            const onDragEnter = (type, index, subIndex) => { if(draggedItem && draggedItem.type === type) setDragOverItem({ type, index, subIndex }); };
            const onDrop = (e, type, targetIndex, targetSubIndex) => {
                e.preventDefault(); setDragOverItem(null);
                if (!draggedItem || draggedItem.type !== type) return;
                performSwap(draggedItem, { type, index: targetIndex, subIndex: targetSubIndex }); setDraggedItem(null); playSound('click');
            };

            // === 타이머 로직 ===
            useEffect(() => {
                if (isTimerRunning && timeLeft > 0) {
                    timerRef.current = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timerRef.current); setIsTimerRunning(false);
                                playSound('alarm'); fireConfetti(); return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                } else { clearInterval(timerRef.current); }
                return () => clearInterval(timerRef.current);
            }, [isTimerRunning]);

            // === 렌더링 헬퍼 ===
            const NavBtn = ({ active, icon, label, onClick }) => (
                <button onClick={() => { playSound('click'); onClick(); }} 
                    className={`flex flex-col items-center justify-center p-2 rounded-2xl transition-all duration-300 w-16 h-16 md:w-auto md:h-auto md:px-5 md:py-3 md:flex-row md:gap-2 relative overflow-hidden shrink-0 snap-center
                    ${active ? 'bg-[#FFB7B2] text-white shadow-md scale-105' : 'text-gray-400 hover:bg-white hover:text-[#FFB7B2] hover:shadow-sm'}`}>
                    <Icon name={icon} size={24} className={active ? "animate-pulse" : ""} />
                    <span className="text-[10px] md:text-sm font-bold mt-1 md:mt-0">{label}</span>
                </button>
            );

            // 미니 타이머 표시 조건: 타이머가 한 번이라도 시작되었고, 현재 타이머 탭이 아닐 때
            const showMiniTimer = step === 'main' && mode !== 'timer' && (isTimerRunning || timerEverStarted) && timeLeft > 0;

            // --- 1. 입력 화면 ---
            if (step === 'input') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4 sm:p-6">
                        <div className="bg-white/90 backdrop-blur-xl p-8 sm:p-10 rounded-[2.5rem] sm:rounded-[3rem] shadow-2xl w-full max-w-lg text-center border border-white relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-3 bg-gradient-to-r from-[#FFB7B2] via-[#B5EAD7] to-[#C7CEEA]"></div>
                            <div className="mb-6 sm:mb-8 inline-block p-6 rounded-full bg-[#FFF0F0] shadow-inner animate-bounce">
                                <Icon name="sprout" size={48} className="text-[#FFB7B2]" />
                            </div>
                            <h1 className="text-3xl sm:text-4xl font-black text-[#5D5D5D] mb-2 tracking-tight">송쌤과학</h1>
                            <p className="text-[#AAA] font-bold mb-8 sm:mb-10 text-sm sm:text-base">행복한 교실을 위한 스마트 도우미</p>
                            <form onSubmit={startClass} className="space-y-5 sm:space-y-6">
                                <div className="relative transform transition-all input-focus-effect rounded-[2rem]">
                                    <input type="number" value={studentCount} onChange={e => setStudentCount(e.target.value)} 
                                        className="w-full h-16 sm:h-20 text-center text-4xl sm:text-5xl font-black text-[#5D5D5D] bg-[#F7F7F7] rounded-[2rem] border-4 border-transparent focus:border-[#FFB7B2] focus:bg-white focus:outline-none shadow-inner placeholder-gray-300 transition-all"
                                        placeholder="0" autoFocus />
                                    <span className="absolute right-6 sm:right-8 top-1/2 -translate-y-1/2 text-lg sm:text-xl font-bold text-gray-400">명</span>
                                </div>
                                <button type="submit" className="w-full py-4 sm:py-5 bg-[#FFB7B2] hover:bg-[#FF9E99] text-white rounded-[2rem] text-xl sm:text-2xl font-black shadow-lg shadow-[#FFB7B2]/40 active:scale-95 transition-all flex items-center justify-center gap-3">
                                    <span>수업 시작하기</span> <Icon name="arrow-right" />
                                </button>
                            </form>
                            <div className="mt-8 flex justify-center">
                                <button onClick={() => setIsSoundOn(!isSoundOn)} className={`flex items-center gap-2 px-5 py-2.5 rounded-full text-sm font-bold transition-all shadow-sm ${isSoundOn ? 'bg-[#E2F0CB] text-[#6B8E23] ring-2 ring-[#E2F0CB]' : 'bg-gray-100 text-gray-400'}`}>
                                    <Icon name={isSoundOn ? "volume-2" : "volume-x"} size={16} /> 소리 {isSoundOn ? "ON" : "OFF"}
                                </button>
                            </div>
                        </div>
                        <Copyright fixed />
                        {systemModal && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4 animate-fade-in">
                                <div className="bg-white p-8 rounded-[2.5rem] shadow-2xl max-w-sm w-full text-center border-4 border-[#FFB7B2] transform scale-100 transition-all">
                                    <p className="text-xl font-bold text-gray-700 mb-8 whitespace-pre-wrap leading-relaxed">{systemModal.msg}</p>
                                    <button onClick={closeModal} className="w-full py-3 bg-[#FFB7B2] rounded-2xl font-bold text-white shadow-md hover:bg-[#FF9E99] active:scale-95">확인</button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // --- 2. 메인 화면 ---
            return (
                <div className="min-h-screen flex flex-col w-full overflow-x-hidden">
                    {/* 상단 네비게이션 */}
                    <nav className="sticky top-0 z-40 glass-panel px-3 sm:px-4 py-3">
                        <div className="max-w-7xl mx-auto flex justify-between items-center gap-2">
                            <div className="flex items-center gap-3 cursor-pointer group shrink-0" onClick={goHome}>
                                <div className="bg-[#B5EAD7] p-2.5 rounded-2xl text-white shadow-sm group-hover:rotate-12 transition-transform"><Icon name="flask-conical" /></div>
                                <div className="hidden md:block">
                                    <h1 className="font-black text-gray-600 text-lg leading-none group-hover:text-[#FFB7B2] transition-colors">송쌤과학</h1>
                                    <span className="text-xs text-gray-400 font-bold">{students.length}명 함께하는 중</span>
                                </div>
                            </div>
                            
                            <div className="flex gap-1 sm:gap-2 overflow-x-auto no-scrollbar py-2 px-2 flex-1 md:flex-none justify-start md:justify-center bg-white/40 rounded-[2rem] border border-white/60 shadow-inner snap-x">
                                <NavBtn active={mode==='pick'} icon="trophy" label="발표" onClick={()=>setMode('pick')} />
                                <NavBtn active={mode==='team'} icon="users" label="모둠" onClick={()=>setMode('team')} />
                                <NavBtn active={mode==='seat'} icon="armchair" label="좌석" onClick={()=>setMode('seat')} />
                                <NavBtn active={mode==='timer'} icon="timer" label="타이머" onClick={()=>setMode('timer')} />
                                <NavBtn active={mode==='qr'} icon="qr-code" label="QR" onClick={()=>setMode('qr')} />
                                <NavBtn active={mode==='memo'} icon="sticky-note" label="메모" onClick={()=>setMode('memo')} />
                                <NavBtn active={mode==='img'} icon="image" label="사진" onClick={()=>setMode('img')} />
                            </div>

                            <button onClick={goHome} className="p-3 text-gray-400 hover:text-[#FFB7B2] hover:bg-[#FFF0F0] rounded-2xl transition-colors hidden sm:block shrink-0" title="홈으로">
                                <Icon name="home" />
                            </button>
                        </div>
                    </nav>

                    {/* ★ 미니 타이머 (다른 탭에서 표시) */}
                    {showMiniTimer && (
                        <div 
                            className={`fixed top-20 left-3 sm:left-4 z-50 mini-timer-float cursor-pointer select-none ${isTimerRunning ? 'mini-timer-pulse' : ''}`}
                            onClick={() => { playSound('click'); setMode('timer'); }}
                            title="타이머로 이동"
                        >
                            <div className={`flex items-center gap-2 px-3 py-2 sm:px-4 sm:py-2.5 rounded-2xl shadow-lg border-2 transition-all hover:scale-105 active:scale-95 ${isTimerRunning ? 'bg-white border-[#FFB7B2]' : 'bg-white/90 border-gray-200'}`}>
                                <div className="relative">
                                    <svg viewBox="0 0 36 36" className="w-8 h-8 sm:w-9 sm:h-9 transform -rotate-90">
                                        <circle cx="18" cy="18" r="15" stroke="#F0F0F0" strokeWidth="3" fill="none" />
                                        <circle cx="18" cy="18" r="15" stroke={isTimerRunning ? "#FFDAC1" : "#D1D5DB"} strokeWidth="3" fill="none" 
                                            strokeDasharray={2 * Math.PI * 15} 
                                            strokeDashoffset={(2 * Math.PI * 15) - (timeLeft / (initialTime || 1)) * (2 * Math.PI * 15)}
                                            strokeLinecap="round"
                                        />
                                    </svg>
                                    {isTimerRunning && <span className="absolute top-0.5 right-0.5 w-2 h-2 bg-[#FF9E99] rounded-full animate-pulse"></span>}
                                </div>
                                <div className="flex flex-col leading-none">
                                    <span className={`text-lg sm:text-xl font-black tabular-nums tracking-tight ${isTimerRunning ? 'text-[#5D5D5D]' : 'text-gray-400'}`}>
                                        {Math.floor(timeLeft/60).toString().padStart(2,'0')}:{(timeLeft%60).toString().padStart(2,'0')}
                                    </span>
                                    <span className="text-[9px] text-gray-400 font-bold">{isTimerRunning ? '진행 중' : '일시정지'}</span>
                                </div>
                            </div>
                        </div>
                    )}

                    <main className="flex-1 max-w-7xl mx-auto w-full p-4 sm:p-6 pb-8 flex flex-col">
                        
                        {/* 1. 발표자 뽑기 */}
                        {mode === 'pick' && (
                            <div className="card-enter w-full">
                                <div className="flex flex-col sm:flex-row sm:justify-between sm:items-end gap-4 mb-6 px-2">
                                    <div>
                                        <h2 className="text-2xl sm:text-3xl font-black text-[#5D5D5D] tracking-tight">발표자 뽑기</h2>
                                        <p className="text-xs sm:text-sm text-gray-400 font-bold mt-1">오늘의 행운의 주인공은?</p>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={()=>setIsNoRepeat(!isNoRepeat)} className={`flex-1 sm:flex-none px-4 py-2 rounded-xl text-xs sm:text-sm font-bold border-2 transition-all ${isNoRepeat ? 'bg-[#FFB7B2] border-[#FFB7B2] text-white shadow-md' : 'bg-white border-gray-200 text-gray-400 hover:bg-gray-50'}`}>
                                            중복방지 {isNoRepeat ? 'ON' : 'OFF'}
                                        </button>
                                        <button onClick={()=>setPickHistory([])} className="flex-1 sm:flex-none px-4 py-2 bg-gray-100 text-gray-500 rounded-xl text-xs sm:text-sm font-bold hover:bg-gray-200 transition-colors">
                                            기록 초기화 ({pickHistory.length})
                                        </button>
                                    </div>
                                </div>
                                
                                <div className="bg-white rounded-[2rem] p-4 sm:p-8 soft-shadow border-4 border-[#FFF5F5] relative overflow-hidden w-full">
                                    <div className="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-2 sm:gap-3 relative z-10 w-full">
                                        {students.map(num => {
                                            const isWin = pickWinner === num;
                                            const isHighlight = currentPick === num;
                                            const isDone = pickHistory.includes(num);
                                            return (
                                                <div key={num} 
                                                    className={`aspect-square rounded-xl sm:rounded-2xl flex items-center justify-center text-xl sm:text-2xl md:text-3xl font-black border-2 sm:border-4 transition-all duration-200 relative overflow-hidden shadow-sm
                                                    ${isWin ? 'winner-pulse bg-[#FFB7B2] border-[#FF9E99] text-white z-20 scale-110' : 
                                                      isHighlight ? 'highlight-anim' : 
                                                      isDone ? 'bg-gray-50 border-gray-100 text-gray-300 scale-90 grayscale' : 'bg-white border-[#F0E6D2] text-[#5D5D5D] hover:border-[#FFB7B2]'}`}>
                                                    {num}
                                                    {isDone && <div className="absolute inset-0 flex items-center justify-center opacity-40 bg-gray-100/50"><Icon name="check" size={24} className="sm:w-8 sm:h-8" /></div>}
                                                </div>
                                            );
                                        })}
                                    </div>
                                    <div className="absolute top-0 right-0 w-64 h-64 bg-[#FFF5F5] rounded-full filter blur-3xl opacity-50 pointer-events-none -translate-y-1/2 translate-x-1/2"></div>
                                    <div className="absolute bottom-0 left-0 w-64 h-64 bg-[#E2F0CB] rounded-full filter blur-3xl opacity-50 pointer-events-none translate-y-1/2 -translate-x-1/2"></div>
                                </div>
                                <div className="mt-8 text-center w-full">
                                    <button onClick={() => {
                                        if (isPicking) return;
                                        let pool = isNoRepeat ? students.filter(s => !pickHistory.includes(s)) : students;
                                        if (pool.length === 0) return showAlert("모든 학생이 발표했습니다! 기록을 초기화해주세요.");
                                        playSound('click'); setIsPicking(true); setPickWinner(null);
                                        let count = 0; const maxCount = 20 + Math.floor(Math.random() * 10); let delay = 50;
                                        const loop = () => {
                                            setCurrentPick(students[Math.floor(Math.random() * students.length)]); playSound('tick');
                                            count++;
                                            if (count > maxCount) {
                                                const finalWinner = pool[Math.floor(Math.random() * pool.length)];
                                                setCurrentPick(finalWinner); setPickWinner(finalWinner);
                                                if (isNoRepeat) setPickHistory(prev => [...prev, finalWinner]);
                                                playSound('win'); fireConfetti(); setIsPicking(false);
                                            } else { delay *= 1.1; setTimeout(loop, delay); }
                                        }; loop();
                                    }} disabled={isPicking} className="w-full sm:w-auto px-12 py-4 sm:py-5 bg-[#FFB7B2] hover:bg-[#FF9E99] text-white rounded-full text-xl sm:text-2xl font-black shadow-lg active:scale-95 transition-all flex items-center justify-center gap-3 mx-auto">
                                        {isPicking ? <Icon name="loader-2" className="animate-spin" /> : <Icon name="sparkles" />}
                                        {isPicking ? '두구두구...' : '발표자 뽑기'}
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* 2. 모둠 만들기 */}
                        {mode === 'team' && (
                            <div className="card-enter space-y-4 sm:space-y-6 w-full">
                                <div className="bg-white p-4 sm:p-6 rounded-[1.5rem] sm:rounded-[2rem] soft-shadow border border-gray-100">
                                    <div className="flex flex-col md:flex-row gap-4 sm:gap-6">
                                        <div className="space-y-3 sm:space-y-4 flex-1">
                                            <div className="flex gap-2">
                                                {['number', 'name', 'gender'].map(t => (
                                                    <button key={t} onClick={()=>setPlacementType(t)} 
                                                        className={`flex-1 py-2 sm:py-3 rounded-xl font-bold text-sm sm:text-base transition-all border-2 ${placementType===t ? 'bg-[#C7CEEA] border-[#C7CEEA] text-white shadow-md' : 'bg-white border-gray-100 text-gray-400 hover:bg-gray-50'}`}>
                                                        {t==='number'?'번호':t==='name'?'이름':'남녀'}
                                                    </button>
                                                ))}
                                            </div>
                                            {placementType === 'name' && <textarea value={inputNames} onChange={e=>setInputNames(e.target.value)} className="w-full p-3 sm:p-4 bg-[#F7F9FC] rounded-2xl border-none resize-none h-20 sm:h-24 focus:ring-2 focus:ring-[#C7CEEA] text-sm sm:text-base" placeholder="학생 이름 입력 (쉼표나 줄바꿈으로 구분)" />}
                                            {placementType === 'gender' && (
                                                <div className="flex flex-col sm:flex-row gap-2">
                                                    <textarea value={maleInput} onChange={e=>setMaleInput(e.target.value)} className="flex-1 p-3 bg-[#F0F8FF] rounded-xl h-20 resize-none focus:ring-2 focus:ring-[#89CFF0] text-sm sm:text-base" placeholder="남학생 명단" />
                                                    <textarea value={femaleInput} onChange={e=>setFemaleInput(e.target.value)} className="flex-1 p-3 bg-[#FFF0F5] rounded-xl h-20 resize-none focus:ring-2 focus:ring-[#FFB7B2] text-sm sm:text-base" placeholder="여학생 명단" />
                                                </div>
                                            )}
                                        </div>
                                        <div className="flex flex-col gap-3 justify-center w-full md:min-w-[200px] md:w-auto">
                                            <div className="flex items-center gap-1 bg-[#F7F9FC] p-1 rounded-xl border border-gray-100">
                                                {[2, 3].map(c => (
                                                    <button key={c} onClick={() => setTeamColumns(c)} className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all ${teamColumns === c ? 'bg-white shadow-sm text-[#5C6B9E]' : 'text-gray-400 hover:text-gray-600'}`}>{c}열 배열</button>
                                                ))}
                                            </div>
                                            <div className="flex items-center justify-between bg-[#F7F9FC] p-2 rounded-xl border border-gray-100">
                                                <button onClick={()=>setTeamCount(Math.max(2, teamCount-1))} className="w-10 h-10 bg-white rounded-lg shadow-sm text-gray-500 hover:text-[#5C6B9E]"><Icon name="minus" size={20}/></button>
                                                <div className="text-center px-2">
                                                    <span className="block text-[10px] sm:text-xs text-gray-400 font-bold mb-0.5">모둠 수</span>
                                                    <span className="text-lg sm:text-xl font-black text-[#5C6B9E]">{teamCount}개</span>
                                                </div>
                                                <button onClick={()=>setTeamCount(Math.min(20, teamCount+1))} className="w-10 h-10 bg-white rounded-lg shadow-sm text-gray-500 hover:text-[#5C6B9E]"><Icon name="plus" size={20}/></button>
                                            </div>
                                            <button onClick={createTeams} className="w-full py-3 sm:py-4 bg-[#C7CEEA] hover:bg-[#AAB6E0] text-white rounded-xl font-bold shadow-md active:scale-95 flex items-center justify-center gap-2">
                                                <Icon name="wand-2" size={18} /> 생성하기
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {teams.length > 0 && (
                                    <div className="relative w-full">
                                         <div className="flex flex-col sm:flex-row sm:justify-between items-start sm:items-center gap-3 mb-3 px-2">
                                            <p className="text-xs text-gray-400 font-bold flex items-center gap-1 bg-white/60 px-2 py-1 rounded-lg">
                                                <Icon name="mouse-pointer-2" size={14} /> 드래그 또는 터치(클릭)하여 자리 변경
                                            </p>
                                            <div className="flex gap-2 w-full sm:w-auto">
                                                <button onClick={createTeams} className="flex-1 sm:flex-none justify-center text-[#C7CEEA] bg-white border border-[#C7CEEA] px-3 py-2 rounded-xl text-xs sm:text-sm font-bold hover:bg-[#F0F4FF] flex items-center gap-1"><Icon name="shuffle" size={14}/> 섞기</button>
                                                <button onClick={handleCapture} className="text-[#C7CEEA] bg-white border border-transparent hover:bg-[#F0F4FF] p-2 sm:p-2.5 rounded-xl shadow-sm"><Icon name="camera" size={20} /></button>
                                            </div>
                                        </div>
                                        <div className="w-full overflow-x-auto pb-4 no-scrollbar">
                                            <div ref={captureRef} className="bg-white p-4 sm:p-6 md:p-8 rounded-[1.5rem] sm:rounded-[2.5rem] border-4 border-[#C7CEEA] shadow-xl min-w-full">
                                                <div className={`grid gap-3 sm:gap-4 w-full ${teamColumns===2 ? 'grid-cols-1 sm:grid-cols-2' : 'grid-cols-1 sm:grid-cols-2 md:grid-cols-3'}`}>
                                                    {teams.map((team, tIdx) => (
                                                        <div key={tIdx} className="bg-[#F7F9FC] rounded-2xl sm:rounded-3xl p-4 sm:p-5 border border-[#E2E8F0] min-h-[140px] shadow-sm hover:shadow-md transition-shadow h-full">
                                                            <div className="team-header flex items-center gap-2 sm:gap-3 mb-3 sm:mb-4 px-1">
                                                                <div className="bg-[#C7CEEA] text-white w-8 h-8 sm:w-9 sm:h-9 flex items-center justify-center rounded-xl font-black text-base sm:text-lg shadow-sm">{tIdx+1}</div>
                                                                <span className="text-xs sm:text-sm font-bold text-gray-500 bg-white px-2 py-1 sm:px-3 sm:py-1 rounded-lg shadow-sm border border-gray-100">{team.length}명</span>
