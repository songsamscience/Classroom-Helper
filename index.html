        /* ===== 칠판 바 (좌석·모둠 배치도 상단) ===== */
        .board-bar{position:relative;width:100%;border-radius:14px;padding:5px;box-sizing:border-box;background:linear-gradient(180deg,#EBD3B0 0%,#D3B085 55%,#C09A6B 100%);}

<style id="classroom-ladder">
/* 사다리 게임: 위 칸 · 사다리 판 · 아래 칸 · 결과 (설정 패널과 버튼은 핀볼의 pb- 스타일을 같이 씀) */
.ld-arena{display:flex;flex-direction:column;gap:10px}
.ld-arena:fullscreen{background:var(--bg-main);padding:14px;overflow:auto}
.ld-arena:-webkit-full-screen{background:var(--bg-main);padding:14px;overflow:auto}
.ld-arena:fullscreen .ld-scroll{flex:1;min-height:0;display:flex}
.ld-arena:-webkit-full-screen .ld-scroll{flex:1;min-height:0;display:flex}
.ld-arena:fullscreen .ld-cols{grid-template-rows:auto minmax(220px,1fr) auto}
.ld-arena:-webkit-full-screen .ld-cols{grid-template-rows:auto minmax(220px,1fr) auto}
.ld-arena:fullscreen .ld-board{height:auto!important}
.ld-arena:-webkit-full-screen .ld-board{height:auto!important}
.ld-scroll{overflow-x:auto;overflow-y:hidden;scrollbar-width:thin;padding-bottom:4px}
.ld-cols{display:grid;grid-template-columns:repeat(var(--n),minmax(var(--cw),1fr));width:max(100%,calc(var(--n) * var(--cw)))}
.ld-top{display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 3px 8px;min-width:0}
.ld-top>i,.ld-top-btn>i{width:11px;height:11px;border-radius:50%;flex-shrink:0;background:var(--pc);box-shadow:0 0 0 1.5px var(--bg-card),0 0 0 2.5px var(--border-soft)}
.ld-in{display:block;width:100%;min-width:0;text-align:center;font-size:13px;font-weight:600;padding:8px 3px;border:1px solid var(--border-soft);border-radius:8px;outline:none}
.ld-in:focus{border-color:var(--accent)!important;box-shadow:0 0 0 2px var(--accent-soft)}
.ld-top-btn{width:100%;min-width:0;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 3px;border-radius:9px;border:1px solid var(--border-soft);background:var(--bg-card);color:var(--text-main);font-size:13px;font-weight:700;transition:background .15s,border-color .15s}
.ld-top-btn .nm,.ld-top-btn .rs{max-width:100%;white-space:nowrap;text-align:center}
.ld-top-btn .rs{font-size:12px;color:var(--text-sub);font-weight:600}
@media(hover:hover){.ld-top-btn:hover{border-color:var(--pc);background:var(--bg-soft)}}
.ld-top-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ld-top-btn.run{border-color:var(--pc);box-shadow:0 0 0 2px var(--pc)}
.ld-top-btn.done{background:var(--bg-soft);border-color:var(--pc)}
/* 위 칸 맞바꾸기: 점선 칸 → 고른 칸은 초록 테두리, 자리가 바뀐 칸은 살짝 튄다 */
.ld-top-btn.swap{border-style:dashed;cursor:pointer}
@media(hover:hover){.ld-top-btn.swap:hover{border-color:var(--accent);background:var(--accent-soft)}}
.ld-top-btn.sel{border-style:solid;border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.ld-top.swapped0>*{animation:ldSwapA .45s ease-out}
.ld-top.swapped1>*{animation:ldSwapB .45s ease-out}
@keyframes ldSwapA{0%{transform:translateY(-6px) scale(.92);opacity:.35}60%{transform:translateY(1px) scale(1.04);opacity:1}100%{transform:none}}
@keyframes ldSwapB{0%{transform:translateY(-6px) scale(.92);opacity:.35}60%{transform:translateY(1px) scale(1.04);opacity:1}100%{transform:none}}
.ld-swap-note{position:absolute;left:0;right:0;top:12px;margin:0 auto;width:fit-content;max-width:calc(100% - 24px);z-index:2;display:flex;align-items:center;gap:7px;min-height:36px;padding:4px 6px 4px 13px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;box-shadow:0 6px 18px #00000040;white-space:nowrap}
.ld-swap-note>span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.ld-swap-note button{padding:4px 10px;border-radius:999px;background:var(--bg-card);color:var(--text-main);font-size:12px;font-weight:600;border:1px solid var(--border-soft)}
.ld-board{grid-column:1/-1;position:relative;background:#10291f;border:1px solid #2c5244;border-radius:14px;overflow:hidden}
.ld-board>svg{position:absolute;inset:0;display:block}
.ld-board>canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}
.ld-go{position:absolute;left:50%;top:50%;transform:translate(-50%,-10%);z-index:2;display:flex;align-items:center;gap:10px;padding:14px 30px;border-radius:999px;background:#ffd166;color:#22301f;font-size:18px;font-weight:800;box-shadow:0 10px 30px #00000059;white-space:nowrap}
.ld-go:hover{background:#ffdc8a}
.ld-flash{position:absolute;left:0;right:0;top:12px;margin:0 auto;width:fit-content;max-width:calc(100% - 24px);z-index:2;display:flex;align-items:center;gap:10px;padding:8px 18px;border-radius:999px;background:#0b1f17eb;border:1px solid #ffffff2b;color:#f1f7f2;font-size:clamp(17px,2.3vw,26px);font-weight:800;white-space:nowrap;pointer-events:none;animation:ldPop .3s ease-out}
.ld-flash i{width:.55em;height:.55em;border-radius:50%;flex-shrink:0;background:var(--pc)}
.ld-flash .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.ld-flash .ar{color:#9fb8a8;font-weight:600}
.ld-flash b{color:#ffd166;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ld-flash.hint{font-size:13px;font-weight:600;color:#cfe3d8;padding:7px 14px;background:#0b1f17cc}
.ld-bot{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 3px 0;min-width:0}
.ld-prize{display:block;width:100%;text-align:center;font-size:13px;font-weight:700;padding:8px 3px;border-radius:8px;background:var(--bg-card);color:var(--text-main);border:1px solid var(--border-soft);white-space:nowrap}
.ld-prize.gold{background:#ffd166;border-color:#e2b54a;color:#2a2410}
.ld-prize.miss{color:var(--text-sub);font-weight:600}
.ld-who{display:inline-flex;align-items:center;justify-content:center;max-width:100%;padding:4px 5px;border-radius:999px;background:var(--pc);color:#1d2620;font-size:12px;font-weight:700;animation:ldPop .3s ease-out}
.ld-who span{white-space:nowrap;text-align:center}
.ld-results{background:var(--bg-card);border:1px solid var(--border-line);border-radius:12px;padding:12px 14px 14px}
.ld-results-head{display:flex;align-items:center;gap:7px;margin-bottom:10px;font-size:13px;font-weight:700;color:var(--text-main)}
.ld-results-head .pb-btn{margin-left:auto}
.ld-results ol{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;list-style:none;margin:0;padding:0}
.ld-results li{display:flex;align-items:center;gap:7px;min-width:0;padding:7px 10px;border-radius:8px;background:var(--bg-soft);font-size:13px;font-weight:600;color:var(--text-main)}
.ld-results li i{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:var(--pc)}
.ld-results li .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ld-results li .ar{color:var(--text-mute)}
.ld-results li b{margin-left:auto;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.ld-results li.gold{background:#ffd166;color:#2a2410}
.ld-results li.gold .ar{color:#5a4a1c}
/* 사다리 새로 그리기: 가로줄이 위에서부터 차례로 그어진다 */
.ld-rung{stroke-dasharray:1;stroke-dashoffset:1;animation:ldDraw .32s ease-out forwards}
@keyframes ldDraw{to{stroke-dashoffset:0}}
@keyframes ldPop{from{opacity:0;transform:translateY(4px) scale(.96)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.ld-flash,.ld-who,.ld-top>*{animation:none!important}.ld-rung{animation:none;stroke-dashoffset:0}}
@media(max-width:640px){.ld-go{font-size:16px;padding:12px 22px}.ld-cols{grid-template-columns:repeat(var(--n),minmax(min(var(--cw),50px),1fr));width:max(100%,calc(var(--n) * min(var(--cw),50px)))}.ld-in{font-size:12px}}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback}=React;

// 아이콘 렌더링 픽스
// 칠판 바 - 좌석/모둠 배치도 상단에 표시
const BoardBar=({label='칠 판',small=false})=>(
    <div className={`board-bar${small?' is-sm':''}`}>
        <div className="board-bar-gloss"/>
        <div className="board-bar-inner">
            <span className="board-bar-rule"/>
            <span className="board-bar-label">{label}</span>
            <span className="board-bar-rule"/>
            <span className="board-bar-dust"/>
        </div>
    </div>
);
const Icon=({name,size=24,className=""})=>{
    const ref=useRef(null);
    useEffect(()=>{
        if(window.lucide&&ref.current){
            ref.current.innerHTML='';
            const i=document.createElement('i');
            i.setAttribute('data-lucide',name);
            ref.current.appendChild(i);
            window.lucide.createIcons({root:ref.current,nameAttr:'data-lucide',attrs:{width:size,height:size}});
        }
    },[name,size]);
    return <span ref={ref} className={`inline-flex items-center justify-center ${className}`}/>;
};

// Public channel links listed on the 송쌤과학 blog.
const SocialLinks=()=> <div className="header-social-links" role="group" aria-label="송쌤과학 소셜 채널">
    <a className="social-link social-youtube" href="https://www.youtube.com/@songsamscience" target="_blank" rel="noopener noreferrer" title="송쌤과학 유튜브 · 새 탭에서 열기" aria-label="송쌤과학 유튜브 (새 탭)">
        <svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M21.58 7.19a2.88 2.88 0 0 0-2.03-2.04C17.76 4.67 12 4.67 12 4.67s-5.76 0-7.55.48a2.88 2.88 0 0 0-2.03 2.04A30.1 30.1 0 0 0 1.94 12a30.1 30.1 0 0 0 .48 4.81 2.88 2.88 0 0 0 2.03 2.04c1.79.48 7.55.48 7.55.48s5.76 0 7.55-.48a2.88 2.88 0 0 0 2.03-2.04 30.1 30.1 0 0 0 .48-4.81 30.1 30.1 0 0 0-.48-4.81Z"/><path className="yt-play" d="m10 15.18 5.2-3.18L10 8.82Z"/></svg>
    </a>
    <a className="social-link social-instagram" href="https://www.instagram.com/songsamscience/" target="_blank" rel="noopener noreferrer" title="송쌤과학 인스타그램 · 새 탭에서 열기" aria-label="송쌤과학 인스타그램 (새 탭)">
        <span className="instagram-mark"><svg aria-hidden="true" focusable="false" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.6" cy="6.4" r="1" fill="currentColor" stroke="none"/></svg></span>
    </a>
</div>;

const Copyright=({fixed})=>(<footer className={`w-full text-center py-4 text-[10px] text-gray-400 font-bold tracking-widest uppercase ${fixed?'fixed bottom-0 left-0 bg-white/50 backdrop-blur-sm safe-b':'mt-6'}`}>ⓒ 송쌤과학 Class Helper</footer>);

function SystemModal({modal,closeModal}){
    return(<div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4"><div className="modal-up bg-white p-5 sm:p-7 rounded-2xl shadow-2xl max-w-xs sm:max-w-sm w-full text-center border-4 border-[#FFB7B2]"><p className="text-base sm:text-lg font-bold text-gray-700 mb-5 whitespace-pre-wrap leading-relaxed">{modal.msg}</p><div className="flex gap-2 justify-center">{modal.type==='confirm'&&<button onClick={closeModal} className="flex-1 py-2.5 bg-gray-100 rounded-xl font-bold text-gray-500 touch-target">취소</button>}<button onClick={()=>{if(modal.action)modal.action();closeModal();}} className="flex-1 py-2.5 bg-[#FFB7B2] rounded-xl font-bold text-white touch-target">확인</button></div></div></div>);
}

function SettingsModal({isDarkMode,setIsDarkMode,uiScale,setUiScale,onClose,playSound}){
    const scalePresets=[
        {label:'작게',value:0.85,icon:'a-large-small'},
        {label:'보통',value:1.0,icon:'type'},
        {label:'크게',value:1.15,icon:'type'},
        {label:'아주크게',value:1.3,icon:'type'},
    ];
    return(<div className="fixed inset-0 z-[110] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4" onClick={onClose}>
        <div className="modal-up bg-white p-5 sm:p-7 rounded-2xl shadow-2xl max-w-sm w-full border-4 border-[#C7CEEA]" onClick={e=>e.stopPropagation()}>
            <div className="flex items-center justify-between mb-5">
                <div className="flex items-center gap-2">
                    <div className="bg-[#C7CEEA] p-2 rounded-xl text-white"><Icon name="settings" size={18}/></div>
                    <h3 className="text-lg font-black text-[#4A4A4A]">화면 설정</h3>
                </div>
                <button onClick={()=>{playSound('click');onClose();}} className="p-2 rounded-lg text-gray-400 touch-target"><Icon name="x" size={18}/></button>
            </div>

            {/* 다크모드 */}
            <div className="mb-5">
                <div className="flex items-center justify-between mb-2 px-1">
                    <span className="text-sm font-black text-gray-600 flex items-center gap-1.5"><Icon name={isDarkMode?"moon":"sun"} size={15} className={isDarkMode?'text-[#FFDAC1]':'text-[#FFD700]'}/> 화면 모드</span>
                </div>
                <div className="flex gap-2 bg-[#F7F9FC] p-1.5 rounded-xl border border-gray-100">
                    <button onClick={()=>{playSound('click');setIsDarkMode(false);}} className={`flex-1 py-3 rounded-lg font-bold text-sm flex items-center justify-center gap-1.5 transition-all ${!isDarkMode?'bg-white shadow-md text-[#FF9E99]':'text-gray-400'}`}>
                        <Icon name="sun" size={16}/> 라이트
                    </button>
                    <button onClick={()=>{playSound('click');setIsDarkMode(true);}} className={`flex-1 py-3 rounded-lg font-bold text-sm flex items-center justify-center gap-1.5 transition-all ${isDarkMode?'bg-[#1F2230] shadow-md text-[#FFDAC1]':'text-gray-400'}`}>
                        <Icon name="moon" size={16}/> 다크
                    </button>
                </div>
            </div>

            {/* UI 크기 */}
            <div className="mb-3">
                <div className="flex items-center justify-between mb-2 px-1">
                    <span className="text-sm font-black text-gray-600 flex items-center gap-1.5"><Icon name="type" size={15} className="text-[#C7CEEA]"/> 글자/아이콘 크기</span>
                    <span className="text-xs font-bold text-[#C7CEEA]">{Math.round(uiScale*100)}%</span>
                </div>
                <div className="grid grid-cols-4 gap-1.5 mb-3">
                    {scalePresets.map(p=>(
                        <button key={p.value} onClick={()=>{playSound('click');setUiScale(p.value);}}
                            className={`py-2.5 rounded-lg text-xs font-bold border-2 transition-all ${Math.abs(uiScale-p.value)<0.01?'bg-[#C7CEEA] border-[#C7CEEA] text-white shadow-md':'bg-white border-gray-100 text-gray-500'}`}>
                            {p.label}
                        </button>
                    ))}
                </div>
                <div className="flex items-center gap-2 bg-[#F7F9FC] rounded-lg p-2.5 border border-gray-100">
                    <span className="text-[10px] font-bold text-gray-400 shrink-0">A</span>
                    <input type="range" min="0.75" max="1.5" step="0.05" value={uiScale}
                        onChange={e=>setUiScale(parseFloat(e.target.value))}
                        className="flex-1" style={{accentColor:'#C7CEEA'}}/>
                    <span className="text-base font-black text-gray-500 shrink-0">A</span>
                </div>
                <p className="text-[10px] text-gray-400 font-bold mt-2 px-1 text-center">미리보기: <span style={{fontSize:`${14*uiScale}px`}}>가나다 ABC 123</span></p>
            </div>

            <button onClick={()=>{playSound('click');onClose();}} className="w-full py-3 bg-[#C7CEEA] hover:bg-[#B5BFE3] text-white rounded-xl font-black shadow-md active:scale-95 touch-target transition-all">완료</button>
        </div>
    </div>);
}

function ExcludeBar({excludedInput,setExcludedInput,excludedNums,totalCount,accentColor,playSound}){
    const activeCount=totalCount-excludedNums.length;
    return(<div className="bg-white/80 backdrop-blur rounded-xl p-2.5 border border-gray-100 soft-shadow"><div className="flex items-center gap-2"><div className="shrink-0 p-1.5 rounded-lg" style={{background:accentColor+'22'}}><Icon name="user-minus" size={15}/></div><input type="text" value={excludedInput} onChange={e=>setExcludedInput(e.target.value)} className="flex-1 p-2 bg-[#F7F7F7] rounded-lg border-2 border-transparent focus:border-gray-200 outline-none font-bold text-xs min-w-0" placeholder="제외 번호 (예: 3, 7, 15)"/>{excludedNums.length>0&&<button onClick={()=>{playSound('click');setExcludedInput('');}} className="shrink-0 p-1.5 text-gray-300 hover:text-red-400 touch-target"><Icon name="x" size={14}/></button>}</div>{excludedNums.length>0&&<div className="mt-2 flex flex-wrap items-center gap-1.5"><span className="text-[10px] text-gray-400 font-bold shrink-0">제외:</span>{excludedNums.map(n=><span key={n} className="excluded-badge">{n}번</span>)}<span className="ml-auto text-[10px] font-bold" style={{color:accentColor}}>참여 {activeCount}명</span></div>}</div>);
}

function SoundToggle({isSoundOn,setIsSoundOn,playSound}){
    return(<button onClick={()=>{if(!isSoundOn)playSound('click');setIsSoundOn(!isSoundOn);}} className={`sound-toggle ${isSoundOn?'on':'off'}`}><Icon name={isSoundOn?"volume-2":"volume-x"} size={13}/>소리 {isSoundOn?"ON":"OFF"}</button>);
}

function LiveClock({size='lg'}){
    const [now,setNow]=useState(new Date());
    useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(t);},[]);
    const h=now.getHours(),m=now.getMinutes(),s=now.getSeconds();
    const period=h>=12?'오후':'오전';const h12=h%12||12;
    const dateStr=`${now.getFullYear()}. ${now.getMonth()+1}. ${now.getDate()}. ${['일','월','화','수','목','금','토'][now.getDay()]}요일`;
    if(size==='md') return(<div className="text-center"><div className="text-sm font-bold text-gray-400 mb-1">{period}</div><div className="text-3xl sm:text-5xl font-black text-[#4A4A4A] clock-face">{String(h12).padStart(2,'0')}:{String(m).padStart(2,'0')}<span className="text-xl sm:text-3xl text-gray-300 ml-0.5">:{String(s).padStart(2,'0')}</span></div><div className="text-xs font-bold text-gray-400 mt-1.5">{dateStr}</div></div>);
    return(<div className="text-center"><div className="text-base font-bold text-gray-400 mb-1">{period}</div><div className="text-5xl sm:text-7xl font-black text-[#4A4A4A] clock-face">{String(h12).padStart(2,'0')}:{String(m).padStart(2,'0')}<span className="text-3xl sm:text-5xl text-gray-300 ml-1">:{String(s).padStart(2,'0')}</span></div><div className="text-sm font-bold text-gray-400 mt-2">{now.getFullYear()}년 {now.getMonth()+1}월 {now.getDate()}일 {['일','월','화','수','목','금','토'][now.getDay()]}요일</div></div>);
}

function CalendarWidget(){
    const today=new Date();const [year,setYear]=useState(today.getFullYear());const [month,setMonth]=useState(today.getMonth());
    const firstDay=new Date(year,month,1).getDay();const daysInMonth=new Date(year,month+1,0).getDate();
    const prev=()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);};
    const next=()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);};
    const goToday=()=>{setYear(today.getFullYear());setMonth(today.getMonth());};
    const isToday=d=>d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
    const days=[];for(let i=0;i<firstDay;i++)days.push(null);for(let d=1;d<=daysInMonth;d++)days.push(d);
    return(<div className="bg-white rounded-2xl p-4 sm:p-5 soft-shadow border border-gray-100 max-w-sm mx-auto w-full"><div className="flex items-center justify-between mb-4"><button onClick={prev} className="p-2 rounded-lg hover:bg-gray-100 touch-target"><Icon name="chevron-left" size={18}/></button><div className="text-center cursor-pointer" onClick={goToday}><span className="text-lg sm:text-xl font-black text-[#4A4A4A]">{year}년 {month+1}월</span></div><button onClick={next} className="p-2 rounded-lg hover:bg-gray-100 touch-target"><Icon name="chevron-right" size={18}/></button></div><div className="grid grid-cols-7 gap-1 mb-2">{['일','월','화','수','목','금','토'].map((d,i)=><div key={d} className={`text-center text-[11px] font-bold py-1 ${i===0?'text-red-400':i===6?'text-blue-400':'text-gray-400'}`}>{d}</div>)}</div><div className="grid grid-cols-7 gap-1">{days.map((d,i)=>d?<div key={i} className={`cal-day ${isToday(d)?'cal-today':i%7===0?'cal-sun':i%7===6?'cal-sat':'text-gray-600'} ${!isToday(d)?'hover:bg-gray-100':''}`}>{d}</div>:<div key={i}/>)}</div><div className="mt-3 text-center"><button onClick={goToday} className="text-[10px] font-bold text-[#FFB7B2] hover:underline">오늘로 이동</button></div></div>);
}

function DDayWidget({dDays, setDDays, playSound, showAlert}) {
    const [title, setTitle] = useState('');
    const [date, setDate] = useState('');

    const calculateDDay = (targetDateStr) => {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        const target = new Date(targetDateStr);
        target.setHours(0, 0, 0, 0);
        
        const diffTime = target.getTime() - today.getTime();
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        
        if (diffDays === 0) return 'D-Day';
        if (diffDays > 0) return `D-${diffDays}`;
        return `D+${Math.abs(diffDays)}`;
    };

    const handleAdd = () => {
        if (!title.trim() || !date) {
            showAlert('제목과 날짜를 모두 입력해주세요.');
            return;
        }
        playSound('click');
        setDDays(prev => [...prev, { id: Date.now(), title: title.trim(), targetDate: date }].sort((a, b) => new Date(a.targetDate) - new Date(b.targetDate)));
        setTitle('');
        setDate('');
    };

    const handleDelete = (id) => {
        playSound('click');
        setDDays(prev => prev.filter(d => d.id !== id));
    };

    return (
        <div className="bg-white rounded-2xl p-4 sm:p-5 soft-shadow border border-gray-100 max-w-sm mx-auto w-full">
            <h3 className="text-base sm:text-lg font-black text-[#4A4A4A] mb-3 flex items-center justify-center gap-2">
                <Icon name="calendar-heart" size={18} className="text-[#FFB7B2]"/> D-Day 계산기
            </h3>
            
            <div className="space-y-2 mb-4">
                <input 
                    type="text" 
                    value={title} 
                    onChange={e => setTitle(e.target.value)} 
                    className="w-full p-2 bg-[#F9F7F4] rounded-xl border-2 border-transparent outline-none focus:border-[#FFB7B2] text-sm font-bold" 
                    placeholder="D-Day 제목 (예: 소풍, 중간고사)"
                />
                <div className="flex gap-2">
                    <input 
                        type="date" 
                        value={date} 
                        onChange={e => setDate(e.target.value)} 
                        className="flex-1 p-2 bg-[#F9F7F4] rounded-xl border-2 border-transparent outline-none focus:border-[#FFB7B2] text-sm font-bold text-gray-600"
                    />
                    <button 
                        onClick={handleAdd} 
                        className="px-4 py-2 bg-[#FFB7B2] text-white rounded-xl font-black text-sm touch-target active:scale-95 transition-all whitespace-nowrap"
                    >
                        추가
                    </button>
                </div>
            </div>

            {dDays.length > 0 ? (
                <div className="space-y-2 max-h-[220px] overflow-y-auto no-scrollbar">
                    {dDays.map(d => {
                        const dDayStr = calculateDDay(d.targetDate);
                        const isPast = dDayStr.startsWith('D+');
                        const isToday = dDayStr === 'D-Day';
                        
                        return (
                            <div key={d.id} className="flex items-center justify-between p-2.5 bg-[#FFFDF0] rounded-xl border border-[#FFE082]/30">
                                <div className="min-w-0 flex-1 pr-2">
                                    <p className="text-xs text-gray-600 font-black truncate mb-0.5">{d.title}</p>
                                    <p className="text-[10px] text-gray-400 font-bold">{d.targetDate}</p>
                                </div>
                                <div className="flex items-center gap-2 shrink-0">
                                    <span className={`text-base font-black ${isToday ? 'text-red-500 animate-pulse' : isPast ? 'text-gray-400' : 'text-[#FF6B6B]'}`}>
                                        {dDayStr}
                                    </span>
                                    <button onClick={() => handleDelete(d.id)} className="p-1 text-red-200 hover:text-red-400 touch-target transition-colors">
                                        <Icon name="x" size={14}/>
                                    </button>
                                </div>
                            </div>
                        );
                    })}
                </div>
            ) : (
                <div className="text-center py-5 border-2 border-dashed border-gray-100 rounded-xl bg-gray-50/50">
                    <p className="text-[11px] text-gray-400 font-bold">등록된 D-Day가 없습니다.<br/>중요한 일정을 등록해보세요!</p>
                </div>
            )}
        </div>
    );
}

function RecorderWidget({playSound:ps}){
    const [isRecording,setIsRecording]=useState(false);
    const [isPaused,setIsPaused]=useState(false);
    const [elapsed,setElapsed]=useState(0);
    const [recordings,setRecordings]=useState([]);
    const [isConverting,setIsConverting]=useState(false);
    const mediaRecRef=useRef(null);
    const chunksRef=useRef([]);
    const timerRef=useRef(null);
    const streamRef=useRef(null);
    const elapsedRef=useRef(0);

    useEffect(()=>{return()=>{if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());clearInterval(timerRef.current);};},[]);

    const toWav=(blob)=>new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=async()=>{
            try{
                const ctx=new(window.AudioContext||window.webkitAudioContext)();
                const buf=await ctx.decodeAudioData(reader.result);
                ctx.close();
                const nCh=1,sr=buf.sampleRate,samples=buf.getChannelData(0);
                const len=samples.length;
                const wavBuf=new ArrayBuffer(44+len*2);
                const v=new DataView(wavBuf);
                const writeStr=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
                writeStr(0,'RIFF');v.setUint32(4,36+len*2,true);writeStr(8,'WAVE');
                writeStr(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,nCh,true);
                v.setUint32(24,sr,true);v.setUint32(28,sr*nCh*2,true);v.setUint16(32,nCh*2,true);v.setUint16(34,16,true);
                writeStr(36,'data');v.setUint32(40,len*2,true);
                let off=44;
                for(let i=0;i<len;i++,off+=2){const s=Math.max(-1,Math.min(1,samples[i]));v.setInt16(off,s<0?s*0x8000:s*0x7FFF,true);}
                resolve(new Blob([wavBuf],{type:'audio/wav'}));
            }catch(e){reject(e);}
        };
        reader.onerror=reject;
        reader.readAsArrayBuffer(blob);
    });

    const startRecording=async()=>{
        try{
            const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,sampleRate:44100}});
            streamRef.current=stream;
            const mimeType=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'';
            const opts=mimeType?{mimeType}:{};
            const mr=new MediaRecorder(stream,opts);
            mediaRecRef.current=mr;chunksRef.current=[];
            mr.ondataavailable=e=>{if(e.data.size>0)chunksRef.current.push(e.data);};
            mr.onstop=async()=>{
                const webmBlob=new Blob(chunksRef.current,{type:mr.mimeType||'audio/webm'});
                const now=new Date();
                const name=`녹음_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}`;
                setIsConverting(true);
                try{
                    const wavBlob=await toWav(webmBlob);
                    const url=URL.createObjectURL(wavBlob);
                    const dur=elapsedRef.current;
                    setRecordings(prev=>[{id:Date.now(),url,name,duration:dur,blob:wavBlob,ext:'wav'},...prev]);
                    const a=document.createElement('a');a.href=url;a.download=name+'.wav';document.body.appendChild(a);a.click();document.body.removeChild(a);
                }catch(err){
                    console.warn('WAV 변환 실패, 원본 저장:',err);
                    const url=URL.createObjectURL(webmBlob);
                    setRecordings(prev=>[{id:Date.now(),url,name,duration:elapsedRef.current,blob:webmBlob,ext:'webm'},...prev]);
                    const a=document.createElement('a');a.href=url;a.download=name+'.webm';document.body.appendChild(a);a.click();document.body.removeChild(a);
                }
                setIsConverting(false);
                stream.getTracks().forEach(t=>t.stop());streamRef.current=null;
            };
            mr.start(250);
            setIsRecording(true);setIsPaused(false);setElapsed(0);elapsedRef.current=0;
            timerRef.current=setInterval(()=>{elapsedRef.current++;setElapsed(e=>e+1);},1000);
            ps('click');
        }catch(e){alert("마이크 권한을 허용해주세요.\n\n브라우저 설정 > 사이트 설정 > 마이크 에서 '허용'으로 변경 후 다시 시도하세요.");}
    };
    const pauseRec=()=>{if(mediaRecRef.current?.state==='recording'){mediaRecRef.current.pause();setIsPaused(true);clearInterval(timerRef.current);ps('click');}};
    const resumeRec=()=>{if(mediaRecRef.current?.state==='paused'){mediaRecRef.current.resume();setIsPaused(false);timerRef.current=setInterval(()=>{elapsedRef.current++;setElapsed(e=>e+1);},1000);ps('click');}};
    const stopRec=()=>{if(mediaRecRef.current?.state!=='inactive'){mediaRecRef.current.stop();setIsRecording(false);setIsPaused(false);clearInterval(timerRef.current);ps('win');}};
    const resetRec=()=>{setElapsed(0);elapsedRef.current=0;ps('click');};
    const newRecording=()=>{setElapsed(0);elapsedRef.current=0;startRecording();};
    const dlRec=r=>{const a=document.createElement('a');a.href=r.url;a.download=r.name+'.'+r.ext;document.body.appendChild(a);a.click();document.body.removeChild(a);};
    const delRec=id=>{setRecordings(prev=>{const t=prev.find(r=>r.id===id);if(t?.url)URL.revokeObjectURL(t.url);return prev.filter(r=>r.id!==id);});ps('click');};
    const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

    return(<div className="w-full max-w-lg mx-auto space-y-4">
        <div className="bg-white rounded-2xl p-5 sm:p-7 soft-shadow border-2 border-[#FFCDD2] text-center">
            <h2 className="text-lg sm:text-xl font-black text-[#4A4A4A] mb-1 flex items-center justify-center gap-2"><Icon name="mic" size={20}/> 음성 녹음</h2>
            <p className="text-[10px] text-gray-400 font-bold mb-5">녹음 완료 시 WAV 파일로 자동 다운로드</p>
            <div className={`text-4xl sm:text-6xl font-black clock-face mb-2 ${isRecording&&!isPaused?'text-red-500':'text-[#4A4A4A]'}`}>{fmt(elapsed)}</div>
            {isRecording&&<p className="text-[11px] font-bold text-gray-400 mb-4">예상 용량 <span className="text-gray-600">{((44100*2*elapsed)/1024/1024).toFixed(1)} MB</span></p>}
            {!isRecording&&!isConverting&&elapsed>0&&<p className="text-[11px] font-bold text-gray-400 mb-4">직전 녹음 시간입니다. 새로 녹음하면 00:00부터 시작됩니다.</p>}
            {isRecording&&!isPaused&&<div className="flex items-center justify-center gap-[3px] mb-5 h-8">{Array.from({length:24}).map((_,i)=><div key={i} className="w-[3px] bg-red-400 rounded-full origin-bottom" style={{height:'24px',animation:`barBounce ${.4+Math.random()*.4}s ease-in-out infinite`,animationDelay:`${i*.04}s`}}/>)}</div>}
            {isRecording&&isPaused&&<div className="flex items-center justify-center gap-2 mb-5 h-8 text-gray-400 font-bold text-sm"><span className="animate-pulse">⏸</span> 일시정지</div>}
            {!isRecording&&!isConverting&&<div className="h-8 mb-5"/>}
            {isConverting&&<div className="flex items-center justify-center gap-2 mb-5 h-8 text-blue-500 font-bold text-sm"><Icon name="loader-2" size={16} className="animate-spin"/> WAV 변환 중...</div>}
            <div className="flex gap-3 justify-center flex-wrap">
                {!isRecording?(elapsed>0?<>
                    <button onClick={newRecording} disabled={isConverting} className="flex items-center gap-2 px-6 py-3.5 bg-red-500 hover:bg-red-600 text-white rounded-full text-base font-black shadow-lg shadow-red-500/25 active:scale-95 touch-target transition-all disabled:opacity-50"><Icon name="rotate-ccw" size={20}/> 새로 녹음하기</button>
                    <button onClick={resetRec} disabled={isConverting} className="flex items-center gap-2 px-5 py-3.5 bg-gray-200 hover:bg-gray-300 text-gray-600 rounded-full text-sm font-black shadow active:scale-95 touch-target transition-all disabled:opacity-50"><Icon name="timer-reset" size={18}/> 시간 초기화</button>
                </>:<button onClick={startRecording} disabled={isConverting} className="flex items-center gap-2 px-6 py-3.5 bg-red-500 hover:bg-red-600 text-white rounded-full text-base font-black shadow-lg shadow-red-500/25 active:scale-95 touch-target transition-all disabled:opacity-50"><Icon name="mic" size={20}/> 녹음 시작</button>):<>
                    {!isPaused?<button onClick={pauseRec} className="px-5 py-3.5 bg-yellow-500 text-white rounded-full font-black shadow-lg active:scale-95 touch-target transition-all flex items-center gap-1.5"><Icon name="pause" size={18}/> 일시정지</button>:<button onClick={resumeRec} className="px-5 py-3.5 bg-green-500 text-white rounded-full font-black shadow-lg active:scale-95 touch-target transition-all flex items-center gap-1.5"><Icon name="play" size={18}/> 계속</button>}
                    <button onClick={stopRec} className={`px-5 py-3.5 bg-[#FFB7B2] text-white rounded-full font-black shadow-lg active:scale-95 touch-target transition-all flex items-center gap-1.5 ${isRecording&&!isPaused?'rec-pulse':''}`}><Icon name="square" size={18}/> 녹음 완료</button>
                </>}
            </div>
        </div>
        <div className="bg-[#FFF8E1] rounded-xl p-3 border border-[#FFE082] flex items-start gap-2">
            <div className="shrink-0 mt-0.5"><Icon name="clock" size={16} className="text-[#FFA000]"/></div>
            <div className="text-[11px] text-gray-600 font-bold leading-relaxed">
                <p>안정적인 녹음을 위해 <span className="text-[#E65100]">최대 10분 이내</span>로 녹음하는 것을 권장합니다.</p>
                <p className="mt-0.5 text-gray-400">긴 녹음은 WAV 변환 시 메모리 부족으로 실패할 수 있습니다. (10분 ≈ 약 53MB)</p>
            </div>
        </div>
        <div className="bg-[#F0F8FF] rounded-xl p-3 border border-[#D6EBFF] flex items-start gap-2">
            <div className="shrink-0 mt-0.5"><Icon name="shield-check" size={16} className="text-blue-400"/></div>
            <div className="text-[11px] text-gray-500 font-bold leading-relaxed">
                <p>녹음 파일은 서버에 저장되지 않으며, 사용자의 기기에서만 처리됩니다.</p>
                <p className="mt-0.5 text-gray-400">브라우저 탭을 닫거나 페이지를 새로고침하면 녹음 파일이 자동으로 삭제됩니다.</p>
            </div>
        </div>
        {recordings.length>0&&<div className="space-y-2">
            <h3 className="text-sm font-black text-gray-500 px-1">녹음 목록 ({recordings.length})</h3>
            {recordings.map(rec=><div key={rec.id} className="bg-white rounded-xl p-3 soft-shadow border border-gray-100 flex items-center gap-3">
                <div className="shrink-0 p-2 bg-red-50 rounded-lg text-red-400"><Icon name="file-audio" size={18}/></div>
                <div className="flex-1 min-w-0">
                    <p className="text-xs font-bold text-gray-600 truncate">{rec.name}.{rec.ext}</p>
                    <p className="text-[10px] text-gray-400 font-bold">{fmt(rec.duration)}</p>
                    <audio controls controlsList="nodownload" preload="metadata" className="w-full mt-1.5 h-8"><source src={rec.url} type={`audio/${rec.ext}`}/></audio>
                </div>
                <div className="flex flex-col gap-1 shrink-0">
                    <button onClick={()=>dlRec(rec)} className="p-1.5 text-blue-400 hover:bg-blue-50 rounded-lg touch-target"><Icon name="download" size={16}/></button>
                    <button onClick={()=>delRec(rec.id)} className="p-1.5 text-red-300 hover:bg-red-50 rounded-lg touch-target"><Icon name="trash-2" size={16}/></button>
                </div>
            </div>)}
        </div>}
    </div>);
}

// 유튜브 검색: API 키가 있으면 이 화면에서 결과를 고르고, 없으면 유튜브 검색 결과를 새 탭으로 연다.
// 키·안전 검색 설정은 이 브라우저에만 저장한다(학급 백업 제외).
const YT_KEY_STORE='songsam_yt_api_key',YT_SAFE_STORE='songsam_yt_safe';
const ytLoad=(k,d)=>{try{return localStorage.getItem(k)||d;}catch(e){return d;}};
const ytSave=(k,v)=>{try{v?localStorage.setItem(k,v):localStorage.removeItem(k);}catch(e){}};
const ytText=s=>{const t=document.createElement('textarea');t.innerHTML=s||'';return t.value;};
const ytDuration=iso=>{const m=/^P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?)?$/.exec(iso||'');if(!m)return '';const h=(+(m[1]||0))*24+(+(m[2]||0)),mi=+(m[3]||0),s=+(m[4]||0);if(!h&&!mi&&!s)return '';return (h?h+':'+String(mi).padStart(2,'0'):mi)+':'+String(s).padStart(2,'0');};
const ytAgo=iso=>{const d=(Date.now()-new Date(iso).getTime())/864e5;if(!(d>=0))return '';if(d<1)return '오늘';if(d<30)return Math.floor(d)+'일 전';if(d<365)return Math.floor(d/30)+'개월 전';return Math.floor(d/365)+'년 전';};
const ytResultsUrl=q=>'https://www.youtube.com/results?search_query='+encodeURIComponent(q);
const ytApiError=(j,status)=>{
    const e=(j&&j.error)||{},reason=(((e.errors&&e.errors[0]&&e.errors[0].reason)||'')+' '+(e.status||'')+' '+JSON.stringify(e.details||'')).trim(),msg=e.message||'';
    if(/quotaExceeded|dailyLimitExceeded|rateLimitExceeded/.test(reason))return '오늘 쓸 수 있는 검색 횟수를 다 썼어요. 내일 다시 검색하거나 [유튜브에서 보기]를 눌러 주세요.';
    if(/REFERRER_BLOCKED|ipRefererBlocked/.test(reason)||/referer|referrer/i.test(msg))return 'API 키의 웹사이트 제한 때문에 이 주소에서는 검색할 수 없어요. 키의 제한 설정을 확인해 주세요.';
    if(/keyInvalid|API_KEY_INVALID/.test(reason)||/API key not valid/i.test(msg))return 'API 키가 올바르지 않아요. 검색 설정에서 키를 다시 확인해 주세요.';
    if(/accessNotConfigured|SERVICE_DISABLED/.test(reason)||/has not been used|is disabled/i.test(msg))return '이 키의 프로젝트에서 YouTube Data API v3가 꺼져 있어요. Google Cloud 콘솔에서 [사용]을 눌러 주세요.';
    return '검색하지 못했어요. ('+status+(e.errors&&e.errors[0]&&e.errors[0].reason?' · '+e.errors[0].reason:'')+')';
};

function YouTubePlayer({playSound:ps}){
    const [embedInput,setEmbedInput]=useState('');
    const [videoId,setVideoId]=useState(null);
    const [history,setHistory]=useState([]);
    const [errorMsg,setErrorMsg]=useState('');
    const [apiKey,setApiKey]=useState(()=>ytLoad(YT_KEY_STORE,''));
    const [safe,setSafe]=useState(()=>ytLoad(YT_SAFE_STORE,'strict'));
    const [showSettings,setShowSettings]=useState(false);
    const [keyDraft,setKeyDraft]=useState('');
    const [showKey,setShowKey]=useState(false);
    const [confirmDel,setConfirmDel]=useState(false);
    const [search,setSearch]=useState(null);
    const reqRef=useRef(0);
    const playerRef=useRef(null);
    const inputRef=useRef(null);

    const extractId=input=>{
        const c=input.trim();
        let m=c.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:embed\/|v\/|shorts\/|live\/|watch\?v=|watch\?.+&v=))([a-zA-Z0-9_-]{11})/);
        if(m)return m[1];
        m=c.match(/src=["'](?:https?:)?\/\/(?:www\.)?(?:youtube\.com|youtube-nocookie\.com)\/embed\/([a-zA-Z0-9_-]{11})/i);
        if(m)return m[1];
        // 영상 ID만 넣은 경우. 'electricity'처럼 11글자 영어 검색어와 헷갈리지 않게 숫자·기호나 대문자 2개 이상이 있을 때만
        if(/^[a-zA-Z0-9_-]{11}$/.test(c)&&(/[0-9_-]/.test(c)||(c.match(/[A-Z]/g)||[]).length>=2))return c;
        return null;
    };
    const inputId=extractId(embedInput);
    const hasKey=!!apiKey.trim();

    const play=(id,title)=>{
        setVideoId(id);setErrorMsg('');
        setHistory(prev=>{const old=prev.find(h=>h.id===id);const f=prev.filter(h=>h.id!==id);return[{id,title:title||(old&&old.title)||'',time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})},...f].slice(0,10);});
        // 아래 검색 결과에서 고른 경우 플레이어가 보이도록 올려 준다
        requestAnimationFrame(()=>{const el=playerRef.current;if(el&&el.getBoundingClientRect().top<0)el.scrollIntoView({behavior:'smooth',block:'start'});});
    };

    const runSearch=async(q,{pageToken=null,key=apiKey,level=safe}={})=>{
        key=(key||'').trim();
        if(!key){reqRef.current++;setSearch({q,items:[],next:null,loading:false,error:'',noKey:true});return;}
        const req=++reqRef.current;
        setSearch(s=>pageToken&&s?{...s,loading:true,error:''}:{q,items:[],next:null,loading:true,error:'',noKey:false});
        const NET='인터넷 연결을 확인해 주세요. 검색 서버에 닿지 못했어요.';
        try{
            const p=new URLSearchParams({part:'snippet',type:'video',maxResults:'12',q,safeSearch:level,videoEmbeddable:'true',regionCode:'KR',relevanceLanguage:'ko',key});
            if(pageToken)p.set('pageToken',pageToken);
            const r=await fetch('https://www.googleapis.com/youtube/v3/search?'+p).catch(()=>{throw new Error(NET);});
            const j=await r.json().catch(()=>({}));
            if(!r.ok)throw new Error(ytApiError(j,r.status));
            let items=(j.items||[]).filter(it=>it.id&&it.id.videoId&&it.snippet).map(it=>{const sn=it.snippet,th=sn.thumbnails||{};return{id:it.id.videoId,title:ytText(sn.title),channel:ytText(sn.channelTitle),date:sn.publishedAt,live:sn.liveBroadcastContent==='live',thumb:(th.medium||th.high||th.default||{}).url||`https://i.ytimg.com/vi/${it.id.videoId}/mqdefault.jpg`};});
            // 영상 길이는 따로 받아 붙인다(1단위). 실패해도 결과는 그대로 보여 줌
            if(items.length){try{const v=await fetch('https://www.googleapis.com/youtube/v3/videos?'+new URLSearchParams({part:'contentDetails',id:items.map(i=>i.id).join(','),key}));const vj=v.ok?await v.json():{};const dur={};(vj.items||[]).forEach(x=>{dur[x.id]=ytDuration(x.contentDetails&&x.contentDetails.duration);});items=items.map(i=>({...i,dur:dur[i.id]||''}));}catch(e){}}
            if(req!==reqRef.current)return;
            setSearch(s=>({q,items:pageToken&&s?[...s.items,...items.filter(i=>!s.items.some(o=>o.id===i.id))]:items,next:j.nextPageToken||null,loading:false,error:'',noKey:false}));
        }catch(e){
            if(req!==reqRef.current)return;
            setSearch(s=>({...(s||{items:[],next:null}),q,loading:false,error:e.message||'검색하지 못했어요.',noKey:false}));
        }
    };

    const submit=()=>{
        const t=(inputRef.current?inputRef.current.value:embedInput).trim();
        if(!t)return;
        ps('click');setErrorMsg('');
        const id=extractId(t);
        if(id){play(id);return;}
        if(/^(https?:\/\/|www\.|<iframe)/i.test(t)||/youtu\.?be[.\/]/i.test(t)){
            setErrorMsg("영상 주소를 알아보지 못했어요.\n\n이렇게 생긴 주소를 넣어 주세요:\nhttps://www.youtube.com/watch?v=VIDEO_ID\nhttps://youtu.be/VIDEO_ID\n<iframe> 퍼가기 코드\n\n낱말을 넣으면 영상을 검색해요.");
            return;
        }
        runSearch(t);
    };
    // 유튜브에서 복사한 주소를 붙여 넣으면 [재생]을 누르지 않아도 바로 튼다
    const onPaste=e=>{const t=((e.clipboardData&&e.clipboardData.getData('text'))||'').trim();const id=extractId(t);if(id){e.preventDefault();setEmbedInput(t);ps('click');play(id);}};

    const saveKey=()=>{
        const k=keyDraft.trim();if(!k)return;
        ps('click');ytSave(YT_KEY_STORE,k);setApiKey(k);setKeyDraft('');setShowKey(false);setShowSettings(false);
        if(search&&search.q)runSearch(search.q,{key:k});
    };
    const removeKey=()=>{ps('click');ytSave(YT_KEY_STORE,'');setApiKey('');setConfirmDel(false);if(search&&search.q&&!search.noKey)runSearch(search.q,{key:''});};
    const changeSafe=v=>{
        if(v===safe)return;
        ps('click');setSafe(v);ytSave(YT_SAFE_STORE,v==='strict'?'':v);
        if(search&&search.q&&!search.noKey)runSearch(search.q,{level:v});
    };
    const openSettings=()=>{ps('click');setShowSettings(true);requestAnimationFrame(()=>{const el=playerRef.current;if(el)el.scrollIntoView({behavior:'smooth',block:'start'});});};

    return(<div className="w-full max-w-3xl mx-auto space-y-3">
        <div ref={playerRef} className="yts-player bg-white rounded-2xl p-4 sm:p-5 soft-shadow border-2 border-[#FF6B6B]/20">
            <div className="yts-top">
                <h2 className="text-lg sm:text-xl font-black text-[#4A4A4A] flex items-center gap-2"><Icon name="youtube" size={20} className="text-red-500"/> 유튜브 플레이어</h2>
                <button type="button" onClick={()=>{ps('click');setShowSettings(v=>!v);setConfirmDel(false);}} className={'yts-gear'+(showSettings?' on':'')} aria-expanded={showSettings} title="유튜브 검색 설정"><Icon name={hasKey?'key-round':'settings-2'} size={14}/><span>검색 설정</span>{hasKey&&<span className="yts-dot" title="API 키 저장됨"/>}</button>
            </div>
            <form className="flex gap-2 mb-2" role="search" onSubmit={e=>{e.preventDefault();submit();}}>
                <div className="yts-field">
                    <Icon name={inputId?'link':'search'} size={16} className="yts-ico"/>
                    <input ref={inputRef} type="text" value={embedInput} onChange={e=>setEmbedInput(e.target.value)} onPaste={onPaste} enterKeyHint="search" aria-label="유튜브 검색어 또는 영상 주소" className="w-full p-2.5 pl-9 pr-9 bg-[#FFF5F5] rounded-xl border-2 border-transparent focus:border-red-200 outline-none font-bold text-xs sm:text-sm min-w-0" placeholder="검색어 또는 YouTube 주소·퍼가기 코드"/>
                    {embedInput&&<button type="button" className="yts-clear" onClick={()=>{setEmbedInput('');inputRef.current&&inputRef.current.focus();}} aria-label="입력 지우기"><Icon name="x" size={14}/></button>}
                </div>
                <button type="submit" className="px-4 bg-red-500 text-white rounded-xl font-black shadow-md touch-target active:scale-95 transition-all text-sm shrink-0 flex items-center gap-1.5"><Icon name={inputId?'play':'search'} size={15}/>{inputId?'재생':'검색'}</button>
            </form>
            <p className="yts-hint">{hasKey?<>낱말을 넣으면 이 화면에서 영상을 찾아 줘요 · 주소를 붙여 넣으면 바로 재생 · 안전 검색 {safe==='strict'?'엄격':'보통'}</>:<>주소를 붙여 넣으면 바로 재생돼요 · 검색 결과는 유튜브 새 탭에서 열려요 · <button type="button" onClick={openSettings}>이 화면에서 바로 검색하기</button></>}</p>
            {showSettings&&<div className="yts-settings">
                <div className="yts-set-row">
                    <span className="yts-set-label">API 키</span>
                    {hasKey?<div className="yts-key-state"><Icon name="circle-check" size={15}/><span>저장됨 <code>{apiKey.slice(0,6)}…{apiKey.slice(-4)}</code></span>{confirmDel?<><span className="yts-set-note">지울까요?</span><button type="button" className="yts-mini danger" onClick={removeKey}>지우기</button><button type="button" className="yts-mini" onClick={()=>setConfirmDel(false)}>취소</button></>:<button type="button" className="yts-mini" onClick={()=>setConfirmDel(true)}>키 지우기</button>}</div>
                    :<form className="yts-key-form" onSubmit={e=>{e.preventDefault();saveKey();}}><input type="text" value={keyDraft} onChange={e=>setKeyDraft(e.target.value)} style={showKey?undefined:{WebkitTextSecurity:'disc'}} placeholder="AIza로 시작하는 키 붙여 넣기" aria-label="YouTube API 키" autoComplete="off" spellCheck={false} className="p-2 rounded-lg text-xs sm:text-sm outline-none min-w-0"/><button type="button" className="yts-mini icon" onClick={()=>setShowKey(v=>!v)} aria-label={showKey?'키 가리기':'키 보기'} title={showKey?'키 가리기':'키 보기'}><Icon name={showKey?'eye-off':'eye'} size={14}/></button><button type="submit" className="yts-mini primary" disabled={!keyDraft.trim()}>저장</button></form>}
                </div>
                <div className="yts-set-row">
                    <span className="yts-set-label">안전 검색</span>
                    <div className="yts-seg" role="group" aria-label="안전 검색 수준">{[['strict','엄격'],['moderate','보통']].map(([v,l])=><button type="button" key={v} className={safe===v?'on':''} aria-pressed={safe===v} onClick={()=>changeSafe(v)}>{l}</button>)}</div>
                    <span className="yts-set-note">{safe==='strict'?'수업에 맞지 않는 영상을 최대한 걸러요':'성인용 영상만 걸러요'}</span>
                </div>
                <details className="yts-guide" open={!hasKey}>
                    <summary>API 키 만드는 방법 (무료 · 처음 한 번만)</summary>
                    <ol>
                        <li><a href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank" rel="noopener noreferrer">Google Cloud 콘솔 <Icon name="external-link" size={11}/></a>에 구글 계정으로 들어가 프로젝트를 하나 만들어요.</li>
                        <li><b>YouTube Data API v3</b> 화면에서 <b>사용</b>을 눌러요.</li>
                        <li><b>API 및 서비스 → 사용자 인증 정보 → 사용자 인증 정보 만들기 → API 키</b>로 키를 만들어 위 칸에 붙여 넣어요.</li>
                    </ol>
                    <p>하루에 약 100번 검색할 수 있어요. 키는 이 브라우저에만 저장되고 학급 백업 파일에는 들어가지 않아요. 키 설정의 ‘API 제한사항’에서 YouTube Data API v3만 허용해 두면 더 안전해요.</p>
                </details>
            </div>}
            {errorMsg&&<div className="mb-3 bg-red-50 border border-red-200 rounded-xl p-3 text-xs text-red-500 font-bold whitespace-pre-wrap">{errorMsg}</div>}
            {videoId?(<div className="relative w-full rounded-xl overflow-hidden shadow-lg bg-black" style={{paddingBottom:'56.25%'}}>
                <iframe
                    key={videoId}
                    src={`https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1&playsinline=1&enablejsapi=0`}
                    className="absolute inset-0 w-full h-full"
                    frameBorder="0"
                    referrerPolicy="strict-origin-when-cross-origin"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowFullScreen
                    title="YouTube video player"
                />
            </div>):(!search&&<div className="w-full rounded-xl bg-gray-50 border-2 border-dashed border-gray-200 flex flex-col items-center justify-center py-16 sm:py-24 text-gray-300"><Icon name="play-circle" size={48} className="opacity-30 mb-2"/><span className="font-bold text-sm">검색하거나 주소를 붙여 넣어 영상을 불러오세요</span></div>)}
        </div>
        {search&&<section className="yts-panel" aria-live="polite">
            <div className="yts-panel-head">
                <strong><Icon name="search" size={14}/><span>‘{search.q}’ {search.noKey?'검색':'검색 결과'}</span></strong>
                {!search.noKey&&search.items.length>0&&<span className="yts-count">{search.items.length}개</span>}
                {!search.noKey&&<a className="yts-yt-link" href={ytResultsUrl(search.q)} target="_blank" rel="noopener noreferrer">유튜브에서 보기 <Icon name="external-link" size={12}/></a>}
                <button type="button" className="yts-close" onClick={()=>{reqRef.current++;setSearch(null);}} aria-label="검색 결과 닫기" title="검색 결과 닫기"><Icon name="x" size={15}/></button>
            </div>
            {search.noKey?<div className="yts-nokey">
                <a className="yts-nokey-btn" href={ytResultsUrl(search.q)} target="_blank" rel="noopener noreferrer" onClick={()=>ps('click')}><Icon name="youtube" size={18}/><span>유튜브에서 ‘{search.q}’ 검색 결과 열기</span><Icon name="external-link" size={14}/></a>
                <ol className="yts-steps"><li>새 탭에서 보여 줄 영상을 골라요.</li><li>주소창의 주소나 <b>공유 → 복사</b>로 영상 주소를 복사해요.</li><li>이 화면 위 칸에 붙여 넣으면 바로 재생돼요.</li></ol>
                <p className="yts-nokey-tip">검색 결과를 이 화면에서 바로 고르려면 <button type="button" onClick={openSettings}>검색 설정</button>에서 YouTube API 키를 넣어 주세요.</p>
            </div>:<>
                {search.error&&<div className="yts-error"><Icon name="circle-alert" size={15}/><span>{search.error}</span></div>}
                {search.items.length>0&&<div className="yts-grid">{search.items.map(it=><button type="button" key={it.id} className={'yts-card'+(videoId===it.id?' is-playing':'')} onClick={()=>{ps('click');play(it.id,it.title);}} title={it.title}>
                    <span className="yts-thumb"><img src={it.thumb} alt="" loading="lazy"/>{it.live?<span className="yts-dur live">실시간</span>:it.dur&&<span className="yts-dur">{it.dur}</span>}{videoId===it.id&&<span className="yts-now"><Icon name="play" size={11}/>재생 중</span>}</span>
                    <span className="yts-title">{it.title}</span>
                    <span className="yts-sub">{it.channel}{it.date&&' · '+ytAgo(it.date)}</span>
                </button>)}</div>}
                {search.loading&&<div className="yts-grid" aria-hidden="true">{Array.from({length:search.items.length?3:6},(_,i)=><span key={i} className="yts-card yts-skel"><span className="yts-thumb"/><span className="yts-line"/><span className="yts-line short"/></span>)}</div>}
                {!search.loading&&!search.error&&search.items.length===0&&<p className="yts-empty">검색 결과가 없어요. 다른 낱말로 찾아보세요.</p>}
                {!search.loading&&search.next&&<button type="button" className="yts-more" onClick={()=>{ps('click');runSearch(search.q,{pageToken:search.next});}}>결과 더 보기</button>}
            </>}
        </section>}
        {history.length>0&&<div className="bg-white/80 rounded-xl p-3 soft-shadow border border-gray-100">
            <div className="flex items-center justify-between mb-2"><span className="text-[10px] font-bold text-gray-400">최근 재생</span><button onClick={()=>{ps('click');setHistory([]);}} className="text-[10px] text-red-300 font-bold">전체삭제</button></div>
            <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">{history.map(h=><button key={h.id} onClick={()=>{ps('click');setVideoId(h.id);setErrorMsg('');}} title={h.title?h.title+' · '+h.time:h.time} className="shrink-0 flex items-center gap-1.5 px-2.5 py-1.5 bg-[#FFF5F5] rounded-lg border border-red-100 text-xs font-bold text-gray-600 active:scale-95 touch-target"><Icon name="play" size={11} className="text-red-400"/><span className={h.title?'max-w-[180px] truncate':'max-w-[80px] truncate'}>{h.title||h.time}</span></button>)}</div>
        </div>}
    </div>);
}

// 송쌤과학 업무 도우미 사이트 모음. 색과 아이콘은 각 사이트의 대표색·파비콘 그림과 같게 맞춘다.

    {id:'image',cat:'이미지',name:'이미지 편집기',url:'https://songsamscience.github.io/image-editor/',color:'#3b2b78',
        desc:'배경 지우기부터 얼굴·이름표 가리기까지, 수업 사진 손질을 한곳에서',tags:['배경 지우기','얼굴·이름표 가리기','자르기·크기·여백','서명·도장'],
        icon:"<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='#3b2b78'/><g transform='translate(4 4)' fill='none' stroke='#ece7ff' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2'/><path d='M8.5 2h7'/><path d='M7 16h10'/></g></svg>"},
