<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Do+Hyeon&family=Gamja+Flower&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{font-family:'Jua',sans-serif;background:#F8F6F1;background-image:radial-gradient(circle at 20% 80%,rgba(181,234,215,.15) 0%,transparent 50%),radial-gradient(circle at 80% 20%,rgba(255,183,178,.12) 0%,transparent 50%),radial-gradient(#E8DDD0 .8px,transparent .8px);background-size:100% 100%,100% 100%,20px 20px;color:#4A4A4A;touch-action:manipulation;overflow-x:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;margin:0;padding:0;}
        ::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:#DDD4C8;border-radius:2px;}
        .no-scrollbar::-webkit-scrollbar{display:none;}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
        .card-enter{animation:cardPop .4s cubic-bezier(.34,1.56,.64,1);}
        @keyframes cardPop{from{opacity:0;transform:scale(.92) translateY(16px)}to{opacity:1;transform:scale(1) translateY(0)}}
        .winner-pulse{animation:winPulse 1.5s infinite;}
        @keyframes winPulse{0%{box-shadow:0 0 0 0 rgba(255,138,128,.6);transform:scale(1.1)}70%{box-shadow:0 0 0 14px rgba(255,138,128,0);transform:scale(1.1)}100%{box-shadow:0 0 0 0 rgba(255,138,128,0);transform:scale(1.1)}}
        .highlight-anim{transition:all .08s;transform:scale(1.14);background:#B5EAD7!important;border-color:#7ECDB0!important;color:#1B5E3F!important;z-index:10;}
        .selected-item{border-color:#FF8A80!important;background:#FFF0F0!important;color:#E53935!important;transform:scale(.95);border-style:dashed!important;animation:bDance 1s infinite linear;}
        @keyframes bDance{0%{border-color:#FF8A80}50%{border-color:#FFDAC1}100%{border-color:#FF8A80}}
        .glass-panel{background:rgba(255,255,255,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.6);box-shadow:0 1px 8px rgba(0,0,0,.04);}
        .soft-shadow{box-shadow:0 2px 12px rgba(0,0,0,.04),0 .5px 2px rgba(0,0,0,.06);}
        .center-content{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;height:100%;line-height:1;word-break:keep-all;}
        .timer-circle{transition:stroke-dashoffset 1s linear;}
        footer{font-family:'Do Hyeon',sans-serif;}
        .mini-float{animation:miniIn .35s cubic-bezier(.34,1.56,.64,1);}
        @keyframes miniIn{from{opacity:0;transform:scale(.5) translateY(8px)}to{opacity:1;transform:scale(1) translateY(0)}}
        .mini-pulse{animation:mPulse 2s infinite;}
        @keyframes mPulse{0%,100%{box-shadow:0 2px 10px rgba(255,183,178,.25)}50%{box-shadow:0 2px 18px rgba(255,183,178,.55)}}
        .t-input{background:transparent;border:none;outline:none;text-align:center;font-family:'Jua',sans-serif;caret-color:#FFDAC1;}
        .t-input:focus{background:rgba(255,218,193,.12);border-radius:10px;}
        .t-input::-webkit-inner-spin-button,.t-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.t-input{-moz-appearance:textfield;}
        .modal-up{animation:mUp .3s cubic-bezier(.34,1.56,.64,1);}
        @keyframes mUp{from{opacity:0;transform:translateY(30px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
        .touch-target{min-height:44px;min-width:44px;}
        .safe-b{padding-bottom:max(env(safe-area-inset-bottom,0px),8px);}
        .excluded-badge{display:inline-flex;align-items:center;gap:2px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:bold;background:#FFF0F0;color:#FF8A80;border:1.5px solid #FFD6D2;}
        .excluded-cell{background:repeating-linear-gradient(135deg,#F8F8F8,#F8F8F8 3px,#F0F0F0 3px,#F0F0F0 6px)!important;color:#CCC!important;border-color:#E8E8E8!important;cursor:default!important;pointer-events:none;}
        .intro-bg{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#FFF5F2 0%,#F0FAF5 40%,#F5F3FF 100%);position:relative;overflow:hidden;}
        .intro-bg::before{content:'';position:absolute;top:-60%;right:-30%;width:600px;height:600px;background:radial-gradient(circle,rgba(255,183,178,.18) 0%,transparent 70%);border-radius:50%;pointer-events:none;}
        .intro-bg::after{content:'';position:absolute;bottom:-40%;left:-20%;width:500px;height:500px;background:radial-gradient(circle,rgba(181,234,215,.18) 0%,transparent 70%);border-radius:50%;pointer-events:none;}
        .intro-card{background:rgba(255,255,255,.92);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.8);animation:introIn .6s cubic-bezier(.34,1.56,.64,1);}
        @keyframes introIn{from{opacity:0;transform:scale(.9) translateY(24px)}to{opacity:1;transform:scale(1) translateY(0)}}
        .intro-icon{animation:gentleBounce 3s ease-in-out infinite;}
        @keyframes gentleBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
        .input-glow:focus{box-shadow:0 0 0 4px rgba(255,183,178,.2);}
        .nav-pill{display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:14px;transition:all .2s;flex-shrink:0;width:46px;height:52px;gap:1px;-webkit-user-select:none;user-select:none;}
        @media(min-width:640px){.nav-pill{width:58px;height:58px;gap:2px}}
        @media(min-width:768px){.nav-pill{flex-direction:row;width:auto;height:auto;padding:10px 14px;gap:6px}}
        .nav-pill.active{background:#FFB7B2;color:#fff;box-shadow:0 3px 12px rgba(255,183,178,.35);transform:scale(1.05);}
        .nav-pill:not(.active){color:#A0A0A0}.nav-pill:not(.active):hover{background:rgba(255,255,255,.8);color:#FFB7B2;}
        .sound-toggle{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:11px;font-weight:bold;cursor:pointer;transition:all .2s;-webkit-user-select:none;user-select:none;}
        .sound-toggle.on{background:#E2F0CB;color:#6B8E23;border:1.5px solid #D4E8B4;}
        .sound-toggle.off{background:#F0F0F0;color:#AAA;border:1.5px solid #E0E0E0;}
        .student-cell{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:900;border:2px solid #EDE6DA;background:#fff;color:#5D5D5D;transition:all .12s;cursor:default;position:relative;overflow:hidden;font-size:14px;}

        .student-cell.winner{background:#FFB7B2;border-color:#FF9E99;color:#fff;z-index:20;}
        .rec-pulse{animation:recPulse 1.2s ease-in-out infinite;}
        @keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,.4)}50%{box-shadow:0 0 0 12px rgba(239,68,68,0)}}
        .clock-face{font-variant-numeric:tabular-nums;letter-spacing:-1px;}
        .cal-day{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:bold;font-size:13px;transition:all .15s;}
        @media(min-width:640px){.cal-day{width:42px;height:42px;font-size:14px}}
        .cal-today{background:#FFB7B2;color:#fff;font-weight:900;box-shadow:0 2px 8px rgba(255,183,178,.35);}
        .cal-sun{color:#FF6B6B}.cal-sat{color:#64B5F6;}
        @keyframes barBounce{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
        audio{max-width:100%;border-radius:8px;}
        audio::-webkit-media-controls-panel{background:#f9f9f9;}
        /* 돌림판 styles */
        .wheel-container{position:relative;display:inline-flex;align-items:center;justify-content:center;}
        .wheel-pointer{position:absolute;top:-8px;left:50%;transform:translateX(-50%);z-index:20;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2));}
        .wheel-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:15;width:44px;height:44px;border-radius:50%;background:white;box-shadow:0 2px 12px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;}
        @media(min-width:640px){.wheel-center{width:56px;height:56px;}}
        .wheel-result-pop{animation:resultPop .5s cubic-bezier(.34,1.56,.64,1);}
        @keyframes resultPop{from{opacity:0;transform:scale(.5) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
        .color-dot{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .15s;flex-shrink:0;}
        .color-dot:hover{transform:scale(1.15);}
        .color-dot.active{border-color:#4A4A4A;transform:scale(1.15);box-shadow:0 2px 8px rgba(0,0,0,.15);}
        /* 로또 styles */
        .lotto-ball{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#fff;box-shadow:inset 0 -4px 8px rgba(0,0,0,.15),0 4px 12px rgba(0,0,0,.12);position:relative;overflow:hidden;}
        @media(min-width:640px){.lotto-ball{width:64px;height:64px;font-size:24px;}}
        .lotto-ball::before{content:'';position:absolute;top:6px;left:50%;transform:translateX(-50%);width:60%;height:30%;background:rgba(255,255,255,.35);border-radius:50%;filter:blur(2px);}
        .lotto-slot{width:52px;height:52px;border-radius:50%;background:#F0F0F0;border:3px dashed #DDD;display:flex;align-items:center;justify-content:center;}
        @media(min-width:640px){.lotto-slot{width:64px;height:64px;}}
        .lotto-rolling{animation:lottoRoll .1s linear infinite;}
        @keyframes lottoRoll{0%{transform:translateY(-2px)}50%{transform:translateY(2px)}100%{transform:translateY(-2px)}}
        .lotto-pop{animation:lottoPop .5s cubic-bezier(.34,1.56,.64,1);}
        @keyframes lottoPop{from{opacity:0;transform:scale(0) rotate(-180deg)}to{opacity:1;transform:scale(1) rotate(0deg)}}
        .lotto-machine{background:linear-gradient(180deg,#2D2D3F 0%,#1a1a2e 100%);border-radius:24px;padding:24px;position:relative;overflow:hidden;}
        .lotto-machine::before{content:'';position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.06) 0%,transparent 100%);pointer-events:none;}
        .lotto-glass{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.1);border-radius:16px;padding:20px;backdrop-filter:blur(10px);}
        .lotto-bounce{animation:lottoBounce .4s ease-out;}
        @keyframes lottoBounce{0%{transform:translateY(-20px);opacity:0}60%{transform:translateY(4px)}100%{transform:translateY(0);opacity:1}}
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo,useCallback}=React;

const Icon=({name,size=24,className=""})=>{const ref=useRef(null);useEffect(()=>{if(window.lucide&&ref.current){ref.current.innerHTML='';const i=document.createElement('i');i.setAttribute('data-lucide',name);i.setAttribute('class',className);ref.current.appendChild(i);window.lucide.createIcons({root:ref.current,nameAttr:'data-lucide',attrs:{width:size,height:size}});}},[name,size,className]);return <span ref={ref} className="inline-flex items-center justify-center"/>;};
const Copyright=({fixed})=>(<footer className={`w-full text-center py-4 text-[10px] text-gray-400 font-bold tracking-widest uppercase ${fixed?'fixed bottom-0 left-0 bg-white/50 backdrop-blur-sm safe-b':'mt-6'}`}>ⓒ 송쌤과학 Class Helper</footer>);

function SystemModal({modal,closeModal}){
    return(<div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4"><div className="modal-up bg-white p-5 sm:p-7 rounded-2xl shadow-2xl max-w-xs sm:max-w-sm w-full text-center border-4 border-[#FFB7B2]"><p className="text-base sm:text-lg font-bold text-gray-700 mb-5 whitespace-pre-wrap leading-relaxed">{modal.msg}</p><div className="flex gap-2 justify-center">{modal.type==='confirm'&&<button onClick={closeModal} className="flex-1 py-2.5 bg-gray-100 rounded-xl font-bold text-gray-500 touch-target">취소</button>}<button onClick={()=>{if(modal.action)modal.action();closeModal();}} className="flex-1 py-2.5 bg-[#FFB7B2] rounded-xl font-bold text-white touch-target">확인</button></div></div></div>);
}

function ExcludeBar({excludedInput,setExcludedInput,excludedNums,totalCount,accentColor,playSound}){
    const activeCount=totalCount-excludedNums.length;
    return(<div className="bg-white/80 backdrop-blur rounded-xl p-2.5 border border-gray-100 soft-shadow"><div className="flex items-center gap-2"><div className="shrink-0 p-1.5 rounded-lg" style={{background:accentColor+'22'}}><Icon name="user-minus" size={15}/></div><input type="text" value={excludedInput} onChange={e=>setExcludedInput(e.target.value)} className="flex-1 p-2 bg-[#F7F7F7] rounded-lg border-2 border-transparent focus:border-gray-200 outline-none font-bold text-xs min-w-0" placeholder="제외 번호 (예: 3, 7, 15)"/>{excludedNums.length>0&&<button onClick={()=>{playSound('click');setExcludedInput('');}} className="shrink-0 p-1.5 text-gray-300 hover:text-red-400 touch-target"><Icon name="x" size={14}/></button>}</div>{excludedNums.length>0&&<div className="mt-2 flex flex-wrap items-center gap-1.5"><span className="text-[10px] text-gray-400 font-bold shrink-0">제외:</span>{excludedNums.map(n=><span key={n} className="excluded-badge">{n}번</span>)}<span className="ml-auto text-[10px] font-bold" style={{color:accentColor}}>참여 {activeCount}명</span></div>}</div>);
}

function SoundToggle({isSoundOn,setIsSoundOn,playSound}){
    return(<button onClick={()=>{if(!isSoundOn)playSound('click');setIsSoundOn(!isSoundOn);}} className={`sound-toggle ${isSoundOn?'on':'off'}`}><Icon name={isSoundOn?"volume-2":"volume-x"} size={13}/>소리 {isSoundOn?"ON":"OFF"}</button>);
}

function LiveClock({size='lg'}){
    const [now,setNow]=useState(new Date());
    useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(t);},[]);
    const h=now.getHours(),m=now.getMinutes(),s=now.getSeconds();
    const period=h>=12?'오후':'오전';const h12=h%12||12;
    const dateStr=`${now.getFullYear()}. ${now.getMonth()+1}. ${now.getDate()}. ${['일','월','화','수','목','금','토'][now.getDay()]}요일`;
    if(size==='md') return(<div className="text-center"><div className="text-sm font-bold text-gray-400 mb-1">{period}</div><div className="text-3xl sm:text-5xl font-black text-[#4A4A4A] clock-face">{String(h12).padStart(2,'0')}:{String(m).padStart(2,'0')}<span className="text-xl sm:text-3xl text-gray-300 ml-0.5">:{String(s).padStart(2,'0')}</span></div><div className="text-xs font-bold text-gray-400 mt-1.5">{dateStr}</div></div>);
    return(<div className="text-center"><div className="text-base font-bold text-gray-400 mb-1">{period}</div><div className="text-5xl sm:text-7xl font-black text-[#4A4A4A] clock-face">{String(h12).padStart(2,'0')}:{String(m).padStart(2,'0')}<span className="text-3xl sm:text-5xl text-gray-300 ml-1">:{String(s).padStart(2,'0')}</span></div><div className="text-sm font-bold text-gray-400 mt-2">{now.getFullYear()}년 {now.getMonth()+1}월 {now.getDate()}일 {['일','월','화','수','목','금','토'][now.getDay()]}요일</div></div>);
}

function CalendarWidget(){
    const today=new Date();const [year,setYear]=useState(today.getFullYear());const [month,setMonth]=useState(today.getMonth());
    const firstDay=new Date(year,month,1).getDay();const daysInMonth=new Date(year,month+1,0).getDate();
    const prev=()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);};
    const next=()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);};
    const goToday=()=>{setYear(today.getFullYear());setMonth(today.getMonth());};
    const isToday=d=>d===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
    const days=[];for(let i=0;i<firstDay;i++)days.push(null);for(let d=1;d<=daysInMonth;d++)days.push(d);
    return(<div className="bg-white rounded-2xl p-4 sm:p-5 soft-shadow border border-gray-100 max-w-sm mx-auto w-full"><div className="flex items-center justify-between mb-4"><button onClick={prev} className="p-2 rounded-lg hover:bg-gray-100 touch-target"><Icon name="chevron-left" size={18}/></button><div className="text-center cursor-pointer" onClick={goToday}><span className="text-lg sm:text-xl font-black text-[#4A4A4A]">{year}년 {month+1}월</span></div><button onClick={next} className="p-2 rounded-lg hover:bg-gray-100 touch-target"><Icon name="chevron-right" size={18}/></button></div><div className="grid grid-cols-7 gap-1 mb-2">{['일','월','화','수','목','금','토'].map((d,i)=><div key={d} className={`text-center text-[11px] font-bold py-1 ${i===0?'text-red-400':i===6?'text-blue-400':'text-gray-400'}`}>{d}</div>)}</div><div className="grid grid-cols-7 gap-1">{days.map((d,i)=>d?<div key={i} className={`cal-day ${isToday(d)?'cal-today':i%7===0?'cal-sun':i%7===6?'cal-sat':'text-gray-600'} ${!isToday(d)?'hover:bg-gray-100':''}`}>{d}</div>:<div key={i}/>)}</div><div className="mt-3 text-center"><button onClick={goToday} className="text-[10px] font-bold text-[#FFB7B2] hover:underline">오늘로 이동</button></div></div>);
}

function RecorderWidget({playSound:ps}){
    const [isRecording,setIsRecording]=useState(false);
    const [isPaused,setIsPaused]=useState(false);
    const [elapsed,setElapsed]=useState(0);
    const [recordings,setRecordings]=useState([]);
    const [isConverting,setIsConverting]=useState(false);
    const mediaRecRef=useRef(null);
    const chunksRef=useRef([]);
    const timerRef=useRef(null);
    const streamRef=useRef(null);
    const elapsedRef=useRef(0);

    useEffect(()=>{return()=>{if(streamRef.current)streamRef.current.getTracks().forEach(t=>t.stop());clearInterval(timerRef.current);};},[]);

    const toWav=(blob)=>new Promise((resolve,reject)=>{
        const reader=new FileReader();
        reader.onload=async()=>{
            try{
                const ctx=new(window.AudioContext||window.webkitAudioContext)();
                const buf=await ctx.decodeAudioData(reader.result);
                ctx.close();
                const nCh=1,sr=buf.sampleRate,samples=buf.getChannelData(0);
                const len=samples.length;
                const wavBuf=new ArrayBuffer(44+len*2);
                const v=new DataView(wavBuf);
                const writeStr=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i));};
                writeStr(0,'RIFF');v.setUint32(4,36+len*2,true);writeStr(8,'WAVE');
                writeStr(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,nCh,true);
                v.setUint32(24,sr,true);v.setUint32(28,sr*nCh*2,true);v.setUint16(32,nCh*2,true);v.setUint16(34,16,true);
                writeStr(36,'data');v.setUint32(40,len*2,true);
                let off=44;
                for(let i=0;i<len;i++,off+=2){const s=Math.max(-1,Math.min(1,samples[i]));v.setInt16(off,s<0?s*0x8000:s*0x7FFF,true);}
                resolve(new Blob([wavBuf],{type:'audio/wav'}));
            }catch(e){reject(e);}
        };
        reader.onerror=reject;
        reader.readAsArrayBuffer(blob);
    });

    const startRecording=async()=>{
        try{
            const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,sampleRate:44100}});
            streamRef.current=stream;
            const mimeType=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'';
            const opts=mimeType?{mimeType}:{};
            const mr=new MediaRecorder(stream,opts);
            mediaRecRef.current=mr;chunksRef.current=[];
            mr.ondataavailable=e=>{if(e.data.size>0)chunksRef.current.push(e.data);};
            mr.onstop=async()=>{
                const webmBlob=new Blob(chunksRef.current,{type:mr.mimeType||'audio/webm'});
                const now=new Date();
                const name=`녹음_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}${String(now.getMinutes()).padStart(2,'0')}${String(now.getSeconds()).padStart(2,'0')}`;
                setIsConverting(true);
                try{
                    const wavBlob=await toWav(webmBlob);
                    const url=URL.createObjectURL(wavBlob);
                    const dur=elapsedRef.current;
                    setRecordings(prev=>[{id:Date.now(),url,name,duration:dur,blob:wavBlob,ext:'wav'},...prev]);
                    const a=document.createElement('a');a.href=url;a.download=name+'.wav';document.body.appendChild(a);a.click();document.body.removeChild(a);
                }catch(err){
                    console.warn('WAV 변환 실패, 원본 저장:',err);
                    const url=URL.createObjectURL(webmBlob);
                    setRecordings(prev=>[{id:Date.now(),url,name,duration:elapsedRef.current,blob:webmBlob,ext:'webm'},...prev]);
                    const a=document.createElement('a');a.href=url;a.download=name+'.webm';document.body.appendChild(a);a.click();document.body.removeChild(a);
                }
                setIsConverting(false);
                stream.getTracks().forEach(t=>t.stop());streamRef.current=null;
            };
            mr.start(250);
            setIsRecording(true);setIsPaused(false);setElapsed(0);elapsedRef.current=0;
            timerRef.current=setInterval(()=>{elapsedRef.current++;setElapsed(e=>e+1);},1000);
            ps('click');
        }catch(e){alert("마이크 권한을 허용해주세요.\n\n브라우저 설정 > 사이트 설정 > 마이크 에서 '허용'으로 변경 후 다시 시도하세요.");}
    };
    const pauseRec=()=>{if(mediaRecRef.current?.state==='recording'){mediaRecRef.current.pause();setIsPaused(true);clearInterval(timerRef.current);ps('click');}};
    const resumeRec=()=>{if(mediaRecRef.current?.state==='paused'){mediaRecRef.current.resume();setIsPaused(false);timerRef.current=setInterval(()=>{elapsedRef.current++;setElapsed(e=>e+1);},1000);ps('click');}};
    const stopRec=()=>{if(mediaRecRef.current?.state!=='inactive'){mediaRecRef.current.stop();setIsRecording(false);setIsPaused(false);clearInterval(timerRef.current);ps('win');}};
    const dlRec=r=>{const a=document.createElement('a');a.href=r.url;a.download=r.name+'.'+r.ext;document.body.appendChild(a);a.click();document.body.removeChild(a);};
    const delRec=id=>{setRecordings(prev=>{const t=prev.find(r=>r.id===id);if(t?.url)URL.revokeObjectURL(t.url);return prev.filter(r=>r.id!==id);});ps('click');};
    const fmt=s=>`${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;

    return(<div className="w-full max-w-lg mx-auto space-y-4">
        <div className="bg-white rounded-2xl p-5 sm:p-7 soft-shadow border-2 border-[#FFCDD2] text-center">
            <h2 className="text-lg sm:text-xl font-black text-[#4A4A4A] mb-1 flex items-center justify-center gap-2"><Icon name="mic" size={20}/> 음성 녹음</h2>
            <p className="text-[10px] text-gray-400 font-bold mb-5">녹음 완료 시 WAV 파일로 자동 다운로드</p>
            <div className={`text-4xl sm:text-6xl font-black clock-face mb-2 ${isRecording&&!isPaused?'text-red-500':'text-[#4A4A4A]'}`}>{fmt(elapsed)}</div>
            {(isRecording||elapsed>0)&&<p className="text-[11px] font-bold text-gray-400 mb-4">예상 용량 <span className="text-gray-600">{((44100*2*elapsed)/1024/1024).toFixed(1)} MB</span></p>}
            {isRecording&&!isPaused&&<div className="flex items-center justify-center gap-[3px] mb-5 h-8">{Array.from({length:24}).map((_,i)=><div key={i} className="w-[3px] bg-red-400 rounded-full origin-bottom" style={{height:'24px',animation:`barBounce ${.4+Math.random()*.4}s ease-in-out infinite`,animationDelay:`${i*.04}s`}}/>)}</div>}
            {isRecording&&isPaused&&<div className="flex items-center justify-center gap-2 mb-5 h-8 text-gray-400 font-bold text-sm"><span className="animate-pulse">⏸</span> 일시정지</div>}
            {!isRecording&&!isConverting&&<div className="h-8 mb-5"/>}
            {isConverting&&<div className="flex items-center justify-center gap-2 mb-5 h-8 text-blue-500 font-bold text-sm"><Icon name="loader-2" size={16} className="animate-spin"/> WAV 변환 중...</div>}
            <div className="flex gap-3 justify-center flex-wrap">
                {!isRecording?<button onClick={startRecording} disabled={isConverting} className="flex items-center gap-2 px-6 py-3.5 bg-red-500 hover:bg-red-600 text-white rounded-full text-base font-black shadow-lg shadow-red-500/25 active:scale-95 touch-target transition-all disabled:opacity-50"><Icon name="mic" size={20}/> 녹음 시작</button>:<>
                    {!isPaused?<button onClick={pauseRec} className="px-5 py-3.5 bg-yellow-500 text-white rounded-full font-black shadow-lg active:scale-95 touch-target transition-all flex items-center gap-1.5"><Icon name="pause" size={18}/> 일시정지</button>:<button onClick={resumeRec} className="px-5 py-3.5 bg-green-500 text-white rounded-full font-black shadow-lg active:scale-95 touch-target transition-all flex items-center gap-1.5"><Icon name="play" size={18}/> 계속</button>}
                    <button onClick={stopRec} className={`px-5 py-3.5 bg-[#FFB7B2] text-white rounded-full font-black shadow-lg active:scale-95 touch-target transition-all flex items-center gap-1.5 ${isRecording&&!isPaused?'rec-pulse':''}`}><Icon name="square" size={18}/> 녹음 완료</button>
                </>}
            </div>
        </div>
        <div className="bg-[#FFF8E1] rounded-xl p-3 border border-[#FFE082] flex items-start gap-2">
            <div className="shrink-0 mt-0.5"><Icon name="clock" size={16} className="text-[#FFA000]"/></div>
            <div className="text-[11px] text-gray-600 font-bold leading-relaxed">
                <p>안정적인 녹음을 위해 <span className="text-[#E65100]">최대 10분 이내</span>로 녹음하는 것을 권장합니다.</p>
                <p className="mt-0.5 text-gray-400">긴 녹음은 WAV 변환 시 메모리 부족으로 실패할 수 있습니다. (10분 ≈ 약 53MB)</p>
            </div>
        </div>
        <div className="bg-[#F0F8FF] rounded-xl p-3 border border-[#D6EBFF] flex items-start gap-2">
            <div className="shrink-0 mt-0.5"><Icon name="shield-check" size={16} className="text-blue-400"/></div>
            <div className="text-[11px] text-gray-500 font-bold leading-relaxed">
                <p>녹음 파일은 서버에 저장되지 않으며, 사용자의 기기에서만 처리됩니다.</p>
                <p className="mt-0.5 text-gray-400">브라우저 탭을 닫거나 페이지를 새로고침하면 녹음 파일이 자동으로 삭제됩니다.</p>
            </div>
        </div>
        {recordings.length>0&&<div className="space-y-2">
            <h3 className="text-sm font-black text-gray-500 px-1">녹음 목록 ({recordings.length})</h3>
            {recordings.map(rec=><div key={rec.id} className="bg-white rounded-xl p-3 soft-shadow border border-gray-100 flex items-center gap-3">
                <div className="shrink-0 p-2 bg-red-50 rounded-lg text-red-400"><Icon name="file-audio" size={18}/></div>
                <div className="flex-1 min-w-0">
                    <p className="text-xs font-bold text-gray-600 truncate">{rec.name}.{rec.ext}</p>
                    <p className="text-[10px] text-gray-400 font-bold">{fmt(rec.duration)}</p>
                    <audio controls controlsList="nodownload" preload="metadata" className="w-full mt-1.5 h-8"><source src={rec.url} type={`audio/${rec.ext}`}/></audio>
                </div>
                <div className="flex flex-col gap-1 shrink-0">
                    <button onClick={()=>dlRec(rec)} className="p-1.5 text-blue-400 hover:bg-blue-50 rounded-lg touch-target"><Icon name="download" size={16}/></button>
                    <button onClick={()=>delRec(rec.id)} className="p-1.5 text-red-300 hover:bg-red-50 rounded-lg touch-target"><Icon name="trash-2" size={16}/></button>
                </div>
            </div>)}
        </div>}
    </div>);
}

function YouTubePlayer({playSound:ps}){
    const [embedInput,setEmbedInput]=useState('');
    const [videoId,setVideoId]=useState(null);
    const [history,setHistory]=useState([]);
    const [errorMsg,setErrorMsg]=useState('');

    const extractId=input=>{
        const c=input.trim();
        let m=c.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|shorts\/|live\/|watch\?v=|watch\?.+&v=))([a-zA-Z0-9_-]{11})/);
        if(m)return m[1];
        m=c.match(/src=["'](?:https?:)?\/\/(?:www\.)?(?:youtube\.com|youtube-nocookie\.com)\/embed\/([a-zA-Z0-9_-]{11})/i);
        if(m)return m[1];
        if(/^[a-zA-Z0-9_-]{11}$/.test(c))return c;
        return null;
    };

    const loadVideo=()=>{
        if(!embedInput.trim())return;
        ps('click');setErrorMsg('');
        const id=extractId(embedInput.trim());
        if(id){
            setVideoId(id);
            setHistory(prev=>{const f=prev.filter(h=>h.id!==id);return[{id,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})},...f].slice(0,10);});
        }else{
            setVideoId(null);
            setErrorMsg("올바른 YouTube URL 또는 임베드 코드를 입력해주세요.\n\n예시:\nhttps://www.youtube.com/watch?v=VIDEO_ID\nhttps://youtu.be/VIDEO_ID\n<iframe> 임베드 코드");
        }
    };

    return(<div className="w-full max-w-3xl mx-auto space-y-3">
        <div className="bg-white rounded-2xl p-4 sm:p-5 soft-shadow border-2 border-[#FF6B6B]/20">
            <h2 className="text-lg sm:text-xl font-black text-[#4A4A4A] mb-3 flex items-center justify-center gap-2"><Icon name="youtube" size={20} className="text-red-500"/> 유튜브 플레이어</h2>
            <div className="flex gap-2 mb-2">
                <input type="text" value={embedInput} onChange={e=>setEmbedInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&loadVideo()} className="flex-1 p-2.5 bg-[#FFF5F5] rounded-xl border-2 border-transparent focus:border-red-200 outline-none font-bold text-xs sm:text-sm min-w-0" placeholder="YouTube URL 또는 임베드 코드 붙여넣기"/>
                <button onClick={loadVideo} className="px-4 bg-red-500 text-white rounded-xl font-black shadow-md touch-target active:scale-95 transition-all text-sm shrink-0">재생</button>
            </div>
            <p className="text-[10px] text-gray-400 font-bold mb-3 px-1">YouTube 링크, 공유 URL, 또는 &lt;iframe&gt; 임베드 코드를 입력하세요</p>
            {errorMsg&&<div className="mb-3 bg-red-50 border border-red-200 rounded-xl p-3 text-xs text-red-500 font-bold whitespace-pre-wrap">{errorMsg}</div>}
            {videoId?(<div className="relative w-full rounded-xl overflow-hidden shadow-lg bg-black" style={{paddingBottom:'56.25%'}}>
                <iframe
                    key={videoId}
                    src={`https://www.youtube.com/embed/${videoId}?rel=0&modestbranding=1&playsinline=1&enablejsapi=0`}
                    className="absolute inset-0 w-full h-full"
                    frameBorder="0"
                    referrerPolicy="strict-origin-when-cross-origin"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowFullScreen
                    title="YouTube video player"
                />
            </div>):(<div className="w-full rounded-xl bg-gray-50 border-2 border-dashed border-gray-200 flex flex-col items-center justify-center py-16 sm:py-24 text-gray-300"><Icon name="play-circle" size={48} className="opacity-30 mb-2"/><span className="font-bold text-sm">영상을 불러와주세요</span></div>)}
        </div>
        {history.length>0&&<div className="bg-white/80 rounded-xl p-3 soft-shadow border border-gray-100">
            <div className="flex items-center justify-between mb-2"><span className="text-[10px] font-bold text-gray-400">최근 재생</span><button onClick={()=>{ps('click');setHistory([]);}} className="text-[10px] text-red-300 font-bold">전체삭제</button></div>
            <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">{history.map(h=><button key={h.id} onClick={()=>{ps('click');setVideoId(h.id);setErrorMsg('');}} className="shrink-0 flex items-center gap-1.5 px-2.5 py-1.5 bg-[#FFF5F5] rounded-lg border border-red-100 text-xs font-bold text-gray-600 active:scale-95 touch-target"><Icon name="play" size={11} className="text-red-400"/><span className="max-w-[80px] truncate">{h.time}</span></button>)}</div>
        </div>}
    </div>);
}

/* ══════════════════════════════════════════
   ▼ 돌림판 (Spinning Wheel) - BUG FIXED
   ══════════════════════════════════════════ */
const WHEEL_COLORS=['#FF6B6B','#FECA57','#48DBFB','#FF9FF3','#54A0FF','#5F27CD','#01A3A4','#F368E0','#FF6348','#2ED573','#FFA502','#3742FA','#EE5A24','#7BED9F','#E056CF','#6C5CE7'];

function SpinWheel({playSound:ps,isSoundOn}){
    const [itemsInput,setItemsInput]=useState('');
    const [items,setItems]=useState([]);
    const [isSpinning,setIsSpinning]=useState(false);
    const [rotation,setRotation]=useState(0);
    const [result,setResult]=useState(null);
    const [history,setHistory]=useState([]);
    const canvasRef=useRef(null);
    const audioCtxRef=useRef(null);
    const spinTimerRef=useRef(null);
    const tickCountRef=useRef(0);

    const getAudioCtx=()=>{
        if(!audioCtxRef.current)audioCtxRef.current=new(window.AudioContext||window.webkitAudioContext)();
        if(audioCtxRef.current.state==='suspended')audioCtxRef.current.resume();
        return audioCtxRef.current;
    };

    const playTickSound=useCallback(()=>{
        if(!isSoundOn)return;
        const ctx=getAudioCtx();const t=ctx.currentTime;
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type='sine';
        const pitch=600+Math.random()*200;
        o.frequency.setValueAtTime(pitch,t);
        g.gain.setValueAtTime(.06,t);
        g.gain.exponentialRampToValueAtTime(.001,t+.05);
        o.start(t);o.stop(t+.06);
    },[isSoundOn]);

    const playFanfare=useCallback(()=>{
        if(!isSoundOn)return;
        const ctx=getAudioCtx();const t=ctx.currentTime;
        const notes=[523.25,659.25,783.99,1046.5,1318.5,1046.5];
        notes.forEach((f,i)=>{
            const o=ctx.createOscillator(),g=ctx.createGain();
            o.connect(g);g.connect(ctx.destination);
            o.type=i<4?'sine':'triangle';
            o.frequency.setValueAtTime(f,t+i*.12);
            g.gain.setValueAtTime(0,t+i*.12);
            g.gain.linearRampToValueAtTime(.1,t+i*.12+.04);
            g.gain.exponentialRampToValueAtTime(.001,t+i*.12+.6);
            o.start(t+i*.12);o.stop(t+i*.12+.6);
        });
    },[isSoundOn]);

    const parseItems=()=>{
        const list=itemsInput.split(/[\n,\t]+/).map(s=>s.trim()).filter(s=>s).slice(0,60);
        if(list.length<2)return null;
        return list;
    };

    const applyItems=()=>{
        const list=parseItems();
        if(!list)return;
        ps('click');
        setItems(list);
        setResult(null);
        setRotation(0);
    };

    // Draw wheel on canvas
    useEffect(()=>{
        const canvas=canvasRef.current;
        if(!canvas||items.length<2)return;
        const ctx=canvas.getContext('2d');
        const size=canvas.width;
        const cx=size/2,cy=size/2,r=size/2-4;
        const n=items.length;
        const arc=2*Math.PI/n;

        ctx.clearRect(0,0,size,size);

        ctx.save();
        ctx.shadowColor='rgba(0,0,0,.1)';
        ctx.shadowBlur=20;
        ctx.beginPath();
        ctx.arc(cx,cy,r,0,2*Math.PI);
        ctx.fill();
        ctx.restore();

        for(let i=0;i<n;i++){
            const startAngle=i*arc-Math.PI/2;
            const endAngle=(i+1)*arc-Math.PI/2;
            ctx.beginPath();
            ctx.moveTo(cx,cy);
            ctx.arc(cx,cy,r,startAngle,endAngle);
            ctx.closePath();
            ctx.fillStyle=WHEEL_COLORS[i%WHEEL_COLORS.length];
            ctx.fill();
            ctx.strokeStyle='rgba(255,255,255,.5)';
            ctx.lineWidth=1.5;
            ctx.stroke();

            ctx.save();
            ctx.translate(cx,cy);
            ctx.rotate(startAngle+arc/2);
            ctx.fillStyle='#fff';
            ctx.font=`bold ${n>20?10:n>12?12:14}px 'Jua',sans-serif`;
            ctx.textAlign='center';
            ctx.textBaseline='middle';
            const textR=r*(n>20?.62:.58);
            const label=items[i].length>(n>20?5:8)?items[i].slice(0,(n>20?4:7))+'…':items[i];
            ctx.fillText(label,textR,0);
            ctx.restore();
        }

        ctx.beginPath();
        ctx.arc(cx,cy,r,0,2*Math.PI);
        ctx.strokeStyle='rgba(255,255,255,.8)';
        ctx.lineWidth=3;
        ctx.stroke();
    },[items]);

    /* ★ BUG FIX: 최종 회전각도에서 당첨자를 역산하는 방식으로 변경
       기존 버그: startRotation(누적 회전)을 고려하지 않아 시각적 결과와 당첨자가 불일치
       수정: 최종 절대 회전각도에서 포인터 위치의 세그먼트를 계산하여 당첨자 결정 */
    const spinWheel=()=>{
        if(isSpinning||items.length<2)return;
        ps('click');
        setIsSpinning(true);
        setResult(null);

        const n=items.length;
        const arc=360/n;
        const extraSpins=5+Math.floor(Math.random()*5);
        // 랜덤 각도로 회전 (특정 인덱스를 미리 선택하지 않음)
        const randomAngle=Math.random()*360;
        const totalRotation=extraSpins*360+randomAngle;
        const startRotation=rotation;
        const endRotation=startRotation+totalRotation;

        const duration=4000+Math.random()*2000;
        const startTime=performance.now();
        tickCountRef.current=0;

        const animate=(now)=>{
            const elapsed=now-startTime;
            const progress=Math.min(elapsed/duration,1);
            const eased=1-Math.pow(1-progress,3);
            const currentRot=startRotation+totalRotation*eased;
            setRotation(currentRot);

            const segmentsPassed=Math.floor(currentRot/arc);
            if(segmentsPassed>tickCountRef.current){
                tickCountRef.current=segmentsPassed;
                playTickSound();
            }

            if(progress<1){
                spinTimerRef.current=requestAnimationFrame(animate);
            }else{
                setRotation(endRotation);
                setIsSpinning(false);

                /* ★ 핵심 수정: 최종 회전각도에서 포인터 아래의 세그먼트 인덱스를 계산
                   - 포인터는 상단(12시)에 고정
                   - 휠이 시계방향으로 endRotation도 만큼 회전한 상태
                   - 원래 세그먼트 i는 i*arc ~ (i+1)*arc (상단=0도 기준, 시계방향)
                   - 회전 후 상단에 위치하는 원래 각도 = (360 - endRotation%360) % 360
                */
                const finalAngle=((endRotation%360)+360)%360;
                // 휠이 finalAngle만큼 시계방향 회전 → 포인터 아래의 원래 각도
                const pointerOrigAngle=((360-finalAngle)%360+360)%360;
                const winnerIdx=Math.floor(pointerOrigAngle/arc)%n;
                const winner=items[winnerIdx];

                setResult(winner);
                setHistory(prev=>[{text:winner,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})},...prev].slice(0,20));
                playFanfare();
                confetti({particleCount:150,spread:80,origin:{y:.5},colors:['#FFB7B2','#B5EAD7','#C7CEEA','#FECA57','#FF6B6B'],disableForReducedMotion:true});
            }
        };
        spinTimerRef.current=requestAnimationFrame(animate);
    };

    useEffect(()=>{return()=>{if(spinTimerRef.current)cancelAnimationFrame(spinTimerRef.current);};},[]);

    const wheelSize=typeof window!=='undefined'?(window.innerWidth<640?280:360):360;

    return(<div className="w-full max-w-2xl mx-auto space-y-3">
        <div className="bg-white rounded-2xl p-4 sm:p-5 soft-shadow border-2 border-[#FECA57]/40">
            <h2 className="text-lg sm:text-xl font-black text-[#4A4A4A] mb-3 flex items-center justify-center gap-2"><Icon name="circle-dot" size={20} className="text-[#FECA57]"/> 돌림판</h2>
            <div className="mb-3">
                <textarea value={itemsInput} onChange={e=>setItemsInput(e.target.value)} className="w-full p-2.5 bg-[#FFFDF0] rounded-xl border-2 border-transparent focus:border-[#FECA57] resize-none h-20 outline-none text-sm font-bold" placeholder="항목 입력 (쉼표, 줄바꿈, 탭으로 구분 · 최대 60개)&#10;예: 사과, 바나나, 딸기 또는 엑셀에서 복사+붙여넣기"/>
                <div className="flex items-center justify-between mt-1.5 px-1">
                    <p className="text-[10px] text-gray-400 font-bold">{parseItems()?`${parseItems().length}개 항목`:'최소 2개 이상 입력해주세요'}</p>
                    <button onClick={applyItems} disabled={!parseItems()} className="px-4 py-1.5 bg-[#FECA57] text-white rounded-lg font-black text-xs shadow-md active:scale-95 touch-target disabled:opacity-40 disabled:cursor-not-allowed transition-all">적용</button>
                </div>
            </div>
        </div>

        {items.length>=2&&<div className="bg-white rounded-2xl p-4 sm:p-6 soft-shadow border border-gray-100 flex flex-col items-center">
            {result&&<div className="wheel-result-pop mb-4 px-6 py-3 rounded-2xl text-center" style={{background:'linear-gradient(135deg,#FECA57 0%,#FF6348 100%)'}}>
                <p className="text-white text-[10px] font-bold mb-0.5">당첨!</p>
                <p className="text-white text-xl sm:text-2xl font-black">{result}</p>
            </div>}

            <div className="wheel-container mb-4">
                <svg className="wheel-pointer" width="30" height="30" viewBox="0 0 30 30">
                    <polygon points="15,28 5,4 25,4" fill="#FF6348" stroke="white" strokeWidth="2"/>
                </svg>
                <div style={{transform:`rotate(${rotation}deg)`,transition:isSpinning?'none':'transform 0.1s'}}>
                    <canvas ref={canvasRef} width={wheelSize} height={wheelSize} style={{width:wheelSize,height:wheelSize}}/>
                </div>
                <div className="wheel-center">
                    <Icon name="circle-dot" size={20} className="text-gray-300"/>
                </div>
            </div>

            <button onClick={spinWheel} disabled={isSpinning} className="w-full sm:w-auto px-8 py-3.5 bg-gradient-to-r from-[#FECA57] to-[#FF6348] hover:from-[#FFD700] hover:to-[#FF4500] text-white rounded-full text-lg font-black shadow-lg active:scale-95 flex items-center justify-center gap-2 touch-target transition-all disabled:opacity-60">
                {isSpinning?<><Icon name="loader-2" size={18} className="animate-spin"/>돌리는 중...</>:<><Icon name="zap" size={18}/>돌리기!</>}
            </button>

            <div className="mt-4 w-full">
                <div className="flex flex-wrap gap-1.5 justify-center">{items.map((item,i)=><span key={i} className="px-2.5 py-1 rounded-full text-[10px] font-bold text-white" style={{backgroundColor:WHEEL_COLORS[i%WHEEL_COLORS.length]}}>{item}</span>)}</div>
            </div>
        </div>}

        {history.length>0&&<div className="bg-white/80 rounded-xl p-3 soft-shadow border border-gray-100">
            <div className="flex items-center justify-between mb-2">
                <span className="text-[10px] font-bold text-gray-400">추첨 기록 ({history.length})</span>
                <button onClick={()=>{ps('click');setHistory([]);}} className="text-[10px] text-red-300 font-bold">전체삭제</button>
            </div>
            <div className="flex flex-wrap gap-1.5">{history.map((h,i)=><div key={i} className="flex items-center gap-1 px-2.5 py-1.5 bg-[#FFFDF0] rounded-lg border border-[#FECA57]/30 text-xs font-bold text-gray-600"><span className="text-[#FECA57] font-black">{i+1}.</span> {h.text} <span className="text-[9px] text-gray-400">({h.time})</span></div>)}</div>
        </div>}
    </div>);
}


/* ══════════════════════════════════════════
   ▼ 로또번호 추첨기 (발표자 뽑기)
   ══════════════════════════════════════════ */
const LOTTO_BALL_COLORS=['#E74C3C','#E67E22','#27AE60','#2980B9','#8E44AD','#D35400','#16A085','#2C3E50','#C0392B','#7D3C98'];

function LottoPicker({students,excludedNums,playSound:ps,isSoundOn}){
    const activeStudents=useMemo(()=>students.filter(s=>!excludedNums.includes(s)),[students,excludedNums]);
    const [pickCount,setPickCount]=useState(1);
    const [isRolling,setIsRolling]=useState(false);
    const [results,setResults]=useState([]);
    const [rollingNums,setRollingNums]=useState([]);
    const [revealedCount,setRevealedCount]=useState(0);
    const [history,setHistory]=useState([]);
    const [isNoRepeat,setIsNoRepeat]=useState(false);
    const [usedNums,setUsedNums]=useState([]);
    const rollTimersRef=useRef([]);
    const audioCtxRef=useRef(null);

    const getAudioCtx=()=>{
        if(!audioCtxRef.current)audioCtxRef.current=new(window.AudioContext||window.webkitAudioContext)();
        if(audioCtxRef.current.state==='suspended')audioCtxRef.current.resume();
        return audioCtxRef.current;
    };

    const playBallDrop=useCallback((idx)=>{
        if(!isSoundOn)return;
        const ctx=getAudioCtx();const t=ctx.currentTime;
        // 점점 올라가는 음계
        const baseFreq=[261.63,329.63,392.00,523.25,659.25,783.99,1046.50];
        const freq=baseFreq[idx%baseFreq.length];
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type='sine';
        o.frequency.setValueAtTime(freq,t);
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(.12,t+.03);
        g.gain.exponentialRampToValueAtTime(.001,t+.4);
        o.start(t);o.stop(t+.4);
        // 짧은 퍼커션
        const o2=ctx.createOscillator(),g2=ctx.createGain();
        o2.connect(g2);g2.connect(ctx.destination);
        o2.type='triangle';
        o2.frequency.setValueAtTime(freq*2,t);
        g2.gain.setValueAtTime(.06,t);
        g2.gain.exponentialRampToValueAtTime(.001,t+.08);
        o2.start(t);o2.stop(t+.1);
    },[isSoundOn]);

    const playFinalFanfare=useCallback(()=>{
        if(!isSoundOn)return;
        const ctx=getAudioCtx();const t=ctx.currentTime;
        [523.25,659.25,783.99,1046.5,1318.5,1567.98].forEach((f,i)=>{
            const o=ctx.createOscillator(),g=ctx.createGain();
            o.connect(g);g.connect(ctx.destination);
            o.type=i<3?'sine':'triangle';
            o.frequency.setValueAtTime(f,t+i*.08);
            g.gain.setValueAtTime(0,t+i*.08);
            g.gain.linearRampToValueAtTime(.1,t+i*.08+.03);
            g.gain.exponentialRampToValueAtTime(.001,t+i*.08+.5);
            o.start(t+i*.08);o.stop(t+i*.08+.5);
        });
    },[isSoundOn]);

    const getBallColor=(num)=>{
        if(num<=10)return '#FBC400';  // 노란색 (1~10)
        if(num<=20)return '#69C8F2';  // 파란색 (11~20)
        if(num<=30)return '#FF7272';  // 빨간색 (21~30)
        if(num<=40)return '#555555';  // 회색 (31~40)
        if(num<=50)return '#B0D840';  // 초록색 (41~50)
        if(num<=60)return '#A855F7';  // 보라색 (51~60)
        if(num<=70)return '#F97316';  // 주황색 (61~70)
        if(num<=80)return '#14B8A6';  // 청록색 (71~80)
        if(num<=90)return '#EC4899';  // 분홍색 (81~90)
        return '#6366F1';             // 남색 (91~100)
    };

    const startDraw=()=>{
        let pool=isNoRepeat?activeStudents.filter(s=>!usedNums.includes(s)):activeStudents;
        if(pool.length===0){
            ps('click');
            return;
        }
        const count=Math.min(pickCount,pool.length);
        ps('click');
        setIsRolling(true);
        setResults([]);
        setRevealedCount(0);

        // 당첨 번호 미리 결정
        const shuffled=[...pool].sort(()=>Math.random()-.5);
        const winners=shuffled.slice(0,count);

        // 각 슬롯에 롤링 숫자 표시
        const initRolling=Array(count).fill(0);
        setRollingNums(initRolling);

        // 각 공을 순차적으로 확정 (1초 간격)
        const revealBall=(idx)=>{
            // 롤링 애니메이션 (100ms마다 숫자 변경)
            let rollCount=0;
            const maxRolls=12+idx*3;
            const rollInterval=setInterval(()=>{
                setRollingNums(prev=>{
                    const next=[...prev];
                    next[idx]=activeStudents[Math.floor(Math.random()*activeStudents.length)];
                    return next;
                });
                rollCount++;
                if(rollCount>=maxRolls){
                    clearInterval(rollInterval);
                    // 확정
                    setRollingNums(prev=>{
                        const next=[...prev];
                        next[idx]=winners[idx];
                        return next;
                    });
                    setResults(prev=>[...prev,winners[idx]]);
                    setRevealedCount(prev=>prev+1);
                    playBallDrop(idx);

                    if(idx===count-1){
                        // 마지막 공
                        setTimeout(()=>{
                            setIsRolling(false);
                            if(isNoRepeat)setUsedNums(prev=>[...prev,...winners]);
                            setHistory(prev=>[{
                                nums:winners,
                                time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})
                            },...prev].slice(0,20));
                            playFinalFanfare();
                            confetti({particleCount:200,spread:90,origin:{y:.45},colors:['#FF6B6B','#FECA57','#48DBFB','#2ED573','#FF9FF3','#54A0FF'],disableForReducedMotion:true});
                        },300);
                    }
                }
            },80);
            rollTimersRef.current.push(rollInterval);
        };

        // 순차적으로 공 뽑기 시작
        for(let i=0;i<count;i++){
            const timer=setTimeout(()=>revealBall(i),i*1200+500);
            rollTimersRef.current.push(timer);
        }
    };

    useEffect(()=>{return()=>{rollTimersRef.current.forEach(t=>{clearTimeout(t);clearInterval(t);});};},[]);

    const availableCount=isNoRepeat?activeStudents.filter(s=>!usedNums.includes(s)).length:activeStudents.length;

    return(<div className="w-full max-w-2xl mx-auto space-y-3">
        {/* 추첨기 머신 */}
        <div className="lotto-machine">
            <div className="text-center mb-4">
                <h2 className="text-xl sm:text-2xl font-black text-white flex items-center justify-center gap-2">
                    <span className="text-2xl">🎱</span> 로또 추첨기
                </h2>
                <p className="text-[11px] text-gray-400 font-bold mt-1">행운의 발표자를 뽑아보세요!</p>
            </div>

            {/* 결과 디스플레이 */}
            <div className="lotto-glass mb-4">
                <div className="flex items-center justify-center gap-3 sm:gap-4 min-h-[80px] flex-wrap py-2">
                    {Array.from({length:Math.min(pickCount,availableCount)}).map((_,i)=>{
                        const revealed=i<results.length;
                        const rolling=isRolling&&i>=results.length&&i<=results.length;
                        const num=revealed?results[i]:(rolling?rollingNums[i]:null);
                        if(revealed){
                            return <div key={i} className="lotto-ball lotto-pop" style={{backgroundColor:getBallColor(num)}}>
                                <span style={{textShadow:'0 1px 3px rgba(0,0,0,.3)'}}>{num}</span>
                            </div>;
                        }
                        if(rolling&&num){
                            return <div key={i} className="lotto-ball lotto-rolling" style={{backgroundColor:'#666'}}>
                                <span style={{textShadow:'0 1px 3px rgba(0,0,0,.3)'}}>{num}</span>
                            </div>;
                        }
                        return <div key={i} className="lotto-slot">
                            <span className="text-gray-400 font-bold text-lg">?</span>
                        </div>;
                    })}
                </div>
            </div>

            {/* 컨트롤 */}
            <div className="flex flex-col gap-3">
                <div className="flex items-center justify-center gap-3">
                    <span className="text-sm font-bold text-gray-400">뽑기 수</span>
                    <div className="flex items-center bg-white/10 rounded-xl px-1.5 py-1 gap-1 border border-white/10">
                        <button onClick={()=>{ps('click');setPickCount(Math.max(1,pickCount-1));}} className="w-9 h-9 rounded-lg bg-white/10 text-white touch-target flex items-center justify-center hover:bg-white/20 transition-all"><Icon name="minus" size={16}/></button>
                        <span className="text-xl font-black text-white min-w-[2.5rem] text-center">{pickCount}</span>
                        <button onClick={()=>{ps('click');setPickCount(Math.min(Math.min(10,availableCount),pickCount+1));}} className="w-9 h-9 rounded-lg bg-white/10 text-white touch-target flex items-center justify-center hover:bg-white/20 transition-all"><Icon name="plus" size={16}/></button>
                    </div>
                    <span className="text-[10px] text-gray-500 font-bold">명</span>
                </div>

                <div className="flex items-center justify-center gap-2">
                    <button onClick={()=>{ps('click');setIsNoRepeat(!isNoRepeat);}} className={`px-3 py-1.5 rounded-lg text-[11px] font-bold border transition-all ${isNoRepeat?'bg-yellow-500/20 border-yellow-500/40 text-yellow-300':'bg-white/5 border-white/10 text-gray-500'}`}>
                        중복방지 {isNoRepeat?'ON':'OFF'}
                    </button>
                    {isNoRepeat&&usedNums.length>0&&<button onClick={()=>{ps('click');setUsedNums([]);}} className="px-3 py-1.5 bg-white/5 border border-white/10 rounded-lg text-[11px] font-bold text-gray-500">
                        초기화 ({usedNums.length}명)
                    </button>}
                    <span className="text-[10px] text-gray-500 font-bold">남은 인원: {availableCount}명</span>
                </div>

                <button onClick={startDraw} disabled={isRolling||availableCount===0} className="w-full py-4 bg-gradient-to-r from-[#FF6B6B] via-[#FECA57] to-[#48DBFB] text-white rounded-2xl text-lg font-black shadow-lg shadow-[#FF6B6B]/20 active:scale-[.97] flex items-center justify-center gap-2 touch-target transition-all disabled:opacity-40 disabled:cursor-not-allowed">
                    {isRolling?<><Icon name="loader-2" size={20} className="animate-spin"/> 추첨 중...</>:availableCount===0?'모두 추첨 완료!':<><span className="text-xl">🎱</span> 추첨 시작!</>}
                </button>
            </div>
        </div>

        {/* 추첨 기록 */}
        {history.length>0&&<div className="bg-white/80 rounded-xl p-3 soft-shadow border border-gray-100">
            <div className="flex items-center justify-between mb-2">
                <span className="text-[10px] font-bold text-gray-400">추첨 기록 ({history.length})</span>
                <button onClick={()=>{ps('click');setHistory([]);}} className="text-[10px] text-red-300 font-bold">전체삭제</button>
            </div>
            <div className="space-y-1.5">{history.map((h,i)=><div key={i} className="flex items-center gap-2 px-2.5 py-2 bg-[#F9F9F9] rounded-lg border border-gray-100">
                <span className="text-[10px] font-black text-gray-400 shrink-0">#{i+1}</span>
                <div className="flex gap-1.5 flex-wrap flex-1">{h.nums.map((n,j)=><span key={j} className="inline-flex items-center justify-center w-8 h-8 rounded-full text-white text-xs font-black" style={{backgroundColor:getBallColor(n),boxShadow:'inset 0 -2px 4px rgba(0,0,0,.15)'}}>{n}</span>)}</div>
                <span className="text-[9px] text-gray-400 shrink-0">{h.time}</span>
            </div>)}</div>
        </div>}
    </div>);
}

    const [selectedItem,setSelectedItem]=useState(null);
    const [timeLeft,setTimeLeft]=useState(300);
    const [initialTime,setInitialTime]=useState(300);
    const [isTimerRunning,setIsTimerRunning]=useState(false);
    const [timerEverStarted,setTimerEverStarted]=useState(false);
    const [minEdit,setMinEdit]=useState('');const [secEdit,setSecEdit]=useState('');
    const [editingMin,setEditingMin]=useState(false);const [editingSec,setEditingSec]=useState(false);
    const [showClockInTimer,setShowClockInTimer]=useState(false);
    const [qrInput,setQrInput]=useState('');const [qrUrl,setQrUrl]=useState(null);
    const [memos,setMemos]=useState([]);const [memoInput,setMemoInput]=useState('');
    const [memoColor,setMemoColor]=useState('#FFE0E0');
    const [memoFontSize,setMemoFontSize]=useState(14);
    const [uploadedImg,setUploadedImg]=useState(null);
    const [fullScreenContent,setFullScreenContent]=useState(null);const [fsFontSize,setFsFontSize]=useState(60);

    const audioCtx=useRef(null);const timerRef=useRef(null);const captureRef=useRef(null);const fileInputRef=useRef(null);

    const MEMO_COLORS=['#FFE0E0','#E0F4FF','#E0FFE4','#FFF4E0','#F3E0FF','#FFDAC1','#C7CEEA','#B5EAD7','#FFB7B2','#FFFFCC','#F0F0F0','#D4F0FF'];

    const excludedNums=useMemo(()=>excludedInput.split(/[\s,]+/).map(n=>parseInt(n)).filter(n=>!isNaN(n)&&n>=1&&n<=students.length),[excludedInput,students.length]);
    const activeStudents=useMemo(()=>students.filter(s=>!excludedNums.includes(s)),[students,excludedNums]);

    const initAudio=()=>{if(!audioCtx.current)audioCtx.current=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.current.state==='suspended')audioCtx.current.resume();};
    const playSound=type=>{
        if(!isSoundOn)return;initAudio();const ctx=audioCtx.current;const t=ctx.currentTime;
        if(type==='click'){const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(800,t);g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);o.start(t);o.stop(t+.08);}
        else if(type==='tick'){const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='triangle';o.frequency.setValueAtTime(600,t);g.gain.setValueAtTime(.025,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);o.start(t);o.stop(t+.04);}
        else if(type==='win'){[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(f,t+i*.1);g.gain.setValueAtTime(0,t+i*.1);g.gain.linearRampToValueAtTime(.08,t+i*.1+.04);g.gain.exponentialRampToValueAtTime(.001,t+i*.1+.5);o.start(t+i*.1);o.stop(t+i*.1+.5);});}
        else if(type==='alarm'){for(let i=0;i<3;i++){const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='square';o.frequency.setValueAtTime(880,t+i*.2);o.frequency.setValueAtTime(698,t+i*.2+.1);g.gain.setValueAtTime(.04,t+i*.2);g.gain.linearRampToValueAtTime(0,t+i*.2+.15);o.start(t+i*.2);o.stop(t+i*.2+.2);}}
    };
    const fireConfetti=()=>{confetti({particleCount:120,spread:65,origin:{y:.6},colors:['#FFB7B2','#B5EAD7','#C7CEEA','#E2F0CB','#FFDAC1'],disableForReducedMotion:true});};
    const showAlert=msg=>setSystemModal({type:'alert',msg});
    const showConfirm=(msg,action)=>setSystemModal({type:'confirm',msg,action});
    const closeModal=()=>{playSound('click');setSystemModal(null);};

    const handleCapture=async()=>{if(!captureRef.current)return;playSound('click');try{await document.fonts.ready;const canvas=await html2canvas(captureRef.current,{scale:2,backgroundColor:'#FDFBF7',useCORS:true,logging:false,allowTaint:true,onclone:doc=>{doc.querySelectorAll('.center-content').forEach(el=>{el.style.display='flex';el.style.alignItems='center';el.style.justifyContent='center';el.style.paddingBottom='12px';el.style.lineHeight='1';el.style.height='100%';});}});const link=document.createElement('a');link.download=`송쌤과학_${mode}_${Date.now()}.png`;link.href=canvas.toDataURL();link.click();showAlert("이미지가 저장되었습니다 📸");}catch(e){console.error(e);showAlert("저장 실패. 다시 시도해주세요.");}};

    const startClass=e=>{e.preventDefault();const c=parseInt(studentCount);if(!c||c<1||c>100)return showAlert("1~100 사이의 번호를 입력해주세요.");playSound('click');setStudents(Array.from({length:c},(_,i)=>i+1));setStep('main');setTimeout(initAudio,300);};
    const goHome=()=>{playSound('click');showConfirm("초기 화면으로 돌아갈까요?\n모든 데이터가 초기화됩니다.",()=>{setStep('input');setStudentCount('');setStudents([]);setPickHistory([]);setTeams([]);setSeats([]);setMemos([]);setUploadedImg(null);setIsTimerRunning(false);setTimerEverStarted(false);setSelectedItem(null);setExcludedInput('');setSeatPairSettings({mustPair:[],mustNotPair:[]});});};

    const adjustTime=sec=>{playSound('click');const v=Math.max(0,Math.min(5999,timeLeft+sec));setTimeLeft(v);if(!isTimerRunning)setInitialTime(v);};
    const onMinFocus=()=>{setEditingMin(true);setMinEdit(String(Math.floor(timeLeft/60)));};
    const onMinBlur=()=>{setEditingMin(false);const m=Math.max(0,Math.min(99,parseInt(minEdit)||0)),s=timeLeft%60,v=m*60+s;setTimeLeft(v);setInitialTime(v);};
    const onSecFocus=()=>{setEditingSec(true);setSecEdit(String(timeLeft%60));};
    const onSecBlur=()=>{setEditingSec(false);const m=Math.floor(timeLeft/60),s=Math.max(0,Math.min(59,parseInt(secEdit)||0)),v=m*60+s;setTimeLeft(v);setInitialTime(v);};

    useEffect(()=>{if(isTimerRunning&&timeLeft>0){timerRef.current=setInterval(()=>{setTimeLeft(p=>{if(p<=1){clearInterval(timerRef.current);setIsTimerRunning(false);playSound('alarm');fireConfetti();return 0;}return p-1;});},1000);}else clearInterval(timerRef.current);return()=>clearInterval(timerRef.current);},[isTimerRunning]);

    const parseData=()=>{if(placementType==='number')return activeStudents;if(placementType==='name'){const l=inputNames.split(/[\n,]+/).map(s=>s.trim()).filter(s=>s);return l.length?l:null;}if(placementType==='gender'){const m=maleInput.split(/[\n,]+/).map(s=>s.trim()).filter(s=>s),f=femaleInput.split(/[\n,]+/).map(s=>s.trim()).filter(s=>s);return m.length+f.length?{m,f}:null;}return[];};
    const buildPool=data=>{let pool=[];if(placementType==='gender'){let{m,f}=data;m=[...m].sort(()=>Math.random()-.5);f=[...f].sort(()=>Math.random()-.5);if(genderOption==='mixed'){const mx=Math.max(m.length,f.length);for(let i=0;i<mx;i++){if(i<m.length)pool.push(m[i]);if(i<f.length)pool.push(f[i]);}}else pool=[...m,...f];}else pool=[...data].sort(()=>Math.random()-.5);return pool;};

    const createTeams=()=>{if(isPicking)return;const data=parseData();if(!data||!data.length)return showAlert("참여할 학생이 없습니다.");playSound('click');setIsPicking(true);setTeams([]);setTimeout(()=>{const pool=buildPool(data);const t=Array.from({length:teamCount},()=>[]);pool.forEach((s,i)=>t[i%teamCount].push(s));setTeams(t);setIsPicking(false);playSound('win');},350);};
    const createSeats=()=>{if(isPicking)return;const data=parseData();if(!data||!data.length)return showAlert("참여할 학생이 없습니다.");playSound('click');setIsPicking(true);setSeats([]);setTimeout(()=>{let pool=buildPool(data);if(seatType==='pair'&&(seatPairSettings.mustPair.length>0||seatPairSettings.mustNotPair.length>0))pool=applyPC(pool,seatPairSettings);setSeats(pool);setIsPicking(false);playSound('win');},350);};
    const applyPC=(pool,settings)=>{const{mustPair,mustNotPair}=settings;const s=v=>String(v);for(let a=0;a<200;a++){let arr=[...pool].sort(()=>Math.random()-.5);for(const p of mustPair){const iA=arr.findIndex(x=>s(x)===s(p[0])),iB=arr.findIndex(x=>s(x)===s(p[1]));if(iA===-1||iB===-1)continue;const big=Math.max(iA,iB),sm=Math.min(iA,iB);const pB=arr.splice(big,1)[0],pS=arr.splice(sm,1)[0];arr.splice(0,0,pS,pB);}let ok=true;for(const p of mustPair){let f=false;for(let i=0;i+1<arr.length;i+=2)if((s(arr[i])===s(p[0])&&s(arr[i+1])===s(p[1]))||(s(arr[i])===s(p[1])&&s(arr[i+1])===s(p[0]))){f=true;break;}if(!f){ok=false;break;}}if(!ok)continue;for(const p of mustNotPair){for(let i=0;i+1<arr.length;i+=2)if((s(arr[i])===s(p[0])&&s(arr[i+1])===s(p[1]))||(s(arr[i])===s(p[1])&&s(arr[i+1])===s(p[0]))){ok=false;break;}if(!ok)break;}if(ok)return arr;}return[...pool].sort(()=>Math.random()-.5);};

    const addPairSetting=()=>{const a=pairInputA.trim(),b=pairInputB.trim();if(!a||!b)return showAlert("두 학생 모두 입력해주세요.");if(a===b)return showAlert("같은 학생을 입력할 수 없습니다.");const key=pairSettingTab==='must'?'mustPair':'mustNotPair';if(seatPairSettings[key].some(p=>(String(p[0])===a&&String(p[1])===b)||(String(p[0])===b&&String(p[1])===a)))return showAlert("이미 등록된 조합입니다.");setSeatPairSettings(prev=>({...prev,[key]:[...prev[key],[a,b]]}));setPairInputA('');setPairInputB('');playSound('click');};

    const performSwap=(src,tgt)=>{if(src.type==='team'){const t=[...teams.map(x=>[...x])];const tmp=t[src.index][src.subIndex];t[src.index][src.subIndex]=t[tgt.index][tgt.subIndex];t[tgt.index][tgt.subIndex]=tmp;setTeams(t);}else{const s=[...seats];[s[src.index],s[tgt.index]]=[s[tgt.index],s[src.index]];setSeats(s);}};
    const handleItemTap=(type,index,subIndex=null)=>{if(isPicking)return;playSound('click');if(selectedItem){if(selectedItem.type===type&&selectedItem.index===index&&selectedItem.subIndex===subIndex){setSelectedItem(null);return;}if(selectedItem.type!==type){setSelectedItem({type,index,subIndex});return;}performSwap(selectedItem,{type,index,subIndex});setSelectedItem(null);playSound('win');}else setSelectedItem({type,index,subIndex});};

                        <p className="text-[11px] text-gray-400 mt-1.5 pl-1 font-bold">예: 30번까지 있으면 → 30 입력 (1~30번 생성)</p>
                    </div>
                    <button type="submit" className="w-full py-4 sm:py-5 bg-[#FFB7B2] hover:bg-[#FF9E99] text-white rounded-2xl text-lg sm:text-2xl font-black shadow-lg shadow-[#FFB7B2]/25 active:scale-[.97] flex items-center justify-center gap-2 touch-target transition-all">수업 시작하기 <Icon name="arrow-right" size={20}/></button>
                </form>
                <div className="mt-5 flex justify-center"><SoundToggle isSoundOn={isSoundOn} setIsSoundOn={setIsSoundOn} playSound={playSound}/></div>
            </div>
            <Copyright fixed/>{systemModal&&<SystemModal modal={systemModal} closeModal={closeModal}/>}
        </div>
    );

    /* ═══ 메인화면 ═══ */
    return(<div className="min-h-screen min-h-[100dvh] flex flex-col w-full overflow-x-hidden">
        <nav className="sticky top-0 z-40 glass-panel px-1.5 sm:px-4 py-2"><div className="max-w-7xl mx-auto flex items-center gap-1 sm:gap-2">
            <div className="flex items-center gap-1 cursor-pointer shrink-0" onClick={goHome}><div className="bg-[#B5EAD7] p-1.5 sm:p-2 rounded-xl text-white shadow-sm"><Icon name="flask-conical" size={16}/></div><span className="hidden sm:block text-sm font-black text-gray-500">{students.length}명{excludedNums.length>0&&<span className="text-[10px] text-gray-400 font-bold ml-0.5">(-{excludedNums.length})</span>}</span></div>

                <NavBtn active={mode==='calendar'} icon="calendar" label="달력" onClick={()=>setMode('calendar')}/>
                <NavBtn active={mode==='youtube'} icon="youtube" label="영상" onClick={()=>setMode('youtube')}/>
                <NavBtn active={mode==='record'} icon="mic" label="녹음" onClick={()=>setMode('record')}/>

        <main className="flex-1 max-w-7xl mx-auto w-full px-3 sm:px-6 py-3 sm:py-5 pb-6 flex flex-col">

            {/* 1 발표자 */}

                <div className="mb-3"><ExcludeBar excludedInput={excludedInput} setExcludedInput={setExcludedInput} excludedNums={excludedNums} totalCount={students.length} accentColor="#FFB7B2" playSound={playSound}/></div>
                <div className="bg-white rounded-2xl p-3 sm:p-5 soft-shadow border border-[#F0EBE3] relative overflow-hidden"><div className="grid grid-cols-5 sm:grid-cols-6 md:grid-cols-8 lg:grid-cols-10 gap-1.5 sm:gap-2 relative z-10">{students.map(num=>{const isExcluded=excludedNums.includes(num),isWin=pickWinner===num,isHL=currentPick===num,isDone=pickHistory.includes(num);return<div key={num} className={`student-cell ${isExcluded?'excluded-cell':isWin?'winner winner-pulse':isHL?'highlight-anim':isDone?'done':''}`}>{isExcluded?<span className="text-gray-300 text-[11px]">✕</span>:num}{!isExcluded&&isDone&&<div className="absolute inset-0 flex items-center justify-center opacity-25 bg-gray-100/40"><Icon name="check" size={14}/></div>}</div>;})}</div></div>
                <div className="mt-5 text-center"><button onClick={()=>{if(isPicking)return;let pool=isNoRepeat?activeStudents.filter(s=>!pickHistory.includes(s)):activeStudents;if(!pool.length)return showAlert(activeStudents.length===0?"참여할 학생이 없습니다.":"모든 학생이 발표했습니다!\n기록을 초기화해주세요.");playSound('click');setIsPicking(true);setPickWinner(null);let cnt=0;const mx=20+Math.floor(Math.random()*10);let d=50;const loop=()=>{setCurrentPick(activeStudents[Math.floor(Math.random()*activeStudents.length)]);playSound('tick');cnt++;if(cnt>mx){const w=pool[Math.floor(Math.random()*pool.length)];setCurrentPick(w);setPickWinner(w);if(isNoRepeat)setPickHistory(prev=>[...prev,w]);playSound('win');fireConfetti();setIsPicking(false);}else{d*=1.1;setTimeout(loop,d);}};loop();}} disabled={isPicking} className="w-full sm:w-auto px-8 py-3.5 sm:py-4 bg-[#FFB7B2] hover:bg-[#FF9E99] text-white rounded-full text-lg sm:text-xl font-black shadow-lg shadow-[#FFB7B2]/25 active:scale-95 flex items-center justify-center gap-2 mx-auto touch-target transition-all">{isPicking?<Icon name="loader-2" size={18} className="animate-spin"/>:<Icon name="sparkles" size={18}/>}{isPicking?'두구두구...':'발표자 뽑기'}</button></div>
            </div>}

                    <div><h2 className="text-xl sm:text-3xl font-black text-[#4A4A4A]">로또 추첨기</h2><p className="text-[10px] sm:text-sm text-gray-400 font-bold">로또처럼 발표자를 뽑아보세요!</p></div>
                </div>
                <div className="mb-3"><ExcludeBar excludedInput={excludedInput} setExcludedInput={setExcludedInput} excludedNums={excludedNums} totalCount={students.length} accentColor="#FF6B6B" playSound={playSound}/></div>
                <LottoPicker students={students} excludedNums={excludedNums} playSound={playSound} isSoundOn={isSoundOn}/>
            </div>}

            {/* 2 모둠 */}
            {mode==='team'&&<div className="card-enter space-y-3 w-full">
                <div className="bg-white p-3 sm:p-5 rounded-2xl soft-shadow border border-gray-100 space-y-2.5">
                    <div className="flex gap-1.5">{['number','name','gender'].map(t=><button key={t} onClick={()=>setPlacementType(t)} className={`flex-1 py-2 rounded-lg font-bold text-xs sm:text-sm border-2 touch-target transition-all ${placementType===t?'bg-[#C7CEEA] border-[#C7CEEA] text-white':'bg-white border-gray-100 text-gray-400'}`}>{t==='number'?'번호':t==='name'?'이름':'남녀'}</button>)}</div>
                    {placementType==='number'&&<ExcludeBar excludedInput={excludedInput} setExcludedInput={setExcludedInput} excludedNums={excludedNums} totalCount={students.length} accentColor="#C7CEEA" playSound={playSound}/>}
                    {placementType==='name'&&<textarea value={inputNames} onChange={e=>setInputNames(e.target.value)} className="w-full p-2.5 bg-[#F7F9FC] rounded-xl border-2 border-transparent focus:border-[#C7CEEA] resize-none h-16 outline-none text-sm" placeholder="학생 이름 (쉼표/줄바꿈 구분)"/>}
                    {placementType==='gender'&&<div className="flex gap-2"><textarea value={maleInput} onChange={e=>setMaleInput(e.target.value)} className="flex-1 p-2.5 bg-[#F0F8FF] rounded-xl h-16 resize-none text-xs border-2 border-transparent focus:border-[#90CAF9] outline-none" placeholder="남학생"/><textarea value={femaleInput} onChange={e=>setFemaleInput(e.target.value)} className="flex-1 p-2.5 bg-[#FFF0F5] rounded-xl h-16 resize-none text-xs border-2 border-transparent focus:border-[#F48FB1] outline-none" placeholder="여학생"/></div>}
                    <div className="flex gap-2 items-end"><div className="flex items-center gap-1 bg-[#F7F9FC] p-1 rounded-lg border border-gray-100">{[2,3].map(c=><button key={c} onClick={()=>setTeamColumns(c)} className={`px-3 py-1.5 rounded-md text-[10px] font-bold transition-all ${teamColumns===c?'bg-white shadow-sm text-[#5C6B9E]':'text-gray-400'}`}>{c}열</button>)}</div><div className="flex items-center bg-[#F7F9FC] rounded-lg border border-gray-100 px-1.5 gap-1"><button onClick={()=>setTeamCount(Math.max(2,teamCount-1))} className="w-8 h-8 rounded-md bg-white shadow-sm text-gray-500 touch-target flex items-center justify-center"><Icon name="minus" size={14}/></button><span className="text-sm font-black text-[#5C6B9E] min-w-[2rem] text-center">{teamCount}</span><button onClick={()=>setTeamCount(Math.min(20,teamCount+1))} className="w-8 h-8 rounded-md bg-white shadow-sm text-gray-500 touch-target flex items-center justify-center"><Icon name="plus" size={14}/></button></div><button onClick={createTeams} className="ml-auto py-2.5 px-4 bg-[#C7CEEA] text-white rounded-lg font-bold shadow-md active:scale-95 flex items-center gap-1.5 touch-target text-sm"><Icon name="wand-2" size={16}/> 생성</button></div>
                </div>
                {teams.length>0&&<div className="w-full"><div className="flex justify-between items-center gap-2 mb-2 px-1"><p className="text-[10px] text-gray-400 font-bold">터치하여 자리 변경</p><div className="flex gap-1.5"><button onClick={createTeams} className="text-[#C7CEEA] bg-white border border-[#C7CEEA] px-2.5 py-1.5 rounded-lg text-[10px] font-bold flex items-center gap-1 touch-target"><Icon name="shuffle" size={12}/> 섞기</button><button onClick={handleCapture} className="text-[#C7CEEA] bg-white p-1.5 rounded-lg touch-target"><Icon name="camera" size={16}/></button></div></div><div ref={captureRef} className="bg-white p-3 sm:p-5 rounded-2xl border-2 border-[#C7CEEA] shadow-lg"><div className={`grid gap-2 sm:gap-3 ${teamColumns===2?'grid-cols-2':'grid-cols-2 sm:grid-cols-3'}`}>{teams.map((team,tIdx)=><div key={tIdx} className="bg-[#F7F9FC] rounded-xl p-2.5 border border-[#E2E8F0]"><div className="flex items-center gap-1.5 mb-2"><div className="bg-[#C7CEEA] text-white w-6 h-6 flex items-center justify-center rounded-lg font-black text-xs">{tIdx+1}</div><span className="text-[10px] font-bold text-gray-400">{team.length}명</span></div><div className="flex flex-col gap-1">{team.map((s,sIdx)=>{const isSel=selectedItem?.type==='team'&&selectedItem?.index===tIdx&&selectedItem?.subIndex===sIdx;return<div key={sIdx} onClick={()=>handleItemTap('team',tIdx,sIdx)} className={`bg-white border-2 rounded-lg font-bold text-gray-600 cursor-pointer select-none center-content py-1.5 px-2 text-sm touch-target transition-all ${isSel?'selected-item':'border-transparent active:border-[#C7CEEA]'}`}>{s}</div>;})}</div></div>)}</div></div></div>}
            </div>}

            {/* 3 좌석 */}
            {mode==='seat'&&<div className="card-enter space-y-3 w-full">
                <div className="bg-white p-3 sm:p-5 rounded-2xl soft-shadow border border-gray-100 space-y-2.5">
                    <div className="flex gap-1.5">{['number','name','gender'].map(t=><button key={t} onClick={()=>setPlacementType(t)} className={`flex-1 py-2 rounded-lg font-bold text-xs sm:text-sm border-2 touch-target transition-all ${placementType===t?'bg-[#FFD3B6] border-[#FFD3B6] text-white':'bg-white border-gray-100 text-gray-400'}`}>{t==='number'?'번호':t==='name'?'이름':'남녀'}</button>)}</div>
                    {placementType==='number'&&<ExcludeBar excludedInput={excludedInput} setExcludedInput={setExcludedInput} excludedNums={excludedNums} totalCount={students.length} accentColor="#FFD3B6" playSound={playSound}/>}

ify-center cursor-pointer touch-target ${s2?'selected-item':''}`}><span className="font-black text-gray-600 text-xs sm:text-sm">{seats[i2]||''}</span></div></div>;})}</div></div></div>}
            </div>}

            {/* ★ 돌림판 */}
            {mode==='wheel'&&<div className="card-enter w-full"><SpinWheel playSound={playSound} isSoundOn={isSoundOn}/></div>}

            {/* 4 타이머 */}
            {mode==='timer'&&<div className="card-enter flex flex-col items-center justify-center py-4 sm:py-8 w-full">
                {showClockInTimer&&<div className="mb-5 bg-white rounded-2xl p-5 sm:p-6 soft-shadow border-2 border-[#C7CEEA] w-full max-w-sm text-center card-enter"><LiveClock size="md"/></div>}
