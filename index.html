const WHEEL_COLORS=['#166B59','#486A63','#344E59','#66754A','#286F73','#5B6555','#285346','#756B51','#405E70','#536B40','#38635C','#76614E','#356267','#567052','#4B5963','#365344'];

function SpinWheel({playSound:ps,isSoundOn}){
    const [itemsInput,setItemsInput]=useState('');
    const [items,setItems]=useState([]);
    const [isSpinning,setIsSpinning]=useState(false);
    const [rotation,setRotation]=useState(0);
    const [result,setResult]=useState(null);
    const [history,setHistory]=useState([]);
    // ★ 중복방지 기능 - ON일 때 이미 뽑힌 항목은 휠에서 제거
    const [isNoRepeat,setIsNoRepeat]=useState(false);
    const [usedItems,setUsedItems]=useState([]);
    const canvasRef=useRef(null);
    const audioCtxRef=useRef(null);
    const spinTimerRef=useRef(null);
    const tickCountRef=useRef(0);

    // ★ 실제 휠에 표시할 항목 (중복방지 ON이면 사용된 항목 제외)
    const displayItems=useMemo(()=>{
        if(!isNoRepeat)return items;
        return items.filter(it=>!usedItems.includes(it));
    },[items,isNoRepeat,usedItems]);

    const getAudioCtx=()=>{
        if(!audioCtxRef.current)audioCtxRef.current=new(window.AudioContext||window.webkitAudioContext)();
        if(audioCtxRef.current.state==='suspended')audioCtxRef.current.resume();
        return audioCtxRef.current;
    };

    const playTickSound=useCallback(()=>{
        if(!isSoundOn)return;
        const ctx=getAudioCtx();const t=ctx.currentTime;
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type='sine';
        const pitch=600+Math.random()*200;
        o.frequency.setValueAtTime(pitch,t);
        g.gain.setValueAtTime(.06,t);
        g.gain.exponentialRampToValueAtTime(.001,t+.05);
        o.start(t);o.stop(t+.06);
    },[isSoundOn]);

    const playFanfare=useCallback(()=>{
        if(!isSoundOn)return;
        const ctx=getAudioCtx();const t=ctx.currentTime;
        const notes=[523.25,659.25,783.99,1046.5,1318.5,1046.5];
        notes.forEach((f,i)=>{
            const o=ctx.createOscillator(),g=ctx.createGain();
            o.connect(g);g.connect(ctx.destination);
            o.type=i<4?'sine':'triangle';
            o.frequency.setValueAtTime(f,t+i*.12);
            g.gain.setValueAtTime(0,t+i*.12);
            g.gain.linearRampToValueAtTime(.1,t+i*.12+.04);
            g.gain.exponentialRampToValueAtTime(.001,t+i*.12+.6);
            o.start(t+i*.12);o.stop(t+i*.12+.6);
        });
    },[isSoundOn]);

    const parseItems=()=>{
        const list=itemsInput.split(/[\n,\t]+/).map(s=>s.trim()).filter(s=>s).slice(0,60);
        if(list.length<2)return null;
        return list;
    };

    const applyItems=()=>{
        const list=parseItems();
        if(!list)return;
        ps('click');
        setItems(list);
        setResult(null);
        setRotation(0);
        setUsedItems([]); // ★ 새 항목 적용 시 사용 기록 초기화
    };

    // ★ 캔버스 그리기 - displayItems 기준
    useEffect(()=>{
        const canvas=canvasRef.current;
        if(!canvas||displayItems.length<1)return;
        const ctx=canvas.getContext('2d');
        const size=canvas.width;
        const cx=size/2,cy=size/2,r=size/2-4;
        const n=displayItems.length;
        const arc=2*Math.PI/n;

        ctx.clearRect(0,0,size,size);

        ctx.save();
        ctx.shadowColor='rgba(0,0,0,.1)';
        ctx.shadowBlur=20;
        ctx.beginPath();
        ctx.arc(cx,cy,r,0,2*Math.PI);
        ctx.fill();
        ctx.restore();

        for(let i=0;i<n;i++){
            const startAngle=i*arc-Math.PI/2;
            const endAngle=(i+1)*arc-Math.PI/2;
            ctx.beginPath();
            ctx.moveTo(cx,cy);
            ctx.arc(cx,cy,r,startAngle,endAngle);
            ctx.closePath();
            // ★ 원래 items 인덱스 기준으로 색상 유지
            const originalIdx=items.indexOf(displayItems[i]);
            ctx.fillStyle=WHEEL_COLORS[(originalIdx>=0?originalIdx:i)%WHEEL_COLORS.length];
            ctx.fill();
            ctx.strokeStyle='rgba(255,255,255,.5)';
            ctx.lineWidth=1.5;
            ctx.stroke();

            ctx.save();
            ctx.translate(cx,cy);
            ctx.rotate(startAngle+arc/2);
            ctx.fillStyle='#fff';
            ctx.font=`bold ${n>20?10:n>12?12:14}px 'Jua',sans-serif`;
            ctx.textAlign='center';
            ctx.textBaseline='middle';
            const textR=r*(n>20?.62:.58);
            const label=displayItems[i].length>(n>20?5:8)?displayItems[i].slice(0,(n>20?4:7))+'…':displayItems[i];
            ctx.fillText(label,textR,0);
            ctx.restore();
        }

        ctx.beginPath();
        ctx.arc(cx,cy,r,0,2*Math.PI);
        ctx.strokeStyle='rgba(255,255,255,.8)';
        ctx.lineWidth=3;
        ctx.stroke();
    },[displayItems,items]);

    const spinWheel=()=>{
        if(isSpinning||displayItems.length<1)return;
        // ★ 항목이 1개면 회전 의미 없음(전부 사용됨 상태) 또는 최소 2개 권장
        if(displayItems.length<2&&isNoRepeat){
            // 단일 남은 경우 바로 결정
        }
        ps('click');
        setIsSpinning(true);
        setResult(null);

        const n=displayItems.length;
        const arc=360/n;
        const extraSpins=5+Math.floor(Math.random()*5);
        const randomAngle=Math.random()*360;
        const totalRotation=extraSpins*360+randomAngle;
        const startRotation=rotation;
        const endRotation=startRotation+totalRotation;

        const duration=4000+Math.random()*2000;
        const startTime=performance.now();
        tickCountRef.current=0;

        const animate=(now)=>{
            const elapsed=now-startTime;
            const progress=Math.min(elapsed/duration,1);
            const eased=1-Math.pow(1-progress,3);
            const currentRot=startRotation+totalRotation*eased;
            setRotation(currentRot);

            const segmentsPassed=Math.floor(currentRot/arc);
            if(segmentsPassed>tickCountRef.current){
                tickCountRef.current=segmentsPassed;
                playTickSound();
            }

            if(progress<1){
                spinTimerRef.current=requestAnimationFrame(animate);
            }else{
                setRotation(endRotation);
                setIsSpinning(false);

                const finalAngle=((endRotation%360)+360)%360;
                const pointerOrigAngle=((360-finalAngle)%360+360)%360;
                const winnerIdx=Math.floor(pointerOrigAngle/arc)%n;
                const winner=displayItems[winnerIdx];

                setResult(winner);
                setHistory(prev=>[{text:winner,time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})},...prev].slice(0,20));
                // ★ 중복방지 ON일 때 사용된 항목 기록
                if(isNoRepeat)setUsedItems(prev=>[...prev,winner]);
                playFanfare();
                confetti({particleCount:150,spread:80,origin:{y:.5},colors:['#FFB7B2','#B5EAD7','#C7CEEA','#FECA57','#FF6B6B'],disableForReducedMotion:true});
            }
        };
        spinTimerRef.current=requestAnimationFrame(animate);
    };

    useEffect(()=>{return()=>{if(spinTimerRef.current)cancelAnimationFrame(spinTimerRef.current);};},[]);

    const wheelSize=typeof window!=='undefined'?(window.innerWidth<640?280:360):360;

    return(<div className="w-full max-w-2xl mx-auto space-y-3">
        <div className="bg-white rounded-2xl p-4 sm:p-5 soft-shadow border-2 border-[#FECA57]/40">
            <h2 className="text-lg sm:text-xl font-black text-[#4A4A4A] mb-3 flex items-center justify-center gap-2"><Icon name="circle-dot" size={20} className="text-[#FECA57]"/> 돌림판</h2>
            <div className="mb-3">
                <textarea value={itemsInput} onChange={e=>setItemsInput(e.target.value)} className="w-full p-2.5 bg-[#FFFDF0] rounded-xl border-2 border-transparent focus:border-[#FECA57] resize-none h-20 outline-none text-sm font-bold" placeholder="항목 입력 (쉼표, 줄바꿈, 탭으로 구분 · 최대 60개)&#10;예: 사과, 바나나, 딸기 또는 엑셀에서 복사+붙여넣기"/>
                <div className="flex items-center justify-between mt-1.5 px-1">
                    <p className="text-[10px] text-gray-400 font-bold">{parseItems()?`${parseItems().length}개 항목`:'최소 2개 이상 입력해주세요'}</p>
                    <button onClick={applyItems} disabled={!parseItems()} className="px-4 py-1.5 bg-[#FECA57] text-white rounded-lg font-black text-xs shadow-md active:scale-95 touch-target disabled:opacity-40 disabled:cursor-not-allowed transition-all">적용</button>
                </div>
            </div>

            {/* ★ 중복방지 컨트롤 영역 */}
            {items.length>=2&&<div className="flex flex-wrap items-center gap-2 pt-2 border-t border-gray-100">
                <button onClick={()=>{ps('click');setIsNoRepeat(!isNoRepeat);}} className={`px-3 py-1.5 rounded-lg text-[11px] font-bold border-2 transition-all ${isNoRepeat?'bg-[#FECA57] border-[#FECA57] text-white shadow-sm':'bg-white border-gray-200 text-gray-400'}`}>
                    중복방지 {isNoRepeat?'ON':'OFF'}
                </button>
                {isNoRepeat&&usedItems.length>0&&<button onClick={()=>{ps('click');setUsedItems([]);}} className="px-3 py-1.5 bg-white border-2 border-gray-200 rounded-lg text-[11px] font-bold text-gray-500 active:scale-95">
                    초기화 ({usedItems.length}개 사용됨)
                </button>}
                {isNoRepeat&&<span className="text-[10px] text-gray-400 font-bold ml-auto">남은 항목: {displayItems.length}/{items.length}</span>}
            </div>}
        </div>

        {items.length>=2&&<div className="bg-white rounded-2xl p-4 sm:p-6 soft-shadow border border-gray-100 flex flex-col items-center">
            {result&&<div className="wheel-result-pop mb-4 px-6 py-3 rounded-2xl text-center" style={{background:'linear-gradient(135deg,#FECA57 0%,#FF6348 100%)'}}>
                <p className="text-white text-[10px] font-bold mb-0.5">당첨!</p>
                <p className="text-white text-xl sm:text-2xl font-black">{result}</p>
            </div>}

            {/* ★ 모든 항목이 다 뽑혔을 때 안내 */}
            {isNoRepeat&&displayItems.length===0&&<div className="mb-4 px-6 py-3 rounded-2xl text-center bg-gray-100 border border-gray-200">
                <p className="text-gray-500 text-sm font-black">모든 항목을 뽑았습니다!</p>
                <p className="text-gray-400 text-[11px] font-bold mt-1">초기화 버튼을 눌러 다시 시작하세요</p>
            </div>}

            {displayItems.length>0&&<div className="wheel-container mb-4">
                <svg className="wheel-pointer" width="30" height="30" viewBox="0 0 30 30">
                    <polygon points="15,28 5,4 25,4" fill="#FF6348" stroke="white" strokeWidth="2"/>
                </svg>
                <div style={{transform:`rotate(${rotation}deg)`,transition:isSpinning?'none':'transform 0.1s'}}>
                    <canvas ref={canvasRef} width={wheelSize} height={wheelSize} style={{width:wheelSize,height:wheelSize}}/>
                </div>
                <div className="wheel-center">
                    <Icon name="circle-dot" size={20} className="text-gray-300"/>
                </div>
            </div>}

            <button onClick={spinWheel} disabled={isSpinning||displayItems.length<1} className="w-full sm:w-auto px-8 py-3.5 bg-gradient-to-r from-[#FECA57] to-[#FF6348] hover:from-[#FFD700] hover:to-[#FF4500] text-white rounded-full text-lg font-black shadow-lg active:scale-95 flex items-center justify-center gap-2 touch-target transition-all disabled:opacity-60 disabled:cursor-not-allowed">
                {isSpinning?<><Icon name="loader-2" size={18} className="animate-spin"/>돌리는 중...</>:displayItems.length===0?'모두 추첨 완료!':<><Icon name="zap" size={18}/>돌리기!</>}
            </button>

            <div className="mt-4 w-full">
                <div className="flex flex-wrap gap-1.5 justify-center">{items.map((item,i)=>{
                    const isUsed=isNoRepeat&&usedItems.includes(item);
                    return <span key={i} className="px-2.5 py-1 rounded-full text-[10px] font-bold text-white relative" style={{backgroundColor:WHEEL_COLORS[i%WHEEL_COLORS.length],opacity:isUsed?0.35:1,textDecoration:isUsed?'line-through':'none'}}>{item}</span>;
                })}</div>
            </div>
        </div>}

        {history.length>0&&<div className="bg-white/80 rounded-xl p-3 soft-shadow border border-gray-100">
            <div className="flex items-center justify-between mb-2">
                <span className="text-[10px] font-bold text-gray-400">추첨 기록 ({history.length})</span>
                <button onClick={()=>{ps('click');setHistory([]);}} className="text-[10px] text-red-300 font-bold">전체삭제</button>
            </div>
            <div className="flex flex-wrap gap-1.5">{history.map((h,i)=><div key={i} className="flex items-center gap-1 px-2.5 py-1.5 bg-[#FFFDF0] rounded-lg border border-[#FECA57]/30 text-xs font-bold text-gray-600"><span className="text-[#FECA57] font-black">{i+1}.</span> {h.text} <span className="text-[9px] text-gray-400">({h.time})</span></div>)}</div>
        </div>}
    </div>);
}

const LOTTO_BALL_COLORS=['#E74C3C','#E67E22','#27AE60','#2980B9','#8E44AD','#D35400','#16A085','#2C3E50','#C0392B','#7D3C98'];

// ===== 핀볼 게임 (구슬 레이스) =====
// 구슬이 장애물 코스를 굴러 내려가고, 결승선을 통과한 순서로 당첨자를 정한다.
// 물리는 직접 계산: 구슬(원) ↔ 벽(두께 있는 선분)·핀·범퍼·회전 막대, 구슬끼리 충돌
const PB={W:400,R:9,G:980,VMAX:780,DT:1/240,CELL:80,MAX:100};
// 충격파: 충전(예고) 시간 · 다음 발사까지 간격 · 범위 · 힘 · 쓸 수 있는 구간(출발 문 아래 TOP ~ 결승 위 SAFE)
const PB_SKILL={CHARGE:.7,MIN:1.2,RANGE:2.2,RAD:80,F:340,F0:60,TOP:40,SAFE:260};
// 역전 알림: 이만큼 확실히 앞서야 인정 · 출발 직후 뭉친 구간 무시 · 알림 최소 간격(초) · 표시 길이(프레임)
const PB_FLIP={LEAD:14,START:120,GAP:1,FRAMES:60};
const PB_COLORS=['#FF8A80','#FFD54F','#80D8FF','#B388FF','#FF80AB','#A7FFEB','#FFAB40','#EA80FC','#CCFF90','#8C9EFF','#FFF59D','#84FFFF','#FF9E80','#F48FB1','#B9F6CA','#FFE57F','#82B1FF','#E1BEE7','#FFCC80','#80CBC4'];
const PB_COURSES=[
    {id:'forest',name:'핀 숲',sub:'짧게',plan:['pins6','funnel','bumpers','pins4']},
    {id:'windmill',name:'풍차 마을',sub:'보통',plan:['pins5','zigzag4','windmills','bumpers','split','pins3']},
    {id:'adventure',name:'큰 바퀴 대모험',sub:'길게',plan:['pins6','windmills','zigzag4','bumpers','wheel','pins5','split','windmills','zigzag3','bumpers','wheel','pins4']}
];
const PB_RULES=[['first','첫 번째'],['last','마지막'],['nth','N번째'],['many','N명']];
let pbFontCache='',pbNX=0,pbNY=0;
const pbFont=()=>pbFontCache||(pbFontCache=getComputedStyle(document.body).fontFamily||'sans-serif');

// 코스 만들기: 구간(핀밭·깔때기·지그재그·풍차·범퍼·큰 바퀴·갈림길)을 위에서 아래로 쌓는다
function pbBuildCourse(courseId,count){
    const plan=(PB_COURSES.find(c=>c.id===courseId)||PB_COURSES[0]).plan;
    const {W,R}=PB,L=4,RT=W-4,MID=W/2,GAP=2*R+3;
    const segs=[],pins=[],bumps=[],spins=[];
    const seg=(x1,y1,x2,y2,w=3)=>segs.push({x1,y1,x2,y2,w});
    const pin=(x,y,r=5)=>pins.push({x,y,r});
    const bump=(x,y,r=16)=>bumps.push({x,y,r,hitT:-9});
    const spin=(x,y,len,arms,speed)=>spins.push({x,y,len,arms,speed,w:4,a:Math.random()*Math.PI*2});
    const cols=Math.floor((RT-L-10)/GAP);
    const gateY=Math.max(96,40+Math.ceil(count/cols)*GAP);
    let y=gateY+36;
    const sec={
        // 엇갈린 핀밭 (벽 쪽 작은 경사판: 벽을 타고 그대로 내려가는 것 방지)
        pins:n=>{const gx=46,gy=42;for(let i=0;i<n;i++){const yy=y+18+i*gy,off=i%2?gx/2:0;for(let k=-5;k<=5;k++){const x=MID+off+k*gx;if(x>L+30&&x<RT-30)pin(x,yy);}if(i%2===0){seg(L,yy-8,L+20,yy+8,2);seg(RT,yy-8,RT-20,yy+8,2);}}y+=18+n*gy+12;},
        funnel:()=>{seg(L,y,MID-36,y+120);seg(RT,y,MID+36,y+120);y+=146;},
        // 지그재그 경사로 + 떨어지는 곳의 핀
        zigzag:n=>{for(let i=0;i<n;i++){const yy=y+i*86;if(i%2===0){seg(L,yy,RT-96,yy+52);pin(RT-48,yy+58);}else{seg(RT,yy,L+96,yy+52);pin(L+48,yy+58);}}y+=n*86+40;},
        // 마주 도는 풍차 두 개 + 큰 십자 풍차
        windmills:()=>{spin(MID-90,y+80,66,2,2.4);spin(MID+90,y+80,66,2,-2.4);seg(L,y+150,L+60,y+190);seg(RT,y+150,RT-60,y+190);spin(MID,y+250,88,4,1.7);pin(L+40,y+262);pin(RT-40,y+262);y+=360;},
        // 범퍼: 맞으면 세게 튕겨 나간다
        bumpers:()=>{[[MID,40],[MID-72,100],[MID+72,100],[MID-144,160],[MID,160],[MID+144,160]].forEach(([x,dy])=>bump(x,y+dy));seg(L,y+60,L+30,y+90);seg(RT,y+60,RT-30,y+90);y+=212;},
        // 깔때기 아래 천천히 도는 큰 바퀴
        wheel:()=>{seg(L,y,MID-70,y+100);seg(RT,y,MID+70,y+100);spin(MID,y+230,118,4,1.25);pin(L+30,y+230,6);pin(RT-30,y+230,6);y+=380;},
        // 지붕으로 좌우로 갈랐다가 다시 모으기
        split:()=>{seg(MID,y,MID-90,y+70);seg(MID,y,MID+90,y+70);for(const d of [-1,1]){pin(MID+d*150,y+60);pin(MID+d*120,y+110);pin(MID+d*165,y+150);pin(MID+d*60,y+150);}seg(L,y+180,MID-60,y+250);seg(RT,y+180,MID+60,y+250);y+=280;}
    };
    plan.forEach(tok=>{const m=tok.match(/^([a-z]+)(\d*)$/);sec[m[1]](m[2]?Number(m[2]):0);});
    // 결승: 좁은 목으로 한 줄씩 통과 · 막힘 방지 휘젓개
    seg(L,y,MID-24,y+190);seg(RT,y,MID+24,y+190);
    spin(MID,y+135,34,2,3.4);
    seg(MID-24,y+190,MID-24,y+236);seg(MID+24,y+190,MID+24,y+236);
    const finishY=y+228,trayY=finishY+64,height=trayY+Math.ceil(count/cols)*GAP+40;
    // 세로 칸(CELL)별로 장애물을 나눠 담아 충돌 검사·그리기를 줄인다
    const grid=[];
    const add=(k,o,y0,y1)=>{const it={k,o,f:0};for(let c=Math.max(0,Math.floor((y0-R-2)/PB.CELL));c<=Math.floor((y1+R+2)/PB.CELL);c++)(grid[c]||(grid[c]=[])).push(it);};
    segs.forEach(s=>add('s',s,Math.min(s.y1,s.y2)-s.w,Math.max(s.y1,s.y2)+s.w));
    pins.forEach(p=>add('p',p,p.y-p.r,p.y+p.r));
    bumps.forEach(b=>add('b',b,b.y-b.r,b.y+b.r));
    return {segs,pins,bumps,spins,grid,cols,gateY,finishY,trayY,height};
}

function pbShuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// 출발 칸에 구슬을 무작위 순서로 세운 새 경기
function pbCreateWorld(courseId,entries){
    const c=pbBuildCourse(courseId,entries.length),R=PB.R,GAP=2*R+3;
    const marbles=entries.map((e,i)=>({id:i,key:e.key,text:e.text,label:e.label,inside:e.inside,color:PB_COLORS[i%PB_COLORS.length],x:0,y:0,vx:0,vy:0,done:false,rank:0,win:false,chkX:0,chkY:0,chkT:0}));
    pbShuffle(marbles.map((_,i)=>i)).forEach((mi,s)=>{const row=Math.floor(s/c.cols),inRow=Math.min(c.cols,marbles.length-row*c.cols),m=marbles[mi];m.x=PB.W/2+(s%c.cols-(inRow-1)/2)*GAP;m.y=c.gateY-R-4-row*GAP;});
    return {...c,marbles,act:[],finished:[],waves:[],t:0,acc:0,ts:1,open:false,running:false,decided:false,slow:false,dec:null,need:1,rule:'first',ruleText:'',nextSkill:2,charge:null,lastLead:null,flipT:-9,flash:null,frame:0,cam:{x:PB.W/2,y:0,z:1,look:null,manualUntil:0}};
}

// 구슬 m을 점(px,py)에서 minD 밖으로 밀어내고 튕긴다. (sx,sy)=닿은 면의 속도(회전 막대)
// 닿지 않았으면 null, 닿았으면 부딪힌 속도(음수일수록 세게) · 법선은 pbNX,pbNY
function pbPush(m,px,py,minD,e,fr,sx,sy){
    let nx=m.x-px,ny=m.y-py;const d2=nx*nx+ny*ny;
    if(d2>=minD*minD)return null;
    const d=Math.sqrt(d2);if(d<1e-6){nx=0;ny=-1;}else{nx/=d;ny/=d;}
    m.x=px+nx*minD;m.y=py+ny*minD;pbNX=nx;pbNY=ny;
    const rvx=m.vx-sx,rvy=m.vy-sy,vn=rvx*nx+rvy*ny;
    if(vn<0){const vt=rvy*nx-rvx*ny,nvn=vn<-40?-vn*e:0,nvt=vt*(1-fr);m.vx=sx+nx*nvn-ny*nvt;m.vy=sy+ny*nvn+nx*nvt;}
    return vn;
}
function pbSeg(m,x1,y1,x2,y2,w,e,fr,sp){
    const lim=PB.R+w;
    if(m.x<Math.min(x1,x2)-lim||m.x>Math.max(x1,x2)+lim||m.y<Math.min(y1,y2)-lim||m.y>Math.max(y1,y2)+lim)return null;
    const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
    let t=l2?((m.x-x1)*dx+(m.y-y1)*dy)/l2:0;t=t<0?0:t>1?1:t;
    const px=x1+dx*t,py=y1+dy*t;
    return pbPush(m,px,py,lim,e,fr,sp?-sp.speed*(py-sp.y):0,sp?sp.speed*(px-sp.x):0);
}

function pbStep(w,dt,ctl){
    const {R,G,VMAX,W}=PB,act=w.act,lo=4+R,hi=W-4-R,D=2*R,D2=D*D;
    w.t+=dt;
    for(const s of w.spins)s.a+=s.speed*dt;
    for(const m of act){
        m.vy+=G*dt;
        const sp=m.vx*m.vx+m.vy*m.vy;if(sp>VMAX*VMAX){const k=VMAX/Math.sqrt(sp);m.vx*=k;m.vy*=k;}
        m.x+=m.vx*dt;m.y+=m.vy*dt;
    }
    // 구슬끼리: y로 정렬해 가까운 것만 검사
    act.sort((a,b)=>a.y-b.y);
    for(let i=0;i<act.length;i++){const p=act[i];for(let j=i+1;j<act.length;j++){const q=act[j],dy=q.y-p.y;if(dy>=D)break;const dx=q.x-p.x,d2=dx*dx+dy*dy;if(d2>=D2||d2<1e-9)continue;const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=(D-d)/2;p.x-=nx*ov;p.y-=ny*ov;q.x+=nx*ov;q.y+=ny*ov;const vn=(q.vx-p.vx)*nx+(q.vy-p.vy)*ny;if(vn<0){const jn=-.78*vn;p.vx-=jn*nx;p.vy-=jn*ny;q.vx+=jn*nx;q.vy+=jn*ny;}}}
    // 벽·핀·범퍼·회전 막대
    let finished=false;
    for(const m of act){
        if(m.x<lo){m.x=lo;if(m.vx<0)m.vx*=-.4;}else if(m.x>hi){m.x=hi;if(m.vx>0)m.vx*=-.4;}
        if(m.y<R){m.y=R;if(m.vy<0)m.vy=0;}
        const cell=w.grid[Math.floor(m.y/PB.CELL)];
        if(cell)for(const it of cell){const o=it.o;let vn;
            if(it.k==='s'){vn=pbSeg(m,o.x1,o.y1,o.x2,o.y2,o.w,.32,.004,null);if(vn!==null&&vn<-170)ctl.hit('wall',m);}
            else if(it.k==='p'){vn=pbPush(m,o.x,o.y,R+o.r,.5,.01,0,0);if(vn!==null&&vn<-140)ctl.hit('pin',m);}
            else{vn=pbPush(m,o.x,o.y,R+o.r,.75,0,0,0);if(vn!==null&&vn<-10){const k=200+Math.random()*80;m.vx+=pbNX*k;m.vy+=pbNY*k;o.hitT=w.t;ctl.hit('bump',m);}}
        }
        for(const s of w.spins){const reach=s.len+s.w+R;if(Math.abs(m.y-s.y)>reach||Math.abs(m.x-s.x)>reach)continue;
            for(let k=0;k<s.arms;k++){const a=s.a+k*Math.PI*2/s.arms,vn=pbSeg(m,s.x,s.y,s.x+Math.cos(a)*s.len,s.y+Math.sin(a)*s.len,s.w,.4,.02,s);if(vn!==null&&vn<-200)ctl.hit('spin',m);}}
        if(!isFinite(m.x)||!isFinite(m.y)){m.x=W/2;m.y=w.gateY+20;m.vx=m.vy=0;}
        if(m.y>w.finishY){m.done=true;m.rank=w.finished.length+1;w.finished.push(m);finished=true;ctl.finish(w,m);}
    }
    if(finished)w.act=act.filter(m=>!m.done);
}

// 당첨을 가르는 구슬: 이 구슬이 들어오는 순간 당첨이 정해진다 (카메라가 따라감)
function pbDecider(w){
    if(!w.act.length)return null;
    const s=w.act.slice().sort((a,b)=>b.y-a.y);
    return s[Math.max(0,Math.min(s.length-1,w.need-w.finished.length-1))];
}

function pbTick(w,real,ctl){
    if(!w.running){for(const s of w.spins)s.a+=s.speed*real*.6;w.slow=false;w.dec=null;return;}
    const d=w.dec=w.decided?null:pbDecider(w);
    // 결승 직전 접전이면 슬로모션
    w.slow=!!d&&d.y>w.finishY-150&&w.act.some(m=>m!==d&&Math.abs(m.y-d.y)<100);
    w.ts+=((w.slow?.32:ctl.fast?2.2:1)-w.ts)*Math.min(1,real*5);
    w.acc+=real*w.ts;let n=0;
    while(w.acc>=PB.DT&&n<48){pbStep(w,PB.DT,ctl);w.acc-=PB.DT;n++;}
    if(n>=48)w.acc=0;
    // 오래 멈춘 구슬은 살짝 튕겨 준다
    for(const m of w.act){if(w.t-m.chkT>1.3){if(Math.hypot(m.x-m.chkX,m.y-m.chkY)<6){m.vx+=(Math.random()-.5)*320;m.vy-=180+Math.random()*140;}m.chkX=m.x;m.chkY=m.y;m.chkT=w.t;}}
    if(!w.decided)pbFlip(w,ctl);
    // 충격파 스킬: 무작위 구슬 하나가 충전(예고)한 뒤 주변 구슬을 밀어낸다 (결승 근처에서는 쓰지 않음)
    const K=PB_SKILL;
    if(ctl.skill){
        if(!w.charge&&!w.slow&&w.t>=w.nextSkill){
            // 충전 중에도 굴러 내려가므로 금지 구간보다 넉넉히 위에 있는 구슬만 고른다
            const pool=w.act.filter(m=>m.y>w.gateY+K.TOP&&m.y<w.finishY-K.SAFE-120);
            // 화면에 보이는 구슬을 먼저 고른다 (연출이 화면 밖에서 낭비되지 않게)
            const half=ctl.view?ctl.view.ch/2/(ctl.view.s*w.cam.z)+20:1e9;
            const vis=pool.filter(m=>Math.abs(m.y-w.cam.y)<half),src=vis.length>1?vis:pool;
            if(src.length>1){const c=src[Math.floor(Math.random()*src.length)];w.charge={m:c,t0:w.t,dur:K.CHARGE*(ctl.fast?1.8:1)};ctl.hit('charge',c);}
            else w.nextSkill=w.t+.6;
        }
        const ch=w.charge;
        if(ch){
            const c=ch.m;
            if(c.done||c.y>=w.finishY-K.SAFE){w.charge=null;w.nextSkill=w.t+.5;}   // 충전 중 금지 구간에 들어가면 취소
            else if(w.t-ch.t0>=ch.dur){
                w.waves.push({x:c.x,y:c.y,t0:w.t});
                for(const m of w.act){if(m===c)continue;const dx=m.x-c.x,dy=m.y-c.y,dd=Math.hypot(dx,dy);if(dd<K.RAD&&dd>.01){const f=(1-dd/K.RAD)*K.F+K.F0;m.vx+=dx/dd*f;m.vy+=dy/dd*f;}}
                ctl.hit('wave',c);
                w.charge=null;w.nextSkill=w.t+K.MIN+Math.random()*K.RANGE;
            }
        }
    }else w.charge=null;
    if(w.waves.length)w.waves=w.waves.filter(v=>w.t-v.t0<.5);
    if(!w.act.length){w.running=false;w.slow=false;w.dec=null;w.charge=null;ctl.done(w);}
}

// 역전 알림: 당첨 자리의 구슬(마지막 규칙은 꼴찌 구슬)이 바뀌면 크게 알린다. 물리에는 영향 없음
function pbFlip(w,ctl){
    if(!w.act.length)return;
    const last=w.rule==='last';
    const d=last?w.act.reduce((a,b)=>b.y<a.y?b:a):pbDecider(w),o=w.lastLead;
    if(!o||o.done){w.lastLead=d;return;}
    if(o===d)return;
    const ahead=last?o.y-d.y:d.y-o.y;
    if(ahead<=-PB_FLIP.LEAD){w.lastLead=d;return;}   // 옛 구슬이 다른 자리로 빠져나간 경우: 조용히 바꿈
    if(ahead<PB_FLIP.LEAD)return;                     // 나란히 떨리는 정도는 무시
    w.lastLead=d;
    if(d.y>w.gateY+PB_FLIP.START&&w.t-w.flipT>=PB_FLIP.GAP){
        const m=last?o:d,name=m.text.length>8?m.text.slice(0,8)+'…':m.text;
        w.flipT=w.t;w.flash={text:`${last?'꼴찌 탈출!':'역전!'} ${name}`,f0:w.frame,m};ctl.hit('flip',m);
    }
}

// 화면 배치: 넓으면 왼쪽 미니맵 · 오른쪽 순위판 자리를 비워 둔다
function pbView(cw,ch,dpr){
    const wide=cw>=760,left=wide?86:0,right=wide?220:0,area=cw-left-right;
    return {cw,ch,dpr,wide,left,right,s:Math.min((area-20)/PB.W,ch/420),cx:left+area/2,cy:ch/2};
}

function pbCamera(w,v,real){
    const cam=w.cam;let ty,tx=PB.W/2,tz=1;
    if(cam.look!==null&&performance.now()<cam.manualUntil)ty=cam.look;
    else{
        cam.look=null;
        if(!w.open)ty=0;
        else{
            const t=w.dec||(w.act.length?w.act.reduce((a,b)=>b.y>a.y?b:a):null);
            if(t){ty=t.y+v.ch/(v.s*cam.z)*.12;tx=t.x;}else ty=w.trayY;
            if(w.slow)tz=1.55;
        }
    }
    cam.z+=(tz-cam.z)*Math.min(1,real*2.5);
    const S=v.s*cam.z,halfH=v.ch/2/S,halfW=(v.cw-v.left-v.right)/2/S;
    ty=w.height<2*halfH?w.height/2:Math.max(halfH-24,Math.min(w.height-halfH+24,ty));
    tx=PB.W+24<2*halfW?PB.W/2:Math.max(halfW-12,Math.min(PB.W-halfW+12,tx));
    const k=Math.min(1,real*(cam.look!==null?12:4.2));
    cam.y+=(ty-cam.y)*k;cam.x+=(tx-cam.x)*k;
}

// 미니맵 바탕은 코스·화면 크기가 바뀔 때만 다시 그린다
function pbMinimap(w,v){
    if(!v||!v.wide)return null;
    const k=Math.min((v.left-28)/PB.W,(v.ch-28)/w.height),mw=PB.W*k,mh=w.height*k;
    const img=document.createElement('canvas');img.width=Math.ceil(mw*v.dpr);img.height=Math.ceil(mh*v.dpr);
    const g=img.getContext('2d');g.scale(v.dpr*k,v.dpr*k);
    g.fillStyle='#173d30';g.fillRect(0,0,PB.W,w.height);
    g.lineCap='round';g.strokeStyle='#cfe8bd';g.lineWidth=Math.max(6,1.3/k);
    g.beginPath();for(const s of w.segs){g.moveTo(s.x1,s.y1);g.lineTo(s.x2,s.y2);}g.stroke();
    g.fillStyle='#cfe8bd';for(const p of w.pins){g.beginPath();g.arc(p.x,p.y,Math.max(p.r,.9/k),0,Math.PI*2);g.fill();}
    g.fillStyle='#ffd166';for(const b of w.bumps){g.beginPath();g.arc(b.x,b.y,b.r,0,Math.PI*2);g.fill();}
    g.strokeStyle='#ffb38a';g.lineWidth=Math.max(5,1/k);for(const s of w.spins){g.beginPath();g.arc(s.x,s.y,s.len,0,Math.PI*2);g.stroke();}
    g.fillStyle='#ffffff';g.fillRect(PB.W/2-24,w.finishY-6,48,12);
    return {img,k,w:mw,h:mh,x:(v.left-mw)/2,y:14};
}

function pbDraw(ctx,w,v,mm){
    const R=PB.R,GAP=2*R+3,cam=w.cam,S=v.s*cam.z,F=pbFont(),TAU=Math.PI*2;
    w.frame++;
    ctx.setTransform(v.dpr,0,0,v.dpr,0,0);
    ctx.fillStyle='#0d241b';ctx.fillRect(0,0,v.cw,v.ch);
    const top=cam.y-v.cy/S,bot=cam.y+(v.ch-v.cy)/S,y0=Math.max(0,top),y1=Math.min(w.height,bot);
    ctx.save();
    ctx.translate(v.cx-cam.x*S,v.cy-cam.y*S);ctx.scale(S,S);
    ctx.fillStyle='#173d30';ctx.fillRect(0,y0,PB.W,y1-y0);
    ctx.fillStyle='rgba(255,255,255,.022)';for(let yy=Math.floor(y0/240)*240;yy<y1;yy+=240)ctx.fillRect(0,yy,PB.W,120);
    // 화면에 보이는 장애물만 그린다
    const segs=[],pins=[],bumps=[];
    for(let c=Math.max(0,Math.floor((top-30)/PB.CELL));c<=Math.floor((bot+30)/PB.CELL);c++){const cell=w.grid[c];if(!cell)continue;for(const it of cell){if(it.f===w.frame)continue;it.f=w.frame;(it.k==='s'?segs:it.k==='p'?pins:bumps).push(it.o);}}
    ctx.lineCap='round';ctx.lineJoin='round';
    ctx.beginPath();ctx.moveTo(2,y0);ctx.lineTo(2,y1);ctx.moveTo(PB.W-2,y0);ctx.lineTo(PB.W-2,y1);
    for(const s of segs){ctx.moveTo(s.x1,s.y1);ctx.lineTo(s.x2,s.y2);}
    ctx.strokeStyle='rgba(190,230,165,.15)';ctx.lineWidth=13;ctx.stroke();
    ctx.strokeStyle='#cfe8bd';ctx.lineWidth=6;ctx.stroke();
    ctx.fillStyle='#eef7e6';ctx.beginPath();for(const p of pins){ctx.moveTo(p.x+p.r,p.y);ctx.arc(p.x,p.y,p.r,0,TAU);}ctx.fill();

                    {teamNames&&teamNames.trim()&&<button className="pb-btn sm" disabled={busy} onClick={()=>{ps('click');setNamesInput(teamNames);}}><Icon name="users" size={13}/> 모둠 만들기 이름 불러오기</button>}
                </div>
            </div>}
            <div className="pb-row">
                <span className="pb-label">코스</span>
                <div className="pb-seg">{PB_COURSES.map(c=><button key={c.id} disabled={busy} className={courseId===c.id?'on':''} onClick={()=>{ps('click');setCourseId(c.id);}}>{c.name}<small>{c.sub}</small></button>)}</div>
            </div>

                <span className="pb-label">당첨</span>
                <div className="pb-seg">{PB_RULES.map(([k,t])=><button key={k} disabled={busy} className={rule===k?'on':''} onClick={()=>{ps('click');setRule(k);}}>{t}</button>)}</div>
                {(rule==='nth'||rule==='many')&&<div className="pb-step">
                    <button disabled={busy||nVal<=nMin} onClick={()=>{ps('click');setRuleN(nVal-1);}} aria-label="줄이기"><Icon name="minus" size={14}/></button>
                    <span>{rule==='nth'?`${nVal}번째`:`${nVal}명`}</span>
                    <button disabled={busy||nVal>=nMax} onClick={()=>{ps('click');setRuleN(nVal+1);}} aria-label="늘리기"><Icon name="plus" size={14}/></button>

                <span className="pb-hint">{ruleText}{rule==='many'?'이 모두 당첨':'이 당첨'}</span>

            <div className="pb-row">

                <button className={'pb-toggle '+(noRepeat?'on':'')} disabled={busy} onClick={()=>{ps('click');setNoRepeat(!noRepeat);}} title="한 번 당첨된 사람은 다음 판부터 빠집니다"><Icon name="user-check" size={14}/> 당첨자 제외 {noRepeat?'ON':'OFF'}</button>
                {used.length>0&&<button className="pb-toggle" disabled={busy} onClick={()=>{ps('click');setUsed([]);}} title={'제외됨: '+usedText}><Icon name="rotate-ccw" size={14}/> 제외 초기화 ({used.length})</button>}
            </div>
        </div>

        <div className="pb-arena" ref={arenaRef}>
            <div className="pb-bar">
                {phase==='running'?<>
                    <button className={'pb-btn '+(fast?'on':'')} onClick={()=>{ps('click');setFast(!fast);}}><Icon name="fast-forward" size={15}/> 빠르게 {fast?'ON':'OFF'}</button>
                    <button className="pb-btn" onClick={reset}><Icon name="rotate-ccw" size={15}/> 처음으로</button>
                </>:<>
                    <button className="pb-btn primary" disabled={count<2} onClick={()=>{ps('click');phase==='ready'?startRace():restart();}}><Icon name="play" size={15}/> {phase==='ready'?'시작':'다시 하기'}</button>
                    <button className="pb-btn" disabled={phase!=='ready'||count<2} onClick={()=>{ps('click');setShuffleKey(k=>k+1);}}><Icon name="shuffle" size={15}/> 섞기</button>
                    {phase==='over'&&<button className="pb-btn" onClick={reset}><Icon name="rotate-ccw" size={15}/> 처음으로</button>}
                </>}
                <span className="pb-status">{status}</span>
                <button className="pb-btn" onClick={toggleFull} title={isFull?'전체 화면 끝내기':'경기장을 전체 화면으로 보기'}><Icon name={isFull?'minimize':'maximize'} size={15}/> {isFull?'작게':'전체 화면'}</button>
            </div>
            <div className="pb-stage" ref={stageRef}>
                <canvas ref={canvasRef} onPointerDown={onPointerDown} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerCancel={onPointerUp} aria-label="핀볼 경기장"/>
                {wide&&<div className="pb-rank">
                    <div className="pb-rank-head">도착 순위<span>{phase==='ready'?`구슬 ${count}개`:`${ranking.length} / ${total}`}</span></div>
                    {ranking.length?<ol>{ranking.map(r=><li key={r.id} className={r.win?'win':''}><b>{r.rank}</b><i style={{background:r.color}}/><span>{r.text}</span>{r.win&&<Icon name="trophy" size={13}/>}</li>)}</ol>
                    :<p className="pb-rank-empty">{phase==='ready'?'시작하면 결승선을 통과한 순서대로 여기에 표시돼요.':'아직 도착한 구슬이 없어요.'}</p>}
                </div>}
                {phase==='ready'&&count>=2&&<button className="pb-go" onClick={()=>{ps('click');startRace();}}><Icon name="play" size={22}/> 시작</button>}
                {phase==='ready'&&count<2&&<div className="pb-empty">구슬이 2개 이상 있어야 시작할 수 있어요.<br/>{source==='name'?'위 칸에 이름을 입력해 주세요.':'제외 번호나 당첨자 제외를 확인해 주세요.'}</div>}
                {showWin&&result&&<div className="pb-winner" onClick={()=>setShowWin(false)}>
                    <div className="pb-winner-card" role="dialog" aria-label="당첨 결과" onClick={e=>e.stopPropagation()}>
                        <p>{result.ruleText} · 당첨</p>
                        <div className={'pb-winner-names'+(result.list.length>2?' many':'')}>{result.list.map(x=><span key={x.id}><i style={{background:x.color}}/>{x.text}</span>)}</div>
                        <div className="pb-winner-actions">
                            <button className="pb-btn primary" onClick={()=>{ps('click');restart();}}><Icon name="rotate-ccw" size={15}/> {noRepeat?'다음 판 (당첨자 제외)':'다시 하기'}</button>
                            {!noRepeat&&<button className="pb-btn" onClick={()=>{ps('click');restartWithout();}}><Icon name="user-minus" size={15}/> 당첨자 빼고 다시</button>}
                            <button className="pb-btn" onClick={()=>{ps('click');setShowWin(false);}}>닫기</button>
                        </div>
                    </div>
                </div>}
                <canvas className="pb-confetti" ref={confettiRef}/>
            </div>
            {!wide&&phase!=='ready'&&<div className="pb-panel">
                <div className="pb-row" style={{justifyContent:'space-between'}}><span className="pb-label">도착 순위</span><span className="pb-hint">{ranking.length} / {total}</span></div>
                {ranking.length>0&&<div className="pb-history">{ranking.map(r=><span key={r.id} className={r.win?'win':''}><b>{r.rank}</b><i style={{background:r.color}}/>{r.text}</span>)}</div>}
            </div>}
        </div>

        {history.length>0&&<div className="pb-panel">
            <div className="pb-row" style={{justifyContent:'space-between'}}><span className="pb-label">당첨 기록</span><button className="pb-btn sm" onClick={()=>{ps('click');setHistory([]);}}>기록 지우기</button></div>
            <div className="pb-history">{history.map(h=><span key={h.id}>{h.names}<small>{h.rule} · {h.time}</small></span>)}</div>
        </div>}
    </div>);
}

// 사다리 게임: 위 칸(이름·번호) → 아래 칸(등수 자동 · 직접 입력 · 당첨/꽝)
// 결과 순서를 먼저 고르게 섞고 그 결과가 나오도록 사다리를 만든다 → 어느 칸에 서도 결과 확률이 같다
const LD={MIN:2,MAX:40,PAD:18};
const ldShuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const ldBuild=n=>{
    const target=ldShuffle([...Array(n).keys()]);           // target[출발 칸] = 도착 칸
    const rows=[];
    // 1) 꾸밈용 무작위 가로줄 (같은 높이에서 이웃한 가로줄은 만들지 않음, 모든 칸 사이에 최소 1개)
    for(let l=0;l<(n<=3?5:4);l++){const r=[];for(let g=0;g<n-1;g++)if(!r.includes(g-1)&&Math.random()<.42)r.push(g);rows.push(r);}
    for(let g=0;g<n-1;g++){if(rows.some(r=>r.includes(g)))continue;const free=rows.filter(r=>!r.includes(g-1)&&!r.includes(g+1));if(free.length)free[Math.floor(Math.random()*free.length)].push(g);else rows.push([g]);}
    // 2) 홀짝 자리바꿈으로 목표 결과에 맞춘다
    const at=[...Array(n).keys()];                          // at[칸] = 지금 그 칸에 있는 사람
    rows.forEach(r=>r.forEach(g=>{[at[g],at[g+1]]=[at[g+1],at[g]];}));
    for(let k=0;k<2*n+2&&at.some((t,p)=>target[t]!==p);k++){const r=[];for(let g=k%2;g<n-1;g+=2)if(target[at[g]]>target[at[g+1]]){r.push(g);[at[g],at[g+1]]=[at[g+1],at[g]];}if(r.length)rows.push(r);}
    const L=rows.length,rungs=[];
    rows.forEach((r,k)=>r.forEach(g=>rungs.push({g,k,y:(k+.5+(Math.random()-.5)*.56)/L})));
    const paths=[...Array(n).keys()].map(c=>{
        let p=c;const pts=[[c,0]];
        for(let k=0;k<L;k++){const rg=rungs.find(o=>o.k===k&&(o.g===p-1||o.g===p));if(!rg)continue;const np=rg.g===p?p+1:p-1;pts.push([p,rg.y],[np,rg.y]);p=np;}
        pts.push([p,1]);return{pts,end:p};
    });
    return{id:Math.random().toString(36).slice(2),n,levels:L,rungs,paths};
};
// 칸 좌표(열, 0~1) → 화면 좌표. 양 끝은 판 가장자리, 가로줄은 위아래 여백 안쪽
const ldPx=([c,y],cw,H)=>[(c+.5)*cw,y<=0?0:y>=1?H:LD.PAD+y*(H-2*LD.PAD)];
const ldGeom=(pts,cw,H)=>{const P=pts.map(p=>ldPx(p,cw,H));let len=0;const seg=[],ticks=[];for(let i=1;i<P.length;i++){const[x0,y0]=P[i-1],[x1,y1]=P[i],d=Math.hypot(x1-x0,y1-y0);if(y0===y1&&x0!==x1)ticks.push(len);seg.push({x0,y0,x1,y1,d,s:len});len+=d;}return{P,len,seg,ticks:ticks.map(t=>t/(len||1)),d:'M'+P.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')};};
// 좁은 칸에서도 글자가 잘리지 않게 칸 폭에 맞춰 글자 크기를 줄이고, 그래도 넘치면 두 줄로 (한글·화살표 1em, 숫자·영문 약 0.62em으로 어림)
const ldFit=(text,avail,max=13,min=10)=>{if(!(avail>0))return undefined;const em=[...String(text)].reduce((s,ch)=>s+(/[ㄱ-힣←-⇿]/.test(ch)?1:ch===' '?.32:.62),0)||1;const fs=Math.floor(Math.min(max,avail/em)*10)/10;return fs>=min?{fontSize:fs}:{fontSize:min,whiteSpace:'normal',wordBreak:'break-all',lineHeight:1.2};};
const ldAt=(g,f)=>{const t=f*g.len;for(let i=0;i<g.seg.length;i++){const s=g.seg[i];if(t<=s.s+s.d||i===g.seg.length-1){const u=s.d?Math.min(1,Math.max(0,(t-s.s)/s.d)):0;return[s.x0+(s.x1-s.x0)*u,s.y0+(s.y1-s.y0)*u];}}return[0,0];};

function LadderGame({students,excludedNums,teamNames,playSound:ps}){
    const [n,setN]=useState(6);
    const [tops,setTops]=useState(()=>Array(LD.MAX).fill(''));
    const [bots,setBots]=useState(()=>Array(LD.MAX).fill(''));
    const [botMode,setBotMode]=useState('rank');         // rank: 등수 자동 · custom: 직접 입력 · win: 당첨/꽝
    const [winCount,setWinCount]=useState(1);
    const [winSeed,setWinSeed]=useState(()=>Math.random());
    const [hide,setHide]=useState(true);
    const [phase,setPhase]=useState('setup');            // setup · play
    const [ladder,setLadder]=useState(null);
    const [prog,setProg]=useState({});                   // 열 → 0~1 (1이면 도착)
    const [revealed,setRevealed]=useState(false);
    const [flash,setFlash]=useState(null);
    const [size,setSize]=useState({w:0,h:0});
    const [isFull,setIsFull]=useState(false);
    const [copied,setCopied]=useState(false);
    const [askRedraw,setAskRedraw]=useState(false);
    const [swapMode,setSwapMode]=useState(false);        // 눌러서 맞바꾸기
    const [swapSel,setSwapSel]=useState(null);           // 먼저 고른 칸
    const [swapAnim,setSwapAnim]=useState({cols:[],k:0});// 방금 자리가 바뀐 칸 (튀는 효과)
    const arenaRef=useRef(null),boardRef=useRef(null),confRef=useRef(null),confFnRef=useRef(null),animRef=useRef({items:{},raf:0}),finishRef=useRef(null);
    const psRef=useRef(ps);psRef.current=ps;
    const play=phase==='play';

    const nameOf=c=>(tops[c]||'').trim()||`${c+1}번`;
    const winSlots=useMemo(()=>{let s=Math.floor(winSeed*2147483646)+1;const rnd=()=>(s=s*16807%2147483647)/2147483647;const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a.slice(0,Math.min(winCount,n-1));},[n,winCount,winSeed]);
    const prizeOf=j=>botMode==='rank'?`${j+1}등`:botMode==='win'?(winSlots.includes(j)?'당첨':'꽝'):((bots[j]||'').trim()||'(빈칸)');
    const isGold=j=>botMode==='rank'?j===0:botMode==='win'?winSlots.includes(j):false;
    const color=c=>PB_COLORS[c%PB_COLORS.length];
    const doneCols=play&&ladder?[...Array(n).keys()].filter(c=>prog[c]>=1):[];
    const allDone=play&&doneCols.length===n;
    const showRungs=play&&(!hide||revealed||allDone);
    const canArrange=!play||!Object.keys(prog).length;   // 아무도 타기 전까지는 위 칸 자리를 바꿀 수 있다

    useEffect(()=>{
        const el=boardRef.current;if(!el)return;
        const ro=new ResizeObserver(()=>setSize({w:el.clientWidth,h:el.clientHeight}));ro.observe(el);
        return()=>ro.disconnect();
    },[]);
    useEffect(()=>{
        const f=()=>setIsFull(!!(document.fullscreenElement||document.webkitFullscreenElement));
        document.addEventListener('fullscreenchange',f);document.addEventListener('webkitfullscreenchange',f);
        return()=>{document.removeEventListener('fullscreenchange',f);document.removeEventListener('webkitfullscreenchange',f);};
    },[]);
    // '모두 공개했어요'는 잠깐만 보여 주고 사다리를 가리지 않게 치운다
    useEffect(()=>{if(!flash||!(flash.all||flash.redraw))return;const t=setTimeout(()=>setFlash(f=>f&&(f.all||f.redraw)?null:f),flash.redraw?1800:2500);return()=>clearTimeout(t);},[flash]);
    useEffect(()=>{if(!askRedraw)return;const t=setTimeout(()=>setAskRedraw(false),5000);return()=>clearTimeout(t);},[askRedraw]);
    useEffect(()=>()=>{cancelAnimationFrame(animRef.current.raf);if(confFnRef.current&&confFnRef.current.reset)confFnRef.current.reset();},[]);

    const stopAnims=()=>{cancelAnimationFrame(animRef.current.raf);animRef.current={items:{},raf:0};};
    const toggleFull=()=>{
        ps('click');const el=arenaRef.current;if(!el)return;
        if(document.fullscreenElement||document.webkitFullscreenElement)(document.exitFullscreen||document.webkitExitFullscreen).call(document);
        else{const req=el.requestFullscreen||el.webkitRequestFullscreen;if(req){const p=req.call(el);if(p&&p.catch)p.catch(()=>{});}}
    };
    const burst=j=>{
        if(!window.confetti||!confRef.current)return;
        if(!confFnRef.current)confFnRef.current=window.confetti.create(confRef.current,{resize:true});
        confFnRef.current({particleCount:70,spread:60,startVelocity:32,origin:{x:(j+.5)/n,y:.92},colors:['#ffd166','#80d8ff','#ff8a80','#ccff90','#ffffff'],disableForReducedMotion:true});
    };

    // 위·아래 칸 채우기
    const setAt=(which,i,v)=>(which==='top'?setTops:setBots)(a=>{const b=a.slice();b[i]=v;return b;});
    const spread=(which,i,text)=>{
        const parts=text.split(/\r?\n|\t|,/).map(s=>s.trim()).filter(Boolean);
        if(parts.length<2)return false;
        (which==='top'?setTops:setBots)(a=>{const b=a.slice();parts.slice(0,LD.MAX-i).forEach((p,k)=>{b[i+k]=p.slice(0,which==='top'?20:30);});return b;});
        setN(v=>Math.min(LD.MAX,Math.max(v,i+parts.length)));
        return true;
    };
    const onKey=(which,i)=>e=>{if(e.key!=='Enter'||e.nativeEvent.isComposing)return;e.preventDefault();const nx=e.currentTarget.closest('.ld-cols').querySelector(`[data-${which}="${i+1}"]`);if(nx)nx.focus();};
    const fillNumbers=()=>{const nums=students.filter(x=>!excludedNums.includes(x)).slice(0,LD.MAX);if(nums.length<LD.MIN)return;ps('click');setTops(a=>{const b=a.slice();nums.forEach((x,k)=>{b[k]=`${x}번`;});return b;});setN(nums.length);setSwapSel(null);};
    const teamList=(teamNames||'').split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);
    const fillTeam=()=>{if(teamList.length<LD.MIN)return;ps('click');const l=teamList.slice(0,LD.MAX);setTops(a=>{const b=a.slice();l.forEach((x,k)=>{b[k]=x.slice(0,20);});return b;});setN(l.length);setSwapSel(null);};
    const clearRow=which=>{ps('click');(which==='top'?setTops:setBots)(Array(LD.MAX).fill(''));if(which==='top')setSwapSel(null);};
    const changeN=v=>{const m=Math.min(LD.MAX,Math.max(LD.MIN,v));if(m===n)return;ps('click');setN(m);setWinCount(w=>Math.min(w,m-1));setSwapSel(null);};
    // 위 칸 자리 섞기·맞바꾸기 (빈칸은 보이는 이름 '3번'을 그대로 옮긴다)
    const bump=cols=>setSwapAnim(a=>({cols,k:a.k+1}));
    const shuffleTops=()=>{
        if(!canArrange)return;ps('click');
        const cur=[...Array(n).keys()].map(nameOf);let nx=cur;
        for(let t=0;t<6&&nx.every((v,i)=>v===cur[i]);t++)nx=ldShuffle(cur.slice());
        setTops(a=>{const b=a.slice();nx.forEach((v,i)=>{b[i]=v;});return b;});
        setSwapSel(null);bump([...Array(n).keys()]);
    };
    const pickSwap=c=>{
        if(swapSel===null){ps('click');setSwapSel(c);return;}
        if(swapSel===c){ps('click');setSwapSel(null);return;}
        const a=swapSel,va=nameOf(a),vb=nameOf(c);
        setTops(t=>{const b=t.slice();b[a]=vb;b[c]=va;return b;});
        ps('tick');setSwapSel(null);bump([a,c]);
    };
    const toggleSwap=()=>{if(!canArrange&&!swapMode)return;ps('click');setSwapMode(v=>!v);setSwapSel(null);};

    // 게임 진행
    const start=()=>{stopAnims();ps('click');setSwapMode(false);setSwapSel(null);setLadder(ldBuild(n));setProg({});setRevealed(false);setFlash(null);setPhase('play');};
    const redraw=()=>{
        if(Object.keys(prog).length&&!askRedraw){ps('click');setAskRedraw(true);return;}
        stopAnims();ps('click');setAskRedraw(false);setLadder(ldBuild(n));setProg({});setRevealed(false);setFlash({redraw:true});
    };
    const edit=()=>{stopAnims();ps('click');setAskRedraw(false);setSwapMode(false);setSwapSel(null);setPhase('setup');setLadder(null);setProg({});setRevealed(false);setFlash(null);};
    const finish=(c,bulk)=>{
        if(!ladder)return;const j=ladder.paths[c].end;
        setFlash({c,j});
        if(!bulk){if(isGold(j)){ps('win');burst(j);}else ps('click');}
    };
    finishRef.current=finish;
    const loop=t=>{
        const A=animRef.current,upd={},fin=[];let bulkDone=false;
        Object.keys(A.items).forEach(k=>{
            const it=A.items[k],f=Math.min(1,(t-it.t0)/it.dur);
            if(!it.bulk&&it.ticks.some(x=>x>it.last&&x<=f))psRef.current('tick');
            it.last=f;upd[k]=f;
            if(f>=1){fin.push([+k,it.bulk]);delete A.items[k];if(it.bulk&&!Object.values(A.items).some(o=>o.bulk))bulkDone=true;}
        });
        setProg(p=>({...p,...upd}));
        fin.forEach(([c,b])=>finishRef.current(c,b));
        if(bulkDone){psRef.current('win');setFlash({all:true});}
        A.raf=Object.keys(A.items).length?requestAnimationFrame(loop):0;
    };
    const trace=(cols,bulk)=>{
        if(!ladder||!size.w)return;
        const cw=size.w/n,now=performance.now();let added=0;
        cols.forEach(c=>{if(animRef.current.items[c]||prog[c]>=1)return;const g=ldGeom(ladder.paths[c].pts,cw,size.h);animRef.current.items[c]={t0:now,dur:Math.min(3600,Math.max(1300,g.len/.42)),last:0,ticks:g.ticks,bulk};added++;});
        if(!added)return;
        setSwapMode(false);setSwapSel(null);
        if(!bulk)ps('click');
        setProg(p=>{const q={...p};cols.forEach(c=>{if(!(q[c]>0))q[c]=0.0001;});return q;});
        if(!animRef.current.raf)animRef.current.raf=requestAnimationFrame(loop);
    };
    const nextCol=play?[...Array(n).keys()].find(c=>!(prog[c]>0)):undefined;

    // 결과
    const results=ladder?doneCols.map(c=>({c,j:ladder.paths[c].end})).sort((a,b)=>botMode==='rank'?a.j-b.j:botMode==='win'?(isGold(b.j)-isGold(a.j))||a.c-b.c:a.c-b.c):[];
    const copyResults=()=>{
        const text=results.map(r=>`${nameOf(r.c)} → ${prizeOf(r.j)}`).join('\n');
        const ok=()=>{setCopied(true);setTimeout(()=>setCopied(false),1600);};
        const fallback=()=>{const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.opacity='0';document.body.appendChild(t);t.select();try{document.execCommand('copy');ok();}catch(e){}t.remove();};
        ps('click');
        if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(text).then(ok,fallback);else fallback();
    };

    // 그리기
    const cw=size.w&&n?size.w/n:0,H=size.h;
    const lv=ladder?ladder.levels:8;
    const boardH=Math.round(Math.min(560,Math.max(play?280:240,lv*17+2*LD.PAD)));
    const colMin=n<=10?76:n<=16?60:n<=24?50:44;
    const whoAt={};doneCols.forEach(c=>{whoAt[ladder.paths[c].end]=c;});
    const flashC=flash&&!flash.all?flash.c:null;

    return(<div className="pb-wrap">
        <div className="pb-panel">
            <div className="pb-row">
                <span className="pb-label">인원</span>
                <div className="pb-step"><button disabled={play||n<=LD.MIN} onClick={()=>changeN(n-1)} aria-label="한 명 줄이기"><Icon name="minus" size={14}/></button><span>{n}명</span><button disabled={play||n>=LD.MAX} onClick={()=>changeN(n+1)} aria-label="한 명 늘리기"><Icon name="plus" size={14}/></button></div>
                <span className="pb-hint">2~40명 · 칸 수만큼 사다리가 생겨요</span>
            </div>
            <div className="pb-row">
                <span className="pb-label">위 칸</span>
                <button className="pb-btn sm" disabled={play||students.filter(x=>!excludedNums.includes(x)).length<LD.MIN} onClick={fillNumbers}><Icon name="hash" size={13}/> 학급 번호로 채우기{excludedNums.length?` (제외 ${excludedNums.length}명 빼고)`:''}</button>
                {teamList.length>=LD.MIN&&<button className="pb-btn sm" disabled={play} onClick={fillTeam}><Icon name="users" size={13}/> 모둠 만들기 이름 불러오기</button>}
                <button className="pb-btn sm" disabled={play} onClick={()=>clearRow('top')}><Icon name="eraser" size={13}/> 위 칸 비우기</button>
                <button className="pb-btn sm" disabled={!canArrange} onClick={shuffleTops} title="위 칸 이름의 자리를 무작위로 바꿔요"><Icon name="shuffle" size={13}/> 위 칸 자리 섞기</button>
                <button className={'pb-btn sm'+(swapMode?' on':'')} disabled={!canArrange&&!swapMode} aria-pressed={swapMode} onClick={toggleSwap} title="두 칸을 차례로 눌러 자리를 맞바꿔요"><Icon name="arrow-left-right" size={13}/> 눌러서 맞바꾸기 {swapMode?'ON':'OFF'}</button>
                <span className="pb-hint">{swapMode?'바꿀 두 칸을 차례로 누르면 서로 자리가 바뀌어요 (같은 칸을 다시 누르면 취소)':'칸에 이름이나 번호를 적어요. 비워 두면 1번, 2번… 여러 이름을 복사해 한 칸에 붙여 넣으면 차례로 채워져요. 사다리를 타기 전까지 자리를 섞거나 맞바꿀 수 있어요'}</span>
            </div>
            <div className="pb-row">
                <span className="pb-label">아래 칸</span>
                <div className="pb-seg">{[['rank','등수 자동'],['custom','직접 입력'],['win','당첨·꽝']].map(([k,t])=><button key={k} disabled={play} className={botMode===k?'on':''} onClick={()=>{ps('click');setBotMode(k);}}>{t}</button>)}</div>
                {botMode==='win'&&<div className="pb-step"><button disabled={play||winCount<=1} onClick={()=>{ps('click');setWinCount(w=>w-1);}} aria-label="당첨 줄이기"><Icon name="minus" size={14}/></button><span>당첨 {Math.min(winCount,n-1)}</span><button disabled={play||winCount>=n-1} onClick={()=>{ps('click');setWinCount(w=>w+1);}} aria-label="당첨 늘리기"><Icon name="plus" size={14}/></button></div>}
                {botMode==='win'&&<button className="pb-btn sm" disabled={play} onClick={()=>{ps('click');setWinSeed(Math.random());}}><Icon name="shuffle" size={13}/> 당첨 자리 섞기</button>}
                {botMode==='custom'&&<button className="pb-btn sm" disabled={play} onClick={()=>clearRow('bot')}><Icon name="eraser" size={13}/> 아래 칸 비우기</button>}
                <span className="pb-hint">{botMode==='rank'?'왼쪽부터 1등, 2등… 자동으로 들어가요':botMode==='custom'?'칸마다 할 일이나 역할을 직접 적어요 (예: 발표, 청소, 통과)':'당첨 개수만큼 당첨, 나머지는 꽝이에요'}</span>
            </div>
            <div className="pb-row">
                <span className="pb-label">가리기</span>
                <button className={'pb-toggle'+(hide?' on':'')} disabled={play} aria-pressed={hide} onClick={()=>{ps('click');setHide(v=>!v);}}><Icon name={hide?'eye-off':'eye'} size={13}/> 사다리 가리기 {hide?'ON':'OFF'}</button>
                <span className="pb-hint">{hide?'결과를 확인하기 전까지 가로줄을 숨겨요':'처음부터 가로줄이 모두 보여요'}</span>
            </div>
        </div>

        <div className="ld-arena" ref={arenaRef}>
            <div className="pb-bar">
                {!play?<button className="pb-btn primary" onClick={start}><Icon name="play" size={15}/> 사다리 타기 시작</button>:<>
                    <button className="pb-btn primary" disabled={nextCol===undefined} onClick={()=>trace([nextCol],false)}><Icon name="arrow-down" size={15}/> {nextCol!==undefined?`다음: ${nameOf(nextCol)}`:allDone?'모두 확인했어요':'타는 중…'}</button>
                    <button className="pb-btn" disabled={nextCol===undefined} onClick={()=>trace([...Array(n).keys()],true)}><Icon name="list-checks" size={15}/> 모두 공개</button>
                    {hide&&!allDone&&<button className="pb-btn" onClick={()=>{ps('click');setRevealed(v=>!v);}}><Icon name={revealed?'eye-off':'eye'} size={15}/> {revealed?'다시 가리기':'가림 걷기'}</button>}
                    <button className={'pb-btn'+(askRedraw?' on':'')} onClick={redraw} title="가로줄을 무작위로 새로 그려요"><Icon name="refresh-cw" size={15}/> {askRedraw?'결과가 지워져요 · 한 번 더 누르기':'사다리 새로 그리기'}</button>
                    <button className="pb-btn" onClick={edit}><Icon name="pencil" size={15}/> 고치기</button>
                </>}
                <span className="pb-status">{play?`${doneCols.length} / ${n}명 확인`:`${n}칸`}</span>
                <button className="pb-btn" onClick={toggleFull} title={isFull?'전체 화면 끝내기':'전체 화면'}><Icon name={isFull?'minimize-2':'maximize-2'} size={15}/></button>
            </div>
            <div className="ld-scroll">
                <div className="ld-cols" style={{'--n':n,'--cw':colMin+'px'}}>
                    {[...Array(n).keys()].map(c=><div key={'t'+c} className={'ld-top'+(swapAnim.cols.includes(c)?' swapped'+(swapAnim.k%2):'')} style={{'--pc':color(c)}}>
                        {play||swapMode?<button className={'ld-top-btn'+(swapMode?' swap':'')+(swapSel===c?' sel':'')+(prog[c]>=1?' done':prog[c]>0?' run':'')} onClick={()=>swapMode?pickSwap(c):trace([c],false)} aria-pressed={swapMode?swapSel===c:undefined} title={swapMode?(swapSel===null?nameOf(c)+' · 눌러서 고르기':swapSel===c?'다시 누르면 고르기 취소':nameOf(swapSel)+'와(과) 자리 바꾸기'):nameOf(c)+(prog[c]>=1?' → '+prizeOf(ladder.paths[c].end):' · 눌러서 사다리 타기')}>
                            <i/><span className="nm" style={ldFit(nameOf(c),cw-14,13,9)}>{nameOf(c)}</span>{play&&prog[c]>=1&&<span className="rs" style={ldFit(prizeOf(ladder.paths[c].end),cw-14,12)}>{prizeOf(ladder.paths[c].end)}</span>}
                        </button>:<><i/><input size={1} className="ld-in" data-top={c} value={tops[c]} maxLength={20} placeholder={`${c+1}번`} aria-label={`위 ${c+1}번째 칸 이름`} onChange={e=>setAt('top',c,e.target.value)} onKeyDown={onKey('top',c)} onPaste={e=>{if(spread('top',c,e.clipboardData.getData('text')))e.preventDefault();}}/></>}
                    </div>)}
                    <div className="ld-board" ref={boardRef} style={{height:boardH}}>
                        {cw>0&&<svg width={size.w} height={H} aria-hidden="true">
                            <defs><pattern id="ldHatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="14" height="14" fill="#10291f"/><rect width="5" height="14" fill="#16352a"/></pattern></defs>
                            {!showRungs&&<rect x="0" y={LD.PAD-6} width={size.w} height={Math.max(0,H-2*LD.PAD+12)} fill="url(#ldHatch)"/>}
                            {[...Array(n).keys()].map(c=><line key={'v'+c} x1={(c+.5)*cw} x2={(c+.5)*cw} y1="0" y2={H} stroke="#d9ece2" strokeOpacity=".55" strokeWidth="3" strokeLinecap="round"/>)}
                            {showRungs&&ladder.rungs.map((r,i)=>{const y=ldPx([0,r.y],cw,H)[1];return<line key={ladder.id+'r'+i} className="ld-rung" pathLength="1" style={{animationDelay:(r.y*.7).toFixed(2)+'s'}} x1={(r.g+.5)*cw} x2={(r.g+1.5)*cw} y1={y} y2={y} stroke="#d9ece2" strokeOpacity=".55" strokeWidth="3" strokeLinecap="round"/>;})}
                            {play&&ladder&&[...Array(n).keys()].filter(c=>prog[c]>0).map(c=>{const g=ldGeom(ladder.paths[c].pts,cw,H),f=Math.min(1,prog[c]),[mx,my]=ldAt(g,f);return<g key={'p'+c}>
                                <path d={g.d} fill="none" stroke={color(c)} strokeWidth={flashC===c||f<1?7:5.5} strokeLinejoin="round" strokeLinecap="round" strokeDasharray={`${g.len} ${g.len}`} strokeDashoffset={g.len*(1-f)} opacity={f<1||flashC===c||allDone?1:.85}/>
                                {f<1&&<circle cx={mx} cy={my} r="10" fill={color(c)} stroke="#10291f" strokeWidth="3"/>}
                            </g>;})}
                            {!play&&<text x={size.w/2} y={H/2+(H>200?-34:-22)} textAnchor="middle" fill="#cfe3d8" fillOpacity=".5" fontSize="15" fontWeight="600">{hide?'가로줄은 시작하면 숨겨진 채로 만들어져요':'시작하면 가로줄이 만들어져요'}</text>}
                        </svg>}
                        {!play&&<button className="ld-go" onClick={start}><Icon name="play" size={20}/> 사다리 타기 시작</button>}
                        {play&&flash&&<div className="ld-flash" key={flash.redraw?'re'+ladder.id:flash.all?'all':flash.c+'-'+doneCols.length} style={{'--pc':flash.all||flash.redraw?'#ffd166':color(flash.c)}}>{flash.redraw?<span>{showRungs?'사다리를 새로 그렸어요':'사다리를 새로 그렸어요 · 가로줄은 숨겨져 있어요'}</span>:flash.all?<span>모두 공개했어요</span>:<><i/><span className="nm">{nameOf(flash.c)}</span><span className="ar">→</span><b>{prizeOf(flash.j)}</b></>}</div>}
                        {play&&!flash&&!swapMode&&!Object.keys(prog).length&&<div className="ld-flash hint">위의 이름을 누르면 사다리를 타요</div>}
                        {swapMode&&<div className="ld-swap-note"><Icon name="arrow-left-right" size={14}/><span>{swapSel===null?'맞바꿀 칸을 차례로 누르세요':`${nameOf(swapSel)}와(과) 바꿀 칸을 누르세요`}</span><button onClick={toggleSwap}>끝내기</button></div>}
                        <canvas ref={confRef}/>
                    </div>
                    {[...Array(n).keys()].map(j=><div key={'b'+j} className="ld-bot">
                        {!play&&botMode==='custom'?<input size={1} className="ld-in" data-bot={j} value={bots[j]} maxLength={30} placeholder="내용" aria-label={`아래 ${j+1}번째 칸 내용`} onChange={e=>setAt('bot',j,e.target.value)} onKeyDown={onKey('bot',j)} onPaste={e=>{if(spread('bot',j,e.clipboardData.getData('text')))e.preventDefault();}}/>
                        :<span className={'ld-prize'+(isGold(j)?' gold':'')+(botMode==='win'&&!isGold(j)?' miss':'')+(botMode==='custom'&&!(bots[j]||'').trim()?' miss':'')} title={prizeOf(j)} style={ldFit(prizeOf(j),cw-14)}>{botMode==='custom'&&!(bots[j]||'').trim()?'—':prizeOf(j)}</span>}
                        {whoAt[j]!==undefined&&<span className="ld-who" style={{'--pc':color(whoAt[j])}} title={nameOf(whoAt[j])}><span style={ldFit(nameOf(whoAt[j]),cw-16,13,9)}>{nameOf(whoAt[j])}</span></span>}
                    </div>)}
                </div>
            </div>
        </div>

        {results.length>0&&<div className="ld-results">
            <div className="ld-results-head"><Icon name="list-ordered" size={15}/><span>결과 {results.length}/{n}</span><button className="pb-btn sm" onClick={copyResults}><Icon name={copied?'check':'copy'} size={13}/> {copied?'복사했어요':'결과 복사'}</button></div>
            <ol>{results.map(r=><li key={r.c} className={isGold(r.j)?'gold':''} style={{'--pc':color(r.c)}}><i/><span className="nm">{nameOf(r.c)}</span><span className="ar">→</span><b title={prizeOf(r.j)}>{prizeOf(r.j)}</b></li>)}</ol>
        </div>}
    </div>);
}

function LottoPicker({students,excludedNums,playSound:ps,isSoundOn}){
    const activeStudents=useMemo(()=>students.filter(s=>!excludedNums.includes(s)),[students,excludedNums]);
    const [pickCount,setPickCount]=useState(1);
    const [isRolling,setIsRolling]=useState(false);
    const [results,setResults]=useState([]);
    const [rollingNums,setRollingNums]=useState([]);
    const [revealedCount,setRevealedCount]=useState(0);
    const [history,setHistory]=useState([]);
    const [isNoRepeat,setIsNoRepeat]=useState(false);
    const [usedNums,setUsedNums]=useState([]);
    const rollTimersRef=useRef([]);
    const audioCtxRef=useRef(null);

    const getAudioCtx=()=>{
        if(!audioCtxRef.current)audioCtxRef.current=new(window.AudioContext||window.webkitAudioContext)();
        if(audioCtxRef.current.state==='suspended')audioCtxRef.current.resume();
        return audioCtxRef.current;
    };

    const playBallDrop=useCallback((idx)=>{
        if(!isSoundOn)return;
        const ctx=getAudioCtx();const t=ctx.currentTime;
        const baseFreq=[261.63,329.63,392.00,523.25,659.25,783.99,1046.50];
        const freq=baseFreq[idx%baseFreq.length];
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.connect(g);g.connect(ctx.destination);
        o.type='sine';
        o.frequency.setValueAtTime(freq,t);
        g.gain.setValueAtTime(0,t);
        g.gain.linearRampToValueAtTime(.12,t+.03);
        g.gain.exponentialRampToValueAtTime(.001,t+.4);
        o.start(t);o.stop(t+.4);
        const o2=ctx.createOscillator(),g2=ctx.createGain();
        o2.connect(g2);g2.connect(ctx.destination);
        o2.type='triangle';
        o2.frequency.setValueAtTime(freq*2,t);
        g2.gain.setValueAtTime(.06,t);
        g2.gain.exponentialRampToValueAtTime(.001,t+.08);
        o2.start(t);o2.stop(t+.1);
    },[isSoundOn]);

    const playFinalFanfare=useCallback(()=>{
        if(!isSoundOn)return;
        const ctx=getAudioCtx();const t=ctx.currentTime;
        [523.25,659.25,783.99,1046.5,1318.5,1567.98].forEach((f,i)=>{
            const o=ctx.createOscillator(),g=ctx.createGain();
            o.connect(g);g.connect(ctx.destination);
            o.type=i<3?'sine':'triangle';
            o.frequency.setValueAtTime(f,t+i*.08);
            g.gain.setValueAtTime(0,t+i*.08);
            g.gain.linearRampToValueAtTime(.1,t+i*.08+.03);
            g.gain.exponentialRampToValueAtTime(.001,t+i*.08+.5);
            o.start(t+i*.08);o.stop(t+i*.08+.5);
        });
    },[isSoundOn]);

    const getBallColor=(num)=>{
        if(num<=10)return '#FBC400';
        if(num<=20)return '#69C8F2';
        if(num<=30)return '#FF7272';
        if(num<=40)return '#555555';
        if(num<=50)return '#B0D840';
        if(num<=60)return '#A855F7';
        if(num<=70)return '#F97316';
        if(num<=80)return '#14B8A6';
        if(num<=90)return '#EC4899';
        return '#6366F1';
    };

    const startDraw=()=>{
        let pool=isNoRepeat?activeStudents.filter(s=>!usedNums.includes(s)):activeStudents;
        if(pool.length===0){
            ps('click');
            return;
        }
        const count=Math.min(pickCount,pool.length);
        ps('click');
        setIsRolling(true);
        setResults([]);
        setRevealedCount(0);

        const shuffled=[...pool].sort(()=>Math.random()-.5);
        const winners=shuffled.slice(0,count);

        const initRolling=Array(count).fill(0);
        setRollingNums(initRolling);

        const revealBall=(idx)=>{
            let rollCount=0;
            const maxRolls=12+idx*3;
            const rollInterval=setInterval(()=>{
                setRollingNums(prev=>{
                    const next=[...prev];
                    next[idx]=activeStudents[Math.floor(Math.random()*activeStudents.length)];
                    return next;
                });
                rollCount++;
                if(rollCount>=maxRolls){
                    clearInterval(rollInterval);
                    setRollingNums(prev=>{
                        const next=[...prev];
                        next[idx]=winners[idx];
                        return next;
                    });
                    setResults(prev=>[...prev,winners[idx]]);
                    setRevealedCount(prev=>prev+1);
                    playBallDrop(idx);

                    if(idx===count-1){
                        setTimeout(()=>{
                            setIsRolling(false);
                            if(isNoRepeat)setUsedNums(prev=>[...prev,...winners]);
                            setHistory(prev=>[{
                                nums:winners,
                                time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})
                            },...prev].slice(0,20));
                            playFinalFanfare();
                            confetti({particleCount:200,spread:90,origin:{y:.45},colors:['#FF6B6B','#FECA57','#48DBFB','#2ED573','#FF9FF3','#54A0FF'],disableForReducedMotion:true});
                        },300);
                    }
                }
            },80);
            rollTimersRef.current.push(rollInterval);
        };

        for(let i=0;i<count;i++){
            const timer=setTimeout(()=>revealBall(i),i*1200+500);
            rollTimersRef.current.push(timer);
        }
    };

    useEffect(()=>{return()=>{rollTimersRef.current.forEach(t=>{clearTimeout(t);clearInterval(t);});};},[]);

    const availableCount=isNoRepeat?activeStudents.filter(s=>!usedNums.includes(s)).length:activeStudents.length;

    return(<div className="w-full max-w-2xl mx-auto space-y-3">
        <div className="lotto-machine">
            <div className="text-center mb-4">
                <h2 className="text-xl sm:text-2xl font-black text-white flex items-center justify-center gap-2">
                    <span className="text-2xl">🎱</span> 로또 추첨기
                </h2>
                <p className="text-[11px] text-gray-400 font-bold mt-1">행운의 발표자를 뽑아보세요!</p>
            </div>

            <div className="lotto-glass mb-4">
                <div className="flex items-center justify-center gap-3 sm:gap-4 min-h-[80px] flex-wrap py-2">
                    {Array.from({length:Math.min(pickCount,availableCount)}).map((_,i)=>{
                        const revealed=i<results.length;
                        const rolling=isRolling&&i>=results.length&&i<=results.length;
                        const num=revealed?results[i]:(rolling?rollingNums[i]:null);
                        if(revealed){

                            </div>;
                        }
                        return <div key={i} className="lotto-slot">
                            <span className="text-gray-400 font-bold text-lg">?</span>
                        </div>;
                    })}

                        <button onClick={()=>{ps('click');setPickCount(Math.min(Math.min(10,availableCount),pickCount+1));}} className="w-9 h-9 rounded-lg bg-white/10 text-white touch-target flex items-center justify-center hover:bg-white/20 transition-all"><Icon name="plus" size={16}/></button>
                    </div>
                    <span className="text-[10px] text-gray-500 font-bold">명</span>
                </div>

                <div className="flex items-center justify-center gap-2">
                    <button onClick={()=>{ps('click');setIsNoRepeat(!isNoRepeat);}} className={`px-3 py-1.5 rounded-lg text-[11px] font-bold border transition-all ${isNoRepeat?'bg-yellow-500/20 border-yellow-500/40 text-yellow-300':'bg-white/5 border-white/10 text-gray-500'}`}>
                        중복방지 {isNoRepeat?'ON':'OFF'}
                    </button>
                    {isNoRepeat&&usedNums.length>0&&<button onClick={()=>{ps('click');setUsedNums([]);}} className="px-3 py-1.5 bg-white/5 border border-white/10 rounded-lg text-[11px] font-bold text-gray-500">

}

function SeatRowConfig({seatGrid,setSeatGrid,seatRows,setSeatRows,seatRowMode,setSeatRowMode,seatColumns,setSeatColumns,seatGridTotal,totalStudents,savedSeatLayout,seatLayoutDirty,onSaveLayout,onClearLayout,playSound}){
    const makeFullGrid=(r,c)=>Array.from({length:r},()=>Array(c).fill(true));
    const makeFitGrid=(r,c,total)=>{
        const grid=Array.from({length:r},()=>Array(c).fill(false));
        let remain=total;
        for(let ri=0;ri<r&&remain>0;ri++){
            for(let ci=0;ci<c&&remain>0;ci++){
                grid[ri][ci]=true;
                remain--;
            }
        }
        return grid;
    };

    const switchToCustom=()=>{
        playSound('click');
        setSeatRowMode('custom');
        if(seatGrid.length===0){
            const r=Math.ceil(totalStudents/seatColumns);
            setSeatRows(r);
            setSeatGrid(makeFitGrid(r,seatColumns,totalStudents));
        }
    };

    const changeRows=(delta)=>{
        playSound('click');
        const next=Math.max(1,Math.min(15,seatRows+delta));
        setSeatRows(next);
        setSeatGrid(prev=>{
            const grid=[...prev.map(r=>[...r])];
            while(grid.length<next)grid.push(Array(seatColumns).fill(true));
            return grid.slice(0,next);
        });
    };
    const changeCols=(delta)=>{
        playSound('click');
        const next=Math.max(2,Math.min(10,seatColumns+delta));
        setSeatColumns(next);
        setSeatGrid(prev=>prev.map(row=>{
            const r=[...row];
            while(r.length<next)r.push(true);
            return r.slice(0,next);
        }));
    };

    const toggleCell=(ri,ci)=>{
        playSound('click');
        setSeatGrid(prev=>{
            const grid=prev.map(r=>[...r]);
            grid[ri][ci]=!grid[ri][ci];
            return grid;
        });
    };
    const toggleRow=(ri)=>{
        playSound('click');
        setSeatGrid(prev=>{
            const grid=prev.map(r=>[...r]);
            const allOn=grid[ri].every(Boolean);
            grid[ri]=grid[ri].map(()=>!allOn);
            return grid;
        });
    };
    const toggleCol=(ci)=>{
        playSound('click');
        setSeatGrid(prev=>{
            const grid=prev.map(r=>[...r]);
            const allOn=grid.every(r=>r[ci]);
            grid.forEach(r=>{r[ci]=!allOn;});
            return grid;
        });
    };

    const presetAll=()=>{playSound('click');setSeatGrid(makeFullGrid(seatRows,seatColumns));};
    const presetFit=()=>{playSound('click');setSeatGrid(makeFitGrid(seatRows,seatColumns,totalStudents));};

            <div className="flex bg-[#FFF8F0] p-0.5 rounded-lg flex-1 border border-gray-100">
                <button onClick={()=>{playSound('click');setSeatRowMode('auto');}} className={`flex-1 py-1.5 rounded-md text-[10px] font-bold transition-all ${seatRowMode==='auto'?'bg-white shadow-sm text-[#D68C60]':'text-gray-400'}`}>자동 배치</button>
