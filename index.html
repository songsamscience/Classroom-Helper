            </div>
        </div>

        <div className="flex items-center gap-3 flex-wrap">
            <div className="flex items-center gap-1.5">
                <span className="text-[10px] text-gray-400 font-bold shrink-0">열</span>
                <div className="flex items-center bg-[#FFF8F0] rounded-lg border border-gray-100 px-1 gap-0.5">
                    <button onClick={()=>changeCols(-1)} className="w-7 h-7 rounded-md bg-white shadow-sm text-gray-500 touch-target flex items-center justify-center"><Icon name="minus" size={12}/></button>
                    <span className="text-sm font-black text-[#D68C60] min-w-[1.5rem] text-center">{seatColumns}</span>
                    <button onClick={()=>changeCols(1)} className="w-7 h-7 rounded-md bg-white shadow-sm text-gray-500 touch-target flex items-center justify-center"><Icon name="plus" size={12}/></button>
                </div>
            </div>
            {seatRowMode==='custom'&&<div className="flex items-center gap-1.5">
                <span className="text-[10px] text-gray-400 font-bold shrink-0">행</span>
                <div className="flex items-center bg-[#FFF8F0] rounded-lg border border-gray-100 px-1 gap-0.5">
                    <button onClick={()=>changeRows(-1)} className="w-7 h-7 rounded-md bg-white shadow-sm text-gray-500 touch-target flex items-center justify-center"><Icon name="minus" size={12}/></button>
                    <span className="text-sm font-black text-[#D68C60] min-w-[1.5rem] text-center">{seatRows}</span>
                    <button onClick={()=>changeRows(1)} className="w-7 h-7 rounded-md bg-white shadow-sm text-gray-500 touch-target flex items-center justify-center"><Icon name="plus" size={12}/></button>
                </div>
            </div>}
            <span className="text-[10px] text-gray-400 font-bold ml-auto">학생 {totalStudents}명</span>
        </div>

        {seatRowMode==='auto'&&savedSeatLayout&&<div className="bg-[#E8F5E9] rounded-lg p-2 border border-[#C8E6C9] flex items-center gap-2">
            <Icon name="check" size={14} className="text-[#43A047] shrink-0"/>
            <p className="text-[10px] text-[#388E3C] font-bold leading-snug flex-1">저장된 자리 배치({savedSeatLayout.grid.reduce((s,r)=>s+r.filter(Boolean).length,0)}석)대로 배치됩니다. '생성'을 누르면 그 배치에 학생이 채워집니다.</p>
            <button onClick={onClearLayout} className="shrink-0 px-2 py-1 rounded-md bg-white border border-[#C8E6C9] text-[#388E3C] text-[10px] font-black active:scale-95 transition-all">해제</button>
        </div>}
        {seatRowMode==='auto'&&!savedSeatLayout&&<div className="bg-[#FFF8F0] rounded-lg p-2 border border-gray-100 flex items-start gap-1.5">
            <Icon name="info" size={12} className="text-gray-300 shrink-0 mt-0.5"/>
            <p className="text-[10px] text-gray-400 font-bold leading-snug">저장된 배치가 없어 {seatColumns}열 직사각형으로 자동 배치됩니다. '자리 배치'에서 모양을 만들어 저장하면 자동 배치에도 적용됩니다.</p>
        </div>}

        {seatRowMode==='custom'&&seatGrid.length>0&&<>
            <div className="flex flex-wrap gap-1.5">
                <button onClick={presetFit} className="px-2.5 py-1 rounded-lg text-[10px] font-bold border bg-white border-gray-200 text-gray-400 hover:border-[#FFD3B6] active:scale-95 transition-all">학생 수 맞춤</button>
                <button onClick={presetAll} className="px-2.5 py-1 rounded-lg text-[10px] font-bold border bg-white border-gray-200 text-gray-400 hover:border-[#FFD3B6] active:scale-95 transition-all">전체 ON</button>
                <button onClick={presetClear} className="px-2.5 py-1 rounded-lg text-[10px] font-bold border bg-white border-gray-200 text-gray-400 hover:border-[#FFD3B6] active:scale-95 transition-all">전체 OFF</button>
            </div>

            <div className="bg-[#FFF8F0] rounded-xl p-2.5 border border-[#FFD3B6]/30">
                <div className="flex items-center justify-between mb-1.5">
                    <span className="text-[9px] text-gray-400 font-bold">칠판 ↓ (앞줄) · 터치하여 좌석 ON/OFF</span>
                    <span className={`text-[10px] font-bold ${seatGridTotal===totalStudents?'text-green-500':'text-orange-400'}`}>
                        {seatGridTotal}석 {seatGridTotal!==totalStudents&&`/ ${totalStudents}명`}
                    </span>
                </div>

                <div className="flex gap-[3px] mb-[3px] ml-7">
                    {Array.from({length:seatColumns}).map((_,ci)=>(
                        <div key={ci} onClick={()=>toggleCol(ci)}
                            className="flex-1 h-4 flex items-center justify-center cursor-pointer rounded-[2px] hover:bg-[#FFD3B6]/20 transition-all"
                            style={{maxWidth:'36px'}}>
                            <span className="text-[8px] text-gray-400 font-bold">{ci+1}</span>
                        </div>
                    ))}
                </div>

                {seatGrid.map((row,ri)=>(
                    <div key={ri} className="flex items-center gap-[3px] mb-[3px]">
                        <span onClick={()=>toggleRow(ri)}
                            className="text-[9px] text-gray-400 font-bold w-6 text-right shrink-0 cursor-pointer hover:text-[#D68C60] transition-colors select-none">{ri+1}</span>
                        {row.map((on,ci)=>(
                            <div key={ci} onClick={()=>toggleCell(ri,ci)}
                                className={`h-7 sm:h-8 flex-1 rounded-[4px] cursor-pointer transition-all active:scale-90 flex items-center justify-center select-none ${on?'bg-[#FFD3B6] shadow-sm hover:bg-[#FFc5a0]':'bg-gray-100 hover:bg-gray-200 border border-dashed border-gray-300/60'}`}
                                style={{maxWidth:'36px'}}>
                                {on?<span className="text-white text-[9px] font-black">●</span>:<span className="text-gray-300 text-[8px]">·</span>}
                            </div>
                        ))}
                    </div>
                ))}
                <div className="text-center pt-0.5"><span className="text-[9px] text-gray-400 font-bold">↑ (뒷줄)</span></div>
            </div>

            {seatGridTotal!==totalStudents&&<div className="bg-[#FFF8E1] rounded-lg p-2 border border-[#FFE082] flex items-start gap-1.5">
                <Icon name="info" size={13} className="text-[#FFA000] shrink-0 mt-0.5"/>
                <p className="text-[10px] text-gray-500 font-bold leading-relaxed">
                    {seatGridTotal>totalStudents
                        ?`좌석(${seatGridTotal})이 학생 수(${totalStudents})보다 많습니다. 남는 자리는 빈칸이 됩니다.`
                        :`좌석(${seatGridTotal})이 학생 수(${totalStudents})보다 적습니다. ${totalStudents-seatGridTotal}명이 배치되지 않습니다.`}
                </p>
            </div>}

            <div className="pt-0.5">
                <button onClick={onSaveLayout}
                    className={`w-full py-2.5 rounded-xl text-xs font-black flex items-center justify-center gap-1.5 shadow-md active:scale-[.97] transition-all ${(savedSeatLayout&&!seatLayoutDirty)?'bg-[#B5EAD7] text-white':'bg-[#FFD3B6] text-white'}`}>
                    <Icon name={(savedSeatLayout&&!seatLayoutDirty)?'check':'save'} size={15}/>
                    {(savedSeatLayout&&!seatLayoutDirty)?'이 배치로 저장됨':'이 배치로 저장'}
                </button>
                {savedSeatLayout&&seatLayoutDirty
                    ?<p className="text-[10px] text-orange-400 font-bold text-center mt-1.5">⚠ 배치가 바뀌었어요. 다시 저장한 뒤 생성하세요.</p>
                    :savedSeatLayout
                        ?<p className="text-[10px] text-[#6BBF9A] font-bold text-center mt-1.5">저장된 배치대로 자리가 채워집니다. ('생성' 누르기)</p>
                        :<p className="text-[10px] text-gray-400 font-bold text-center mt-1.5">자리를 정한 뒤 저장하면 그대로 배치됩니다.</p>}
            </div>
        </>}
    </div>);
}

// ===== 판서(화이트보드) 컴포넌트 - 통합용 =====
const WB_TOOLS={MARKER:'marker',HIGHLIGHTER:'highlighter',BRUSH:'brush',TEXT:'text',SHAPE:'shape',STICKY:'sticky',ERASER:'eraser',SELECT:'select',LASER:'laser',PAN:'pan'};
const WB_ERASER_MODES={PIXEL:'pixel',STROKE:'stroke',OBJECT:'object'};
const WB_BG_MODES={LIGHT:'light',DARK:'dark',GRID:'grid',GRAPH:'graph',LINED:'lined'};
const WB_BASE_COLORS=['#E53935','#FB8C00','#FDD835','#43A047','#1E88E5','#3949AB','#8E24AA','#000000','#FFFFFF'];
const WB_STICKY_COLORS=['#FFF59D','#F8BBD0','#B3E5FC','#C5E1A5','#FFCC80','#D1C4E9'];
const WB_FONTS=[{label:'고운돋움',value:"'Gowun Dodum',sans-serif"},{label:'감자꽃',value:"'Gamja Flower',cursive"},{label:'주아',value:"'Jua',sans-serif"},{label:'도현',value:"'Do Hyeon',sans-serif"},{label:'노토산스',value:"'Noto Sans KR',sans-serif"}];
const WB_SHAPES=[{value:'line',label:'직선',icon:'minus'},{value:'arrow',label:'화살표',icon:'move-right'},{value:'rect',label:'사각형',icon:'square'},{value:'ellipse',label:'원',icon:'circle'},{value:'triangle',label:'삼각형',icon:'triangle'}];
const wbUid=()=>Math.random().toString(36).slice(2,11);
const wbDistSeg=(px,py,x1,y1,x2,y2)=>{const dx=x2-x1,dy=y2-y1;const l=dx*dx+dy*dy;if(l===0)return Math.hypot(px-x1,py-y1);let t=((px-x1)*dx+(py-y1)*dy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(x1+t*dx),py-(y1+t*dy));};
const wbStrokeHit=(s,ex,ey,er)=>{const th=er+(s.width||3)/2;const p=s.points;for(let i=0;i<p.length-1;i++)if(wbDistSeg(ex,ey,p[i][0],p[i][1],p[i+1][0],p[i+1][1])<=th)return true;if(p.length===1)return Math.hypot(ex-p[0][0],ey-p[0][1])<=th;return false;};
const wbBoxHit=(b,ex,ey,er)=>{const cx=Math.max(b.x,Math.min(ex,b.x+b.w));const cy=Math.max(b.y,Math.min(ey,b.y+b.h));return Math.hypot(ex-cx,ey-cy)<=er;};
const wbShapeHit=(s,ex,ey,er)=>{if(s.shape==='line'||s.shape==='arrow')return wbDistSeg(ex,ey,s.x1,s.y1,s.x2,s.y2)<=er+s.strokeWidth/2;const b={x:Math.min(s.x1,s.x2),y:Math.min(s.y1,s.y2),w:Math.abs(s.x2-s.x1),h:Math.abs(s.y2-s.y1)};return wbBoxHit(b,ex,ey,er);};
const wbSplitStroke=(s,ex,ey,er)=>{const th=er+(s.width||3)/2;const p=s.points,w=s.widths;const segs=[],sw=[];let c=[],cw=[];for(let i=0;i<p.length;i++){if(Math.hypot(p[i][0]-ex,p[i][1]-ey)>th){c.push(p[i]);if(w)cw.push(w[i]);}else{if(c.length>=2){segs.push(c);if(w)sw.push(cw);}c=[];cw=[];}}if(c.length>=2){segs.push(c);if(w)sw.push(cw);}return segs.map((pts,i)=>({...s,id:wbUid(),points:pts,...(w?{widths:sw[i]}:{})}));};

const wbInitState={pages:[{id:wbUid(),name:'페이지 1',objects:[],background:WB_BG_MODES.LIGHT}],activePageIdx:0,history:[],future:[]};
function wbReducer(state,action){
    const snap=()=>JSON.parse(JSON.stringify({pages:state.pages,activePageIdx:state.activePageIdx}));
    const push=(np,ni)=>({...state,pages:np,activePageIdx:ni??state.activePageIdx,history:[...state.history,snap()].slice(-50),future:[]});
    const skip=(np,ni)=>({...state,pages:np,activePageIdx:ni??state.activePageIdx});
    switch(action.type){
        case 'ADD_OBJECT':{const np=state.pages.map((p,i)=>i===state.activePageIdx?{...p,objects:[...p.objects,action.object]}:p);return push(np);}
        case 'UPDATE_OBJECT':{const np=state.pages.map((p,i)=>i===state.activePageIdx?{...p,objects:p.objects.map(o=>o.id===action.id?{...o,...action.patch}:o)}:p);return action.skipHistory?skip(np):push(np);}
        case 'REMOVE_OBJECTS':{const ids=new Set(action.ids);const np=state.pages.map((p,i)=>i===state.activePageIdx?{...p,objects:p.objects.filter(o=>!ids.has(o.id))}:p);return push(np);}
        case 'REPLACE_OBJECTS':{const rm=new Set(action.removeIds);const np=state.pages.map((p,i)=>{if(i!==state.activePageIdx)return p;return {...p,objects:[...p.objects.filter(o=>!rm.has(o.id)),...action.newObjects]};});return action.skipHistory?skip(np):push(np);}
        case 'CLEAR_PAGE':{const np=state.pages.map((p,i)=>i===state.activePageIdx?{...p,objects:[]}:p);return push(np);}
        case 'SET_BACKGROUND':{const np=state.pages.map((p,i)=>i===state.activePageIdx?{...p,background:action.bg}:p);return push(np);}
        case 'ADD_PAGE':{const newP={id:wbUid(),name:`페이지 ${state.pages.length+1}`,objects:[],background:state.pages[state.activePageIdx].background};return push([...state.pages,newP],state.pages.length);}
        case 'REMOVE_PAGE':{if(state.pages.length<=1)return state;const np=state.pages.filter((_,i)=>i!==action.index);return push(np,Math.min(state.activePageIdx,np.length-1));}
        case 'SET_ACTIVE_PAGE':return {...state,activePageIdx:action.index};
        case 'UNDO':{if(!state.history.length)return state;const prev=state.history[state.history.length-1];return {...state,pages:prev.pages,activePageIdx:prev.activePageIdx,history:state.history.slice(0,-1),future:[snap(),...state.future].slice(0,50)};}
        case 'REDO':{if(!state.future.length)return state;const nxt=state.future[0];return {...state,pages:nxt.pages,activePageIdx:nxt.activePageIdx,history:[...state.history,snap()].slice(-50),future:state.future.slice(1)};}
        case 'LOAD':return {...action.state,history:[],future:[]};
        default:return state;
    }
}

function WhiteboardTab({playSound,showAlert,globalDarkMode}){
    const [state,dispatch]=React.useReducer(wbReducer,wbInitState);
    const activePage=state.pages[state.activePageIdx];
    const objects=activePage.objects;
    const background=activePage.background;
    const [tool,setTool]=useState(WB_TOOLS.MARKER);
    const [penColor,setPenColor]=useState(globalDarkMode?'#FFFFFF':'#1F2937');
    const wbMountedRef=useRef(false);
    // ★ 전역 다크모드와 판서 배경 동기화 + 펜 색상 흰색 자동 적용
    useEffect(()=>{
        if(!wbMountedRef.current){
            wbMountedRef.current=true;
            if(globalDarkMode){
                dispatch({type:'SET_BACKGROUND',bg:WB_BG_MODES.DARK});
                setPenColor('#FFFFFF');
                setTextOpts(o=>({...o,color:'#FFFFFF'}));
            }

        if(tool===WB_TOOLS.MARKER||tool===WB_TOOLS.HIGHLIGHTER||tool===WB_TOOLS.BRUSH){
            dr.active=true;
            const bw=tool===WB_TOOLS.HIGHLIGHTER?Math.max(penWidth*3,12):penWidth;
            const iw=tool===WB_TOOLS.BRUSH?bw*0.7:bw;
            dr.currentStroke={id:wbUid(),type:'stroke',tool,color:penColor,width:bw,opacity:tool===WB_TOOLS.HIGHLIGHTER?0.35:1,points:[[pos.x,pos.y]],widths:tool===WB_TOOLS.BRUSH?[iw]:undefined};
            dr.lastPointer={x:pos.x,y:pos.y,t:Date.now()};dr.smoothedWidth=iw;pushRecent(penColor);
            // 불투명 펜(마커)·붓은 증분 렌더링(빠른 잉크) 사용. 형광펜은 반투명이라 기존 전체 렌더 유지.

    const processSample=(x,y,pressure,ts)=>{
        const dr=drawingRef.current;if(!dr.active||!dr.currentStroke)return;
        const s=dr.currentStroke;const pts=s.points;const last=pts[pts.length-1];
        const dist=Math.hypot(x-last[0],y-last[1]);if(dist<0.5)return;

    // QR을 흰색 배경 데이터 URL로 변환 후 캔버스에 삽입
    const insertQRImage=async(text)=>{
        if(!text||!text.trim())return;
        const url=`https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(text.trim())}&bgcolor=ffffff&color=000000&margin=20&format=png`;
        try{
            const res=await fetch(url);
            const blob=await res.blob();
            const dataUrl=await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onload=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(blob);});
            // 다크 배경에서도 안전하게 보이도록 흰색 패딩을 추가한 캔버스로 합성
            const padded=await new Promise((resolve)=>{

                im.onerror=()=>resolve(dataUrl);

            });
            addImage(padded);

        if(m)return m[1];

        if(m)return m[1];
        if(/^[a-zA-Z0-9_-]{11}$/.test(c))return c;
        return null;
    };

    // YouTube 썸네일 + 재생 오버레이로 판서 캔버스에 삽입
    const insertYouTubeVideo=async(input)=>{
        const id=extractYouTubeId(input);
        if(!id){setYTModalError('올바른 YouTube URL을 입력하세요.');return false;}
        setYTModalError('');
        // 썸네일 후보 (maxres가 없는 영상도 있어 hqdefault로 폴백)
        const tryLoad=(u)=>new Promise(res=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>res({ok:im.naturalWidth>120,im,u});im.onerror=()=>res({ok:false,u});im.src=u;});
        const candidates=[`https://img.youtube.com/vi/${id}/maxresdefault.jpg`,`https://img.youtube.com/vi/${id}/hqdefault.jpg`,`https://img.youtube.com/vi/${id}/0.jpg`];
        let chosen=null;
        for(const u of candidates){const r=await tryLoad(u);if(r.ok){chosen=r;break;}}
        if(!chosen){setYTModalError('썸네일을 불러올 수 없습니다.');return false;}
        // 썸네일 + 재생 버튼 + YouTube 라벨을 합성한 데이터 URL 생성 (CORS 실패 시 원본 URL 폴백)
        let dataUrl=chosen.u;
        try{
            const im=chosen.im;
            const tc=document.createElement('canvas');tc.width=im.naturalWidth;tc.height=im.naturalHeight;
            const tcx=tc.getContext('2d');
            tcx.drawImage(im,0,0);
            // 어두운 그라데이션 오버레이(가운데를 살짝 어둡게)로 재생버튼 가독성 확보
            tcx.fillStyle='rgba(0,0,0,0.22)';tcx.fillRect(0,0,tc.width,tc.height);
            // 재생 삼각형
            const cx=tc.width/2,cy=tc.height/2;const rr=Math.min(tc.width,tc.height)*0.16;
            tcx.fillStyle='rgba(0,0,0,0.78)';
            tcx.beginPath();const rad=rr*1.55;
            // 둥근 사각 배경
            const rx=cx-rad,ry=cy-rad*0.7,rw=rad*2,rh=rad*1.4,rrad=18;
            tcx.moveTo(rx+rrad,ry);tcx.lineTo(rx+rw-rrad,ry);tcx.quadraticCurveTo(rx+rw,ry,rx+rw,ry+rrad);tcx.lineTo(rx+rw,ry+rh-rrad);tcx.quadraticCurveTo(rx+rw,ry+rh,rx+rw-rrad,ry+rh);tcx.lineTo(rx+rrad,ry+rh);tcx.quadraticCurveTo(rx,ry+rh,rx,ry+rh-rrad);tcx.lineTo(rx,ry+rrad);tcx.quadraticCurveTo(rx,ry,rx+rrad,ry);tcx.closePath();tcx.fill();
            tcx.fillStyle='#ffffff';
            tcx.beginPath();tcx.moveTo(cx-rr*0.45,cy-rr*0.6);tcx.lineTo(cx-rr*0.45,cy+rr*0.6);tcx.lineTo(cx+rr*0.65,cy);tcx.closePath();tcx.fill();
            // 좌상단 YOUTUBE 라벨
            const labelW=Math.min(tc.width*0.28,180),labelH=labelW*0.32,lx=16,ly=16;
            tcx.fillStyle='rgba(204,0,0,0.92)';
            tcx.beginPath();const lr=8;
            tcx.moveTo(lx+lr,ly);tcx.lineTo(lx+labelW-lr,ly);tcx.quadraticCurveTo(lx+labelW,ly,lx+labelW,ly+lr);tcx.lineTo(lx+labelW,ly+labelH-lr);tcx.quadraticCurveTo(lx+labelW,ly+labelH,lx+labelW-lr,ly+labelH);tcx.lineTo(lx+lr,ly+labelH);tcx.quadraticCurveTo(lx,ly+labelH,lx,ly+labelH-lr);tcx.lineTo(lx,ly+lr);tcx.quadraticCurveTo(lx,ly,lx+lr,ly);tcx.closePath();tcx.fill();
            tcx.fillStyle='#ffffff';tcx.font=`bold ${Math.round(labelH*0.55)}px sans-serif`;tcx.textAlign='center';tcx.textBaseline='middle';
            tcx.fillText('YouTube',lx+labelW/2,ly+labelH/2+1);

        // 이미지 객체 생성 (videoId 메타데이터 부착)

        const im2=new Image();
        im2.onload=()=>{

            addImage(chosen.u);
        };
        im2.src=finalSrc;
        return true;
    };

            if(textEdit)return;const t=e.target;if(t.tagName==='TEXTAREA'||t.tagName==='INPUT')return;
            if(e.key===' '||e.code==='Space'){if(tool!==WB_TOOLS.PAN){prevToolRef.current=tool;setTool(WB_TOOLS.PAN);}e.preventDefault();return;}
            if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.shiftKey){e.preventDefault();dispatch({type:'UNDO'});}
            else if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==='y'||(e.shiftKey&&e.key.toLowerCase()==='z'))){e.preventDefault();dispatch({type:'REDO'});}
            else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();exportPNG();}
            else if((e.key==='Delete'||e.key==='Backspace')&&(selectedImageId||selectedTextId)){const id=selectedImageId||selectedTextId;dispatch({type:'REMOVE_OBJECTS',ids:[id]});setSelectedImageId(null);setSelectedTextId(null);}
            else if(e.key==='p'||e.key==='P')setTool(WB_TOOLS.MARKER);
            else if(e.key==='h'||e.key==='H')setTool(WB_TOOLS.HIGHLIGHTER);
            else if(e.key==='b'||e.key==='B')setTool(WB_TOOLS.BRUSH);
            else if(e.key==='t'||e.key==='T')setTool(WB_TOOLS.TEXT);
            else if(e.key==='s'||e.key==='S')setTool(WB_TOOLS.SHAPE);
            else if(e.key==='n'||e.key==='N')setTool(WB_TOOLS.STICKY);
            else if(e.key==='i'||e.key==='I')fileInputRef.current?.click();
            else if(e.key==='v'||e.key==='V')setTool(WB_TOOLS.SELECT);
            else if(e.key==='l'||e.key==='L')setTool(WB_TOOLS.LASER);
            else if(e.key==='e'||e.key==='E'){if(tool===WB_TOOLS.ERASER)setEraserMode(m=>m===WB_ERASER_MODES.PIXEL?WB_ERASER_MODES.STROKE:m===WB_ERASER_MODES.STROKE?WB_ERASER_MODES.OBJECT:WB_ERASER_MODES.PIXEL);else setTool(WB_TOOLS.ERASER);}
        };
        const onKeyUp=(e)=>{if((e.key===' '||e.code==='Space')&&prevToolRef.current!=null){setTool(prevToolRef.current);prevToolRef.current=null;}};
        window.addEventListener('keydown',onKey);window.addEventListener('keyup',onKeyUp);return()=>{window.removeEventListener('keydown',onKey);window.removeEventListener('keyup',onKeyUp);};
    },[tool,textEdit,selectedImageId,selectedTextId]);

    useEffect(()=>{
        if(tool===WB_TOOLS.ERASER&&!eraserTipSeen){
            setShowEraserTip(true);
            const t=setTimeout(()=>{setShowEraserTip(false);setEraserTipSeen(true);try{localStorage.setItem('songsam_wb_eraser_seen','1');}catch(e){}},5000);
            return()=>clearTimeout(t);
        }
    },[tool,eraserTipSeen]);
    useEffect(()=>{if(tool!==WB_TOOLS.SELECT){setSelectedImageId(null);setSelectedTextId(null);}},[tool]);

    const exportPNG=async()=>{
        await Promise.all(objects.filter(o=>o.type==='image').map(o=>new Promise(res=>{const im=imageCache.current.get(o.src);if(im&&im.complete)res();else if(im){im.onload=()=>res();im.onerror=()=>res();}else res();})));
        const tmp=document.createElement('canvas');const dpr=2;tmp.width=canvasSize.w*dpr;tmp.height=canvasSize.h*dpr;
        const ctx=tmp.getContext('2d');ctx.scale(dpr,dpr);
        if(background===WB_BG_MODES.DARK)ctx.fillStyle='#1F2937';else if(background===WB_BG_MODES.LINED)ctx.fillStyle='#FFFEF7';else ctx.fillStyle='#FAFAFA';
        ctx.fillRect(0,0,canvasSize.w,canvasSize.h);
        if(background===WB_BG_MODES.GRID){ctx.strokeStyle='#E5E7EB';ctx.lineWidth=1;for(let x=0;x<=canvasSize.w;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvasSize.h);ctx.stroke();}for(let y=0;y<=canvasSize.h;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvasSize.w,y);ctx.stroke();}}
        else if(background===WB_BG_MODES.GRAPH){ctx.strokeStyle='#EEF2FF';ctx.lineWidth=1;for(let x=0;x<=canvasSize.w;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvasSize.h);ctx.stroke();}for(let y=0;y<=canvasSize.h;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvasSize.w,y);ctx.stroke();}ctx.strokeStyle='#C7D2FE';for(let x=0;x<=canvasSize.w;x+=100){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,canvasSize.h);ctx.stroke();}for(let y=0;y<=canvasSize.h;y+=100){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvasSize.w,y);ctx.stroke();}}
        else if(background===WB_BG_MODES.LINED){ctx.strokeStyle='#D6E4FF';ctx.lineWidth=1;for(let y=40;y<=canvasSize.h;y+=36){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(canvasSize.w,y);ctx.stroke();}}
        ctx.save();ctx.translate(pan.x,pan.y);
        objects.filter(o=>o.type==='image').forEach(o=>drawObject(ctx,o));
        objects.filter(o=>o.type!=='image'&&o.type!=='sticky').forEach(o=>drawObject(ctx,o));
        objects.filter(o=>o.type==='sticky').forEach(o=>{
            ctx.save();ctx.translate(o.x+o.w/2,o.y+o.h/2);ctx.rotate((o.rotation||0)*Math.PI/180);
            ctx.fillStyle=o.color;ctx.shadowColor='rgba(0,0,0,.2)';ctx.shadowBlur=8;ctx.shadowOffsetX=2;ctx.shadowOffsetY=4;
            ctx.fillRect(-o.w/2,-o.h/2,o.w,o.h);ctx.shadowColor='transparent';
            ctx.fillStyle='#333';ctx.font="bold 18px 'Gamja Flower',sans-serif";ctx.textBaseline='top';
            (o.text||'').split('\n').forEach((l,i)=>ctx.fillText(l,-o.w/2+14,-o.h/2+14+i*22));
            ctx.restore();
        });
        ctx.restore();
        ctx.fillStyle='rgba(0,0,0,.25)';ctx.font="bold 12px 'Jua',sans-serif";ctx.textBaseline='alphabetic';ctx.textAlign='right';
        ctx.fillText('© 송쌤과학',canvasSize.w-14,canvasSize.h-12);
        const link=document.createElement('a');link.download=`송쌤과학_판서_${Date.now()}.png`;link.href=tmp.toDataURL('image/png');link.click();
    };

    const stickyDragRef=useRef(null);
    const onStickyPointerDown=(e,o,m)=>{
        if(e.target.tagName==='TEXTAREA')return;e.stopPropagation();try{e.target.setPointerCapture(e.pointerId);}catch(_){}
        if(m==='resize')stickyDragRef.current={id:o.id,mode:'resize',sX:e.clientX,sY:e.clientY,sW:o.w,sH:o.h};
        else stickyDragRef.current={id:o.id,mode:'move',sX:e.clientX,sY:e.clientY,oX:o.x,oY:o.y};
    };
    const onStickyPointerMove=(e)=>{
        if(!stickyDragRef.current)return;
        const sd=stickyDragRef.current;const dx=e.clientX-sd.sX,dy=e.clientY-sd.sY;
        const o=objects.find(o=>o.id===sd.id);if(!o)return;
        if(sd.mode==='move')dispatch({type:'UPDATE_OBJECT',id:sd.id,patch:{x:sd.oX+dx,y:sd.oY+dy},skipHistory:true});
        else dispatch({type:'UPDATE_OBJECT',id:sd.id,patch:{w:Math.max(80,sd.sW+dx),h:Math.max(80,sd.sH+dy)},skipHistory:true});
    };
    const onStickyPointerUp=()=>{if(stickyDragRef.current){const o=objects.find(o=>o.id===stickyDragRef.current.id);if(o)dispatch({type:'UPDATE_OBJECT',id:o.id,patch:{x:o.x,y:o.y,w:o.w,h:o.h}});stickyDragRef.current=null;}};

    const getCursor=()=>{if(tool===WB_TOOLS.PAN)return panDragRef.current?'grabbing':'grab';if(tool===WB_TOOLS.ERASER)return 'none';if(tool===WB_TOOLS.TEXT)return 'text';if(tool===WB_TOOLS.LASER)return 'crosshair';if(tool===WB_TOOLS.SELECT)return 'default';return 'crosshair';};
    const selectedImage=selectedImageId?objects.find(o=>o.id===selectedImageId):null;

    return(<div ref={tabRootRef} className={`flex flex-col ${isDark?'wb-dark':''} ${isFullscreenMode?'wb-fs-mode':''}`} style={{height:isFullscreenMode?'100dvh':'calc(100dvh - 76px)',minHeight:'500px',width:'100%'}}>
        {/* 상단 툴바 */}
        <div className="wb-panel border-b flex items-center px-2 py-1.5 gap-1 overflow-x-auto no-scrollbar" style={{flexShrink:0}}>
            <div className="flex items-center gap-1.5 px-1 mr-1 flex-shrink-0">
                <div className="bg-[#FFB7B2] p-1.5 rounded-lg text-white shadow-sm"><Icon name="palette" size={14}/></div>
                <span className="font-black text-sm hidden md:inline" style={{color:isDark?'#fff':'#4A4A4A'}}>판서</span>
            </div>
            <div className="wb-divider"/>
            <button onClick={()=>dispatch({type:'SET_BACKGROUND',bg:WB_BG_MODES.LIGHT})} className={`wb-tool-btn ${background===WB_BG_MODES.LIGHT?'active':''}`} data-tip="라이트 배경"><Icon name="sun" size={15}/></button>
            <button onClick={()=>dispatch({type:'SET_BACKGROUND',bg:WB_BG_MODES.DARK})} className={`wb-tool-btn ${background===WB_BG_MODES.DARK?'active':''}`} data-tip="다크 배경"><Icon name="moon" size={15}/></button>
            <button onClick={()=>dispatch({type:'SET_BACKGROUND',bg:WB_BG_MODES.GRID})} className={`wb-tool-btn ${background===WB_BG_MODES.GRID?'active':''}`} data-tip="격자 배경"><Icon name="grid-3x3" size={15}/></button>
            <button onClick={()=>dispatch({type:'SET_BACKGROUND',bg:WB_BG_MODES.GRAPH})} className={`wb-tool-btn ${background===WB_BG_MODES.GRAPH?'active':''}`} data-tip="모눈종이"><Icon name="grid-2x2" size={15}/></button>
            <button onClick={()=>dispatch({type:'SET_BACKGROUND',bg:WB_BG_MODES.LINED})} className={`wb-tool-btn ${background===WB_BG_MODES.LINED?'active':''}`} data-tip="줄노트"><Icon name="menu" size={15}/></button>
            <div className="wb-divider"/>
            <button onClick={()=>setTool(WB_TOOLS.MARKER)} className={`wb-tool-btn ${tool===WB_TOOLS.MARKER?'active':''}`} data-tip="마커펜 (P)"><Icon name="pen" size={15}/></button>
            <button onClick={()=>setTool(WB_TOOLS.HIGHLIGHTER)} className={`wb-tool-btn ${tool===WB_TOOLS.HIGHLIGHTER?'active':''}`} data-tip="형광펜 (H)"><Icon name="highlighter" size={15}/></button>
            <button onClick={()=>setTool(WB_TOOLS.BRUSH)} className={`wb-tool-btn ${tool===WB_TOOLS.BRUSH?'active':''}`} data-tip="브러쉬 (B)"><Icon name="brush" size={15}/></button>
            <button onClick={()=>setTool(WB_TOOLS.TEXT)} className={`wb-tool-btn ${tool===WB_TOOLS.TEXT?'active':''}`} data-tip="텍스트 (T)"><Icon name="type" size={15}/></button>
            <button onClick={()=>setTool(WB_TOOLS.SHAPE)} className={`wb-tool-btn ${tool===WB_TOOLS.SHAPE?'active':''}`} data-tip="도형 (S)"><Icon name="shapes" size={15}/></button>
            <button onClick={()=>setTool(WB_TOOLS.STICKY)} className={`wb-tool-btn ${tool===WB_TOOLS.STICKY?'active':''}`} data-tip="포스트잇 (N)"><Icon name="sticky-note" size={15}/></button>
            <button onClick={()=>fileInputRef.current?.click()} className="wb-tool-btn" data-tip="이미지 첨부 (I)"><Icon name="image-plus" size={15}/></button>
            <button onClick={()=>{setQRModalInput('');setShowQRModal(true);}} className="wb-tool-btn" data-tip="QR코드 삽입"><Icon name="qr-code" size={15}/></button>
            <button onClick={()=>{setYTModalInput('');setYTModalError('');setShowYTModal(true);}} className="wb-tool-btn" data-tip="YouTube 영상 삽입"><Icon name="youtube" size={15}/></button>
            <button onClick={()=>setTool(WB_TOOLS.ERASER)} className={`wb-tool-btn ${tool===WB_TOOLS.ERASER?'active':''}`} data-tip="지우개 (E)"><Icon name="eraser" size={15}/></button>
            <button onClick={()=>setTool(WB_TOOLS.SELECT)} className={`wb-tool-btn ${tool===WB_TOOLS.SELECT?'active':''}`} data-tip="선택/이동 (V)"><Icon name="mouse-pointer-2" size={15}/></button>
            <button onClick={()=>setTool(WB_TOOLS.PAN)} className={`wb-tool-btn ${tool===WB_TOOLS.PAN?'active':''}`} data-tip="손바닥 끌기 (스페이스)"><Icon name="hand" size={15}/></button>
            {(pan.x!==0||pan.y!==0)&&<button onClick={()=>setPanBoth({x:0,y:0})} className="wb-tool-btn action" data-tip="화면 위치 초기화"><Icon name="locate-fixed" size={15}/></button>}
            <button onClick={()=>setTool(WB_TOOLS.LASER)} className={`wb-tool-btn ${tool===WB_TOOLS.LASER?'active':''}`} data-tip="레이저 포인터 (L)"><Icon name="zap" size={15}/></button>
            <div className="wb-divider"/>
            <div className="flex items-center gap-0.5 ml-auto flex-shrink-0">
                <button onClick={()=>dispatch({type:'UNDO'})} className="wb-tool-btn action" data-tip="실행취소 (Ctrl+Z)" disabled={!state.history.length} style={{opacity:state.history.length?1:.3}}><Icon name="undo-2" size={15}/></button>
                <button onClick={()=>dispatch({type:'REDO'})} className="wb-tool-btn action" data-tip="다시실행 (Ctrl+Y)" disabled={!state.future.length} style={{opacity:state.future.length?1:.3}}><Icon name="redo-2" size={15}/></button>
                <button onClick={()=>setConfirmClear(true)} className="wb-tool-btn action" data-tip="전체 지우기"><Icon name="trash-2" size={15}/></button>
                <button onClick={exportPNG} className="wb-tool-btn action" data-tip="PNG 저장 (Ctrl+S)"><Icon name="download" size={15}/></button>
                <button onClick={toggleFullscreen} className="wb-tool-btn action" data-tip={isFullscreenMode?"전체화면 종료":"전체화면"}><Icon name={isFullscreenMode?"minimize":"maximize"} size={15}/></button>
                <button onClick={()=>setOptPanelOpen(o=>!o)} className="wb-tool-btn action" data-tip={optPanelOpen?"옵션 패널 접기":"옵션 패널 펼치기"}><Icon name={optPanelOpen?"chevron-up":"chevron-down"} size={15}/></button>
            </div>
        </div>

        {/* 옵션 패널 */}
        {optPanelOpen&&<div className="wb-panel border-b px-2 py-2" style={{flexShrink:0}}>
            <div className="flex items-center gap-2 overflow-x-auto no-scrollbar">
                {(tool===WB_TOOLS.MARKER||tool===WB_TOOLS.HIGHLIGHTER||tool===WB_TOOLS.BRUSH)&&(<>
                    <div className="flex items-center gap-1 flex-shrink-0">
                        {WB_BASE_COLORS.map(c=>(<div key={c} className={`wb-swatch ${penColor===c?'active':''}`} style={{backgroundColor:c}} onClick={()=>setPenColor(c)}/>))}
                        <input type="color" value={penColor} onChange={e=>{setPenColor(e.target.value);pushRecent(e.target.value);}} className="w-7 h-7 rounded-full border-2 border-white shadow cursor-pointer" style={{padding:0}}/>
                    </div>
                    {recentColors.length>0&&<><div className="wb-divider"/><span className="text-[10px] font-bold opacity-60 flex-shrink-0">최근</span>
                        {recentColors.map(c=>(<div key={c} className={`wb-swatch ${penColor===c?'active':''}`} style={{backgroundColor:c,width:18,height:18}} onClick={()=>setPenColor(c)}/>))}
                    </>}
                    <div className="wb-divider"/>
                    <div className="flex items-center gap-2 flex-shrink-0" style={{minWidth:140}}>
                        <span className="text-[10px] font-bold opacity-60">굵기</span>
                        <input type="range" min="1" max="30" value={penWidth} onChange={e=>setPenWidth(parseInt(e.target.value))} className="wb-range" style={{flex:1,minWidth:80}}/>
                        <span className="text-[10px] font-bold w-6 text-center">{penWidth}</span>
                    </div>
                </>)}
                {tool===WB_TOOLS.TEXT&&(<>
                    <select value={textOpts.fontFamily} onChange={e=>setTextOpts(o=>({...o,fontFamily:e.target.value}))} className="wb-chip flex-shrink-0" style={{padding:'6px 10px'}}>
                        {WB_FONTS.map(f=>(<option key={f.value} value={f.value} style={{fontFamily:f.value}}>{f.label}</option>))}
                    </select>
                    <div className="flex items-center gap-2 flex-shrink-0" style={{minWidth:140}}>
                        <span className="text-[10px] font-bold opacity-60">크기</span>
                        <input type="range" min="12" max="120" value={textOpts.fontSize} onChange={e=>setTextOpts(o=>({...o,fontSize:parseInt(e.target.value)}))} className="wb-range" style={{flex:1,minWidth:80}}/>
                        <span className="text-[10px] font-bold w-8 text-center">{textOpts.fontSize}</span>
                    </div>
                    <button onClick={()=>setTextOpts(o=>({...o,bold:!o.bold}))} className={`wb-chip ${textOpts.bold?'active':''}`}><Icon name="bold" size={12}/></button>
                    <button onClick={()=>setTextOpts(o=>({...o,italic:!o.italic}))} className={`wb-chip ${textOpts.italic?'active':''}`}><Icon name="italic" size={12}/></button>
                    <div className="wb-divider"/>
                    <div className="flex items-center gap-1 flex-shrink-0">{WB_BASE_COLORS.map(c=>(<div key={c} className={`wb-swatch ${textOpts.color===c?'active':''}`} style={{backgroundColor:c}} onClick={()=>setTextOpts(o=>({...o,color:c}))}/>))}</div>
                </>)}
                {tool===WB_TOOLS.SHAPE&&(<>
                    <div className="flex items-center gap-1 flex-shrink-0">{WB_SHAPES.map(s=>(<button key={s.value} onClick={()=>setShapeOpts(o=>({...o,shape:s.value}))} className={`wb-chip ${shapeOpts.shape===s.value?'active':''}`} title={s.label}><Icon name={s.icon} size={12}/></button>))}</div>
                    <div className="wb-divider"/>
                    <div className="flex items-center gap-1.5 flex-shrink-0"><span className="text-[10px] font-bold opacity-60">선색</span><input type="color" value={shapeOpts.strokeColor} onChange={e=>setShapeOpts(o=>({...o,strokeColor:e.target.value}))} className="w-6 h-6 rounded-full border-2 border-white shadow cursor-pointer" style={{padding:0}}/></div>
                    <div className="flex items-center gap-1.5 flex-shrink-0">
                        <span className="text-[10px] font-bold opacity-60">채움</span>
                        <button onClick={()=>setShapeOpts(o=>({...o,fillColor:o.fillColor==='transparent'?'#FFE5B4':'transparent'}))} className={`wb-chip ${shapeOpts.fillColor!=='transparent'?'active':''}`}>{shapeOpts.fillColor==='transparent'?'투명':'채움'}</button>
                        {shapeOpts.fillColor!=='transparent'&&<input type="color" value={shapeOpts.fillColor} onChange={e=>setShapeOpts(o=>({...o,fillColor:e.target.value}))} className="w-6 h-6 rounded-full border-2 border-white shadow cursor-pointer" style={{padding:0}}/>}
                    </div>
                    <div className="flex items-center gap-2 flex-shrink-0" style={{minWidth:110}}><span className="text-[10px] font-bold opacity-60">굵기</span><input type="range" min="1" max="20" value={shapeOpts.strokeWidth} onChange={e=>setShapeOpts(o=>({...o,strokeWidth:parseInt(e.target.value)}))} className="wb-range" style={{flex:1,minWidth:60}}/><span className="text-[10px] font-bold w-5">{shapeOpts.strokeWidth}</span></div>
                    <button onClick={()=>setShapeOpts(o=>({...o,dashed:!o.dashed}))} className={`wb-chip ${shapeOpts.dashed?'active':''}`}>점선</button>
                </>)}
                {tool===WB_TOOLS.STICKY&&(<>

                    <div className="wb-divider"/>
                    <div className="flex items-center gap-2 flex-shrink-0" style={{minWidth:140}}>
                        <span className="text-[10px] font-bold opacity-60">크기</span>

                        <span className="text-[10px] font-bold w-6 text-center">{eraserSize}</span>
                    </div>
                    <button onClick={()=>setEraserSize(10)} className={`wb-chip ${eraserSize===10?'active':''}`}>작게</button>
                    <button onClick={()=>setEraserSize(25)} className={`wb-chip ${eraserSize===25?'active':''}`}>보통</button>
                    <button onClick={()=>setEraserSize(60)} className={`wb-chip ${eraserSize===60?'active':''}`}>크게</button>
                </>)}
                {tool===WB_TOOLS.LASER&&(<span className="text-[10px] font-bold opacity-60">🔴 펜/마우스/손가락으로 <b>드래그</b>하면 빨간 점이 따라다닙니다</span>)}
                {tool===WB_TOOLS.SELECT&&(<span className="text-[10px] font-bold opacity-60">{selectedImage?'드래그 이동 · 핸들로 크기 조정 · Delete로 삭제':selectedText?'드래그 이동 · ✎로 수정 · 우측 핸들로 폭조절 · Delete 삭제':'이미지·글씨·포스트잇을 탭하면 선택됩니다 (이동·수정·삭제)'}</span>)}
                {tool===WB_TOOLS.PAN&&(<span className="text-[10px] font-bold opacity-60">✋ 드래그해서 화면을 이동합니다 · 스페이스를 누르고 있어도 이동</span>)}
                {tool===WB_TOOLS.TEXT&&(<span className="text-[10px] font-bold opacity-60">탭하면 글씨 입력 · <b>드래그</b>하면 입력 영역(폭)을 정할 수 있어요</span>)}
            </div>
        </div>}

        {/* 캔버스 영역 */}
        <div ref={containerRef} className="wb-canvas-stack flex-1 relative" style={{cursor:getCursor()}}

// ★ 세션 저장/복원 (창을 껐다 켜도 설정 유지)
const SESSION_KEY='songsam_session_v1';
const loadSession=()=>{try{const s=localStorage.getItem(SESSION_KEY);return s?JSON.parse(s):{};}catch(e){return {};}};


// 학급별로 저장되는 출결 확인과 수업 체크리스트.
const localDateString=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const ATTENDANCE_LABELS={present:'출석',absent:'결석',late:'지각',early:'조퇴'};
function AttendanceTool({students,records,setRecords,excludedInput,setExcludedInput}){
    const [date,setDate]=useState(localDateString),[notice,setNotice]=useState('');
    const entries=records.find(r=>r.date===date)?.entries||{};
    const counts=Object.fromEntries(Object.keys(ATTENDANCE_LABELS).map(key=>[key,students.filter(n=>entries[n]===key).length]));
    const saveEntries=next=>{
        if(!date)return setNotice('날짜를 선택해 주세요.');
        if(!records.some(r=>r.date===date)&&records.length>=366)return setNotice('출결은 학급당 366일을 보관할 수 있어요. 다음 학년도는 새 학급으로 등록해 주세요.');
        setRecords(prev=>[...prev.filter(r=>r.date!==date),{date,entries:next}].sort((a,b)=>a.date.localeCompare(b.date)));
        setNotice('출결을 변경했어요. 이 브라우저에 자동 저장됩니다.');
    };
    const excludeAbsent=()=>{
        const absent=students.filter(n=>['absent','early'].includes(entries[n]));
        if(!absent.length)return setNotice('선택한 날짜에 결석·조퇴로 표시한 학생이 없습니다.');
        const previous=excludedInput.split(/[\s,]+/).map(Number).filter(n=>students.includes(n));
        setExcludedInput([...new Set([...previous,...absent])].sort((a,b)=>a-b).join(', '));
        setNotice('결석·조퇴 번호를 추첨 제외 목록에 추가했어요. 기존 제외 번호는 유지됩니다.');
    };
    return <section className="class-tool card-enter w-full">
        <h2>출결 확인</h2><p>날짜별로 학생 번호의 출결을 확인하세요. 처음에는 모두 ‘미확인’이며 학급별로 기록됩니다.</p>
        <div className="tool-toolbar"><label htmlFor="attendance-date">확인 날짜</label><input id="attendance-date" type="date" value={date} onChange={e=>{setDate(e.target.value);setNotice('');}}/>
            <button disabled={!date} onClick={()=>saveEntries({...entries,...Object.fromEntries(students.filter(n=>!entries[n]).map(n=>[n,'present']))})}>미확인 모두 출석</button>
            <button disabled={!date} onClick={excludeAbsent}>결석·조퇴를 추첨 제외에 추가</button></div>
        <div className="attendance-counts"><span>전체 {students.length}명</span>{Object.entries(ATTENDANCE_LABELS).map(([key,label])=><span key={key} data-status={key}>{label} {counts[key]}명</span>)}<span>미확인 {students.filter(n=>!entries[n]).length}명</span></div>

        <p className="tool-notice" role="status">{notice}</p>

}
function LessonChecklist({items,setItems}){
    const [text,setText]=useState(''),[notice,setNotice]=useState('');
    const add=e=>{e.preventDefault();if(!text.trim())return;if(items.length>=200)return setNotice('체크리스트는 학급당 200개까지 저장할 수 있어요.');setItems(prev=>[...prev,{id:classId(),text:text.trim(),done:false}]);setText('');setNotice('할 일을 추가했어요.');};
    return <section className="class-tool card-enter w-full"><h2>수업 체크리스트</h2><p>준비물, 과제 수합, 수업 마무리를 확인하세요. 학급별로 저장되어 다음에 열어도 이어서 사용할 수 있어요.</p>
        <form className="checklist-form" onSubmit={add}><input aria-label="새 할 일" maxLength={200} value={text} onChange={e=>setText(e.target.value)} placeholder="예: 실험 준비물 확인, 활동지 걷기"/><button type="submit" className="primary" disabled={!text.trim()||items.length>=200}><Icon name="plus" size={16}/>할 일 추가</button></form>
        <div className="tool-toolbar"><p>완료 {items.filter(x=>x.done).length} / 전체 {items.length}</p><button disabled={!items.some(x=>x.done)} onClick={()=>{setItems(prev=>prev.map(x=>({...x,done:false})));setNotice('완료 표시를 해제했어요. 할 일은 그대로 유지됩니다.');}}>완료 표시 모두 해제</button></div>
        {!items.length&&<p className="library-empty">아직 등록한 할 일이 없습니다. 오늘 확인할 일을 추가해 보세요.</p>}
        {items.map(item=><div className={'lesson-task '+(item.done?'is-done':'')} key={item.id}><label><input type="checkbox" checked={item.done} onChange={()=>setItems(prev=>prev.map(x=>x.id===item.id?{...x,done:!x.done}:x))}/><span>{item.text}</span></label><button aria-label={item.text+' 삭제'} onClick={()=>{setItems(prev=>prev.filter(x=>x.id!==item.id));setNotice('할 일을 삭제했어요. 상단 실행 취소로 되돌릴 수 있어요.');}}><Icon name="trash-2" size={16}/></button></div>)}
        <p className="tool-notice" role="status">{notice}</p>
    </section>;
}

    const initAudio=()=>{if(!audioCtx.current)audioCtx.current=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.current.state==='suspended')audioCtx.current.resume();};
    const playSound=type=>{
        if(!isSoundOn)return;initAudio();const ctx=audioCtx.current;const t=ctx.currentTime;
        if(type==='click'){const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(800,t);g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);o.start(t);o.stop(t+.08);}
        else if(type==='tick'){const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='triangle';o.frequency.setValueAtTime(600,t);g.gain.setValueAtTime(.025,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);o.start(t);o.stop(t+.04);}
        else if(type==='win'){[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(f,t+i*.1);g.gain.setValueAtTime(0,t+i*.1);g.gain.linearRampToValueAtTime(.08,t+i*.1+.04);g.gain.exponentialRampToValueAtTime(.001,t+i*.1+.5);o.start(t+i*.1);o.stop(t+i*.1+.5);});}

<div style="position:absolute;left:${gridX+7}px;top:${y+barH-19}px;width:${gridW-14}px;height:12px;border-radius:0 0 8px 8px;background:linear-gradient(180deg,rgba(233,244,238,0) 0%,rgba(233,244,238,.11) 100%);"></div>
<div style="position:absolute;left:${gridX}px;top:${y}px;width:${gridW}px;height:${barH}px;line-height:${vLine(barH,21)}px;text-align:center;font-size:21px;font-weight:900;letter-spacing:11px;text-indent:11px;color:#F0F7F3;text-shadow:0 1px 3px rgba(0,0,0,.45);">칠 판</div>
${sideRules(y+Math.round(barH/2),'rgba(240,247,243,.32)')}`;

        const deskHtml=y=>{
            const bodyH=barH-7;
            return `
<div style="position:absolute;left:${gridX+Math.round(gridW*0.10)}px;top:${y+bodyH-2}px;width:${Math.round(gridW*0.80)}px;height:9px;border-radius:0 0 10px 10px;background:linear-gradient(180deg,#2E2721 0%,rgba(46,39,33,0) 100%);"></div>
<div style="position:absolute;left:${gridX}px;top:${y}px;width:${gridW}px;height:${bodyH}px;border-radius:12px;background:linear-gradient(180deg,#584C43 0%,#3E362F 58%,#342D28 100%);"></div>
<div style="position:absolute;left:${gridX+14}px;top:${y+2}px;width:${gridW-28}px;height:2px;border-radius:1px;background:rgba(255,255,255,.18);"></div>
<div style="position:absolute;left:${gridX+18}px;top:${y+bodyH-9}px;width:${gridW-36}px;height:2.5px;border-radius:2px;background:linear-gradient(90deg,rgba(240,168,104,0) 0%,#F0A868 22%,#FFD9BC 50%,#F0A868 78%,rgba(240,168,104,0) 100%);"></div>
<div style="position:absolute;left:${gridX}px;top:${y}px;width:${gridW}px;height:${bodyH-6}px;line-height:${vLine(bodyH-6,21)}px;text-align:center;font-size:21px;font-weight:900;letter-spacing:11px;text-indent:11px;color:#F8F0E6;text-shadow:0 1px 3px rgba(0,0,0,.4);">교 탁</div>
${sideRules(y+Math.round((bodyH-6)/2),'rgba(248,240,230,.30)')}`;
        };

        return `
<div style="position:absolute;left:${M}px;top:${M-4}px;width:${areaW-(teacherLine?360:60)}px;height:${titleH}px;font-size:${titleFs.toFixed(1)}px;line-height:${vLine(titleH,titleFs)}px;font-weight:900;color:#2F3437;white-space:nowrap;overflow:hidden;">${seatEsc(title)}</div>
<div style="position:absolute;left:${M}px;top:${M+44}px;width:${areaW}px;font-size:14px;line-height:19px;font-weight:700;color:#B0B0B0;">${seatEsc(sub)}</div>
${teacherLine?`<div style="position:absolute;left:${M}px;top:${M+5}px;width:${areaW}px;text-align:right;font-size:${teacherFs.toFixed(1)}px;line-height:28px;font-weight:900;color:#5D5D5D;white-space:nowrap;">${seatEsc(teacherLine)}</div>`:''}
<div style="position:absolute;left:${M}px;top:${M+(teacherLine?40:10)}px;width:${areaW}px;text-align:right;font-size:14px;line-height:19px;font-weight:700;color:#B5B5B5;">${dateStr}</div>
<div style="position:absolute;left:${M}px;top:${M+headerH-4}px;width:${areaW}px;height:3px;border-radius:2px;background:${accent};"></div>
${isTeacher?deskHtml(barY):boardHtml(barY)}
<div style="position:absolute;left:${gridX}px;top:${noteY}px;width:${gridW}px;height:${noteH}px;line-height:${vLine(noteH,13)}px;text-align:center;font-size:13px;font-weight:700;color:#BEBEBE;letter-spacing:3px;">${noteLabel}</div>`;
    };

    // 화면 밖에 그린 배치표를 이미지로 떠서 A4 가로 PDF 로 저장
    const savePosterPDF=async({html,fname,label})=>{
        const {W,H}=POSTER;
        const host=document.createElement('div');
        host.setAttribute('style',`position:absolute;left:-99999px;top:0;width:${W}px;height:${H}px;background:#ffffff;font-family:'Jua','Noto Sans KR',sans-serif;`);
        host.innerHTML=html;
        document.body.appendChild(host);
        try{
            try{await document.fonts.ready;}catch(e){}
            const canvas=await html2canvas(host,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false,width:W,height:H,windowWidth:W,windowHeight:H});
            const img=canvas.toDataURL('image/jpeg',0.95);
            const JsPDF=window.jspdf&&window.jspdf.jsPDF;
            if(JsPDF){
                const pdf=new JsPDF({orientation:'landscape',unit:'mm',format:'a4'});
                pdf.addImage(img,'JPEG',0,0,pdf.internal.pageSize.getWidth(),pdf.internal.pageSize.getHeight());
                pdf.save(fname+'.pdf');
                showAlert(`${label} PDF가 저장되었습니다 📄`);
            }else{
                // jsPDF 로드 실패(오프라인 등) → 인쇄창에서 'PDF로 저장' 하도록 대체
                const w=window.open('','_blank');
                if(!w)return showAlert("PDF 저장에 실패했습니다.\n팝업 차단을 해제한 뒤 다시 시도해주세요.");
                w.document.write(`<html><head><meta charset="utf-8"><title>${fname}</title><style>@page{size:A4 landscape;margin:0}html,body{margin:0;padding:0}img{width:100%;display:block}</style></head><body><img src="${img}"></body></html>`);
                w.document.close();w.focus();
                setTimeout(()=>{try{w.print();}catch(e){}},700);
                showAlert("인쇄 창에서 '대상'을 'PDF로 저장'으로 선택해주세요.");
            }
        }catch(e){
            console.error(e);
            showAlert("PDF 저장에 실패했습니다.\n잠시 후 다시 시도해주세요.");
        }finally{
            host.remove();
        }
    };

    // ===== 좌석 배치도 PDF 저장 (교탁 게시용 / 학생 게시용) =====
    // 현재 좌석을 {rows:[[cell|null,...],...], cols, pair} 행렬로 변환 (화면 배치와 동일)
    const buildSeatMatrix=()=>{
        if(!seats.length)return null;
        if(seatType==='pair'){
            const desks=[];
            for(let i=0;i<seats.length;i+=2)desks.push([seats[i]??null,seats[i+1]??null]);
            const cols=Math.min(3,Math.max(1,desks.length));
            const rows=[];
            for(let i=0;i<desks.length;i+=cols){
                const row=[];
                for(let c=0;c<cols;c++)row.push(desks[i+c]?{labels:desks[i+c]}:null);
                rows.push(row);
            }
            return {rows,cols,pair:true};
        }
        if(savedSeatLayout&&savedSeatLayout.grid&&savedSeatLayout.grid.length){
            const cols=Math.max(1,savedSeatLayout.cols);
            let idx=0;const rows=[];
            savedSeatLayout.grid.forEach(gRow=>{
                const row=[];
                for(let c=0;c<cols;c++)row.push(gRow[c]?{labels:[idx<seats.length?seats[idx++]:null]}:null);
                rows.push(row);
            });
            return {rows,cols,pair:false};
        }
        const cols=Math.max(1,seatColumns);
        const rows=[];
        for(let i=0;i<seats.length;i+=cols){
            const row=[];
            for(let c=0;c<cols;c++)row.push(i+c<seats.length?{labels:[seats[i+c]]}:null);
            rows.push(row);
        }
        return {rows,cols,pair:false};
    };

    // 교탁에서 학생을 바라본 방향 = 180° 회전 (앞뒤 뒤집기 + 좌우 뒤집기)
    const rotateSeatMatrix180=m=>({...m,rows:m.rows.slice().reverse().map(row=>row.slice().reverse().map(c=>c?{labels:c.labels.slice().reverse()}:null))});

    const exportSeatPDF=async(view)=>{
        const base=buildSeatMatrix();
        if(!base)return showAlert("먼저 좌석을 생성해주세요.");
        playSound('click');
        const isTeacher=view==='teacher';
        const m=isTeacher?rotateSeatMatrix180(base):base;

        const rows=m.rows.length,cols=m.cols;
        const {M}=POSTER;
        const {areaW,areaY,areaH}=posterArea(isTeacher);
        const gap=Math.max(6,Math.min(14,Math.round(Math.min(areaW/cols,areaH/rows)*0.10)));
        // 학생 수가 적을 때 칸이 지나치게 커지지 않도록 상한을 두고 가운데 정렬
        const CW=Math.min(m.pair?340:230,Math.floor((areaW-gap*(cols-1))/cols));
        const CH=Math.min(120,Math.floor((areaH-gap*(rows-1))/rows));
        const gridW=CW*cols+gap*(cols-1),gridH=CH*rows+gap*(rows-1);
        const gridX=M+Math.round((areaW-gridW)/2),gridY=areaY+Math.round((areaH-gridH)/2);
        const iw=CW-4,ih=CH-4;

        let maxUnits=1;
        m.rows.forEach(r=>r.forEach(c=>{if(c)c.labels.forEach(l=>{if(l!=null&&l!=='')maxUnits=Math.max(maxUnits,seatTextUnits(l));});}));
        const textW=m.pair?(iw/2-10):(iw-12);
        const fs=Math.max(9,Math.min(42,Math.min(ih*0.5,textW/maxUnits)));
        const fsTxt=fs.toFixed(1);
        const vLine=posterVLine;

        const cellsHtml=[];
        m.rows.forEach((row,ri)=>row.forEach((cell,ci)=>{
            if(!cell)return;
            const x=gridX+ci*(CW+gap),y=gridY+ri*(CH+gap);
            const box=`position:absolute;left:${x}px;top:${y}px;width:${CW}px;height:${CH}px;box-sizing:border-box;`;
            if(m.pair){
                const lw=Math.round(iw/2),rw=iw-lw;
                const half=(l,i)=>`<div style="position:absolute;left:${i===0?0:lw}px;top:0;width:${i===0?lw:rw}px;height:${ih}px;line-height:${vLine(ih,fs)}px;text-align:center;font-size:${fsTxt}px;font-weight:900;color:#3D3D3D;box-sizing:border-box;${i===0?'border-right:1.5px solid #F3C9A8;':''}">${l==null||l===''?'':seatEsc(l)}</div>`;
                cellsHtml.push(`<div style="${box}background:#FFF8F0;border:2px solid #F0A868;border-radius:10px;overflow:hidden;">${cell.labels.map(half).join('')}</div>`);
            }else{
                const l=cell.labels[0];
                if(l==null||l===''){
                    cellsHtml.push(`<div style="${box}background:#FAFAFA;border:2px dashed #DDDDDD;border-radius:10px;"></div>`);
                }else{
                    cellsHtml.push(`<div style="${box}background:#ffffff;border:2px solid #F0A868;border-radius:10px;line-height:${vLine(ih,fs)}px;text-align:center;font-size:${fsTxt}px;font-weight:900;color:#3D3D3D;overflow:hidden;">${seatEsc(l)}</div>`);
                }
            }
        }));

        const title=(seatTitle||'').trim()||'자리 배치도';
        const html=buildPosterChrome({title,isTeacher,gridX,gridW})+cellsHtml.join('');
        const fname=`${posterFileBase(seatTitle,title,'송쌤과학_자리배치도')}_${isTeacher?'교탁게시용':'학생게시용'}_${posterStamp().ymd}`;
        await savePosterPDF({html,fname,label:isTeacher?'교탁 게시용':'학생 게시용'});
    };

    // ===== 모둠 배치도 PDF 저장 (교탁 게시용 / 학생 게시용) =====
    // 모둠 안 자리 열 수 (화면의 renderTeamDesk 와 같은 규칙)
    const teamInnerCols=(n,outerCols)=>outerCols===2?2:(n<=4?2:3);
    // 현재 모둠을 화면과 같은 행렬로 변환: rows=[[모둠|null,...],...]
    // 모둠 = {no, count, ic, seatRows:[[이름|null,...],...]} — 모둠마다 자리 줄 수를 맞춰 두어
    // 180° 회전했을 때도 각 모둠의 앞줄(칠판 쪽 줄)이 같은 높이에 오게 한다.
    const buildTeamMatrix=(cols)=>{
        if(!teams.length)return null;
        const list=teams.map((team,i)=>{
            const t=Array.isArray(team)?team:[];
            const ic=teamInnerCols(t.length,teamColumns);
            const seatRows=[];
            for(let r=0;r<t.length;r+=ic){const row=[];for(let c=0;c<ic;c++)row.push(r+c<t.length?t[r+c]:null);seatRows.push(row);}
            return {no:i+1,count:t.length,ic,seatRows};
        });
        const innerRows=Math.max(1,...list.map(t=>t.seatRows.length));
        list.forEach(t=>{while(t.seatRows.length<innerRows)t.seatRows.push(Array(t.ic).fill(null));});
        const rows=[];
        for(let i=0;i<list.length;i+=cols){const row=[];for(let c=0;c<cols;c++)row.push(list[i+c]||null);rows.push(row);}
        return {rows,cols,innerRows};
    };
    // 교탁에서 바라본 방향 = 모둠 배치와 모둠 안 자리를 모두 180° 회전
    const rotateTeamMatrix180=m=>({...m,rows:m.rows.slice().reverse().map(row=>row.slice().reverse().map(t=>t?{...t,seatRows:t.seatRows.slice().reverse().map(r=>r.slice().reverse())}:null))});

    const exportTeamPDF=async(view)=>{
        if(!teams.length)return showAlert("먼저 모둠을 생성해주세요.");
        playSound('click');
        const isTeacher=view==='teacher';
        const {M}=POSTER;
        const {areaW,areaY,areaH}=posterArea(isTeacher);

        // 모둠 카드의 모든 치수를 기준 단위(u)의 배수로 잡아, 모둠 수·인원에 맞춰 한 장에 들어가도록 줄인다
        const K={pad:.5,hc:1.4,hg:.4,sp:.45,cell:3,ig:.35};
        const HC_MIN=22;   // 모둠 번호 머리글은 최소 22px 로 읽기 쉽게
        const fit=cols=>{
            const m=buildTeamMatrix(cols);
            const rows=m.rows.length,IR=m.innerRows;
            const gap=rows<=2?20:rows<=3?16:12;
            const cardHMax=(areaH-gap*(rows-1))/rows;
            const unitsH=K.pad*2+K.hc+K.hg+K.sp*2+K.cell*IR+K.ig*(IR-1);
            let u=Math.min(24,cardHMax/unitsH);
            // 머리글이 최소 높이보다 작아지면 머리글을 고정하고 나머지 치수를 조금 더 줄인다
            if(u*K.hc<HC_MIN)u=Math.max(1,(cardHMax-HC_MIN)/(unitsH-K.hc));
            return {m,rows,IR,gap,u};
        };
        // 화면의 열 수를 그대로 쓰되, 모둠이 너무 많아 글자가 지나치게 작아질 때만 열을 늘린다
        const baseCols=Math.max(1,Math.min(teamColumns,teams.length));
        let L=fit(baseCols);
        for(let c=baseCols+1;L.u<9&&c<=Math.min(5,teams.length);c++){const next=fit(c);if(next.u>L.u)L=next;}
        const {rows,IR,gap,u}=L;
        const m0=L.m,cols=m0.cols;
        const m=isTeacher?rotateTeamMatrix180(m0):m0;

        const pad=Math.floor(u*K.pad),hc=Math.max(HC_MIN,Math.round(u*K.hc)),hg=Math.floor(u*K.hg),sp=Math.floor(u*K.sp),ig=Math.max(3,Math.floor(u*K.ig));
        const cellH=Math.floor(u*K.cell);
        const surfH=sp*2+cellH*IR+ig*(IR-1);
        const cardH=pad*2+hc+hg+surfH;
        // 모둠이 적을 때 카드가 지나치게 넓어지지 않도록 상한을 두고 가운데 정렬
        const cardW=Math.min(480,Math.floor((areaW-gap*(cols-1))/cols));
        const gridW=cardW*cols+gap*(cols-1),gridH=cardH*rows+gap*(rows-1);
        const gridX=M+Math.round((areaW-gridW)/2),gridY=areaY+Math.round((areaH-gridH)/2);
        // 칠판·교탁은 배치 폭이 좁아도 최소 460px 로 그림
        const boardW=Math.min(areaW,Math.max(gridW,460)),boardX=M+Math.round((areaW-boardW)/2);

        const cellW=ic=>Math.floor((cardW-pad*2-sp*2-ig*(ic-1))/ic);
        let maxUnits=1,minCellW=Infinity;
        m.rows.forEach(r=>r.forEach(t=>{if(!t)return;minCellW=Math.min(minCellW,cellW(t.ic));t.seatRows.forEach(sr=>sr.forEach(l=>{if(l!=null&&l!=='')maxUnits=Math.max(maxUnits,seatTextUnits(l));}));}));
        const fs=Math.max(8,Math.min(40,cellH*0.5,(minCellW-12)/maxUnits));
        const fsTxt=fs.toFixed(1);
        const vLine=posterVLine;
        const hfs=hc*0.6,cfs=Math.max(10,hc*0.48);
        const rCard=Math.max(6,Math.min(14,Math.round(u*0.6))),rSurf=Math.max(5,Math.min(10,Math.round(u*0.45))),rCell=Math.max(4,Math.min(9,Math.round(u*0.35)));

        const html=[];
        m.rows.forEach((row,ri)=>row.forEach((t,ci)=>{
            if(!t)return;
            const x=gridX+ci*(cardW+gap),y=gridY+ri*(cardH+gap);
            html.push(`<div style="position:absolute;left:${x}px;top:${y}px;width:${cardW}px;height:${cardH}px;box-sizing:border-box;border-radius:${rCard}px;background:linear-gradient(180deg,#F7F9FC 0%,#EEF1F8 100%);border:1.5px solid #D8DEF0;"></div>`);
            // 머리글: 모둠 번호 배지 + 'N모둠' + 인원
            const hy=y+pad;
            html.push(`<div style="position:absolute;left:${x+pad}px;top:${hy}px;width:${hc}px;height:${hc}px;border-radius:${Math.round(hc*0.3)}px;background:#5C6B9E;color:#ffffff;text-align:center;font-size:${hfs.toFixed(1)}px;line-height:${vLine(hc,hfs)}px;font-weight:900;">${t.no}</div>`);
            html.push(`<div style="position:absolute;left:${x+pad+hc+Math.round(hc*0.35)}px;top:${hy}px;width:${cardW-pad*2-hc*2}px;height:${hc}px;font-size:${hfs.toFixed(1)}px;line-height:${vLine(hc,hfs)}px;font-weight:900;color:#3D4466;white-space:nowrap;">${t.no}모둠</div>`);
            html.push(`<div style="position:absolute;left:${x+pad}px;top:${hy}px;width:${cardW-pad*2}px;height:${hc}px;text-align:right;font-size:${cfs.toFixed(1)}px;line-height:${vLine(hc,cfs)}px;font-weight:700;color:#9AA2BF;white-space:nowrap;">${t.count}명</div>`);
            // 책상 + 자리
            const sx=x+pad,sy=hy+hc+hg,sw=cardW-pad*2;
            html.push(`<div style="position:absolute;left:${sx}px;top:${sy}px;width:${sw}px;height:${surfH}px;box-sizing:border-box;border-radius:${rSurf}px;background:#ffffff;border:1.5px solid #C9D1EC;"></div>`);
            const cw=cellW(t.ic);
            // 열 수가 다른 모둠(2열/3열)도 책상 안에서 좌우 가운데에 오도록
            const used=cw*t.ic+ig*(t.ic-1),ox=sx+Math.round((sw-used)/2);
            t.seatRows.forEach((sr,r)=>sr.forEach((l,c)=>{
                if(l==null||l==='')return;
                const cx=ox+c*(cw+ig),cy=sy+sp+r*(cellH+ig);
                html.push(`<div style="position:absolute;left:${cx}px;top:${cy}px;width:${cw}px;height:${cellH}px;box-sizing:border-box;border-radius:${rCell}px;background:#F5F7FC;border:1.5px solid #D9DEF0;text-align:center;font-size:${fsTxt}px;line-height:${vLine(cellH-3,fs)}px;font-weight:900;color:#3D3D3D;overflow:hidden;white-space:nowrap;">${seatEsc(l)}</div>`);
            }));
        }));

        const title=(teamTitle||'').trim()||'모둠 배치도';
        const chrome=buildPosterChrome({title,isTeacher,gridX:boardX,gridW:boardW,accent:'linear-gradient(90deg,#7C8BC4 0%,#C7CEEA 45%,rgba(199,206,234,.12) 100%)'});
        const fname=`${posterFileBase(teamTitle,title,'송쌤과학_모둠배치도')}_${isTeacher?'교탁게시용':'학생게시용'}_${posterStamp().ymd}`;
        await savePosterPDF({html:chrome+html.join(''),fname,label:isTeacher?'모둠 교탁 게시용':'모둠 학생 게시용'});
    };

    // PDF 배치표에 인쇄될 제목 · 교사명 입력칸 (교사명·담임/교과는 좌석·모둠이 함께 씀)
    const renderPosterInfo=(titleValue,setTitleValue,defaultLabel,example)=>(
        <div className="bg-[#FFF8F0] rounded-xl p-2.5 border border-[#F7E4D0] space-y-2">
            <div className="flex items-center gap-1.5">
                <Icon name="file-text" size={12} className="text-[#D68C60]"/>
                <span className="text-[10px] font-black text-[#D68C60]">PDF 배치표 정보</span>
                <span className="text-[9px] font-bold text-gray-400">비워두면 '{defaultLabel}'로 인쇄됩니다</span>
            </div>
            <input value={titleValue} onChange={e=>setTitleValue(e.target.value)} maxLength={40}
                className="w-full p-2 bg-white rounded-lg border-2 border-transparent focus:border-[#FFD3B6] outline-none text-xs font-bold"
                placeholder={`배치표 제목 (예: ${example})`}/>

    const startClass=e=>{e.preventDefault();const c=parseInt(studentCount);if(!c||c<1||c>100)return showAlert("1~100 사이의 번호를 입력해주세요.");playSound('click');setStudents(Array.from({length:c},(_,i)=>i+1));setStep('main');setTimeout(initAudio,300);};
    const goHome=()=>classContext.openPanel('classes');

    // ★ 타이머 ref - 모든 타이머 동작은 이 ref들 기반
    const timerStartRef=useRef(null);
    const timerStartLeftRef=useRef(0);

    // ★ 시간 조정 함수 - 작동 중에도 즉시 반영되도록 ref 갱신
    const adjustTime=sec=>{
        playSound('click');
        const v=Math.max(0,Math.min(599999,timeLeft+sec));
        setTimeLeft(v);
        if(isTimerRunning){
            // 작동 중이면 ref를 새로 세팅하여 다음 tick부터 새 값에서 카운트
            timerStartRef.current=Date.now();
            timerStartLeftRef.current=v;
            // 새 timeLeft가 기존 initialTime보다 크면 진행도 바가 100% 초과되지 않게 보정
            if(v>initialTime)setInitialTime(v);
        }else{
            setInitialTime(v);
        }
    };

    const onMinFocus=()=>{setEditingMin(true);setMinEdit(String(Math.floor(timeLeft/60)));};
    const onMinBlur=()=>{setEditingMin(false);const m=Math.max(0,Math.min(9999,parseInt(minEdit)||0)),s=timeLeft%60,v=m*60+s;setTimeLeft(v);setInitialTime(v);};
    const onSecFocus=()=>{setEditingSec(true);setSecEdit(String(timeLeft%60));};
    const onSecBlur=()=>{setEditingSec(false);const m=Math.floor(timeLeft/60),s=Math.max(0,Math.min(59,parseInt(secEdit)||0)),v=m*60+s;setTimeLeft(v);setInitialTime(v);};

    // ★ 타이머 tick - timestamp 기반
    const tickTimer=()=>{
        if(timerStartRef.current===null)return;
        const elapsed=Math.floor((Date.now()-timerStartRef.current)/1000);
        const newLeft=Math.max(0,timerStartLeftRef.current-elapsed);
        setTimeLeft(newLeft);
        if(newLeft<=0){
            clearInterval(timerRef.current);
            timerRef.current=null;
            timerStartRef.current=null;
            setIsTimerRunning(false);
            playSound('alarm');
            fireConfetti();
        }
    };
    useEffect(()=>{
        if(isTimerRunning&&timeLeft>0){
            timerStartRef.current=Date.now();
            timerStartLeftRef.current=timeLeft;
            clearInterval(timerRef.current);
            timerRef.current=setInterval(tickTimer,250);
        }else{
            clearInterval(timerRef.current);
            timerRef.current=null;
            timerStartRef.current=null;
        }
        return()=>clearInterval(timerRef.current);
    },[isTimerRunning]);
    useEffect(()=>{
        const onVis=()=>{if(!document.hidden&&isTimerRunning&&timerStartRef.current!==null)tickTimer();};
        const onFocus=()=>{if(isTimerRunning&&timerStartRef.current!==null)tickTimer();};
        document.addEventListener('visibilitychange',onVis);
        window.addEventListener('focus',onFocus);
        return()=>{document.removeEventListener('visibilitychange',onVis);window.removeEventListener('focus',onFocus);};
    },[isTimerRunning]);

    const parseData=()=>{if(placementType==='number')return activeStudents;if(placementType==='name'){const l=inputNames.split(/[\n,]+/).map(s=>s.trim()).filter(s=>s);return l.length?l:null;}if(placementType==='gender'){const m=maleInput.split(/[\n,]+/).map(s=>s.trim()).filter(s=>s),f=femaleInput.split(/[\n,]+/).map(s=>s.trim()).filter(s=>s);return m.length+f.length?{m,f}:null;}return[];};
    const buildPool=data=>{let pool=[];if(placementType==='gender'){let{m,f}=data;m=[...m].sort(()=>Math.random()-.5);f=[...f].sort(()=>Math.random()-.5);if(genderOption==='mixed'){const mx=Math.max(m.length,f.length);for(let i=0;i<mx;i++){if(i<m.length)pool.push(m[i]);if(i<f.length)pool.push(f[i]);}}else pool=[...m,...f];}else pool=[...data].sort(()=>Math.random()-.5);return pool;};

    const createTeams=()=>{if(isPicking)return;const data=parseData();if(!data||!data.length)return showAlert("참여할 학생이 없습니다.");playSound('click');setIsPicking(true);setTeams([]);setTimeout(()=>{const pool=buildPool(data);const t=Array.from({length:teamCount},()=>[]);pool.forEach((s,i)=>t[i%teamCount].push(s));setTeams(t);setIsPicking(false);playSound('win');},350);};
    const createSeats=()=>{if(isPicking)return;const data=parseData();if(!data||!data.length)return showAlert("참여할 학생이 없습니다.");
        // 혼자 + 자리 배치 모드: 저장된 배치가 없거나 변경되었으면 현재 격자를 자동 저장(잠금)
        if(seatType==='single'&&seatRowMode==='custom'){
            if(seatGridTotal<1)return showAlert("켜진 좌석이 없습니다.\n좌석을 1개 이상 켜주세요.");
            if(!savedSeatLayout||seatLayoutDirty){
                setSavedSeatLayout({grid:seatGrid.map(r=>[...r]),cols:seatColumns});
                setSeatLayoutDirty(false);
            }
        }
        playSound('click');setIsPicking(true);setSeats([]);setTimeout(()=>{let pool=buildPool(data);if(seatType==='pair'&&(seatPairSettings.mustPair.length>0||seatPairSettings.mustNotPair.length>0))pool=applyPC(pool,seatPairSettings);pool=applyFixedSeats(pool);setSeats(pool);setIsPicking(false);playSound('win');},350);};
    const applyPC=(pool,settings)=>{const{mustPair,mustNotPair}=settings;const s=v=>String(v);for(let a=0;a<200;a++){let arr=[...pool].sort(()=>Math.random()-.5);for(const p of mustPair){const iA=arr.findIndex(x=>s(x)===s(p[0])),iB=arr.findIndex(x=>s(x)===s(p[1]));if(iA===-1||iB===-1)continue;const big=Math.max(iA,iB),sm=Math.min(iA,iB);const pB=arr.splice(big,1)[0],pS=arr.splice(sm,1)[0];arr.splice(0,0,pS,pB);}let ok=true;for(const p of mustPair){let f=false;for(let i=0;i+1<arr.length;i+=2)if((s(arr[i])===s(p[0])&&s(arr[i+1])===s(p[1]))||(s(arr[i])===s(p[1])&&s(arr[i+1])===s(p[0]))){f=true;break;}if(!f){ok=false;break;}}if(!ok)continue;for(const p of mustNotPair){for(let i=0;i+1<arr.length;i+=2)if((s(arr[i])===s(p[0])&&s(arr[i+1])===s(p[1]))||(s(arr[i])===s(p[1])&&s(arr[i+1])===s(p[0]))){ok=false;break;}if(!ok)break;}if(ok)return arr;}return[...pool].sort(()=>Math.random()-.5);};

    const addPairSetting=()=>{const a=pairInputA.trim(),b=pairInputB.trim();if(!a||b)return showAlert("두 학생 모두 입력해주세요.");if(a===b)return showAlert("같은 학생을 입력할 수 없습니다.");const key=pairSettingTab==='must'?'mustPair':'mustNotPair';if(seatPairSettings[key].some(p=>(String(p[0])===a&&String(p[1])===b)||(String(p[0])===b&&String(p[1])===a)))return showAlert("이미 등록된 조합입니다.");setSeatPairSettings(prev=>({...prev,[key]:[...prev[key],[a,b]]}));setPairInputA('');setPairInputB('');playSound('click');};
    const removePairSetting=(key,idx)=>{playSound('click');setSeatPairSettings(prev=>({...prev,[key]:prev[key].filter((_,i)=>i!==idx)}));};

    // ★ 고정 좌석: pool(섞인 학생 배열)에서 지정 학생을 지정 자리로 이동, 나머지는 순서대로 채움
    const applyFixedSeats=(pool)=>{
        if(!seatFixed.length)return pool;
        const s=v=>String(v);
        const n=pool.length;
        const result=new Array(n).fill(undefined);
        const remaining=[...pool];
        seatFixed.forEach(f=>{
            const pos=parseInt(f.pos)-1;
            if(isNaN(pos)||pos<0||pos>=n)return;       // 자리 범위를 벗어나면 무시
            if(result[pos]!==undefined)return;         // 이미 채워진 자리면 무시
            const idx=remaining.findIndex(x=>s(x)===s(f.student));
            if(idx===-1)return;                        // 명단에 없는 학생이면 무시
            result[pos]=remaining.splice(idx,1)[0];
        });
        let ri=0;
        for(let i=0;i<n;i++){if(result[i]===undefined)result[i]=remaining[ri++];}
        return result;
    };
    // 현재 배치 인원 수(고정 좌석 미리보기용)
    const getExpectedCount=()=>{const d=parseData();if(!d)return 0;if(placementType==='gender')return (d.m?.length||0)+(d.f?.length||0);return d.length;};

        return [];
    };
    const isInRoster=st=>rosterList().some(x=>String(x)===String(st));
    // 미리보기 레이아웃(현재 좌석 모드/저장배치 기준) 계산
    const buildFixLayout=()=>{
        const expected=getExpectedCount();
        if(seatType==='single'&&savedSeatLayout&&savedSeatLayout.grid){
            const cols=savedSeatLayout.cols;let onIdx=0;
            const rows=savedSeatLayout.grid.map(row=>{
                const cells=[];
                for(let ci=0;ci<cols;ci++){
                    if(row[ci]){onIdx++;cells.push(onIdx<=expected?{pos:onIdx}:{empty:true});}
                    else cells.push({spacer:true});
                }
                return {cols,cells};
            });
            return {rows,expected};
        }
        if(seatType==='pair'){
            const rows=[];
            for(let i=0;i<expected;i+=2){
                const cells=[{pos:i+1}];
                cells.push(i+1<expected?{pos:i+2}:{spacer:true});
                rows.push({cols:2,cells,pair:true});
            }
            return {rows,expected};
        }
        const cols=seatColumns;const rows=[];
        for(let i=0;i<expected;i+=cols){
            const cells=[];
            for(let c=0;c<cols;c++){const p=i+c+1;cells.push(p<=expected?{pos:p}:{spacer:true});}
            rows.push({cols,cells});
        }
        return {rows,expected};
    };
    // 미리보기에서 자리를 탭했을 때
    const onFixSeatTap=pos=>{
        const occupant=seatFixed.find(f=>String(f.pos)===String(pos));
        if(occupant){playSound('click');setSeatFixed(prev=>prev.filter(f=>String(f.pos)!==String(pos)));return;}
        const st=fixStudent.trim();
        if(!st){playSound('click');setFixPos(pos);return showAlert("먼저 위 칸에 학생 번호(또는 이름)를\n입력한 뒤 자리를 선택하세요.");}
        if(!isInRoster(st))return showAlert("명단에 없는 학생입니다.\n번호/이름을 다시 확인해주세요.");
        playSound('win');
        setSeatFixed(prev=>{const cleaned=prev.filter(f=>String(f.student)!==String(st)&&String(f.pos)!==String(pos));return [...cleaned,{student:st,pos}];});
        setFixStudent('');setFixPos(null);
    };
    const removeFix=pos=>{playSound('click');setSeatFixed(prev=>prev.filter(f=>String(f.pos)!==String(pos)));};

    const performSwap=(src,tgt)=>{if(src.type==='team'){const t=[...teams.map(x=>[...x])];const tmp=t[src.index][src.subIndex];t[src.index][src.subIndex]=t[tgt.index][tgt.subIndex];t[tgt.index][tgt.subIndex]=tmp;setTeams(t);}else{const s=[...seats];[s[src.index],s[tgt.index]]=[s[tgt.index],s[src.index]];setSeats(s);}};
    const handleItemTap=(type,index,subIndex=null)=>{if(isPicking)return;playSound('click');if(selectedItem){if(selectedItem.type===type&&selectedItem.index===index&&selectedItem.subIndex===subIndex){setSelectedItem(null);return;}if(selectedItem.type!==type){setSelectedItem({type,index,subIndex});return;}performSwap(selectedItem,{type,index,subIndex});setSelectedItem(null);playSound('win');}else setSelectedItem({type,index,subIndex});};

    const addMemo=()=>{
        if(!memoInput.trim())return;
        playSound('click');
        if(editingMemoId!=null){
            setMemos(memos.map(m=>m.id===editingMemoId?{...m,text:memoInput,color:memoColor,fontSize:memoFontSize}:m));
            setEditingMemoId(null);

        setMemoInput('');

    const startEditMemo=(m)=>{playSound('click');setEditingMemoId(m.id);setMemoInput(m.text);setMemoColor(m.color);setMemoFontSize(m.fontSize||14);};
    const cancelEditMemo=()=>{setEditingMemoId(null);setMemoInput('');};

    const showMiniTimer=step==='main'&&mode!=='timer'&&(isTimerRunning||timerEverStarted)&&timeLeft>0;
    const NavBtn=({active,icon,label,onClick,color='#FFB7B2'})=><button onClick={()=>{playSound('click');onClick();}} className={`nav-pill ${active?'active':''}`} style={{'--pill-c':color}} title={label} aria-pressed={active}><Icon name={icon} size={16}/><span className="text-[8px] sm:text-[10px] md:text-sm font-bold leading-tight">{label}</span></button>;

    const getTimerFontSize=()=>{
        const totalChars=Math.floor(timeLeft/60).toString().length+3;
        const isMobile=typeof window!=='undefined'&&window.innerWidth<640;
        if(totalChars<=5){
            return isMobile?'3.5rem':'5.5rem';
        }else if(totalChars===6){
            return isMobile?'2.8rem':'4.5rem';
        }else if(totalChars===7){
            return isMobile?'2.2rem':'3.5rem';
        }else{
            return isMobile?'1.8rem':'2.8rem';
        }
    };

    if(step==='input') return(
        <div className="intro-bg p-4">
            <section className="welcome-story"><div className="welcome-brand"><span className="brand-mark"><Icon name="flask-conical" size={24}/></span>송쌤과학 <span>CLASSROOM</span></div><div className="welcome-copy"><p className="eyebrow">선생님의 수업에, 여유를 더하다</p><h2>수업에 필요한 도구,<br/>한 곳에서 가볍게.</h2><p className="welcome-description">발표자를 뽑고, 모둠을 만들고, 생각을 기록하세요.<br/>작은 준비는 도우미에게 맡기고 수업에 집중하세요.</p><div className="welcome-preview"><div className="preview-label"><span className="live-dot"/> 오늘의 교실 <span>READY TO START</span></div><div className="preview-desks">{['01','02','03','04','05','06','07','08'].map((n,i)=><span key={n} className={i===2?'chosen':''}>{i===2?<Icon name="sparkles" size={23}/>:n}</span>)}</div><div className="preview-bottom"><span>함께 배우는 시간을 위한</span><strong>17가지 수업 도구 <span>↗</span></strong></div></div></div><div className="welcome-foot">준비는 간결하게. 수업은 풍성하게.</div></section>
            <div className="intro-card p-6 sm:p-10 rounded-[2rem] shadow-2xl w-full max-w-md text-center relative overflow-hidden">
                <div className="hidden"/>
                <div className="setup-icon"><Icon name="sprout" size={36} className="text-[#FFB7B2]"/></div>
                <p className="setup-eyebrow">LETS GET STARTED</p><h1 className="text-2xl sm:text-4xl font-black mb-1 intro-title">선택한 학급의 명단 설정</h1>
                <p className="text-gray-400 font-bold mb-4 text-xs sm:text-sm">{classContext.name} · 마지막 번호를 입력하면 이 학급의 수업을 시작해요</p>
                <div className="flex flex-wrap justify-center gap-1.5 mb-6 sm:mb-8">
                    <span className="intro-chip"><Icon name="trophy" size={12} className="text-[#FFB7B2]"/>발표뽑기</span>

                        <p className="text-[11px] text-gray-400 mt-1.5 pl-1 font-bold">예: 30번까지 있으면 → 30 입력 (1~30번 생성)</p>

    const renderSingleSeatsCustomGrid=()=>{

                {title:'수업 진행',items:[['whiteboard','화이트보드','palette'],['timer','타이머','timer'],['calendar','달력','calendar']]},

                    {/* PDF 배치표에 인쇄될 제목 · 교사명 (교사명은 좌석 배치와 함께 씀) */}
                    {renderPosterInfo(teamTitle,setTeamTitle,'모둠 배치도','3학년 2반 모둠 배치도')}

                            <button onClick={()=>exportTeamPDF('student')} className="bg-white text-[#D68C60] border border-[#D68C60] px-2.5 py-1.5 rounded-lg text-[10px] font-black flex items-center gap-1 touch-target active:scale-95" title="칠판을 위쪽에 두고 화면과 같은 방향으로 모둠 배치도 PDF 저장"><Icon name="file-down" size={12}/> 학생용 PDF</button>
                            <button onClick={handleCapture} className="text-[#C7CEEA] bg-white p-1.5 rounded-lg touch-target" title="PNG 이미지로 저장"><Icon name="camera" size={16}/></button>

                        <div className="mb-3 sm:mb-5"><BoardBar/></div>

                            {teams.map((team,tIdx)=>renderTeamDesk(team,tIdx,teamColumns))}

                <div className={`bg-white p-3 sm:p-5 rounded-2xl soft-shadow border border-gray-100 space-y-2.5 ${seatPresentMode&&seats.length>0?'hidden':''}`}>
                    <div className="flex gap-1.5">{['number','name','gender'].map(t=><button key={t} onClick={()=>setPlacementType(t)} className={`flex-1 py-2 rounded-lg font-bold text-xs sm:text-sm border-2 touch-target transition-all ${placementType===t?'bg-[#FFD3B6] border-[#FFD3B6] text-white':'bg-white border-gray-100 text-gray-400'}`}>{t==='number'?'번호':t==='name'?'이름':'남녀'}</button>)}</div>
                    {placementType==='number'&&<ExcludeBar excludedInput={excludedInput} setExcludedInput={setExcludedInput} excludedNums={excludedNums} totalCount={students.length} accentColor="#166B59" playSound={playSound}/>}

                        setSeatColumns={setSeatColumns}

                {seats.length>0&&<div className="w-full"><div className="flex flex-wrap justify-between items-center gap-2 mb-2 px-1"><p className="text-[10px] text-gray-400 font-bold">터치하여 자리 변경</p><div className="flex flex-wrap items-center gap-1.5"><button onClick={()=>{playSound('click');setSeatPresentMode(v=>!v);}} className={`px-2.5 py-1.5 rounded-lg text-[10px] font-bold flex items-center gap-1 touch-target border ${seatPresentMode?'bg-[#5D5D5D] border-[#5D5D5D] text-white':'bg-white border-gray-200 text-gray-400'}`} title="시연 모드: 켜면 위 설정 창을 숨겨 학생에게 정보가 보이지 않습니다"><Icon name={seatPresentMode?'eye-off':'eye'} size={12}/> {seatPresentMode?'설정':'시연'}</button><button onClick={createSeats} className="text-[#FFD3B6] bg-white border border-[#FFD3B6] px-2.5 py-1.5 rounded-lg text-[10px] font-bold flex items-center gap-1 touch-target"><Icon name="shuffle" size={12}/> 섞기</button><button onClick={()=>exportSeatPDF('teacher')} className="bg-[#D68C60] text-white border border-[#D68C60] px-2.5 py-1.5 rounded-lg text-[10px] font-black flex items-center gap-1 touch-target active:scale-95" title="교탁을 아래쪽에 두고, 교탁에서 학생을 바라본 방향으로 PDF 저장"><Icon name="file-down" size={12}/> 교탁용 PDF</button><button onClick={()=>exportSeatPDF('student')} className="bg-white text-[#D68C60] border border-[#D68C60] px-2.5 py-1.5 rounded-lg text-[10px] font-black flex items-center gap-1 touch-target active:scale-95" title="칠판을 위쪽에 두고 화면과 같은 방향으로 PDF 저장"><Icon name="file-down" size={12}/> 학생용 PDF</button><button onClick={handleCapture} className="text-[#FFD3B6] bg-white p-1.5 rounded-lg touch-target" title="PNG 이미지로 저장"><Icon name="camera" size={16}/></button></div></div>
