        setNotice('「'+target.name+'」 학급을 삭제했어요.'+(wasLast?' 마지막 학급이어서 비어 있는 기본 학급을 준비했어요.':wasActive?' 「'+active().name+'」 학급으로 전환했어요.':''));
    };
    const requestHistoryClear=()=>{
        if(library.current.loadError)return setNotice('저장된 학급을 읽지 못했습니다. 백업을 복구한 뒤 기록을 비워 주세요.');
        commit();const target=active();
        if(!target.past.length&&!target.future.length)return setNotice('비울 복구 기록이 없습니다.');
        setPendingHistoryClear(target.id);setNotice('');setPanel('clearHistory');
    };
    const cancelHistoryClear=()=>{setPendingHistoryClear(null);setPanel('history');setNotice('복구 기록 비우기를 취소했어요.');};
    const clearHistory=()=>{
        if(library.current.loadError)return;
        commit();const previous=library.current,target=previous.classes.find(item=>item.id===pendingHistoryClear);
        if(!target)return cancelHistoryClear();
        library.current={...previous,classes:previous.classes.map(item=>item.id===target.id?{...item,past:[],future:[]}:item)};
        if(!persist()){
            library.current=previous;
            setNotice('변경 내용을 저장하지 못해 복구 기록을 유지했습니다. 저장 공간·권한을 확인한 뒤 다시 시도해 주세요.');
            redraw();return;
        }
        redraw();setPendingHistoryClear(null);setPanel('history');
        setNotice('「'+target.name+'」의 복구 기록을 비웠어요. 현재 학급 내용은 그대로 유지됩니다.');
    };
    const restore=index=>{commit();const c=active(),h=c.past[index];if(!h)return;const target=classClone(h.data);c.past.push({at:Date.now(),label:'기록 복구 전',data:classClone(c.data)});c.past=c.past.slice(-20);c.future=[];c.data={...target,mode:c.data.mode};c.updated=Date.now();persist();remount();setPanel(null);setNotice('기록을 복구했어요. 실행 취소로 복구 전 상태로 돌아갈 수 있어요.');};
    const download=()=>{commit();let payload=JSON.stringify(library.current,null,2);if(library.current.loadError){try{payload=localStorage.getItem(CLASSROOM_KEY)||payload;}catch(e){}}const url=URL.createObjectURL(new Blob([payload],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='송쌤과학_학급백업_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);setNotice('백업 파일을 저장했어요');};
    const readBackup=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>5*1024*1024)throw Error('백업 파일은 5MB 이하만 불러올 수 있습니다.');const raw=JSON.parse(await file.text());if(raw.version!==1||!Array.isArray(raw.classes)||!raw.classes.length||raw.classes.length>30)throw Error('송쌤과학 학급 백업 파일이 아닙니다.');const imported=raw.classes.map(parseClassRecord);if(imported.length+library.current.classes.length>30)throw Error('불러온 뒤 학급 수가 30개를 넘습니다.');setPendingImport(imported);setNotice('아래 학급 목록을 확인한 후 추가해 주세요.');}catch(err){setPendingImport(null);setNotice('불러오기 실패: '+(err.message||'파일을 확인해 주세요.'));}};
    const importBackup=()=>{if(!pendingImport)return;commit();for(const c of pendingImport){c.name=(c.name+' (불러옴)').slice(0,40);library.current.classes.push(c);}delete library.current.loadError;persist();redraw();setPendingImport(null);setNotice('백업 학급을 추가했어요. 기존 학급은 그대로 유지됩니다.');};
    const c=active(),deleteTarget=library.current.classes.find(item=>item.id===pendingDelete),historyClearTarget=library.current.classes.find(item=>item.id===pendingHistoryClear);
    const ctx={boot:c.data,capture,name:c.name,openPanel};
    return <ClassContext.Provider value={ctx}>
        <div className="library-bar" ref={barRef} aria-label="학급 관리 메뉴"><button className="library-current" aria-label={'학급 선택·관리: '+c.name} title="저장된 학급 선택 및 현재 학급 이름 변경" onClick={()=>openPanel('classes')}><Icon name="folder-open" size={17}/><span className="current-label">선택한 학급</span><strong>{c.name}</strong><Icon name="chevron-down" size={14}/></button><button className="library-new" title="기존 학급과 별도로 새 학급 등록" onClick={openNewClass}><Icon name="folder-plus" size={16}/><span>새 학급 등록</span></button><button className="local-badge" title="저장 방식과 백업 확인" onClick={()=>openPanel('backup')}><Icon name="hard-drive" size={13}/><span>저장·백업 안내</span></button><SocialLinks/><span className="library-spacer"/><button title="명단·모둠·좌석·출결·체크리스트·메모 등의 이전 상태로 되돌리기" disabled={!c.past.length} onClick={undo}><Icon name="undo-2" size={16}/><span>실행 취소</span></button><button title="취소한 변경 다시 실행" disabled={!c.future.length} onClick={redo}><Icon name="redo-2" size={16}/><span>다시 실행</span></button><button onClick={()=>openPanel('history')}><Icon name="history" size={16}/><span>복구 기록</span></button></div>
        {saveError&&<div className="library-error" role="alert">{saveError}<button onClick={download}>백업 파일 저장</button></div>}
        <App key={c.id+':'+epoch}/>
        <div className="library-status" role="status" aria-live="polite">{notice}</div>
        {panel&&<div className="library-overlay" onMouseDown={e=>{if(e.target===e.currentTarget)setPanel(null);}}><section className="library-dialog" role="dialog" aria-modal="true" aria-labelledby="library-title" aria-describedby={panel==='delete'?'delete-class-description':panel==='clearHistory'?'clear-history-description':undefined} ref={dialogRef} tabIndex={-1} onKeyDown={e=>{if(e.key==='Escape'){if(panel==='delete')cancelDelete();else if(panel==='clearHistory')cancelHistoryClear();else setPanel(null);return;}if(e.key==='Tab'){const nodes=[...e.currentTarget.querySelectorAll('button:not(:disabled),input:not([type=hidden]),[tabindex="0"]')].filter(n=>n.getClientRects().length);const first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===e.currentTarget)){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}}}>
            <div className="library-dialog-title"><div><p>MY CLASSROOMS</p><h2 id="library-title">{({classes:'학급 선택·관리',new:'새 학급 등록',backup:'저장·백업 안내',history:'기록 복구',delete:'학급 삭제',clearHistory:'복구 기록 비우기'})[panel]}</h2></div><button aria-label="학급 창 닫기" onClick={()=>setPanel(null)}><Icon name="x" size={21}/></button></div>
            {panel!=='delete'&&panel!=='clearHistory'&&<div className="library-tabs">{[['classes','학급 선택·관리'],['new','새 학급 등록'],['backup','저장·백업 안내'],['history','복구 기록 · '+c.past.length]].map(([id,label])=><button key={id} className={panel===id?'selected':''} onClick={()=>openPanel(id)}>{label}</button>)}</div>}
            {panel==='classes'&&<>
                <p className="library-new-intro">저장된 학급으로 전환하거나 이름을 변경하고, 더 이상 사용하지 않는 학급을 삭제할 수 있어요.</p>
                <form className="library-form" onSubmit={e=>{e.preventDefault();rename();}}><label htmlFor="class-name">선택한 학급 이름 변경</label><div><input id="class-name" value={name} maxLength={40} placeholder="예: 2026학년도 1학년 3반" onChange={e=>setName(e.target.value)}/><button type="submit" disabled={!name.trim()||name.trim()===c.name}>이름 변경 저장</button></div></form>
                <h3 className="library-list-title">저장된 학급 · {library.current.classes.length}개</h3>
                <div className="library-list">{library.current.classes.map(item=><div className={'library-row '+(item.id===c.id?'current':'')} key={item.id}><div><strong>{item.name}</strong><small>{item.data.students.length}명 · 메모 {item.data.memos.length}개 · {new Date(item.updated).toLocaleString('ko-KR')}</small></div><div className="library-row-actions">{item.id===c.id?<span className="library-current-tag">현재 선택됨</span>:<button onClick={()=>switchClass(item.id)}>이 학급으로 전환</button>}<button className="library-delete-button" aria-label={item.name+' 학급 삭제'} disabled={!!library.current.loadError} onClick={()=>requestDelete(item.id)}><Icon name="trash-2" size={14}/>삭제</button></div></div>)}</div>
                <button className="primary" onClick={openNewClass}><Icon name="folder-plus" size={16}/>새 학급 등록</button><p className="library-hint">새 학급 등록은 비어 있는 학급을 추가합니다. 기존 학급의 명단과 기록은 유지됩니다.</p>
            </>}
            {panel==='delete'&&deleteTarget&&<div className="library-delete-confirm">
                <div className="library-delete-icon"><Icon name="trash-2" size={25}/></div>
                <h3>「{deleteTarget.name}」 학급을 삭제할까요?</h3>
                <p id="delete-class-description">이 학급의 명단, 모둠·좌석, 메모, 발표 기록, 일정, 출결, 체크리스트와 복구 기록이 함께 삭제됩니다. 학급 삭제는 상단 ‘실행 취소’로 되돌릴 수 없으며, 미리 저장한 백업 파일로 다시 불러올 수 있어요.</p>
                <div className="library-delete-summary"><span>학생 {deleteTarget.data.students.length}명</span><span>메모 {deleteTarget.data.memos.length}개</span><span>출결 {deleteTarget.data.attendanceRecords.length}일</span><span>할 일 {deleteTarget.data.lessonTasks.length}개</span></div>
                {library.current.classes.length===1?<p className="library-hint">마지막 학급을 삭제하면 비어 있는 ‘기본 학급’이 생성됩니다.</p>:deleteTarget.id===c.id?<p className="library-hint">현재 선택한 학급입니다. 삭제 후 남아 있는 첫 번째 학급으로 전환됩니다.</p>:null}
                <div className="library-delete-backup"><button onClick={download}><Icon name="download" size={15}/>삭제 전 백업 파일 저장</button></div>
                <div className="library-delete-actions"><button data-confirm-cancel onClick={cancelDelete}>취소</button><button className="library-delete-submit" onClick={deleteClass}>이 학급 삭제</button></div>
            </div>}
            {panel==='clearHistory'&&historyClearTarget&&<div className="library-delete-confirm">
                <div className="library-delete-icon"><Icon name="history" size={25}/></div>
                <h3>「{historyClearTarget.name}」의 복구 기록을 비울까요?</h3>
                <p id="clear-history-description">이 학급의 실행 취소·다시 실행 기록을 모두 삭제합니다. 현재 명단, 모둠·좌석, 메모, 출결, 체크리스트 등은 그대로 유지됩니다. 비운 기록은 실행 취소로 되돌릴 수 없어요.</p>
                <div className="library-delete-summary"><span>실행 취소 {historyClearTarget.past.length}개</span><span>다시 실행 {historyClearTarget.future.length}개</span></div>
                <div className="library-delete-backup"><button onClick={download}><Icon name="download" size={15}/>비우기 전 백업 파일 저장</button></div>
                <div className="library-delete-actions"><button data-confirm-cancel onClick={cancelHistoryClear}>취소</button><button className="library-delete-submit" onClick={clearHistory}>복구 기록 모두 비우기</button></div>
            </div>}
            {panel==='new'&&<>
                <p className="library-new-intro">기존 학급과 별도로 관리할 학급을 추가해요. 등록 후 학생 마지막 번호를 입력하면 시작할 수 있어요.</p>
                <form className="library-form" onSubmit={e=>{e.preventDefault();addClass();}}><label htmlFor="class-name">등록할 새 학급 이름</label><div><input id="class-name" value={name} maxLength={40} placeholder="예: 2026학년도 2학년 1반" onChange={e=>setName(e.target.value)}/><button type="submit" className="primary" disabled={!name.trim()||library.current.classes.length>=30}>새 학급 등록하기</button></div><p>명단·좌석·메모·출결·체크리스트가 비어 있는 학급으로 시작합니다. 최대 30개까지 등록할 수 있어요.</p></form>
            </>}
            {panel==='backup'&&<>
                <div className="library-privacy"><Icon name="hard-drive" size={20}/><div><strong>학급 정보는 현재 브라우저에 자동 저장됩니다.</strong><p>변경 후 약 0.5초 뒤 저장합니다. 같은 브라우저에서 같은 주소의 도우미를 다시 열면 이어서 사용할 수 있어요.</p><p>HTML 파일 안에 기록되거나 OneDrive로 학급 데이터가 자동 동기화되는 방식은 아닙니다.</p></div></div>
                <ul className="library-storage-info"><li><strong>학급별 저장:</strong> 학생 번호·입력한 이름·제외 번호, 모둠·좌석 설정, 메모, 발표 기록, 일정, 타이머 설정, 출결, 수업 체크리스트와 최근 변경 20개.</li><li><strong>별도 저장:</strong> 화이트보드 판서, 화면 설정, 유튜브 검색 설정(API 키)은 이 브라우저에 따로 저장되며 학급별로 나뉘지 않습니다. 학급 백업에는 포함되지 않습니다.</li><li><strong>백업 제외:</strong> 사진·녹음·영상·돌림판·핀볼 게임·사다리 게임의 내용, 실행 중인 타이머는 학급 백업 및 복구에 포함되지 않습니다. 타이머는 학급 전환·복구 시 정지합니다.</li><li><strong>다른 환경으로 이동:</strong> 다른 기기·브라우저·프로필에는 자동 공유되지 않습니다. HTML 파일의 위치나 접속 주소를 바꾸면 기존 기록이 보이지 않을 수 있어요. 이동 전에 백업 파일을 저장하세요.</li><li><strong>기록 보관:</strong> 브라우저 데이터를 삭제하거나 시크릿 창을 닫으면 기록이 사라질 수 있습니다. 백업 JSON에는 입력한 명단과 기록이 들어 있으므로 개인 보관용으로 관리해 주세요.</li></ul>
                <div className="library-backup"><div><strong>모든 학급과 복구 기록을 파일로 보관</strong><p>백업을 불러오면 기존 학급을 유지한 채 별도 학급으로 추가합니다.</p></div><div><button onClick={download}><Icon name="download" size={15}/>백업 파일 저장</button><button onClick={()=>fileRef.current.click()}><Icon name="upload" size={15}/>백업 불러오기</button><input ref={fileRef} hidden type="file" accept=".json,application/json" onChange={readBackup}/></div></div>
                {pendingImport&&<div className="library-import"><strong>{pendingImport.length}개 학급을 추가합니다</strong><p>{pendingImport.map(x=>x.name).join(', ')}</p><p>기존 학급을 덮어쓰지 않고 별도 학급으로 추가합니다.</p><button className="primary" onClick={importBackup}>확인 후 추가</button><button onClick={()=>setPendingImport(null)}>취소</button></div>}
            </>}
            {panel==='history'&&<><p className="library-hint">{c.name}의 최근 변경 20개를 보관합니다. 복구 후에도 실행 취소로 되돌릴 수 있어요.</p><div className="library-history-toolbar"><p>실행 취소 {c.past.length}개 · 다시 실행 {c.future.length}개</p><button className="library-delete-button" disabled={!!library.current.loadError||(!c.past.length&&!c.future.length)} onClick={requestHistoryClear}><Icon name="trash-2" size={14}/>이 학급의 복구 기록 비우기</button></div><p className="library-hint">복구 기록을 비워도 현재 학급 내용은 유지됩니다. 이후 변경한 내용부터 새 기록이 쌓입니다.</p><div className="library-list">{!c.past.length?<p className="library-empty">아직 복구 기록이 없습니다. 명단·좌석·메모·출결·체크리스트 등을 변경하면 이전 상태를 자동으로 보관합니다.</p>:[...c.past].reverse().map((h,i)=><div className="library-row" key={i}><div><strong>{h.label}</strong><small>{new Date(h.at).toLocaleString('ko-KR')} · 메모 {h.data.memos.length}개 · 좌석 {h.data.seats.length}개</small></div><button onClick={()=>restore(c.past.length-1-i)}>이 상태로 복구</button></div>)}</div></>}
            <p className="library-dialog-status" role="status">{notice}</p>
        </section></div>}
    </ClassContext.Provider>;
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<ClassroomShell/>);
</script>
</body>
</html>
