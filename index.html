                                                            <div className="flex flex-wrap gap-2">
                                                                {team.map((student, sIdx) => {
                                                                    const isSelected = selectedItem?.type === 'team' && selectedItem?.index === tIdx && selectedItem?.subIndex === sIdx;
                                                                    const isDragOver = dragOverItem?.type === 'team' && dragOverItem?.index === tIdx && dragOverItem?.subIndex === sIdx;
                                                                    return (
                                                                        <div key={sIdx} draggable
                                                                            onDragStart={(e) => onDragStart(e, 'team', tIdx, sIdx)} onDragOver={onDragOver}
                                                                            onDragEnter={() => onDragEnter('team', tIdx, sIdx)} onDrop={(e) => onDrop(e, 'team', tIdx, sIdx)}
                                                                            onClick={() => handleItemInteraction('team', tIdx, sIdx)}
                                                                            className={`bg-white border-2 rounded-xl font-bold text-gray-600 shadow-sm cursor-pointer select-none transition-all hover:border-[#C7CEEA] center-content min-h-[3rem] px-3 w-full
                                                                            ${isSelected ? 'selected-item' : 'border-transparent'} ${isDragOver ? 'drag-target-active' : ''}`}>
                                                                            <span className="text-lg sm:text-xl">{student}</span>
                                                                        </div>
                                                                    );
                                                                })}
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 3. 좌석 배치 */}
                        {mode === 'seat' && (
                             <div className="card-enter space-y-4 sm:space-y-6 w-full">
                                <div className="bg-white p-4 sm:p-6 rounded-[1.5rem] sm:rounded-[2rem] soft-shadow border border-gray-100">
                                    <div className="flex flex-col md:flex-row gap-4 sm:gap-6">
                                        <div className="flex-1 space-y-3 sm:space-y-4">
                                             <div className="flex gap-2">
                                                {['number', 'name', 'gender'].map(t => (
                                                    <button key={t} onClick={()=>setPlacementType(t)} 
                                                        className={`flex-1 py-2 sm:py-3 rounded-xl font-bold text-sm sm:text-base transition-all border-2 ${placementType===t ? 'bg-[#FFD3B6] border-[#FFD3B6] text-white shadow-md' : 'bg-white border-gray-100 text-gray-400 hover:bg-gray-50'}`}>
                                                        {t==='number'?'번호':t==='name'?'이름':'남녀'}
                                                    </button>
                                                ))}
                                            </div>
                                            {placementType === 'number' && (
                                                <div className="relative">
                                                    <input type="text" value={excludedInput} onChange={e=>setExcludedInput(e.target.value)} className="w-full p-3 sm:p-4 bg-[#FFF8F0] rounded-2xl border-none focus:ring-2 focus:ring-[#FFD3B6] text-sm sm:text-base" placeholder="제외할 번호 (예: 5, 12)" />
                                                    {excludedInput && <button onClick={()=>setExcludedInput('')} className="absolute right-3 top-1/2 -translate-y-1/2 p-1 text-gray-300 hover:text-gray-500"><Icon name="x" size={16} /></button>}
                                                </div>
                                            )}
                                            {placementType === 'name' && <textarea value={inputNames} onChange={e=>setInputNames(e.target.value)} className="w-full p-3 sm:p-4 bg-[#FFF8F0] rounded-2xl border-none resize-none h-20 sm:h-24 focus:ring-2 focus:ring-[#FFD3B6] text-sm sm:text-base" placeholder="학생 이름 입력" />}
                                            {placementType === 'gender' && (
                                                <div className="flex flex-col gap-2">
                                                    <div className="flex bg-[#FFF8F0] p-1 rounded-xl">
                                                        <button onClick={()=>setGenderOption('mixed')} className={`flex-1 py-2 rounded-lg text-xs font-bold ${genderOption==='mixed'?'bg-white shadow-sm text-[#D68C60]':'text-gray-400'}`}>이성끼리 👫</button>
                                                        <button onClick={()=>setGenderOption('same')} className={`flex-1 py-2 rounded-lg text-xs font-bold ${genderOption==='same'?'bg-white shadow-sm text-[#D68C60]':'text-gray-400'}`}>동성끼리 👬👭</button>
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <textarea value={maleInput} onChange={e=>setMaleInput(e.target.value)} className="flex-1 p-3 bg-[#F0F8FF] rounded-xl h-20 resize-none focus:ring-2 focus:ring-[#89CFF0] text-sm" placeholder="남학생 명단" />
                                                        <textarea value={femaleInput} onChange={e=>setFemaleInput(e.target.value)} className="flex-1 p-3 bg-[#FFF0F5] rounded-xl h-20 resize-none focus:ring-2 focus:ring-[#FFB7B2] text-sm" placeholder="여학생 명단" />
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                        <div className="flex flex-col justify-center gap-3 w-full md:min-w-[200px] md:w-auto">
                                            <div className="flex bg-[#FFF8F0] p-1 rounded-xl border border-gray-100">
                                                <button onClick={()=>setSeatType('single')} className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all ${seatType==='single'?'bg-white shadow-sm text-[#D68C60]':'text-gray-400'}`}>혼자 앉기</button>
                                                <button onClick={()=>setSeatType('pair')} className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all ${seatType==='pair'?'bg-white shadow-sm text-[#D68C60]':'text-gray-400'}`}>짝꿍 앉기</button>
                                            </div>
                                            
                                            {/* ★ 짝꿍 설정 버튼 (짝꿍 앉기 모드일 때만) */}
                                            {seatType === 'pair' && (
                                                <button onClick={() => { playSound('click'); setShowPairSettings(true); }}
                                                    className="w-full py-2.5 bg-white border-2 border-dashed border-[#FFD3B6] text-[#D68C60] rounded-xl text-xs sm:text-sm font-bold hover:bg-[#FFF8F0] transition-all flex items-center justify-center gap-2 relative">
                                                    <Icon name="settings-2" size={16} />
                                                    짝꿍 조건 설정
                                                    {(seatPairSettings.mustPair.length + seatPairSettings.mustNotPair.length) > 0 && (
                                                        <span className="absolute -top-2 -right-2 bg-[#FFB7B2] text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center shadow-sm">
                                                            {seatPairSettings.mustPair.length + seatPairSettings.mustNotPair.length}
                                                        </span>
                                                    )}
                                                </button>
                                            )}

                                            <button onClick={createSeats} className="w-full py-3 sm:py-4 bg-[#FFD3B6] hover:bg-[#F2C2A2] text-white rounded-xl font-bold shadow-md active:scale-95 flex items-center justify-center gap-2">
                                                <Icon name="layout-grid" size={18} /> 생성하기
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {seats.length > 0 && (
                                    <div className="relative w-full">
                                        <div className="flex flex-col sm:flex-row sm:justify-between items-start sm:items-center gap-3 mb-3 px-2">
                                            <p className="text-xs text-gray-400 font-bold flex items-center gap-1 bg-white/60 px-2 py-1 rounded-lg">
                                                <Icon name="mouse-pointer-2" size={14} /> 터치(클릭)하여 자리 변경
                                            </p>
                                            <div className="flex gap-2 w-full sm:w-auto">
                                                <button onClick={createSeats} className="flex-1 sm:flex-none justify-center text-[#FFD3B6] bg-white border border-[#FFD3B6] px-3 py-2 rounded-xl text-xs sm:text-sm font-bold hover:bg-[#FFF5EB] flex items-center gap-1"><Icon name="shuffle" size={14}/> 섞기</button>
                                                <button onClick={handleCapture} className="text-[#FFD3B6] bg-white border border-transparent hover:bg-[#FFF5EB] p-2 sm:p-2.5 rounded-xl shadow-sm"><Icon name="camera" size={20} /></button>
                                            </div>
                                        </div>
                                        <div className="w-full overflow-x-auto pb-4 no-scrollbar rounded-[1.5rem] sm:rounded-[2.5rem]">
                                            <div ref={captureRef} className="bg-white p-4 sm:p-8 rounded-[1.5rem] sm:rounded-[2.5rem] border-4 border-[#FFD3B6] min-w-[500px] min-h-[400px] flex flex-col shadow-xl">
                                                <div className="w-full bg-[#5D5D5D] text-white py-2 sm:py-3 rounded-2xl text-center font-bold mb-8 shadow-md tracking-widest relative overflow-hidden text-sm sm:text-base">
                                                    <span className="relative z-10">칠 판</span>
                                                    <div className="absolute top-0 left-0 w-full h-1 bg-white/10"></div>
                                                </div>
                                                <div className={`grid gap-2 sm:gap-4 ${seatType==='single'?'grid-cols-5':'grid-cols-3'} w-full`}>
                                                    {seatType === 'single' ? seats.map((s, i) => {
                                                        const isSelected = selectedItem?.type === 'seat' && selectedItem?.index === i;
                                                        const isDragOver = dragOverItem?.type === 'seat' && dragOverItem?.index === i;
                                                        return (
                                                            <div key={i} draggable
                                                                onDragStart={(e) => onDragStart(e, 'seat', i)} onDragOver={onDragOver}
                                                                onDragEnter={() => onDragEnter('seat', i)} onDrop={(e) => onDrop(e, 'seat', i)}
                                                                onClick={() => handleItemInteraction('seat', i)}
                                                                className={`aspect-[2/1] min-h-[40px] flex items-center justify-center bg-white border-2 rounded-xl text-base sm:text-xl font-black text-gray-600 shadow-sm cursor-pointer hover:bg-[#FFF8F0] hover:border-[#FFD3B6] transition-all center-content
                                                                ${isSelected ? 'selected-item' : 'border-gray-100'} ${isDragOver ? 'drag-target-active' : ''}`}>
                                                                <span>{s}</span>
                                                            </div>
                                                        );
                                                    }) : (
                                                        Array.from({ length: Math.ceil(seats.length / 2) }).map((_, gIdx) => {
                                                            const idx1 = gIdx * 2;
                                                            const idx2 = gIdx * 2 + 1;
                                                            const isSel1 = selectedItem?.type === 'seat' && selectedItem?.index === idx1;
                                                            const isSel2 = selectedItem?.type === 'seat' && selectedItem?.index === idx2;
                                                            return (
                                                                <div key={gIdx} className="flex bg-[#FFF8F0] border-2 border-[#FFD3B6] rounded-xl overflow-hidden shadow-sm h-12 sm:h-16">
                                                                    <div draggable onDragStart={(e)=>onDragStart(e,'seat',idx1)} onDragOver={onDragOver} onDrop={(e)=>onDrop(e,'seat',idx1)} onClick={()=>handleItemInteraction('seat',idx1)}
                                                                        className={`flex-1 flex items-center justify-center p-1 sm:p-2 border-r border-[#FFD3B6]/30 cursor-pointer hover:bg-white center-content ${isSel1?'selected-item':''}`}>
                                                                        <span className="font-black text-gray-600 text-sm sm:text-lg">{seats[idx1]}</span>
                                                                    </div>
                                                                    <div draggable onDragStart={(e)=>onDragStart(e,'seat',idx2)} onDragOver={onDragOver} onDrop={(e)=>onDrop(e,'seat',idx2)} onClick={()=>handleItemInteraction('seat',idx2)}
                                                                        className={`flex-1 flex items-center justify-center p-1 sm:p-2 cursor-pointer hover:bg-white center-content ${isSel2?'selected-item':''}`}>
                                                                        <span className="font-black text-gray-600 text-sm sm:text-lg">{seats[idx2] || ''}</span>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                             </div>
                        )}

                        {/* 4. 타이머 (수정: 수동 입력 + 버튼 활성화) */}
                        {mode === 'timer' && (
                            <div className="card-enter flex flex-col items-center justify-center py-6 sm:py-10 w-full">
                                <div className="relative mb-8 sm:mb-10 w-64 h-64 sm:w-72 sm:h-72">
                                    <svg viewBox="0 0 300 300" className="w-full h-full transform -rotate-90 drop-shadow-xl">
                                        <circle cx="150" cy="150" r="120" stroke="#F0F0F0" strokeWidth="15" fill="none" />
                                        <circle cx="150" cy="150" r="120" stroke="#FFDAC1" strokeWidth="15" fill="none" 
                                            strokeDasharray={2 * Math.PI * 120} 
                                            strokeDashoffset={(2 * Math.PI * 120) - (timeLeft / (initialTime || 1)) * (2 * Math.PI * 120)}
                                            strokeLinecap="round"
                                            className="timer-circle"
                                        />
                                    </svg>
                                    <div className="absolute inset-0 flex flex-col items-center justify-center">
                                        {/* 타이머 수동 입력 영역 */}
                                        <div className="flex items-center gap-0">
                                            {isTimerRunning ? (
                                                <span className="text-5xl sm:text-7xl font-black text-[#5D5D5D] tracking-tighter tabular-nums drop-shadow-sm">
                                                    {Math.floor(timeLeft/60).toString().padStart(2,'0')}:{(timeLeft%60).toString().padStart(2,'0')}
                                                </span>
                                            ) : (
                                                <>
                                                    <input
                                                        ref={minInputRef}
                                                        type="number"
                                                        className="timer-input-field text-5xl sm:text-7xl font-black text-[#5D5D5D] tracking-tighter tabular-nums drop-shadow-sm w-[2.5ch]"
                                                        value={Math.floor(timeLeft / 60).toString().padStart(2, '0')}
                                                        onFocus={(e) => e.target.select()}
                                                        onChange={(e) => handleMinInput(e.target.value)}
                                                        min="0" max="99"
                                                    />
                                                    <span className="text-5xl sm:text-7xl font-black text-[#5D5D5D] tracking-tighter drop-shadow-sm select-none">:</span>
                                                    <input
                                                        ref={secInputRef}
                                                        type="number"
                                                        className="timer-input-field text-5xl sm:text-7xl font-black text-[#5D5D5D] tracking-tighter tabular-nums drop-shadow-sm w-[2.5ch]"
                                                        value={(timeLeft % 60).toString().padStart(2, '0')}
                                                        onFocus={(e) => e.target.select()}
                                                        onChange={(e) => handleSecInput(e.target.value)}
                                                        min="0" max="59"
                                                    />
                                                </>
                                            )}
                                        </div>
                                        <span className="text-xs sm:text-sm text-gray-400 font-bold mt-2 flex items-center gap-2">
                                            {isTimerRunning ? <span className="animate-pulse text-[#FF9E99]">●</span> : <span className="text-gray-300">●</span>}
                                            {isTimerRunning ? '진행 중' : '터치하여 시간 입력'}
                                        </span>
                                    </div>
                                </div>
                                
                                <div className="flex flex-wrap justify-center gap-2 sm:gap-3 mb-6 sm:mb-8">
                                    {[10, 60, 300].map(s => (
                                        <button key={`add-${s}`} onClick={()=>adjustTime(s)} className="px-4 sm:px-5 py-2 sm:py-2.5 bg-white rounded-xl font-bold text-sm sm:text-base text-gray-500 shadow-sm border border-gray-100 hover:bg-gray-50 active:scale-95 transition-all">+{s>=60 ? `${s/60}분` : `${s}초`}</button>
                                    ))}
                                    <button onClick={()=>adjustTime(-10)} className="px-4 sm:px-5 py-2 sm:py-2.5 bg-white rounded-xl font-bold text-sm sm:text-base text-red-400 shadow-sm border border-red-50 hover:bg-red-50 active:scale-95 transition-all">-10초</button>
                                </div>

                                {/* 프리셋 버튼 */}
                                <div className="flex flex-wrap justify-center gap-2 sm:gap-3 mb-6 sm:mb-8">
                                    {[{label:'1분', sec:60}, {label:'3분', sec:180}, {label:'5분', sec:300}, {label:'10분', sec:600}].map(p => (
                                        <button key={p.label} onClick={()=>{playSound('click'); setTimeLeft(p.sec); setInitialTime(p.sec); setIsTimerRunning(false);}}
                                            className={`px-4 py-2 rounded-xl text-sm font-bold border-2 transition-all active:scale-95 ${timeLeft === p.sec && !isTimerRunning ? 'bg-[#FFDAC1] border-[#FFDAC1] text-white shadow-md' : 'bg-white border-gray-100 text-gray-400 hover:border-[#FFDAC1] hover:text-[#D68C60]'}`}>
                                            {p.label}
                                        </button>
                                    ))}
                                </div>

                                <div className="flex flex-col sm:flex-row gap-3 sm:gap-4 w-full max-w-sm sm:max-w-md">
                                    <button onClick={()=>{playSound('click'); if(!isTimerRunning) { setTimerEverStarted(true); setInitialTime(prev => timeLeft > 0 ? (timeLeft !== prev ? timeLeft : prev) : prev); } setIsTimerRunning(!isTimerRunning);}} className={`flex-1 py-4 sm:py-5 rounded-2xl text-xl sm:text-2xl font-black text-white shadow-lg active:scale-95 flex items-center justify-center gap-2 ${isTimerRunning ? 'bg-[#FF9E99]' : 'bg-[#B5EAD7]'}`}>
                                        <Icon name={isTimerRunning ? "pause" : "play"} /> {isTimerRunning ? '일시정지' : '시작'}
                                    </button>
                                    <button onClick={()=>{playSound('click'); setIsTimerRunning(false); setTimeLeft(initialTime);}} className="py-4 sm:py-5 px-6 rounded-2xl bg-gray-200 text-gray-500 font-bold hover:bg-gray-300 shadow-sm flex items-center justify-center">
                                        <Icon name="rotate-ccw" /> <span className="ml-2 sm:hidden">초기화</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        {/* 5. QR 코드 */}
                        {mode === 'qr' && (
                            <div className="card-enter flex flex-col items-center w-full">
                                <div className="bg-white p-6 sm:p-8 rounded-[1.5rem] sm:rounded-[2.5rem] shadow-xl border-4 border-[#B5EAD7] w-full max-w-2xl text-center">
                                    <h2 className="text-xl sm:text-2xl font-black text-[#5D5D5D] mb-4 sm:mb-6 flex items-center justify-center gap-2"><Icon name="scan-line" /> QR코드 생성기</h2>
                                    <div className="flex flex-col sm:flex-row gap-2 mb-6 sm:mb-8">
                                        <input type="text" value={qrInput} onChange={e=>setQrInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&(qrInput&&setQrUrl(`https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(qrInput)}`))} 
                                            className="flex-1 p-3 sm:p-4 bg-[#F0FDF4] rounded-xl sm:rounded-2xl border-2 border-transparent focus:border-[#B5EAD7] outline-none font-bold text-sm sm:text-lg" placeholder="인터넷 주소(URL) 입력" />
                                        <button onClick={()=>{if(qrInput) {playSound('click'); setQrUrl(`https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(qrInput)}`);}}} className="py-3 sm:py-0 px-6 bg-[#B5EAD7] text-white rounded-xl sm:rounded-2xl font-black shadow-md hover:bg-[#95D4B6]">생성</button>
                                    </div>
                                    {qrUrl ? (
                                        <div className="inline-block p-4 sm:p-6 bg-white rounded-2xl sm:rounded-3xl shadow-lg border border-gray-100 cursor-zoom-in" onClick={()=>setFullScreenContent({type:'qr', data:qrUrl})}>
                                            <img src={qrUrl} alt="QR" className="w-48 h-48 sm:w-64 sm:h-64 mix-blend-multiply" />
                                            <p className="text-gray-400 text-xs font-bold mt-3 sm:mt-4 flex items-center justify-center gap-1"><Icon name="zoom-in" size={12} /> 터치하여 크게 보기</p>
                                        </div>
                                    ) : (
                                        <div className="w-48 h-48 sm:w-64 sm:h-64 mx-auto bg-gray-50 rounded-2xl sm:rounded-3xl flex flex-col items-center justify-center text-gray-300 border-2 border-dashed border-gray-200">
                                            <Icon name="link" size={40} className="mb-2 opacity-50" />
                                            <span className="font-bold text-sm">주소를 입력하세요</span>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* 6. 메모 */}
                        {mode === 'memo' && (
                            <div className="card-enter w-full max-w-4xl mx-auto">
                                <div className="flex flex-col sm:flex-row gap-2 sm:gap-3 mb-6 sm:mb-8 w-full">
                                    <div className="flex-1 relative">
                                        <input type="text" value={memoInput} onChange={e=>setMemoInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter' && memoInput.trim()){playSound('click'); setMemos([{ id: Date.now(), text: memoInput, color: ['#FFE0E0', '#E0F4FF', '#E0FFE4', '#FFF4E0', '#F3E0FF'][Math.floor(Math.random()*5)] }, ...memos]); setMemoInput('');}}}
                                            className="w-full p-3 sm:p-4 pl-10 sm:pl-12 bg-white rounded-xl sm:rounded-2xl border-2 border-[#C7CEEA] shadow-sm font-bold text-sm sm:text-lg focus:outline-none" placeholder="기억할 내용을 입력하세요" />
                                        <span className="absolute left-3 sm:left-4 top-1/2 -translate-y-1/2 text-[#C7CEEA]"><Icon name="pencil" size={18}/></span>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={()=>{if(!memoInput.trim()) return; playSound('click'); setMemos([{ id: Date.now(), text: memoInput, color: ['#FFE0E0', '#E0F4FF', '#E0FFE4', '#FFF4E0', '#F3E0FF'][Math.floor(Math.random()*5)] }, ...memos]); setMemoInput('');}} className="flex-1 sm:flex-none px-6 py-3 sm:py-0 bg-[#C7CEEA] text-white rounded-xl sm:rounded-2xl font-black shadow-md"><Icon name="plus" className="mx-auto" /></button>
                                        {memos.length > 0 && <button onClick={()=>{playSound('click'); setMemos([]);}} className="px-4 bg-red-100 text-red-400 rounded-xl sm:rounded-2xl font-bold"><Icon name="trash-2" /></button>}
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-3 gap-3 sm:gap-5">
                                    {memos.map(memo => (
                                        <div key={memo.id} onClick={()=>{ setFullScreenContent({type:'text', data:memo.text, color:memo.color}); setFsFontSize(window.innerWidth < 600 ? 50 : 80); }}
                                            className="relative p-4 sm:p-6 rounded-2xl sm:rounded-[2rem] min-h-[120px] sm:min-h-[180px] flex items-center justify-center text-center cursor-pointer shadow-sm hover:shadow-md"
                                            style={{backgroundColor: memo.color}}>
                                            <p className="font-black text-gray-700 text-base sm:text-xl whitespace-pre-wrap line-clamp-4 font-[Gamja Flower]">{memo.text}</p>
                                            <button onClick={(e)=>{e.stopPropagation(); playSound('click'); setMemos(memos.filter(m=>m.id!==memo.id));}} className="absolute top-2 right-2 p-1.5 bg-white/50 rounded-full text-red-400"><Icon name="trash-2" size={14} /></button>
                                        </div>
                                    ))}
                                    {memos.length === 0 && (
                                        <div className="col-span-full py-16 sm:py-24 text-center text-gray-300 font-bold border-2 border-dashed border-gray-200 rounded-3xl sm:rounded-[2.5rem] bg-white/50">
                                            <Icon name="sticky-note" size={40} className="mx-auto opacity-30 mb-2" />
                                            <p className="text-sm sm:text-base">새로운 메모를 추가해보세요!</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* 7. 사진 */}
                        {mode === 'img' && (
                             <div className="card-enter flex flex-col items-center w-full">
                                 <div className="bg-white p-4 sm:p-6 rounded-[1.5rem] sm:rounded-[2.5rem] shadow-lg border-4 border-[#FFC3A0] w-full max-w-4xl min-h-[300px] sm:min-h-[500px] flex items-center justify-center relative">
                                     {uploadedImg ? (
                                         <div className="relative w-full h-full flex items-center justify-center">
                                             <img src={uploadedImg} className="max-w-full max-h-[60vh] rounded-xl sm:rounded-2xl shadow-sm cursor-zoom-in" onClick={()=>setFullScreenContent({type:'img', data:uploadedImg})} />
                                             <button onClick={()=>{setUploadedImg(null); fileInputRef.current.value='';}} className="absolute top-2 right-2 sm:top-4 sm:right-4 p-2 sm:p-3 bg-white text-[#FFC3A0] rounded-full shadow-md"><Icon name="x" size={20}/></button>
                                         </div>
                                     ) : (
                                         <div onClick={()=>fileInputRef.current.click()} className="flex flex-col items-center justify-center gap-3 sm:gap-4 cursor-pointer p-10 sm:p-20 hover:bg-[#FFF5EB] rounded-2xl sm:rounded-[2rem] w-full h-full border-2 border-dashed border-[#FFC3A0]/30">
                                             <div className="p-6 sm:p-8 bg-[#FFEDD5] rounded-full text-[#FFC3A0]"><Icon name="image-plus" size={40} className="sm:w-14 sm:h-14" /></div>
                                             <p className="text-lg sm:text-xl font-bold text-[#FFC3A0]">터치하여 사진 업로드</p>
                                         </div>
                                     )}
                                     <input type="file" ref={fileInputRef} onChange={(e)=>{ const file=e.target.files[0]; if(file){ const reader=new FileReader(); reader.onload=(res)=>{setUploadedImg(res.target.result); playSound('win');}; reader.readAsDataURL(file); } }} accept="image/*" className="hidden" />
                                 </div>
                             </div>
                        )}
                        
                        <Copyright />
                    </main>

                    {/* ★ 짝꿍 조건 설정 모달 */}
                    {showPairSettings && (
                        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center bg-black/40 backdrop-blur-sm p-0 sm:p-4" onClick={() => setShowPairSettings(false)}>
                            <div className="modal-slide-up bg-white w-full sm:max-w-lg sm:rounded-[2rem] rounded-t-[2rem] shadow-2xl border-t-4 sm:border-4 border-[#FFD3B6] max-h-[85vh] flex flex-col" onClick={e => e.stopPropagation()}>
                                {/* 헤더 */}
                                <div className="flex items-center justify-between p-5 sm:p-6 border-b border-gray-100 shrink-0">
                                    <div className="flex items-center gap-3">
                                        <div className="bg-[#FFD3B6] p-2 rounded-xl text-white"><Icon name="settings-2" size={20} /></div>
                                        <div>
                                            <h3 className="text-lg font-black text-[#5D5D5D]">짝꿍 조건 설정</h3>
                                            <p className="text-[10px] sm:text-xs text-gray-400 font-bold">학생들에게 보이지 않는 비밀 설정</p>
                                        </div>
                                    </div>
                                    <button onClick={() => setShowPairSettings(false)} className="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-xl transition-colors">
                                        <Icon name="x" size={20} />
                                    </button>
                                </div>

                                {/* 탭 */}
                                <div className="flex mx-5 sm:mx-6 mt-4 bg-[#FFF8F0] p-1 rounded-xl shrink-0">
                                    <button onClick={() => setPairSettingTab('must')} className={`flex-1 py-2.5 rounded-lg text-sm font-bold transition-all flex items-center justify-center gap-1.5 ${pairSettingTab === 'must' ? 'bg-white shadow-sm text-[#4CAF50]' : 'text-gray-400'}`}>
                                        <Icon name="heart" size={14} /> 같이 앉기
                                        {seatPairSettings.mustPair.length > 0 && <span className="bg-[#4CAF50] text-white text-[10px] px-1.5 py-0.5 rounded-full font-black">{seatPairSettings.mustPair.length}</span>}
                                    </button>
                                    <button onClick={() => setPairSettingTab('mustNot')} className={`flex-1 py-2.5 rounded-lg text-sm font-bold transition-all flex items-center justify-center gap-1.5 ${pairSettingTab === 'mustNot' ? 'bg-white shadow-sm text-[#FF6B6B]' : 'text-gray-400'}`}>
                                        <Icon name="shield-alert" size={14} /> 떨어뜨리기
                                        {seatPairSettings.mustNotPair.length > 0 && <span className="bg-[#FF6B6B] text-white text-[10px] px-1.5 py-0.5 rounded-full font-black">{seatPairSettings.mustNotPair.length}</span>}
                                    </button>
                                </div>

                                {/* 입력 영역 */}
                                <div className="px-5 sm:px-6 pt-4 shrink-0">
                                    <div className={`flex gap-2 items-center p-3 rounded-xl border-2 transition-all ${pairSettingTab === 'must' ? 'bg-[#F0FFF0] border-[#C8E6C9]' : 'bg-[#FFF0F0] border-[#FFCDD2]'}`}>
                                        <input type="text" value={pairInputA} onChange={e => setPairInputA(e.target.value)} 
                                            className="flex-1 bg-white p-2.5 rounded-lg text-center font-bold text-sm border border-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200" 
                                            placeholder={placementType === 'number' ? '번호' : '이름'} 
                                            onKeyDown={e => e.key === 'Enter' && addPairSetting()} />
                                        <span className="text-lg">{pairSettingTab === 'must' ? '💕' : '🚫'}</span>
                                        <input type="text" value={pairInputB} onChange={e => setPairInputB(e.target.value)} 
                                            className="flex-1 bg-white p-2.5 rounded-lg text-center font-bold text-sm border border-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200" 
                                            placeholder={placementType === 'number' ? '번호' : '이름'} 
                                            onKeyDown={e => e.key === 'Enter' && addPairSetting()} />
                                        <button onClick={addPairSetting} className={`p-2.5 rounded-lg text-white shadow-sm active:scale-95 transition-all ${pairSettingTab === 'must' ? 'bg-[#4CAF50] hover:bg-[#43A047]' : 'bg-[#FF6B6B] hover:bg-[#EF5350]'}`}>
                                            <Icon name="plus" size={18} />
                                        </button>
                                    </div>
                                    <p className="text-[10px] text-gray-400 font-bold mt-2 ml-1">
                                        {pairSettingTab === 'must' ? '반드시 짝꿍으로 앉힐 학생 조합' : '절대 짝꿍으로 앉히지 않을 학생 조합'}
                                    </p>
                                </div>

                                {/* 등록된 목록 */}
                                <div className="flex-1 overflow-y-auto px-5 sm:px-6 py-3 min-h-0">
                                    {pairSettingTab === 'must' && (
                                        <div className="space-y-2">
                                            {seatPairSettings.mustPair.length === 0 ? (
                                                <div className="text-center py-8 text-gray-300">
                                                    <Icon name="heart" size={32} className="mx-auto opacity-30 mb-2" />
                                                    <p className="text-sm font-bold">등록된 조합이 없습니다</p>
                                                </div>
                                            ) : seatPairSettings.mustPair.map((pair, idx) => (
                                                <div key={idx} className="flex items-center justify-between bg-[#F0FFF0] p-3 rounded-xl border border-[#C8E6C9]">
                                                    <div className="flex items-center gap-2">
                                                        <span className="bg-white px-3 py-1.5 rounded-lg font-bold text-sm text-[#4CAF50] border border-[#C8E6C9]">{pair[0]}</span>
                                                        <span className="text-sm">💕</span>
                                                        <span className="bg-white px-3 py-1.5 rounded-lg font-bold text-sm text-[#4CAF50] border border-[#C8E6C9]">{pair[1]}</span>
                                                    </div>
                                                    <button onClick={() => removePairSetting('mustPair', idx)} className="p-1.5 text-red-300 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors">
                                                        <Icon name="x" size={16} />
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                    {pairSettingTab === 'mustNot' && (
                                        <div className="space-y-2">
                                            {seatPairSettings.mustNotPair.length === 0 ? (
                                                <div className="text-center py-8 text-gray-300">
                                                    <Icon name="shield-alert" size={32} className="mx-auto opacity-30 mb-2" />
                                                    <p className="text-sm font-bold">등록된 조합이 없습니다</p>
                                                </div>
                                            ) : seatPairSettings.mustNotPair.map((pair, idx) => (
                                                <div key={idx} className="flex items-center justify-between bg-[#FFF0F0] p-3 rounded-xl border border-[#FFCDD2]">
                                                    <div className="flex items-center gap-2">
                                                        <span className="bg-white px-3 py-1.5 rounded-lg font-bold text-sm text-[#FF6B6B] border border-[#FFCDD2]">{pair[0]}</span>
                                                        <span className="text-sm">🚫</span>
                                                        <span className="bg-white px-3 py-1.5 rounded-lg font-bold text-sm text-[#FF6B6B] border border-[#FFCDD2]">{pair[1]}</span>
                                                    </div>
                                                    <button onClick={() => removePairSetting('mustNotPair', idx)} className="p-1.5 text-red-300 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors">
                                                        <Icon name="x" size={16} />
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {/* 하단 버튼 */}
                                <div className="p-5 sm:p-6 border-t border-gray-100 flex gap-2 shrink-0">
                                    {(seatPairSettings.mustPair.length + seatPairSettings.mustNotPair.length) > 0 && (
                                        <button onClick={() => { playSound('click'); setSeatPairSettings({ mustPair: [], mustNotPair: [] }); }} 
                                            className="px-4 py-3 bg-gray-100 text-gray-500 rounded-xl font-bold text-sm hover:bg-gray-200 transition-colors">
                                            전체 삭제
                                        </button>
                                    )}
                                    <button onClick={() => { playSound('click'); setShowPairSettings(false); }} 
                                        className="flex-1 py-3 bg-[#FFD3B6] hover:bg-[#F2C2A2] text-white rounded-xl font-bold shadow-md active:scale-95 transition-all">
                                        설정 완료
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 시스템 모달 */}
                    {systemModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4 animate-fade-in">
                            <div className="bg-white p-6 sm:p-8 rounded-[1.5rem] sm:rounded-[2.5rem] shadow-2xl max-w-sm w-full text-center border-4 border-[#FFB7B2]">
                                <p className="text-lg sm:text-xl font-bold text-gray-700 mb-6 sm:mb-8 whitespace-pre-wrap">{systemModal.msg}</p>
                                <div className="flex gap-2 sm:gap-3 justify-center">
                                    {systemModal.type === 'confirm' && <button onClick={closeModal} className="flex-1 py-3 bg-gray-100 rounded-xl sm:rounded-2xl font-bold text-gray-500">취소</button>}
                                    <button onClick={() => { if(systemModal.action) systemModal.action(); closeModal(); }} className="flex-1 py-3 bg-[#FFB7B2] rounded-xl sm:rounded-2xl font-bold text-white">확인</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* 전체화면 확대 */}
                    {fullScreenContent && (
                        <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-2 sm:p-4 cursor-pointer animate-fade-in" onClick={()=>setFullScreenContent(null)}>
                            {fullScreenContent.type === 'qr' && <div className="bg-white p-6 sm:p-8 rounded-3xl" onClick={e=>e.stopPropagation()}><img src={fullScreenContent.data} className="w-[80vw] h-[80vw] sm:w-[60vmin] sm:h-[60vmin]" /></div>}
                            {fullScreenContent.type === 'img' && <img src={fullScreenContent.data} className="max-w-[100vw] max-h-[100vh] object-contain" />}
                            {fullScreenContent.type === 'text' && (
                                <div className="bg-white p-6 sm:p-12 rounded-[2rem] sm:rounded-[3rem] max-w-5xl w-full text-center h-[80vh] sm:h-auto sm:max-h-[90vh] flex flex-col items-center relative" style={{backgroundColor: fullScreenContent.color}} onClick={e => e.stopPropagation()}>
                                    <div className="flex-1 overflow-y-auto w-full flex items-center justify-center min-h-[200px] no-scrollbar">
                                         <p className="font-black text-gray-700 leading-tight font-[Gamja Flower] whitespace-pre-wrap select-text" style={{fontSize: `${fsFontSize}px`}}>{fullScreenContent.data}</p>
                                    </div>
                                    <div className="mt-4 sm:mt-8 flex items-center gap-3 sm:gap-4 bg-white/60 px-4 sm:px-6 py-2 sm:py-3 rounded-full" onClick={e => e.stopPropagation()}>
                                        <button onClick={() => setFsFontSize(s => Math.max(20, s - 10))} className="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-white font-bold text-gray-500"><Icon name="minus" size={20} /></button>
                                        <span className="font-bold text-gray-600 min-w-[3rem] sm:min-w-[4rem] text-base sm:text-lg">{fsFontSize}px</span>
                                        <button onClick={() => setFsFontSize(s => Math.min(300, s + 10))} className="w-10 h-10 sm:w-12 sm:h-12 rounded-full bg-white font-bold text-gray-500"><Icon name="plus" size={20} /></button>
                                    </div>
                                    <button onClick={() => setFullScreenContent(null)} className="absolute top-4 right-4 sm:top-6 sm:right-6 p-2 sm:p-4 bg-white/50 rounded-full text-gray-500"><Icon name="x" size={20} className="sm:w-6 sm:h-6"/></button>
                                </div>
                            )}
                        </div>
                    )}

                    <div id="confetti-holder" className="fixed inset-0 pointer-events-none z-50"></div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
