<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>송쌤과학 교실 도우미</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Do+Hyeon&family=Gamja+Flower&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
        body{font-family:'Jua',sans-serif;background:#FDFBF7;background-image:radial-gradient(#E2D5C5 1px,transparent 1px);background-size:24px 24px;color:#4A4A4A;touch-action:manipulation;overflow-x:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;margin:0;padding:0;}
        ::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:#E2D5C5;border-radius:2px;}
        .no-scrollbar::-webkit-scrollbar{display:none;}.no-scrollbar{-ms-overflow-style:none;scrollbar-width:none;}
        .card-enter{animation:cardPop .4s cubic-bezier(.34,1.56,.64,1);}
        @keyframes cardPop{from{opacity:0;transform:scale(.92) translateY(16px);}to{opacity:1;transform:scale(1) translateY(0);}}
        .winner-pulse{animation:winPulse 1.5s infinite;}
        @keyframes winPulse{0%{box-shadow:0 0 0 0 rgba(255,183,178,.7);transform:scale(1.08);}70%{box-shadow:0 0 0 16px rgba(255,183,178,0);transform:scale(1.08);}100%{box-shadow:0 0 0 0 rgba(255,183,178,0);transform:scale(1.08);}}
        .highlight-anim{transition:all .1s;transform:scale(1.12);background:#B5EAD7!important;border-color:#88D8B0!important;color:#2D6A4F!important;z-index:10;}
        .selected-item{border-color:#FFB7B2!important;background:#FFF0F0!important;color:#FF8A80!important;transform:scale(.95);border-style:dashed!important;animation:bDance 1s infinite linear;}
        @keyframes bDance{0%{border-color:#FFB7B2;}50%{border-color:#FFDAC1;}100%{border-color:#FFB7B2;}}
        .glass-panel{background:rgba(255,255,255,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.8);}
        .soft-shadow{box-shadow:6px 6px 16px rgba(166,171,189,.08),-6px -6px 16px rgba(255,255,255,.7);}
        .center-content{display:flex;align-items:center;justify-content:center;text-align:center;width:100%;height:100%;line-height:1;word-break:keep-all;}
        .timer-circle{transition:stroke-dashoffset 1s linear;}
        footer{font-family:'Do Hyeon',sans-serif;}
        .mini-float{animation:miniIn .35s cubic-bezier(.34,1.56,.64,1);}
        @keyframes miniIn{from{opacity:0;transform:scale(.5) translateY(8px);}to{opacity:1;transform:scale(1) translateY(0);}}
        .mini-pulse{animation:mPulse 2s infinite;}
        @keyframes mPulse{0%,100%{box-shadow:0 2px 10px rgba(255,183,178,.25);}50%{box-shadow:0 2px 18px rgba(255,183,178,.55);}}
        .t-input{background:transparent;border:none;outline:none;text-align:center;font-family:'Jua',sans-serif;caret-color:#FFDAC1;}
        .t-input:focus{background:rgba(255,218,193,.12);border-radius:10px;}
        .t-input::-webkit-inner-spin-button,.t-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}.t-input{-moz-appearance:textfield;}
        .modal-up{animation:mUp .3s cubic-bezier(.34,1.56,.64,1);}
        @keyframes mUp{from{opacity:0;transform:translateY(30px) scale(.96);}to{opacity:1;transform:translateY(0) scale(1);}}
        .touch-target{min-height:44px;min-width:44px;}
        .safe-b{padding-bottom:max(env(safe-area-inset-bottom,0px),8px);}
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback}=React;

const Icon=({name,size=24,className=""})=>{const ref=useRef(null);useEffect(()=>{if(window.lucide&&ref.current){ref.current.innerHTML='';const i=document.createElement('i');i.setAttribute('data-lucide',name);i.setAttribute('class',className);ref.current.appendChild(i);window.lucide.createIcons({root:ref.current,nameAttr:'data-lucide',attrs:{width:size,height:size}});}},[name,size,className]);return <span ref={ref} className="inline-flex items-center justify-center"/>;};
const Copyright=({fixed})=>(<footer className={`w-full text-center py-4 text-[10px] text-gray-400 font-bold tracking-widest uppercase ${fixed?'fixed bottom-0 left-0 bg-white/50 backdrop-blur-sm safe-b':'mt-6'}`}>ⓒ 송쌤과학 Class Helper</footer>);

function SystemModal({modal,closeModal}){
    return(
        <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
            <div className="modal-up bg-white p-5 sm:p-7 rounded-2xl shadow-2xl max-w-xs sm:max-w-sm w-full text-center border-4 border-[#FFB7B2]">
                <p className="text-base sm:text-lg font-bold text-gray-700 mb-5 whitespace-pre-wrap leading-relaxed">{modal.msg}</p>
                <div className="flex gap-2 justify-center">
                    {modal.type==='confirm'&&<button onClick={closeModal} className="flex-1 py-2.5 bg-gray-100 rounded-xl font-bold text-gray-500 touch-target">취소</button>}
                    <button onClick={()=>{if(modal.action)modal.action();closeModal();}} className="flex-1 py-2.5 bg-[#FFB7B2] rounded-xl font-bold text-white touch-target">확인</button>
                </div>
            </div>
        </div>
    );
}

function App(){
    const [step,setStep]=useState('input');
    const [studentCount,setStudentCount]=useState('');
    const [students,setStudents]=useState([]);
    const [mode,setMode]=useState('pick');
    const [isSoundOn,setIsSoundOn]=useState(true);
    const [systemModal,setSystemModal]=useState(null);
    const [pickHistory,setPickHistory]=useState([]);
    const [currentPick,setCurrentPick]=useState(null);
    const [pickWinner,setPickWinner]=useState(null);
    const [isPicking,setIsPicking]=useState(false);
    const [isNoRepeat,setIsNoRepeat]=useState(false);
    const [placementType,setPlacementType]=useState('number');
    const [inputNames,setInputNames]=useState('');
    const [maleInput,setMaleInput]=useState('');
    const [femaleInput,setFemaleInput]=useState('');
    const [genderOption,setGenderOption]=useState('mixed');
    const [teams,setTeams]=useState([]);
    const [teamCount,setTeamCount]=useState(6);
    const [teamColumns,setTeamColumns]=useState(3);
    const [seats,setSeats]=useState([]);
    const [seatType,setSeatType]=useState('single');
    const [excludedInput,setExcludedInput]=useState('');
    const [seatPairSettings,setSeatPairSettings]=useState({mustPair:[],mustNotPair:[]});
    const [showPairSettings,setShowPairSettings]=useState(false);
    const [pairSettingTab,setPairSettingTab]=useState('must');
    const [pairInputA,setPairInputA]=useState('');
    const [pairInputB,setPairInputB]=useState('');
    const [selectedItem,setSelectedItem]=useState(null);
    const [timeLeft,setTimeLeft]=useState(300);
    const [initialTime,setInitialTime]=useState(300);
    const [isTimerRunning,setIsTimerRunning]=useState(false);
    const [timerEverStarted,setTimerEverStarted]=useState(false);
    const [minEdit,setMinEdit]=useState('');
    const [secEdit,setSecEdit]=useState('');
    const [editingMin,setEditingMin]=useState(false);
    const [editingSec,setEditingSec]=useState(false);
    const [qrInput,setQrInput]=useState('');
    const [qrUrl,setQrUrl]=useState(null);
    const [memos,setMemos]=useState([]);
    const [memoInput,setMemoInput]=useState('');
    const [uploadedImg,setUploadedImg]=useState(null);
    const [fullScreenContent,setFullScreenContent]=useState(null);
    const [fsFontSize,setFsFontSize]=useState(60);

    const audioCtx=useRef(null);
    const timerRef=useRef(null);
    const captureRef=useRef(null);
    const fileInputRef=useRef(null);

    // Audio
    const initAudio=()=>{if(!audioCtx.current)audioCtx.current=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.current.state==='suspended')audioCtx.current.resume();};
    const playSound=(type)=>{
        if(!isSoundOn)return;initAudio();const ctx=audioCtx.current;const t=ctx.currentTime;
        if(type==='click'){const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.frequency.setValueAtTime(800,t);g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);o.start(t);o.stop(t+.08);}
        else if(type==='tick'){const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='triangle';o.frequency.setValueAtTime(600,t);g.gain.setValueAtTime(.025,t);g.gain.exponentialRampToValueAtTime(.001,t+.04);o.start(t);o.stop(t+.04);}
        else if(type==='win'){[523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='sine';o.frequency.setValueAtTime(f,t+i*.1);g.gain.setValueAtTime(0,t+i*.1);g.gain.linearRampToValueAtTime(.08,t+i*.1+.04);g.gain.exponentialRampToValueAtTime(.001,t+i*.1+.5);o.start(t+i*.1);o.stop(t+i*.1+.5);});}
        else if(type==='alarm'){for(let i=0;i<3;i++){const o=ctx.createOscillator();const g=ctx.createGain();o.connect(g);g.connect(ctx.destination);o.type='square';o.frequency.setValueAtTime(880,t+i*.2);o.frequency.setValueAtTime(698,t+i*.2+.1);g.gain.setValueAtTime(.04,t+i*.2);g.gain.linearRampToValueAtTime(0,t+i*.2+.15);o.start(t+i*.2);o.stop(t+i*.2+.2);}}
    };

    const fireConfetti=()=>{confetti({particleCount:120,spread:65,origin:{y:.6},colors:['#FFB7B2','#B5EAD7','#C7CEEA','#E2F0CB','#FFDAC1'],disableForReducedMotion:true});};
    const showAlert=(msg)=>setSystemModal({type:'alert',msg});
    const showConfirm=(msg,action)=>setSystemModal({type:'confirm',msg,action});
    const closeModal=()=>{playSound('click');setSystemModal(null);};

    const handleCapture=async()=>{
        if(!captureRef.current)return;playSound('click');
        try{await document.fonts.ready;
            const canvas=await html2canvas(captureRef.current,{scale:2,backgroundColor:'#FDFBF7',useCORS:true,logging:false,allowTaint:true,
                onclone:(doc)=>{doc.querySelectorAll('.center-content').forEach(el=>{el.style.display='flex';el.style.alignItems='center';el.style.justifyContent='center';el.style.paddingBottom='12px';el.style.lineHeight='1';el.style.height='100%';});}});
            const link=document.createElement('a');link.download=`송쌤과학_${mode}_${Date.now()}.png`;link.href=canvas.toDataURL();link.click();
            showAlert("이미지가 저장되었습니다 📸");
        }catch(e){console.error(e);showAlert("저장 실패. 다시 시도해주세요.");}
    };

    const startClass=(e)=>{e.preventDefault();const c=parseInt(studentCount);if(!c||c<1||c>100)return showAlert("1~100명 사이로 입력해주세요.");playSound('click');setStudents(Array.from({length:c},(_,i)=>i+1));setStep('main');setTimeout(initAudio,300);};
    const goHome=()=>{playSound('click');showConfirm("초기 화면으로 돌아갈까요?\n모든 데이터가 초기화됩니다.",()=>{setStep('input');setStudentCount('');setStudents([]);setPickHistory([]);setTeams([]);setSeats([]);setMemos([]);setUploadedImg(null);setIsTimerRunning(false);setTimerEverStarted(false);setSelectedItem(null);setSeatPairSettings({mustPair:[],mustNotPair:[]});});};

    // Timer
    const adjustTime=(sec)=>{playSound('click');const v=Math.max(0,Math.min(5999,timeLeft+sec));setTimeLeft(v);if(!isTimerRunning)setInitialTime(v);};
    const onMinFocus=()=>{setEditingMin(true);setMinEdit(String(Math.floor(timeLeft/60)));};
    const onMinBlur=()=>{setEditingMin(false);const m=Math.max(0,Math.min(99,parseInt(minEdit)||0));const s=timeLeft%60;const v=m*60+s;setTimeLeft(v);setInitialTime(v);};
    const onSecFocus=()=>{setEditingSec(true);setSecEdit(String(timeLeft%60));};
    const onSecBlur=()=>{setEditingSec(false);const m=Math.floor(timeLeft/60);const s=Math.max(0,Math.min(59,parseInt(secEdit)||0));const v=m*60+s;setTimeLeft(v);setInitialTime(v);};

    useEffect(()=>{
        if(isTimerRunning&&timeLeft>0){timerRef.current=setInterval(()=>{setTimeLeft(p=>{if(p<=1){clearInterval(timerRef.current);setIsTimerRunning(false);playSound('alarm');fireConfetti();return 0;}return p-1;});},1000);}
        else clearInterval(timerRef.current);
        return()=>clearInterval(timerRef.current);
    },[isTimerRunning]);

    // Data
    const parseData=()=>{
        if(placementType==='number'){const exc=excludedInput.split(/[\s,]+/).map(n=>parseInt(n)).filter(n=>!isNaN(n));return students.filter(s=>!exc.includes(s));}
        else if(placementType==='name'){const l=inputNames.split(/[\n,]+/).map(s=>s.trim()).filter(s=>s);return l.length?l:null;}
        else if(placementType==='gender'){const m=maleInput.split(/[\n,]+/).map(s=>s.trim()).filter(s=>s);const f=femaleInput.split(/[\n,]+/).map(s=>s.trim()).filter(s=>s);return m.length+f.length?{m,f}:null;}
        return[];
    };
    const buildPool=(data)=>{
        let pool=[];
        if(placementType==='gender'){let{m,f}=data;m=[...m].sort(()=>Math.random()-.5);f=[...f].sort(()=>Math.random()-.5);
            if(genderOption==='mixed'){const mx=Math.max(m.length,f.length);for(let i=0;i<mx;i++){if(i<m.length)pool.push(m[i]);if(i<f.length)pool.push(f[i]);}}
            else pool=[...m,...f];
        }else pool=[...data].sort(()=>Math.random()-.5);
        return pool;
    };

    const createTeams=()=>{if(isPicking)return;const data=parseData();if(!data)return showAlert("명단을 입력해주세요.");playSound('click');setIsPicking(true);setTeams([]);setTimeout(()=>{const pool=buildPool(data);const t=Array.from({length:teamCount},()=>[]);pool.forEach((s,i)=>t[i%teamCount].push(s));setTeams(t);setIsPicking(false);playSound('win');},350);};

    const createSeats=()=>{if(isPicking)return;const data=parseData();if(!data)return showAlert("명단을 입력해주세요.");playSound('click');setIsPicking(true);setSeats([]);
        setTimeout(()=>{let pool=buildPool(data);if(seatType==='pair'&&(seatPairSettings.mustPair.length>0||seatPairSettings.mustNotPair.length>0))pool=applyPC(pool,seatPairSettings);setSeats(pool);setIsPicking(false);playSound('win');},350);};

    const applyPC=(pool,settings)=>{
        const{mustPair,mustNotPair}=settings;const s=v=>String(v);
        for(let a=0;a<200;a++){
            let arr=[...pool].sort(()=>Math.random()-.5);
            for(const p of mustPair){const iA=arr.findIndex(x=>s(x)===s(p[0]));const iB=arr.findIndex(x=>s(x)===s(p[1]));if(iA===-1||iB===-1)continue;const big=Math.max(iA,iB),sm=Math.min(iA,iB);const pB=arr.splice(big,1)[0];const pS=arr.splice(sm,1)[0];arr.splice(0,0,pS,pB);}
            let ok=true;
            for(const p of mustPair){let f=false;for(let i=0;i+1<arr.length;i+=2){if((s(arr[i])===s(p[0])&&s(arr[i+1])===s(p[1]))||(s(arr[i])===s(p[1])&&s(arr[i+1])===s(p[0]))){f=true;break;}}if(!f){ok=false;break;}}
            if(!ok)continue;
            for(const p of mustNotPair){for(let i=0;i+1<arr.length;i+=2){if((s(arr[i])===s(p[0])&&s(arr[i+1])===s(p[1]))||(s(arr[i])===s(p[1])&&s(arr[i+1])===s(p[0]))){ok=false;break;}}if(!ok)break;}
            if(ok)return arr;
        }
        return[...pool].sort(()=>Math.random()-.5);
    };

    const addPairSetting=()=>{const a=pairInputA.trim(),b=pairInputB.trim();if(!a||!b)return showAlert("두 학생 모두 입력해주세요.");if(a===b)return showAlert("같은 학생을 입력할 수 없습니다.");const key=pairSettingTab==='must'?'mustPair':'mustNotPair';if(seatPairSettings[key].some(p=>(String(p[0])===a&&String(p[1])===b)||(String(p[0])===b&&String(p[1])===a)))return showAlert("이미 등록된 조합입니다.");setSeatPairSettings(prev=>({...prev,[key]:[...prev[key],[a,b]]}));setPairInputA('');setPairInputB('');playSound('click');};
    const removePairSetting=(key,idx)=>{playSound('click');setSeatPairSettings(prev=>({...prev,[key]:prev[key].filter((_,i)=>i!==idx)}));};

    const performSwap=(src,tgt)=>{if(src.type==='team'){const t=[...teams.map(x=>[...x])];const tmp=t[src.index][src.subIndex];t[src.index][src.subIndex]=t[tgt.index][tgt.subIndex];t[tgt.index][tgt.subIndex]=tmp;setTeams(t);}else if(src.type==='seat'){const s=[...seats];const tmp=s[src.index];s[src.index]=s[tgt.index];s[tgt.index]=tmp;setSeats(s);}};
    const handleItemTap=(type,index,subIndex=null)=>{if(isPicking)return;playSound('click');if(selectedItem){if(selectedItem.type===type&&selectedItem.index===index&&selectedItem.subIndex===subIndex){setSelectedItem(null);return;}if(selectedItem.type!==type){setSelectedItem({type,index,subIndex});return;}performSwap(selectedItem,{type,index,subIndex});setSelectedItem(null);playSound('win');}else setSelectedItem({type,index,subIndex});};

    const showMiniTimer=step==='main'&&mode!=='timer'&&(isTimerRunning||timerEverStarted)&&timeLeft>0;

    const NavBtn=({active,icon,label,onClick})=>(
        <button onClick={()=>{playSound('click');onClick();}} className={`flex flex-col items-center justify-center rounded-2xl transition-all shrink-0 touch-target w-[50px] h-[54px] sm:w-16 sm:h-16 md:w-auto md:h-auto md:px-4 md:py-2.5 md:flex-row md:gap-2 ${active?'bg-[#FFB7B2] text-white shadow-md scale-105':'text-gray-400 hover:bg-white/80 hover:text-[#FFB7B2]'}`}>
            <Icon name={icon} size={18}/>
            <span className="text-[9px] sm:text-[10px] md:text-sm font-bold mt-0.5 md:mt-0 leading-tight">{label}</span>
        </button>
    );

    // ═══ 입력화면 ═══
    if(step==='input'){
        return(
            <div className="min-h-screen min-h-[100dvh] flex items-center justify-center p-4">
                <div className="bg-white/92 backdrop-blur-xl p-6 sm:p-10 rounded-[2rem] shadow-2xl w-full max-w-md text-center border border-white/80 relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-full h-2.5 bg-gradient-to-r from-[#FFB7B2] via-[#B5EAD7] to-[#C7CEEA]"></div>
                    <div className="mb-5 sm:mb-8 inline-block p-5 rounded-full bg-[#FFF0F0] shadow-inner animate-bounce"><Icon name="sprout" size={40} className="text-[#FFB7B2]"/></div>
                    <h1 className="text-2xl sm:text-4xl font-black text-[#5D5D5D] mb-1.5">송쌤과학</h1>
                    <p className="text-gray-400 font-bold mb-6 sm:mb-10 text-xs sm:text-base">행복한 교실을 위한 스마트 도우미</p>
                    <form onSubmit={startClass} className="space-y-4 sm:space-y-6">
                        <div className="relative"><input type="number" inputMode="numeric" pattern="[0-9]*" value={studentCount} onChange={e=>setStudentCount(e.target.value)} className="w-full h-14 sm:h-20 text-center text-3xl sm:text-5xl font-black text-[#5D5D5D] bg-[#F7F7F7] rounded-2xl border-3 border-transparent focus:border-[#FFB7B2] focus:bg-white focus:outline-none shadow-inner placeholder-gray-300" placeholder="0" autoFocus/><span className="absolute right-5 top-1/2 -translate-y-1/2 text-base font-bold text-gray-400">명</span></div>
                        <button type="submit" className="w-full py-3.5 sm:py-5 bg-[#FFB7B2] hover:bg-[#FF9E99] text-white rounded-2xl text-lg sm:text-2xl font-black shadow-lg shadow-[#FFB7B2]/30 active:scale-95 flex items-center justify-center gap-2 touch-target">수업 시작하기 <Icon name="arrow-right" size={20}/></button>
                    </form>
                    <div className="mt-6 flex justify-center"><button onClick={()=>setIsSoundOn(!isSoundOn)} className={`flex items-center gap-1.5 px-4 py-2 rounded-full text-xs font-bold ${isSoundOn?'bg-[#E2F0CB] text-[#6B8E23]':'bg-gray-100 text-gray-400'}`}><Icon name={isSoundOn?"volume-2":"volume-x"} size={14}/> 소리 {isSoundOn?"ON":"OFF"}</button></div>
                </div>
                <Copyright fixed/>
                {systemModal&&<SystemModal modal={systemModal} closeModal={closeModal}/>}
            </div>
        );
    }

    // ═══ 메인화면 ═══
    return(
        <div className="min-h-screen min-h-[100dvh] flex flex-col w-full overflow-x-hidden">
            <nav className="sticky top-0 z-40 glass-panel px-2 sm:px-4 py-2">
                <div className="max-w-7xl mx-auto flex items-center gap-1.5 sm:gap-2">
                    <div className="flex items-center gap-1.5 cursor-pointer shrink-0" onClick={goHome}>
                        <div className="bg-[#B5EAD7] p-1.5 sm:p-2 rounded-xl text-white shadow-sm"><Icon name="flask-conical" size={18}/></div>
                        <span className="hidden sm:block text-sm font-black text-gray-500">{students.length}명</span>
                    </div>
                    <div className="flex gap-0.5 sm:gap-1 overflow-x-auto no-scrollbar flex-1 py-1 px-0.5 bg-white/40 rounded-2xl border border-white/50">
                        <NavBtn active={mode==='pick'} icon="trophy" label="발표" onClick={()=>setMode('pick')}/>
                        <NavBtn active={mode==='team'} icon="users" label="모둠" onClick={()=>setMode('team')}/>
                        <NavBtn active={mode==='seat'} icon="armchair" label="좌석" onClick={()=>setMode('seat')}/>
                        <NavBtn active={mode==='timer'} icon="timer" label="타이머" onClick={()=>setMode('timer')}/>
                        <NavBtn active={mode==='qr'} icon="qr-code" label="QR" onClick={()=>setMode('qr')}/>

                {/* 2. 모둠 */}

                    <div className="card-enter space-y-3 w-full">

                                        </div>))}
                                    </div>
                                </div>
                            </div>

                                        );}):Array.from({length:Math.ceil(seats.length/2)}).map((_,g)=>{const i1=g*2,i2=g*2+1;const s1=selectedItem?.type==='seat'&&selectedItem?.index===i1;const s2=selectedItem?.type==='seat'&&selectedItem?.index===i2;return(
                                            <div key={g} className="flex bg-[#FFF8F0] border-2 border-[#FFD3B6] rounded-lg overflow-hidden h-10 sm:h-12">
                                                <div onClick={()=>handleItemTap('seat',i1)} className={`flex-1 flex items-center justify-center border-r border-[#FFD3B6]/30 cursor-pointer active:bg-white touch-target ${s1?'selected-item':''}`}><span className="font-black text-gray-600 text-xs sm:text-sm">{seats[i1]}</span></div>

                        </div>
                        <div className="flex gap-2.5 w-full max-w-xs">
                            <button onClick={()=>{playSound('click');if(!isTimerRunning){setTimerEverStarted(true);if(timeLeft>0)setInitialTime(timeLeft);}setIsTimerRunning(!isTimerRunning);}} className={`flex-1 py-3.5 rounded-2xl text-lg font-black text-white shadow-lg active:scale-95 flex items-center justify-center gap-2 touch-target ${isTimerRunning?'bg-[#FF9E99]':'bg-[#B5EAD7]'}`}><Icon name={isTimerRunning?"pause":"play"} size={20}/>{isTimerRunning?'일시정지':'시작'}</button>

                            {qrUrl?(<div className="inline-block p-3 bg-white rounded-2xl shadow-md border border-gray-100 cursor-pointer" onClick={()=>setFullScreenContent({type:'qr',data:qrUrl})}><img src={qrUrl} alt="QR" className="w-40 h-40 sm:w-52 sm:h-52 mix-blend-multiply"/><p className="text-gray-400 text-[10px] font-bold mt-2">터치하여 확대</p></div>):(<div className="w-40 h-40 sm:w-52 sm:h-52 mx-auto bg-gray-50 rounded-2xl flex flex-col items-center justify-center text-gray-300 border-2 border-dashed border-gray-200"><Icon name="link" size={28} className="opacity-40 mb-1"/><span className="font-bold text-xs">주소를 입력하세요</span></div>)}
                        </div>
                    </div>

                {mode==='memo'&&(
                    <div className="card-enter w-full max-w-3xl mx-auto">
                        <div className="flex gap-2 mb-3">
                            <div className="flex-1 relative"><input type="text" value={memoInput} onChange={e=>setMemoInput(e.target.value)} onKeyDown={e=>{if(e.key==='Enter'&&memoInput.trim()){playSound('click');setMemos([{id:Date.now(),text:memoInput,color:['#FFE0E0','#E0F4FF','#E0FFE4','#FFF4E0','#F3E0FF'][Math.floor(Math.random()*5)]},...memos]);setMemoInput('');}}} className="w-full p-2.5 pl-8 bg-white rounded-xl border-2 border-[#C7CEEA] font-bold text-sm focus:outline-none" placeholder="기억할 내용"/><span className="absolute left-2.5 top-1/2 -translate-y-1/2 text-[#C7CEEA]"><Icon name="pencil" size={14}/></span></div>
                            <button onClick={()=>{if(!memoInput.trim())return;playSound('click');setMemos([{id:Date.now(),text:memoInput,color:['#FFE0E0','#E0F4FF','#E0FFE4','#FFF4E0','#F3E0FF'][Math.floor(Math.random()*5)]},...memos]);setMemoInput('');}} className="px-3 bg-[#C7CEEA] text-white rounded-xl font-black shadow-md touch-target"><Icon name="plus" size={18}/></button>
                            {memos.length>0&&<button onClick={()=>{playSound('click');setMemos([]);}} className="px-3 bg-red-100 text-red-400 rounded-xl font-bold touch-target"><Icon name="trash-2" size={16}/></button>}
                        </div>
                        <div className="grid grid-cols-2 sm:grid-cols-3 gap-2 sm:gap-3">
                            {memos.map(m=>(<div key={m.id} onClick={()=>{setFullScreenContent({type:'text',data:m.text,color:m.color});setFsFontSize(window.innerWidth<500?40:70);}} className="relative p-3 sm:p-4 rounded-xl min-h-[80px] sm:min-h-[130px] flex items-center justify-center text-center cursor-pointer shadow-sm" style={{backgroundColor:m.color}}><p className="font-black text-gray-700 text-xs sm:text-base whitespace-pre-wrap line-clamp-3" style={{fontFamily:'Gamja Flower'}}>{m.text}</p><button onClick={e=>{e.stopPropagation();playSound('click');setMemos(memos.filter(x=>x.id!==m.id));}} className="absolute top-1.5 right-1.5 p-1 bg-white/50 rounded-full text-red-400"><Icon name="trash-2" size={11}/></button></div>))}
                            {!memos.length&&<div className="col-span-full py-10 text-center text-gray-300 font-bold border-2 border-dashed border-gray-200 rounded-2xl bg-white/50"><Icon name="sticky-note" size={28} className="mx-auto opacity-30 mb-1"/><p className="text-xs">메모를 추가해보세요!</p></div>}
                        </div>
                    </div>
                )}

                {/* 7. 사진 */}
                {mode==='img'&&(
                    <div className="card-enter flex flex-col items-center w-full">
                        <div className="bg-white p-3 sm:p-5 rounded-2xl shadow-lg border-2 border-[#FFC3A0] w-full max-w-3xl min-h-[220px] sm:min-h-[400px] flex items-center justify-center relative">
                            {uploadedImg?(<div className="relative w-full flex items-center justify-center"><img src={uploadedImg} className="max-w-full max-h-[50vh] rounded-xl shadow-sm cursor-pointer" onClick={()=>setFullScreenContent({type:'img',data:uploadedImg})}/><button onClick={()=>{setUploadedImg(null);fileInputRef.current.value='';}} className="absolute top-2 right-2 p-2 bg-white text-[#FFC3A0] rounded-full shadow-md touch-target"><Icon name="x" size={18}/></button></div>):(
                                <div onClick={()=>fileInputRef.current.click()} className="flex flex-col items-center justify-center gap-3 cursor-pointer p-8 sm:p-14 hover:bg-[#FFF5EB] rounded-2xl w-full h-full border-2 border-dashed border-[#FFC3A0]/30"><div className="p-5 bg-[#FFEDD5] rounded-full text-[#FFC3A0]"><Icon name="image-plus" size={32}/></div><p className="text-base font-bold text-[#FFC3A0]">터치하여 사진 업로드</p></div>
                            )}
                            <input type="file" ref={fileInputRef} onChange={e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=res=>{setUploadedImg(res.target.result);playSound('win');};r.readAsDataURL(f);}}} accept="image/*" className="hidden"/>
                        </div>
                    </div>
                )}
                <Copyright/>
            </main>

            {/* 짝꿍 설정 모달 */}
            {showPairSettings&&(
                <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center bg-black/40 backdrop-blur-sm" onClick={()=>setShowPairSettings(false)}>
                    <div className="modal-up bg-white w-full sm:max-w-md sm:rounded-2xl rounded-t-2xl shadow-2xl border-t-4 sm:border-4 border-[#FFD3B6] max-h-[80vh] flex flex-col safe-b" onClick={e=>e.stopPropagation()}>
                        <div className="flex items-center justify-between p-3.5 border-b border-gray-100 shrink-0">
                            <div className="flex items-center gap-2"><div className="bg-[#FFD3B6] p-1.5 rounded-lg text-white"><Icon name="settings-2" size={16}/></div><div><h3 className="text-sm font-black text-[#5D5D5D]">짝꿍 조건 설정</h3><p className="text-[9px] text-gray-400 font-bold">비밀 설정</p></div></div>
                            <button onClick={()=>setShowPairSettings(false)} className="p-2 text-gray-400 rounded-lg touch-target"><Icon name="x" size={18}/></button>
                        </div>
                        <div className="flex mx-3.5 mt-2.5 bg-[#FFF8F0] p-0.5 rounded-lg shrink-0">
                            <button onClick={()=>setPairSettingTab('must')} className={`flex-1 py-2 rounded-md text-xs font-bold flex items-center justify-center gap-1 ${pairSettingTab==='must'?'bg-white shadow-sm text-[#4CAF50]':'text-gray-400'}`}><Icon name="heart" size={12}/> 같이 앉기 {seatPairSettings.mustPair.length>0&&<span className="bg-[#4CAF50] text-white text-[9px] px-1 rounded-full">{seatPairSettings.mustPair.length}</span>}</button>
                            <button onClick={()=>setPairSettingTab('mustNot')} className={`flex-1 py-2 rounded-md text-xs font-bold flex items-center justify-center gap-1 ${pairSettingTab==='mustNot'?'bg-white shadow-sm text-[#FF6B6B]':'text-gray-400'}`}><Icon name="shield-alert" size={12}/> 떨어뜨리기 {seatPairSettings.mustNotPair.length>0&&<span className="bg-[#FF6B6B] text-white text-[9px] px-1 rounded-full">{seatPairSettings.mustNotPair.length}</span>}</button>
                        </div>
                        <div className="px-3.5 pt-2.5 shrink-0">
                            <div className={`flex gap-1.5 items-center p-2 rounded-lg border-2 ${pairSettingTab==='must'?'bg-[#F0FFF0] border-[#C8E6C9]':'bg-[#FFF0F0] border-[#FFCDD2]'}`}>
                                <input type="text" value={pairInputA} onChange={e=>setPairInputA(e.target.value)} className="flex-1 bg-white p-2 rounded-md text-center font-bold text-xs border border-gray-100 focus:outline-none min-w-0" placeholder={placementType==='number'?'번호':'이름'} onKeyDown={e=>e.key==='Enter'&&addPairSetting()}/>
                                <span className="text-sm shrink-0">{pairSettingTab==='must'?'💕':'🚫'}</span>
                                <input type="text" value={pairInputB} onChange={e=>setPairInputB(e.target.value)} className="flex-1 bg-white p-2 rounded-md text-center font-bold text-xs border border-gray-100 focus:outline-none min-w-0" placeholder={placementType==='number'?'번호':'이름'} onKeyDown={e=>e.key==='Enter'&&addPairSetting()}/>
                                <button onClick={addPairSetting} className={`p-2 rounded-md text-white shrink-0 active:scale-95 touch-target ${pairSettingTab==='must'?'bg-[#4CAF50]':'bg-[#FF6B6B]'}`}><Icon name="plus" size={16}/></button>
                            </div>
                        </div>
                        <div className="flex-1 overflow-y-auto px-3.5 py-2 min-h-0">
                            {pairSettingTab==='must'?(seatPairSettings.mustPair.length?seatPairSettings.mustPair.map((p,i)=>(<div key={i} className="flex items-center justify-between bg-[#F0FFF0] p-2 rounded-lg border border-[#C8E6C9] mb-1.5"><div className="flex items-center gap-1.5"><span className="bg-white px-2 py-1 rounded-md font-bold text-xs text-[#4CAF50] border border-[#C8E6C9]">{p[0]}</span><span className="text-xs">💕</span><span className="bg-white px-2 py-1 rounded-md font-bold text-xs text-[#4CAF50] border border-[#C8E6C9]">{p[1]}</span></div><button onClick={()=>removePairSetting('mustPair',i)} className="p-1 text-red-300 touch-target"><Icon name="x" size={14}/></button></div>)):<div className="text-center py-6 text-gray-300"><Icon name="heart" size={24} className="mx-auto opacity-30 mb-1"/><p className="text-xs font-bold">등록된 조합 없음</p></div>):(
                                seatPairSettings.mustNotPair.length?seatPairSettings.mustNotPair.map((p,i)=>(<div key={i} className="flex items-center justify-between bg-[#FFF0F0] p-2 rounded-lg border border-[#FFCDD2] mb-1.5"><div className="flex items-center gap-1.5"><span className="bg-white px-2 py-1 rounded-md font-bold text-xs text-[#FF6B6B] border border-[#FFCDD2]">{p[0]}</span><span className="text-xs">🚫</span><span className="bg-white px-2 py-1 rounded-md font-bold text-xs text-[#FF6B6B] border border-[#FFCDD2]">{p[1]}</span></div><button onClick={()=>removePairSetting('mustNotPair',i)} className="p-1 text-red-300 touch-target"><Icon name="x" size={14}/></button></div>)):<div className="text-center py-6 text-gray-300"><Icon name="shield-alert" size={24} className="mx-auto opacity-30 mb-1"/><p className="text-xs font-bold">등록된 조합 없음</p></div>
                            )}
                        </div>
                        <div className="p-3.5 border-t border-gray-100 flex gap-2 shrink-0">
                            {(seatPairSettings.mustPair.length+seatPairSettings.mustNotPair.length)>0&&<button onClick={()=>{playSound('click');setSeatPairSettings({mustPair:[],mustNotPair:[]});}} className="px-3 py-2.5 bg-gray-100 text-gray-500 rounded-lg font-bold text-xs touch-target">전체삭제</button>}
                            <button onClick={()=>{playSound('click');setShowPairSettings(false);}} className="flex-1 py-2.5 bg-[#FFD3B6] text-white rounded-lg font-bold shadow-md active:scale-95 touch-target">설정 완료</button>
                        </div>
                    </div>
                </div>
            )}

            {systemModal&&<SystemModal modal={systemModal} closeModal={closeModal}/>}

            {fullScreenContent&&(
                <div className="fixed inset-0 z-50 bg-black/90 backdrop-blur-md flex items-center justify-center p-2 cursor-pointer" onClick={()=>setFullScreenContent(null)}>
                    {fullScreenContent.type==='qr'&&<div className="bg-white p-5 rounded-2xl" onClick={e=>e.stopPropagation()}><img src={fullScreenContent.data} className="w-[75vw] h-[75vw] max-w-[400px] max-h-[400px]"/></div>}
                    {fullScreenContent.type==='img'&&<img src={fullScreenContent.data} className="max-w-[98vw] max-h-[95vh] object-contain rounded-lg"/>}
                    {fullScreenContent.type==='text'&&(
                        <div className="p-5 sm:p-8 rounded-2xl max-w-4xl w-full text-center max-h-[88vh] flex flex-col items-center relative" style={{backgroundColor:fullScreenContent.color}} onClick={e=>e.stopPropagation()}>
                            <div className="flex-1 overflow-y-auto w-full flex items-center justify-center min-h-[100px] no-scrollbar"><p className="font-black text-gray-700 leading-tight whitespace-pre-wrap select-text" style={{fontSize:`${fsFontSize}px`,fontFamily:'Gamja Flower'}}>{fullScreenContent.data}</p></div>
                            <div className="mt-3 flex items-center gap-3 bg-white/60 px-4 py-2 rounded-full" onClick={e=>e.stopPropagation()}>
                                <button onClick={()=>setFsFontSize(s=>Math.max(16,s-8))} className="w-9 h-9 rounded-full bg-white font-bold text-gray-500 touch-target flex items-center justify-center"><Icon name="minus" size={16}/></button>
                                <span className="font-bold text-gray-600 text-sm min-w-[2.5rem] text-center">{fsFontSize}</span>
                                <button onClick={()=>setFsFontSize(s=>Math.min(200,s+8))} className="w-9 h-9 rounded-full bg-white font-bold text-gray-500 touch-target flex items-center justify-center"><Icon name="plus" size={16}/></button>
                            </div>
                            <button onClick={()=>setFullScreenContent(null)} className="absolute top-3 right-3 p-2 bg-white/50 rounded-full text-gray-500 touch-target"><Icon name="x" size={18}/></button>
                        </div>
                    )}
                </div>
            )}
            <div id="confetti-holder" className="fixed inset-0 pointer-events-none z-50"></div>
        </div>
    );
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
